# Локальные службы для разработки и прогона тестов.
#
# ⚠️ ЭТО НЕ ПРОД. Файл поднимает ту же СУБД, что на боевом сервере, чтобы
# перестать доказывать корректность на SQLite. Инфраструктура переезда
# (docker-compose.prod.yml, nginx, certbot) — отдельная работа, её здесь нет.
#
# Поднять:      docker compose -f docker-compose.dev.yml up -d
# Посмотреть:   docker compose -f docker-compose.dev.yml ps
# Погасить:     docker compose -f docker-compose.dev.yml down
# Снести с данными: docker compose -f docker-compose.dev.yml down -v
#
# ⚠️ ПОРТЫ НАРУЖУ НЕСТАНДАРТНЫЕ — 55432 и 56379. Причина: у разработчика на
# машине уже может стоять своя PostgreSQL на 5432, и контейнер либо не
# поднимется, либо (хуже) команды пойдут не в ту базу. Промах по номеру порта
# заметен сразу, промах по базе — через час.

services:
  postgres:
    image: postgres:17
    container_name: qls_postgres_dev
    environment:
      POSTGRES_USER: qls
      POSTGRES_PASSWORD: qls_dev_password
      POSTGRES_DB: qls_dev
      # Сравнение и сортировка строк. C.UTF-8 даёт устойчивый порядок,
      # не зависящий от локали хоста: иначе один и тот же order_by по
      # русским строкам даёт разный порядок на разных машинах, и тест,
      # зелёный у одного, краснеет у другого.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '55432:5432'
    volumes:
      - qls_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Тесты стартуют раньше, чем база готова принимать соединения, и
      # падают с «connection refused». Проверка здоровья закрывает эту щель.
      test: ['CMD-SHELL', 'pg_isready -U qls -d qls_dev']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: qls_redis_dev
    # ⚠️ К DJANGO НЕ ПОДКЛЮЧЁН. Стоит здесь заранее, чтобы состав служб
    # совпадал с целевым сервером. Подключение кэша и сессий — отдельная
    # сессия, она идёт ПОСЛЕ аудита безопасности: кэш, розданный до того,
    # как разобраны границы доступа, раздаёт и чужие страницы тоже.
    ports:
      - '56379:6379'
    volumes:
      - qls_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # ⚠️ СЕРВИС ПОИСКА — БЕЗ СЕКЦИИ `ports`, И ЭТО ПРОВЕРЯЕМОЕ СВОЙСТВО.
  # У postgres и redis выше порты наружу есть (они нужны Django, который
  # на этой машине живёт вне Docker). У search их нет намеренно: так
  # локальная раскладка повторяет боевую, где сервис доступен только по
  # внутренней сети. Проверка ровно в этом и состоит:
  #
  #   docker compose -f docker-compose.dev.yml up -d search
  #   curl http://localhost:8001/healthz          # ОТКАЗ — порт не опубликован
  #   docker compose -f docker-compose.dev.yml exec search \
  #       curl -fsS http://127.0.0.1:8001/healthz # успех — изнутри виден
  #
  # Из другого контейнера той же сети сервис виден по имени `search` —
  # именно так к нему ходит Django на боевом сервере.
  search:
    build:
      context: .
      dockerfile: search_service/Dockerfile
    image: weconomics-search:latest
    container_name: qls_search_dev
    # ports: НЕ ДОБАВЛЯТЬ — на этом стоит проверка изоляции.
    environment:
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_DIM: '1024'
      EMBEDDING_MODEL_BUILD: bge-m3/st-fp32
    volumes:
      - qls_hfcache:/models
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8001/healthz | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  qls_pgdata:
  qls_redisdata:
  # Кэш модели: 2,12 ГБ качаются один раз и переживают пересборку образа.
  qls_hfcache:
