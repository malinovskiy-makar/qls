{% comment %}
Строка кандидата на шаге «Что нашлось».

Ждёт в контексте: card — карточка из `hw_generator.problem_card`
(плюс поля `checked` и `taken_by`, которые проставляет `preview_rows`).

Разметка ОДНА на серверный рендер и на догрузку «Показать ещё 5»: скрипт
клонирует эту же строку из <template>, а не собирает свою. Вторая разметка
разошлась бы с первой на первой же правке.
{% endcomment %}
<li class="cand{% if card.checked %} is-picked{% endif %}{% if card.taken_by %} is-taken{% endif %}"
    data-pid="{{ card.id }}">
  {% comment %}
  ⚠️ ГАЛОЧКА ЗАДАЧИ — ОБЫЧНОГО РАЗМЕРА (ревью 17.08, п. 3.4). Крупная
  осталась одна на блок — в шапке строки запроса, и выкидывает она весь
  блок. Здесь цена нажатия — одна задача, и вес должен отличаться:
  одинаковые галочки для разных по цене действий сбивают с толку.
  {% endcomment %}
  <label class="k-check">
    <input type="checkbox" class="cand-pick" value="{{ card.id }}"
           data-title="{{ card.title }}"
           {% if card.checked %}checked{% endif %}
           {% if card.taken_by %}disabled{% endif %}>
  </label>
  <div class="cand-main">
    {% comment %}
    Название — кнопка: нажатие раскрывает начало условия прямо здесь.
    Прямое требование владельца «задачи нужно иметь возможность отсмотреть».
    {% endcomment %}
    <div class="cand-name" role="button" tabindex="0">{{ card.title }}</div>
    <div class="cand-meta">{{ card.meta }}</div>
    {% comment %}
    ⚠️ ДВЕ СТРОКИ УСЛОВИЯ ВИДНЫ СРАЗУ (ревью 16.08, п. 9.2). Раньше в
    строке стояли только название, тема, сложность и источник — то есть
    ничего о самой задаче: чтобы понять, о чём она, приходилось раскрывать
    каждую по очереди. Обрезка — по CSS (`line-clamp`), а не по символам:
    резать текст числом символов значит рвать формулу посередине.
    {% endcomment %}
    <div class="cand-lead">{{ card.preview }}</div>
    {% comment %}
    ⚠️ СЛОВО И ЗНАК ОДНИ НА ПЛАТФОРМУ (визуальная сессия 17.08, п. 1.3).
    Здесь стояла тихая серая кнопка набора, на соседнем шаге — та же
    надпись малиновой ссылкой.
    {% endcomment %}
    <button type="button" class="k-disc cand-full" aria-expanded="false"
            aria-controls="cand-body-{{ card.problem.pk }}"><span
      class="k-disc__tri" aria-hidden="true">▸</span><span
      class="k-disc__lbl">Целиком</span></button>
    <div class="cand-taken">уже выбрана в строке «<span class="cand-taken-row">{{ card.taken_by }}</span>»</div>
    {% comment %}
    ⚠️ ЗАДАЧА РАСКРЫВАЕТСЯ ЦЕЛИКОМ (ревью 15.08, фаза 13): условие без
    обрезки, ВСЕ пункты, ответы и пометка про эталонное решение. Раньше
    здесь было начало условия на 900 символов — обрезанное условие
    выглядит как целое, и ошибка обнаруживается уже у ученика.
    {% endcomment %}
    <div class="cand-body" id="cand-body-{{ card.problem.pk }}">
      <div class="cand-st">{{ card.body }}</div>
      <div class="cand-parts">
        {% for part in card.parts %}
        <div class="cand-part"><b>{{ part.label }})</b> <span>{{ part.text }}</span>
          {% if part.answer %}<span class="cand-ans">ответ: {{ part.answer }}</span>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="cand-ans cand-answer" {% if not card.answer %}hidden{% endif %}>Ответ: {{ card.answer }}</div>
      <div class="cand-flags">
        <span class="cand-kind">{% if card.is_test %}Тест{% else %}Задача{% endif %}</span>
        <span class="cand-sol">{% if card.has_solution %}эталонное решение есть{% else %}эталонного решения нет{% endif %}</span>
      </div>
    </div>
  </div>
  <span class="conf conf-{{ card.confidence }}">{{ card.confidence_label }}</span>
</li>
