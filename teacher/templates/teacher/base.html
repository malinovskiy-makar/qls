<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Панель учителя{% endblock %} — ЭкЗадачи</title>

  {% include '_tokens.html' %}

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="initKaTeX()"></script>

  <style>
/* Цветовые токены — в общем партиале _tokens.html (свет + тьма). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  transition: background-color .2s ease, color .2s ease;
}

/* ── Шапка ─────────────────────────────────────────── */
.site-header {
  background: var(--sb);
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  letter-spacing: -.5px;
  text-decoration: none;
  flex-shrink: 0;
}
.header-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
}
.header-nav a {
  color: rgba(255,255,255,.55);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: var(--r);
  transition: color .12s, background .12s;
}
.header-nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
.header-nav a.active { color: #fff; }
.header-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: rgba(255,255,255,.55);
}
.header-user strong {
  color: rgba(255,255,255,.85);
  font-weight: 600;
}
.header-logout {
  font-size: 12px;
  color: rgba(255,255,255,.45);
  padding: 5px 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: var(--r);
  text-decoration: none;
  transition: color .12s, border-color .12s;
}
.header-logout:hover { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.3); }

/* ── Основной контент ───────────────────────────────── */
.page-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

/* ── Сообщения Django ───────────────────────────────── */
.messages {
  list-style: none;
  margin-bottom: 20px;
}
.messages li {
  padding: 12px 16px;
  border-radius: var(--r);
  font-size: 14px;
  margin-bottom: 8px;
}
.messages li.success { background: var(--green-tint); border: 1px solid var(--green-border); color: var(--green); }
.messages li.error   { background: var(--error-tint); border: 1px solid var(--error-border); color: var(--error); }
.messages li.warning { background: var(--amber-tint); border: 1px solid var(--amber-border); color: var(--text); }

/* ── Доступность: фокус-ринг для клавиатуры + reduced-motion ── */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

{% include '_kit.html' %}
{% block extra_style %}{% endblock %}
  </style>
</head>
<body>

{% include '_nav.html' %}

<main class="page-wrap">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  {% block content %}{% endblock %}
</main>

<script>
// fix-v2 (сессия E). Литеральные LaTeX-эскейпы «\$ \_ \& \#»: после KaTeX
// показываем $ _ & # (только отображение, данные не трогаем).
// fix-v3 (сессия H3). Корень: KaTeX auto-render при поиске разделителя $
// разрезает «\$» по границе доллара на два текстовых узла («4.53\» и «$...»),
// поэтому пост-проходный fixCurrencyDollars не видит «\$» как одну строку — слэш
// остаётся виден. Решение: ДО KaTeX маскируем «\$» приватным символом \uE000
// (KaTeX его не считает разделителем), ПОСЛЕ KaTeX возвращаем «$».
var DOLLAR_SENTINEL = '\uE000';

function maskEscapedDollars(root) {
  var walker = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, null);
  var node;
  while ((node = walker.nextNode())) {
    var p = node.parentNode && node.parentNode.nodeName;
    if (p === 'SCRIPT' || p === 'STYLE' || p === 'TEXTAREA') continue;
    if (node.nodeValue.indexOf('\\$') !== -1) {
      node.nodeValue = node.nodeValue.split('\\$').join(DOLLAR_SENTINEL);
    }
  }
}

function fixCurrencyDollars(root) {
  var walker = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, null);
  var node;
  while ((node = walker.nextNode())) {
    var p = node.parentNode && node.parentNode.nodeName;
    if (p === 'SCRIPT' || p === 'STYLE' || p === 'TEXTAREA') continue;
    var v = node.nodeValue;
    if (v.indexOf(DOLLAR_SENTINEL) !== -1 || v.indexOf('\\$') !== -1 ||
        v.indexOf('\\_') !== -1 || v.indexOf('\\&') !== -1 ||
        v.indexOf('\\#') !== -1) {
      node.nodeValue = v.split(DOLLAR_SENTINEL).join('$').split('\\$').join('$')
                        .split('\\_').join('_').split('\\&').join('&')
                        .split('\\#').join('#');
    }
  }
}

function initKaTeX() {
  maskEscapedDollars(document.body);
  renderMathInElement(document.body, {
    delimiters: [
      { left: '$$',   right: '$$',   display: true  },
      { left: '$',    right: '$',    display: false },
      { left: '\\[',  right: '\\]',  display: true  },
      { left: '\\(',  right: '\\)',  display: false }
    ],
    throwOnError: false
  });
  fixCurrencyDollars(document.body);
}

// Страховка: если CDN KaTeX не загрузился, эскейпы всё равно чистятся.
document.addEventListener('DOMContentLoaded', function () {
  fixCurrencyDollars(document.body);
});
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
