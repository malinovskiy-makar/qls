{% comment %}
Модальное окно с условием задачи — общее для обоих конструкторов.
{% endcomment %}
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-box">
    <div class="modal-head">
      <div style="flex:1;">
        <div class="modal-title" id="modal-title">—</div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" type="button" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-loading">Загрузка…</div>
    </div>
    <div class="modal-foot">
      <span class="modal-source" id="modal-source"></span>
      <button class="btn-modal-add" id="modal-add-btn" type="button">
        + Добавить
      </button>
    </div>
  </div>
</div>
