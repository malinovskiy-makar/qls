{% comment %}
Стили тренажёра ВП. Партиал лежит ВНУТРИ <style> базового шаблона: только
правила, ни одного тега.

⚠️ ТОЛЬКО ТОКЕНЫ САЙТА (`_tokens.html`), НИ ОДНОГО ЦВЕТА ЛИТЕРАЛОМ. Тёмная
тема достаётся даром: переключатель меняет значения токенов, а не правила.
Единственное исключение — прозрачная подложка окна, она не зависит от темы.

⚠️ ФОКУС — ОДИН НА САЙТ (DESIGN.md 2.15, 3.2): нейтральное кольцо `--focus`, а не
акцентная обводка. «Где я сейчас» показывает отдельно полоса слева у задания.

⚠️ ПОЛЕ ВВОДА — 16 px НА ЛЮБОЙ ШИРИНЕ. Меньше — и iOS Safari приближает страницу
при фокусе, а уходящая рамка кадра ломает всю раскладку прохождения.
{% endcomment %}
/* ── Общее ───────────────────────────────────────────────────────── */
.vp-wrap { max-width: var(--w-page); margin: 0 auto; padding: 32px 20px 56px; }
.vp-eyebrow {
  font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent-ink); margin-bottom: 6px;
}
.vp-h1 { font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.vp-h2 { font-size: 19px; line-height: 1.3; font-weight: 600; }
.vp-h3 { font-size: 17px; line-height: 1.3; font-weight: 600; }
.vp-sub { margin-top: 8px; font-size: 14.5px; color: var(--text2); line-height: 1.5; }
.vp-mute { font-size: 13px; color: var(--text2); line-height: 1.5; }
.vp-card {
  background: var(--surface); border: var(--line, 1px) solid var(--border);
  border-radius: var(--r-panel); padding: 20px 22px;
}
.vp-note {
  background: var(--surface-info); border-radius: var(--r); padding: 12px 16px;
  font-size: 13.5px; line-height: 1.5; color: var(--text2);
}
.vp-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.vp-btn {
  font: inherit; font-size: 14.5px; font-weight: 600; line-height: 1.2;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 11px 22px; min-height: 44px; border-radius: var(--r-card); border: 0;
  background: var(--btn-bg); color: var(--on-btn); cursor: pointer; text-decoration: none;
  transition: background var(--t, .12s);
}
.vp-btn:hover { background: var(--btn-bg-hover); color: var(--on-btn); }
.vp-btn--plain {
  background: transparent; color: var(--text); font-weight: 500;
  border: var(--line, 1px) solid var(--border);
}
.vp-btn--plain:hover { background: var(--chip-bg); color: var(--text); }
.vp-btn--lg { font-size: 16px; padding: 14px 34px; }
.vp-btn:focus-visible, .vp-cell:focus-visible, .vp-chip:focus-visible,
.vp-opt input:focus-visible, .vp-link:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px;
}
.vp-link { color: var(--accent-ink); }

/* ── Список и вход ───────────────────────────────────────────────── */
.vp-band { margin-top: 28px; }
.vp-mt { margin-top: 20px; }
.vp-mt-lg { margin-top: 28px; }
.vp-mt-sm { margin-top: 8px; }
.vp-mt-xs { margin-top: 4px; }
.vp-mt-xxs { margin-top: 6px; }
.vp-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
.vp-vcard { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text); }
.vp-vcard:hover { border-color: var(--accent); }
.vp-vcard b { font-size: 16px; }
.vp-vcard .vp-pill { align-self: flex-start; }
.vp-pill {
  display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px;
  border-radius: var(--r-pill); background: var(--accent-tint); color: var(--accent-ink);
}
.vp-pill--draft { background: var(--amber-tint); color: var(--amber-ink); }
.vp-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.vp-head-main { flex: 1 1 320px; }
.vp-head-clock { text-align: right; padding-bottom: 4px; }
.vp-big { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vp-cols { display: flex; gap: 20px; align-items: stretch; margin-top: 20px; flex-wrap: wrap; }
.vp-cols > .vp-card { flex: 1 1 300px; }
.vp-cols > .vp-card--rules { flex: 0 1 430px; }
.vp-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 14px; }
.vp-table td { padding: 7px 0; border-bottom: 1px solid var(--border-soft); }
.vp-table tr:last-child td { border-bottom: 0; }
.vp-table td:first-child { color: var(--text3); width: 64px; }
.vp-table td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
.vp-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; font-size: 14.5px; line-height: 1.55; }
.vp-chain-demo {
  margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 15px; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
.vp-chain-demo b { color: var(--accent-ink); }
.vp-chain-demo i { color: var(--skip); font-style: normal; }
.vp-modes { display: flex; gap: 12px; margin-top: 20px; border: 0; padding: 0; flex-wrap: wrap; }
.vp-mode {
  flex: 1 1 240px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
  background: var(--surface); border: var(--line, 1px) solid var(--border);
  border-radius: var(--r-card); padding: 14px 16px;
}
.vp-mode:has(input:checked) { border: 2px solid var(--accent); padding: 13px 15px; }
.vp-mode input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }
.vp-mode b { display: block; font-size: 15px; }
.vp-mode span span { display: block; font-size: 13px; color: var(--text2); margin-top: 3px; }
.vp-start { display: flex; align-items: center; gap: 18px; margin-top: 20px; flex-wrap: wrap; }
.vp-resume {
  margin-top: 20px; background: var(--amber-tint); border: var(--line, 1px) solid var(--amber-border);
  border-radius: var(--r); padding: 12px 14px; font-size: 14px; line-height: 1.6;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.vp-resume p { flex: 1 1 260px; }

/* ── Прохождение ─────────────────────────────────────────────────── */
/* На странице прохождения шапка сайта и кружки угла спрятаны: до задания
   меньше отвлекающего, а двойная липкая шапка закрыла бы поле на телефоне. */
body.vp-focus .site-nav, body.vp-focus #corner-stack { display: none !important; }
html:has(body.vp-focus) { scroll-padding-top: calc(var(--vp-bar-h, 64px) + 16px); }
.vp-bar {
  position: sticky; top: 0; z-index: 60;
  background: var(--surface); border-bottom: var(--line, 1px) solid var(--border);
}
.vp-bar-row { display: flex; align-items: center; gap: 24px; padding: 0 28px; min-height: 64px; }
.vp-bar-title { width: 300px; min-width: 0; }
.vp-bar-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vp-bar-sub { font-size: 12.5px; color: var(--text2); }
.vp-clock { flex: 1; display: flex; justify-content: center; align-items: baseline; gap: 10px; }
.vp-timer {
  font-size: 30px; font-weight: 700; letter-spacing: .5px; font-variant-numeric: tabular-nums;
}
.vp-timer-cap { font-size: 12.5px; color: var(--text2); }
.vp-clock.is-warn .vp-timer, .vp-clock.is-warn .vp-timer-cap { color: var(--amber); font-weight: 700; }
.vp-clock.is-danger .vp-timer, .vp-clock.is-danger .vp-timer-cap { color: var(--error); font-weight: 700; }
.vp-bar-side { width: 300px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
.vp-icon-btn {
  font: inherit; font-size: 17px; line-height: 1; width: 40px; height: 40px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  border-radius: var(--r-card); border: var(--line, 1px) solid var(--border);
  background: transparent; color: var(--text);
}
.vp-icon-btn:hover { background: var(--chip-bg); }
.vp-icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vp-count { font-size: 13px; color: var(--text2); }
.vp-count b { color: var(--text); }
.vp-save.is-offline { color: var(--error); font-weight: 600; }
.vp-banner {
  padding: 11px 28px; font-size: 14px; line-height: 1.5;
  background: var(--amber-tint); color: var(--amber-ink);
}
.vp-banner.is-danger { background: var(--error-tint); color: var(--error-ink); }
.vp-banner[hidden] { display: none; }
.vp-strip { display: none; }
.vp-layout { display: flex; gap: 28px; padding: 22px 28px 64px; align-items: flex-start; }
.vp-rail { width: 216px; flex-shrink: 0; position: sticky; top: calc(var(--vp-bar-h, 64px) + 16px); }
.vp-rail-card {
  background: var(--surface); border: var(--line, 1px) solid var(--border);
  border-radius: var(--r-panel); padding: 14px;
}
.vp-rail-cap { font-size: 12.5px; color: var(--text2); margin-bottom: 10px; }
.vp-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.vp-cell {
  display: flex; align-items: center; justify-content: center; height: 30px;
  border-radius: 5px; font-size: 12px; font-weight: 500; text-decoration: none;
  background: var(--surface); border: var(--line, 1px) solid var(--border); color: var(--text3);
}
.vp-cell.is-answered { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); }
.vp-cell.is-current { border: 2px solid var(--text); color: var(--text); }
.vp-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--text2); }
.vp-legend span { display: flex; align-items: center; gap: 7px; }
.vp-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: var(--line, 1px) solid var(--border); background: var(--surface); }
.vp-legend .is-a { background: var(--accent-tint); border-color: var(--accent); }
.vp-legend .is-c { border: 2px solid var(--text); }
.vp-main-col { flex: 1; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 28px; }
.vp-section { display: flex; flex-direction: column; gap: 12px; }
.vp-section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.vp-list { display: flex; flex-direction: column; gap: 6px; }
.vp-item {
  display: flex; gap: 12px; padding: 10px 16px 12px 10px; border-radius: var(--r-card);
  background: var(--surface); border: var(--line, 1px) solid var(--border);
  scroll-margin-top: calc(var(--vp-bar-h, 64px) + 16px);
  scroll-margin-bottom: 96px;
}
.vp-item.is-current { box-shadow: inset 3px 0 0 var(--accent); }
.vp-item-num { width: 30px; flex-shrink: 0; padding-top: 11px; font-size: 13px; font-weight: 600; color: var(--text3); text-align: right; }
.vp-item-body { flex: 1; min-width: 0; padding: 9px 0 0; display: flex; flex-direction: column; gap: 10px; }
.vp-item-text { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.vp-gap { display: inline-block; min-width: 72px; border-bottom: 2px solid var(--accent); margin: 0 4px; vertical-align: baseline; }
.vp-answer { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding-bottom: 2px; }
.vp-affix { font-size: 15px; color: var(--text2); }
.vp-input {
  font: inherit; font-size: 16px; padding: 9px 12px; width: 300px; max-width: 100%;
  background: var(--surface-2); color: var(--text);
  border: var(--line, 1px) solid var(--border); border-radius: var(--r);
  transition: border-color var(--t, .12s), background var(--t, .12s);
}
.vp-input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-ring); }
.vp-options { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vp-options.is-pills { flex-direction: row; flex-wrap: wrap; gap: 8px; }
.vp-opt {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; cursor: pointer;
  border-radius: var(--r); border: var(--line, 1px) solid var(--border);
  background: var(--surface-2); font-size: 14.5px; line-height: 1.45;
  min-height: 44px; /* зона нажатия на телефоне не ниже 44 px */
}
.vp-opt:has(input:checked) { border: 2px solid var(--accent); padding: 9px 11px; background: var(--accent-tint); }
.vp-opt input { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.vp-pairs { display: flex; flex-direction: column; gap: 8px; }
.vp-pair { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 44px; }
.vp-pair-key { width: 24px; font-weight: 600; color: var(--text3); }
/* Список — по канону (DESIGN 3.2): без нативного вида, стрелка — у обёртки. */
.vp-select-wrap { position: relative; flex: 1 1 220px; max-width: 420px; }
.vp-select-wrap::after {
  content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: var(--text2); pointer-events: none;
}
.vp-select {
  appearance: none; -webkit-appearance: none; width: 100%; min-height: 44px;
  font: inherit; font-size: 16px; padding: 9px 30px 9px 12px;
  background: var(--surface-2); color: var(--text);
  border: var(--line, 1px) solid var(--border); border-radius: var(--r);
}
.vp-select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-ring); }
.vp-opt--pill { border-radius: var(--r-pill); padding: 9px 16px; align-items: center; font-variant-numeric: tabular-nums; }
.vp-opt--pill:has(input:checked) { padding: 8px 15px; }
.vp-figure { margin: 0; }
.vp-figure img { max-width: 100%; height: auto; border-radius: var(--r); background: var(--surface-2); }
.vp-figure figcaption { margin-top: 6px; font-size: 12px; color: var(--text3); }
.vp-scroll { overflow-x: auto; max-width: 100%; }
.vp-scroll table { border-collapse: collapse; font-size: 14px; width: 100%; }
.vp-scroll th { background: var(--surface-info); text-align: left; padding: 8px 12px; font-weight: 600; }
.vp-scroll td { padding: 7px 12px; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
.vp-dialog {
  border: var(--line, 1px) solid var(--border); border-radius: var(--r-panel);
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop);
  padding: 24px; width: 520px; max-width: calc(100vw - 32px); margin: auto;
}
.vp-dialog::backdrop { background: rgba(8, 11, 18, .55); }
.vp-dialog p { margin-top: 10px; font-size: 14.5px; line-height: 1.55; }
.vp-chips { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.vp-chip {
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 36px;
  padding: 0 10px; border-radius: var(--r); border: var(--line, 1px) solid var(--border);
  background: var(--surface-2); font-size: 13px; color: var(--text); text-decoration: none;
}
.vp-dialog-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.vp-timeup {
  position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center;
  background: rgba(8, 11, 18, .6); padding: 20px;
}
body.vp-is-timeup .vp-timeup { display: flex; }
.vp-timeup > div { max-width: 460px; }
.vp-timeup h2 { font-size: 22px; font-weight: 700; }
.vp-timeup p { margin-top: 10px; font-size: 14.5px; line-height: 1.6; }

/* ── Результат ───────────────────────────────────────────────────── */
.vp-result { display: flex; flex-direction: column; gap: 18px; }
.vp-score-card { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; padding: 24px 26px; }
.vp-score-num { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.vp-score-num b { font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.vp-score-num span { font-size: 20px; color: var(--text2); }
.vp-auto-banner { display: flex; gap: 12px; align-items: flex-start; }
.vp-auto-banner svg { flex-shrink: 0; color: var(--amber); }
.vp-auto-banner h2 { font-size: 20px; font-weight: 700; }
.vp-rows { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.vp-brow { display: flex; align-items: center; gap: 14px; font-size: 14.5px; }
.vp-brow-name { width: 250px; flex-shrink: 0; }
.vp-brow-score { width: 90px; flex-shrink: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.vp-brow-track { flex: 1; height: 10px; border-radius: var(--r-pill); background: var(--chip-bg); overflow: hidden; }
.vp-brow-fill { display: block; height: 100%; border-radius: var(--r-pill); }
.vp-brow-fill.is-good { background: var(--green); }
.vp-brow-fill.is-mid { background: var(--amber); }
.vp-brow-fill.is-bad { background: var(--error); }
.vp-brow-pct { width: 52px; flex-shrink: 0; text-align: right; font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }

/* ── Телефон ─────────────────────────────────────────────────────── */
@media (max-width: 760px) {
  .vp-wrap { padding: 20px 16px 40px; }
  .vp-h1 { font-size: 24px; }
  .vp-head-clock { text-align: left; }
  .vp-bar-row { flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px; min-height: 0; }
  .vp-bar-title { order: 3; flex: 1 1 100%; width: auto; }
  .vp-bar-name { display: inline; }
  .vp-bar-sub { display: inline; margin-left: 6px; }
  .vp-clock { order: 1; flex: 0 0 auto; justify-content: flex-start; }
  .vp-timer { font-size: 26px; }
  .vp-timer-cap { display: none; }
  .vp-bar-side { order: 2; flex: 1; width: auto; gap: 10px; }
  .vp-count { flex: 1; font-size: 12px; text-align: right; }
  .vp-icon-btn { width: 40px; height: 40px; }
  .vp-banner { padding: 9px 16px; font-size: 13px; }
  .vp-strip {
    display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; overscroll-behavior-x: contain;
  }
  .vp-strip .vp-cell { min-width: 32px; height: 32px; flex-shrink: 0; }
  .vp-rail { display: none; }
  .vp-layout { padding: 14px 16px 48px; }
  .vp-item { padding: 12px; gap: 8px; }
  .vp-item-num { width: auto; padding-top: 2px; text-align: left; }
  .vp-item-body { padding-top: 0; }
  .vp-input { width: 100%; flex: 1 1 auto; }
  .vp-brow { flex-wrap: wrap; gap: 4px 12px; }
  .vp-brow-name { width: 100%; }
  .vp-brow-track { flex: 1 1 120px; }
  .vp-score-num b { font-size: 44px; }
  .vp-dialog { padding: 18px; }
}
@media (max-width: 760px) {
  .vp-item { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  .vp-input, .vp-btn { transition: none; }
}
