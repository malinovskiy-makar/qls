{% comment %}Общая клавиатура только числовых полей ВП. Без JS скрыта; поля используют обычную клавиатуру.{% endcomment %}
<div class="vp-number-keypad" id="vp-number-keypad" role="group" aria-label="Клавиатура числового ответа" hidden>
  <div class="vp-number-keys">
    <button type="button" data-number-key="1">1</button>
    <button type="button" data-number-key="2">2</button>
    <button type="button" data-number-key="3">3</button>
    <button type="button" class="vp-number-tool" data-number-key="delete" aria-label="Удалить символ">⌫</button>
    <button type="button" data-number-key="4">4</button>
    <button type="button" data-number-key="5">5</button>
    <button type="button" data-number-key="6">6</button>
    <button type="button" class="vp-number-tool" data-number-key="-" aria-label="Минус">−</button>
    <button type="button" data-number-key="7">7</button>
    <button type="button" data-number-key="8">8</button>
    <button type="button" data-number-key="9">9</button>
    <button type="button" class="vp-number-tool vp-number-hide" data-number-key="hide" aria-label="Скрыть клавиатуру"><span aria-hidden="true">⌄</span>Скрыть</button>
    <button type="button" data-number-key="," aria-label="Запятая">,</button>
    <button type="button" data-number-key="0">0</button>
    <button type="button" class="vp-number-next" data-number-key="next">Далее →</button>
  </div>
</div>
