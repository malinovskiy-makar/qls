# weconomics.site — HTTP + HTTPS.
# Позже на место статической заглушки встанет проксирование в Django:
# location / { proxy_pass http://web:8000; ... }

# --- обращения по IP или с чужим Host: рвём соединение ---
server {
    listen 80 default_server;
    server_name _;

    # Внутренняя проверка живости. Живёт именно здесь, в default_server,
    # чтобы отвечать на запрос к 127.0.0.1 без заголовка Host.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;
    return 444;
}

# --- HTTP: только проверка сертификата, всё остальное на HTTPS ---
server {
    listen 80;
    server_name weconomics.site www.weconomics.site;

    # Должна оставаться доступной по HTTP: по ней идёт продление.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name weconomics.site www.weconomics.site;

    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling НЕ включаем: Let's Encrypt убрал OCSP-адрес из сертификатов,
    # директива только сыпала бы предупреждениями в лог.

    # ⚠️ HSTS НАМЕРЕННО ВЫКЛЮЧЕН. Включаем только когда сайт заработает
    # по-настоящему: заголовок кэшируется браузером на месяцы, и откатить
    # его нельзя. Раскомментировать в сессии, когда встанет Django.
    # add_header Strict-Transport-Security "max-age=63072000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
