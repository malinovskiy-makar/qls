# weconomics.site — боевой конфиг: проксирование в Django + отдача файлов.
#
# ⚠️ ЭТОТ ФАЙЛ И nginx/available/stub.conf — ДВА ПОЛОЖЕНИЯ ОДНОГО
# ПЕРЕКЛЮЧАТЕЛЯ. Активен тот, что скопирован в conf.d/weconomics.conf.
# Откат на заглушку одной командой — docs/SERVER.md, раздел «Откат».

# --- обращения по IP или с чужим Host: рвём соединение ---
server {
    listen 80 default_server;
    server_name _;

    # Внутренняя проверка живости САМОГО NGINX. Живёт именно здесь, в
    # default_server, чтобы отвечать на запрос к 127.0.0.1 без заголовка Host.
    # ⚠️ Это НЕ /healthz/ Django. Тот наружу не выставлен вовсе — см. ниже.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;
    return 444;
}

# --- HTTP: только проверка сертификата, всё остальное на HTTPS ---
server {
    listen 80;
    server_name weconomics.site www.weconomics.site;

    # Должна оставаться доступной по HTTP: по ней идёт продление.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name weconomics.site www.weconomics.site;

    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling НЕ включаем: Let's Encrypt убрал OCSP-адрес из сертификатов,
    # директива только сыпала бы предупреждениями в лог.

    # ⚠️ HSTS ВКЛЮЧЁН НА ПЯТЬ МИНУТ, И ЭТО НЕ ОПЕЧАТКА.
    # HSTS необратим СО СТОРОНЫ СЕРВЕРА: пока у посетителя не истечёт
    # запомненный срок, вернуть его на HTTP нельзя ничем — ни правкой
    # конфига, ни откатом, ни снятием заголовка. Год «на всякий случай» —
    # это год невозможности откатиться, если домен придётся переносить.
    # Пять минут дают ровно то же поведение живому посетителю и стоят ноль
    # риска. Поднять до года — карточка в Notion, после недели работы сайта.
    # preload и includeSubDomains НЕ ставим: preload вносит домен в списки,
    # вшитые в браузеры, откуда его убирают месяцами.
    add_header Strict-Transport-Security "max-age=300" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Загрузки работ учеников: сканы и фотографии решений. 25 МБ — потолок
    # с запасом; Django своим DATA_UPLOAD_MAX_MEMORY_SIZE ограничит точнее.
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;
    # gzip_types не содержит text/html намеренно: он сжимается всегда и
    # указывать его — ошибка, о которой nginx предупреждает в логе.

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ⚠️ ПРОВЕРКА ЖИВОСТИ DJANGO НАРУЖУ НЕ ВЫСТАВЛЕНА.
    # Без этого блока запрос ушёл бы в location / и был бы проксирован:
    # /healthz/ отдаёт наружу состояние базы и Redis, то есть карту служб
    # для того, кто её собирает. Контейнерный healthcheck ходит по
    # внутренней сети напрямую к gunicorn и этого блока не касается.
    location ~ ^/healthz/?$ {
        access_log off;
        return 404;
    }

    # --- Статика: отдаёт NGINX, а не Django ---
    #
    # ⚠️ ЛОВУШКА «ЗЕЛЁНОЕ ПО НЕПРАВИЛЬНОЙ ПРИЧИНЕ». В проекте стоит
    # WhiteNoise, то есть Django УМЕЕТ отдавать статику сам. Ошибись мы
    # в alias — запрос ушёл бы в location / , попал в Django, и файл всё
    # равно отдался бы. Страница выглядела бы правильной, а nginx при этом
    # не работал бы вовсе, и обнаружилось бы это только под нагрузкой.
    # Поэтому здесь стоит заголовок-метка: он есть ТОЛЬКО у ответов nginx.
    # Порядок проверки — docs/SERVER.md, раздел «Кто отдаёт статику».
    location /static/ {
        alias /var/www/static/;
        access_log /var/log/nginx/static_access.log main;
        add_header X-Served-By "nginx-static" always;
        # Имена файлов статики хешированы (CompressedManifestStaticFilesStorage),
        # поэтому содержимое по конкретному имени не меняется никогда.
        #
        # ⚠️ Директива expires здесь НЕ используется, хотя напрашивается:
        # она сама дописывает Cache-Control, и в ответе оказывались ДВА
        # заголовка Cache-Control сразу. Браузеры выбирают из них по-разному,
        # то есть срок жизни кэша становился бы вопросом везения.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ⚠️ MEDIA НАРУЖУ НЕ ВЫСТАВЛЕНА — И ЭТО НЕ ТО ЖЕ САМОЕ, ЧТО «НЕЧЕГО
    # ОТДАВАТЬ». `alias /var/www/media/` (снятый ниже) отдавал бы РЕАЛЬНЫЕ
    # файлы: том `media` общий у web (`/app/media`, он же MEDIA_ROOT) и у
    # nginx (`/var/www/media`, deploy/docker-compose.yml). А загрузка туда —
    # рабочая функция сегодня: `Submission.solution_file`
    # (problems/models.py, problems/assignment_rows.py) сохраняет скан или
    # фото решения ученика при сдаче задания. Django эти файлы НЕ отдаёт
    # (config/urls.py — static() только под `if DEBUG`, problems/tests/
    # test_media_route.py), но alias здесь стоял В ОБХОД Django — значит
    # каждый прикреплённый файл был доступен всем по предсказуемому адресу
    # `/media/submissions/ГГГГ/ММ/имя` без единой проверки прав.
    # Закрыто здесь той же командой, что и /healthz/ выше — до отдельной
    # сессии SEC-06 (лимиты размера, magic/MIME-проверка, приватное
    # хранилище, подписанные ссылки). Не забывчивость — отложено осознанно.
    location /media/ {
        access_log off;
        return 404;
    }

    # --- Всё остальное: в Django ---
    location / {
        proxy_pass http://web:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ БЕЗ ЭТОГО ЗАГОЛОВКА САЙТ УХОДИТ В БЕСКОНЕЧНЫЙ РЕДИРЕКТ.
        # У Django SECURE_SSL_REDIRECT=True: он перенаправляет всё, что
        # считает незащищённым. К web nginx ходит по обычному http, и без
        # X-Forwarded-Proto Django видел бы каждый запрос незащищённым и
        # отвечал 301 на https — который снова пришёл бы сюда. Браузер
        # показал бы ERR_TOO_MANY_REDIRECTS на полностью живом приложении.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_redirect off;
    }
}
