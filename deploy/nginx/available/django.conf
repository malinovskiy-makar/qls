# weconomics.site / weconomics.ai — боевой конфиг: проксирование в Django + отдача файлов.
#
# ⚠️ ЭТОТ ФАЙЛ И nginx/available/stub.conf — ДВА ПОЛОЖЕНИЯ ОДНОГО
# ПЕРЕКЛЮЧАТЕЛЯ. Активен тот, что скопирован в conf.d/weconomics.conf.
# Откат на заглушку одной командой — docs/SERVER.md, раздел «Откат».

# --- обращения по IP или с чужим Host: рвём соединение ---
server {
    listen 80 default_server;
    server_name _;

    # Внутренняя проверка живости САМОГО NGINX. Живёт именно здесь, в
    # default_server, чтобы отвечать на запрос к 127.0.0.1 без заголовка Host.
    # ⚠️ Это НЕ /healthz/ Django. Тот наружу не выставлен вовсе — см. ниже.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;
    return 444;
}

# --- HTTP: только проверка сертификата, всё остальное на HTTPS ---
server {
    listen 80;
    server_name weconomics.site www.weconomics.site weconomics.ai www.weconomics.ai;

    # Должна оставаться доступной по HTTP: по ней идёт продление.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name weconomics.site www.weconomics.site weconomics.ai www.weconomics.ai;

    ssl_certificate     /etc/letsencrypt/live/weconomics.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weconomics.site/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling НЕ включаем: Let's Encrypt убрал OCSP-адрес из сертификатов,
    # директива только сыпала бы предупреждениями в лог.

    # ⚠️ HSTS ВКЛЮЧЁН НА ПЯТЬ МИНУТ, И ЭТО НЕ ОПЕЧАТКА.
    # HSTS необратим СО СТОРОНЫ СЕРВЕРА: пока у посетителя не истечёт
    # запомненный срок, вернуть его на HTTP нельзя ничем — ни правкой
    # конфига, ни откатом, ни снятием заголовка. Год «на всякий случай» —
    # это год невозможности откатиться, если домен придётся переносить.
    # Пять минут дают ровно то же поведение живому посетителю и стоят ноль
    # риска. Поднять до года — карточка в Notion, после недели работы сайта.
    # preload и includeSubDomains НЕ ставим: preload вносит домен в списки,
    # вшитые в браузеры, откуда его убирают месяцами.
    add_header Strict-Transport-Security "max-age=300" always;

    # ⚠️ X-Frame-Options, X-Content-Type-Options И Referrer-Policy ЗДЕСЬ
    # НЕТ НАМЕРЕННО — все три ставит Django (config/settings_production.py:
    # X_FRAME_OPTIONS=DENY, SECURE_CONTENT_TYPE_NOSNIFF=True,
    # SECURE_REFERRER_POLICY='same-origin'). Строки
    # `add_header X-Frame-Options SAMEORIGIN always;`,
    # `add_header X-Content-Type-Options nosniff always;` и
    # `add_header Referrer-Policy strict-origin-when-cross-origin always;`
    # стояли тут и давали в ответе ДВА заголовка сразу по каждому —
    # Django-значение и это. Замерено curl-ом по живому сайту 22.08.2026:
    # X-Frame-Options реально расходился (DENY vs SAMEORIGIN), Referrer-Policy
    # тоже (same-origin vs strict-origin-when-cross-origin, и там же
    # выяснилось, что при расхождении ПОБЕЖДАЕТ ПОСЛЕДНЕЕ значение —
    # то есть было в силе более слабое, nginx-овое). X-Content-Type-Options
    # совпадал по значению (nosniff = nosniff), но дублировался тоже — шум
    # без вреда.
    #
    # Соблазн вернуть эти строки «чтобы и статика была прикрыта» НЕ РАБОТАЕТ:
    # у `location /static/` и `location /media/` есть свои `add_header`, а
    # nginx наследует `add_header` с уровня выше ТОЛЬКО если на текущем
    # уровне нет ни одного своего. Поэтому серверные заголовки в те два
    # блока не доходят и сейчас — проверено тем же curl-ом. То есть строки
    # прикрывали ровно те ответы, которые Django и так прикрывает сам.
    # Подробности и отвергнутые варианты —
    # docs/adr/0013-x-frame-options-owner.md и
    # docs/adr/0014-referrer-policy-and-nosniff-owner.md.

    # Загрузки работ учеников: сканы и фотографии решений. 25 МБ — потолок
    # с запасом; Django своим DATA_UPLOAD_MAX_MEMORY_SIZE ограничит точнее.
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;
    # gzip_types не содержит text/html намеренно: он сжимается всегда и
    # указывать его — ошибка, о которой nginx предупреждает в логе.

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ⚠️ ПРОВЕРКА ЖИВОСТИ DJANGO НАРУЖУ НЕ ВЫСТАВЛЕНА.
    # Без этого блока запрос ушёл бы в location / и был бы проксирован:
    # /healthz/ отдаёт наружу состояние базы и Redis, то есть карту служб
    # для того, кто её собирает. Контейнерный healthcheck ходит по
    # внутренней сети напрямую к gunicorn и этого блока не касается.
    location ~ ^/healthz/?$ {
        access_log off;
        return 404;
    }

    # --- Статика: отдаёт NGINX, а не Django ---
    #
    # ⚠️ ЛОВУШКА «ЗЕЛЁНОЕ ПО НЕПРАВИЛЬНОЙ ПРИЧИНЕ». В проекте стоит
    # WhiteNoise, то есть Django УМЕЕТ отдавать статику сам. Ошибись мы
    # в alias — запрос ушёл бы в location / , попал в Django, и файл всё
    # равно отдался бы. Страница выглядела бы правильной, а nginx при этом
    # не работал бы вовсе, и обнаружилось бы это только под нагрузкой.
    # Поэтому здесь стоит заголовок-метка: он есть ТОЛЬКО у ответов nginx.
    # Порядок проверки — docs/SERVER.md, раздел «Кто отдаёт статику».
    location /static/ {
        alias /var/www/static/;
        access_log /var/log/nginx/static_access.log main;
        add_header X-Served-By "nginx-static" always;
        # Имена файлов статики хешированы (CompressedManifestStaticFilesStorage),
        # поэтому содержимое по конкретному имени не меняется никогда.
        #
        # ⚠️ Директива expires здесь НЕ используется, хотя напрашивается:
        # она сама дописывает Cache-Control, и в ответе оказывались ДВА
        # заголовка Cache-Control сразу. Браузеры выбирают из них по-разному,
        # то есть срок жизни кэша становился бы вопросом везения.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ⚠️ MEDIA НАРУЖУ НЕ ВЫСТАВЛЕНА — И ЭТО НЕ ТО ЖЕ САМОЕ, ЧТО «НЕЧЕГО
    # ОТДАВАТЬ». `alias /var/www/media/` (снятый ниже) отдавал бы РЕАЛЬНЫЕ
    # файлы: том `media` общий у web (`/app/media`, он же MEDIA_ROOT) и у
    # nginx (`/var/www/media`, deploy/docker-compose.yml). А загрузка туда —
    # рабочая функция сегодня: `Submission.solution_file`
    # (problems/models.py, problems/assignment_rows.py) сохраняет скан или
    # фото решения ученика при сдаче задания. Django эти файлы НЕ отдаёт
    # (config/urls.py — static() только под `if DEBUG`, problems/tests/
    # test_media_route.py), но alias здесь стоял В ОБХОД Django — значит
    # каждый прикреплённый файл был доступен всем по предсказуемому адресу
    # `/media/submissions/ГГГГ/ММ/имя` без единой проверки прав.
    # Закрыто здесь той же командой, что и /healthz/ выше — до отдельной
    # сессии SEC-06 (лимиты размера, magic/MIME-проверка, приватное
    # хранилище, подписанные ссылки). Не забывчивость — отложено осознанно.
    location /media/ {
        access_log off;
        return 404;
    }

    # --- WebSocket дуэли: отдельный процесс daphne ---
    #
    # ⚠️ БЛОК СТОИТ ВЫШЕ `location /`, ИНАЧЕ ОН НЕ РАБОТАЕТ. Запрос к
    # /ws/ ушёл бы к gunicorn, а тот про сокеты не знает вовсе.
    #
    # ⚠️ Upgrade и Connection ОБЯЗАТЕЛЬНЫ, и Connection задаётся ЯВНО.
    # У `location /` ниже стоит `proxy_set_header Connection ""` — то есть
    # рукопожатие протокола там намеренно гасится. Здесь наоборот.
    #
    # ⚠️ proxy_read_timeout час, а не минута. Дуэль в Классике идёт до
    # получаса, и между двумя ответами игрока в сокете может не быть НИ
    # ОДНОГО байта. С минутным таймаутом nginx рвал бы соединение посреди
    # забега, а выглядело бы это как «связь потеряна» на ровном месте.
    location /ws/ {
        proxy_pass http://ws:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_redirect off;
        access_log off;
    }

    # --- Всё остальное: в Django ---
    location / {
        proxy_pass http://web:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ БЕЗ ЭТОГО ЗАГОЛОВКА САЙТ УХОДИТ В БЕСКОНЕЧНЫЙ РЕДИРЕКТ.
        # У Django SECURE_SSL_REDIRECT=True: он перенаправляет всё, что
        # считает незащищённым. К web nginx ходит по обычному http, и без
        # X-Forwarded-Proto Django видел бы каждый запрос незащищённым и
        # отвечал 301 на https — который снова пришёл бы сюда. Браузер
        # показал бы ERR_TOO_MANY_REDIRECTS на полностью живом приложении.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_redirect off;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# ПЛОЩАДКА РАЗРАБОТЧИКОВ dev.weconomics.ai
#
# ⚠️ ВСЁ, ЧТО ВЫШЕ ЭТОЙ ЧЕРТЫ, — БОЕВЫЕ БЛОКИ, И ОНИ НЕ МЕНЯЮТСЯ. Площадка
# добавлена ТОЛЬКО дописыванием в конец файла: `git diff` по этому файлу не
# содержит ни одной удалённой строки. Иначе правка площадки означала бы риск
# для боя при каждом `nginx -s reload` — они в одном контейнере и в одном
# конфиге.
#
# ⚠️ ПОЧЕМУ ПЛОЩАДКА ВООБЩЕ ЕСТЬ. 06.09.2026 два бага всплыли только на бою
# (site_meta не подключён в settings_production; varchar(300) на PostgreSQL):
# до боя код нигде не жил в боевых условиях. Здесь он живёт — те же настройки,
# тот же PostgreSQL, тот же nginx, только другая база и другой адрес.
#
# ⚠️ ПЛОЩАДКА ЗАКРЫТА ДВУМЯ РАЗНЫМИ РУБЕЖАМИ, И ОБА ОБЯЗАТЕЛЬНЫ.
#   1. `auth_basic` — пароль на весь сайт. Площадка показывает код, который
#      ещё никто не принимал; без пароля это второй публичный сайт проекта
#      с сырыми правками.
#   2. `X-Robots-Tag: noindex, nofollow` — от поисковиков. Пароль их и так не
#      пускает, но заголовок стоит на случай, если пароль когда-нибудь снимут
#      «на пять минут»: снятый пароль без заголовка — это площадка в выдаче
#      поисковика рядом с настоящим сайтом.
# ═══════════════════════════════════════════════════════════════════════════

# --- HTTP: только проверка сертификата, всё остальное на HTTPS ---
server {
    listen 80;
    server_name dev.weconomics.ai;

    # Должна оставаться доступной по HTTP и БЕЗ ПАРОЛЯ: по ней идёт продление
    # сертификата, а certbot пароля не знает.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name dev.weconomics.ai;

    # ⚠️ СЕРТИФИКАТ СВОЙ, А НЕ БОЕВОЙ. Боевой выписан на четыре имени
    # (weconomics.site, www, weconomics.ai, www) и dev.weconomics.ai в нём нет:
    # браузер показал бы ошибку имени. Расширять боевой сертификат пятым именем
    # тоже не стали — тогда перевыпуск площадки трогал бы сертификат боя.
    ssl_certificate     /etc/letsencrypt/live/dev.weconomics.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.weconomics.ai/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ⚠️ HSTS ЗДЕСЬ НЕТ ВОВСЕ, И ЭТО НЕ КОПИЯ БОЕВОГО БЛОКА С ПРОПУСКОМ.
    # HSTS необратим со стороны сервера. У площадки нет ни одной причины его
    # включать: её открывают три человека, которым известен адрес.

    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    # ⚠️ ПАРОЛЬ ОБЪЯВЛЕН НА УРОВНЕ server, А НЕ В КАЖДОМ location.
    # Так он действует ВЕЗДЕ по умолчанию, и новый location, добавленный
    # когда-нибудь потом, окажется закрыт сам собой. Обратный порядок
    # («закрыть каждый location отдельно») — это способ однажды забыть один.
    # Снимается ниже ровно в одном месте: у acme-challenge.
    auth_basic           "weconomics dev";
    # ⚠️ ФАЙЛ БЕЗ РАСШИРЕНИЯ .conf, И ЭТО НАМЕРЕННО. Каталог conf.d целиком
    # подключён в nginx.conf шаблоном `*.conf`: файл с другим именем nginx
    # НЕ ЧИТАЕТ как конфигурацию, но прекрасно открывает по явному пути.
    # Назови мы его htpasswd_dev.conf — nginx попытался бы разобрать хеш
    # пароля как директивы и не поднялся бы вовсе, уронив заодно бой.
    auth_basic_user_file /etc/nginx/conf.d/htpasswd_dev;

    # ⚠️ always ОБЯЗАТЕЛЕН: без него заголовок ставится только на ответы 2xx
    # и 3xx, а страница входа площадки — это 401.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ⚠️ БЕЗ ПАРОЛЯ, И ЭТО ЕДИНСТВЕННОЕ ИСКЛЮЧЕНИЕ. Продление сертификата
    # ходит сюда безымянным запросом; закрой мы этот путь — сертификат
    # площадки перестал бы продлеваться и однажды просто истёк.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # Проверка живости Django наружу не выставлена — как и на бою: она отдаёт
    # состояние базы и Redis, то есть карту служб.
    location ~ ^/healthz/?$ {
        access_log off;
        return 404;
    }

    # ⚠️ MEDIA ЗАКРЫТА ТАК ЖЕ, КАК НА БОЮ. Площадка работает на копии боевой
    # базы; хотя dev_scrub и удаляет работы учеников, том media от прежних
    # запусков может содержать файлы. Открывать — только после SEC-06.
    location /media/ {
        access_log off;
        return 404;
    }

    # --- WebSocket дуэли: свой daphne площадки ---
    # ⚠️ ВЫШЕ `location /`, иначе не сработает: запрос ушёл бы к gunicorn.
    # Адрес — ws-dev, НЕ боевой ws: перепутай их, и дуэль на площадке
    # обслуживал бы боевой процесс на боевой базе.
    location /ws/ {
        proxy_pass http://ws-dev:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_redirect off;
        access_log off;
    }

    # --- Статика: ОТДАЁТ WhiteNoise ВНУТРИ web-dev, А НЕ NGINX ---
    #
    # ⚠️ ЗДЕСЬ СОЗНАТЕЛЬНОЕ ОТЛИЧИЕ ОТ БОЯ, И ВОТ ПОЧЕМУ. На бою nginx отдаёт
    # статику сам из тома `static`. Чтобы сделать так же для площадки, том
    # `weconomics-dev_static_dev` пришлось бы примонтировать в БОЕВОЙ
    # контейнер nginx — то есть править боевой docker-compose.yml и
    # пересоздавать боевой nginx ради площадки. Это ровно тот риск для боя,
    # которого вся затея избегает.
    # Цена отличия мала: WhiteNoise отдаёт статику штатно (на бою он тоже
    # включён — просто nginx перехватывает раньше), а площадку смотрят три
    # человека, а не поток. Отдельного `location /static/` поэтому нет вовсе:
    # запрос уходит в `location /` ниже и попадает в Django.
    #
    # ⚠️ Следствие для проверок: на площадке заголовка `x-served-by:
    # nginx-static` НЕ БУДЕТ, и это норма, а не поломка. Боевая проверка
    # «кто отдаёт статику» (docs/SERVER.md) к площадке неприменима.

    # --- Всё остальное: в Django площадки ---
    location / {
        proxy_pass http://web-dev:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ БЕЗ ЭТОГО ЗАГОЛОВКА ПЛОЩАДКА УХОДИТ В БЕСКОНЕЧНЫЙ РЕДИРЕКТ.
        # Настройки боевые, значит SECURE_SSL_REDIRECT=True: без
        # X-Forwarded-Proto Django считает каждый запрос незащищённым и
        # отвечает 301 на https, который снова приходит сюда.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_redirect off;
    }
}
