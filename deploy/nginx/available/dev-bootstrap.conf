# ВРЕМЕННЫЙ конфиг: только порт 80 для dev.weconomics.ai.
#
# ⚠️ ЭТОТ ФАЙЛ ЖИВЁТ В conf.d МИНУТЫ, А НЕ ПОСТОЯННО. Он нужен ровно один раз —
# получить первый сертификат для dev.weconomics.ai. Порядок такой потому, что
# nginx НЕ ПОДНИМЕТСЯ с блоком `listen 443`, у которого ssl_certificate
# указывает на несуществующий файл: проверка `nginx -t` честно падает, а
# `nginx -s reload` со сломанным конфигом уронил бы БОЕВОЙ САЙТ — он живёт в
# том же контейнере nginx. То есть «просто добавить сразу оба блока» стоило бы
# простоя боя.
#
# Порядок применения (docs/SERVER.md, раздел «Площадка dev.weconomics.ai»):
#   1. скопировать этот файл в /srv/weconomics/nginx/conf.d/dev-bootstrap.conf
#   2. nginx -t && nginx -s reload
#   3. certbot certonly --webroot -w /var/www/certbot -d dev.weconomics.ai
#   4. УДАЛИТЬ этот файл из conf.d и положить туда django.conf с dev-блоками
#   5. nginx -t && nginx -s reload
#
# Оставленный в conf.d, он не сломает ничего (блоки для одного и того же
# server_name на порту 80 конфликтовали бы предупреждением «conflicting
# server name»), но забытый временный файл — это способ однажды долго искать,
# почему правка django.conf не действует. Удалять.

server {
    listen 80;
    server_name dev.weconomics.ai;

    # Единственное, ради чего файл существует.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — отказ. Пускать сюда до появления пароля и HTTPS нельзя:
    # площадка показывает сырой код с main.
    location / {
        return 444;
    }
}
