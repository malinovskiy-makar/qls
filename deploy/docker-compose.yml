# Боевой сервер weconomics.site.
#
# ⚠️ ГЛАВНОЕ ПРАВИЛО ЭТОГО ФАЙЛА: у postgres и redis НЕТ секции ports.
# Публикация портов в Docker обходит ufw — правило в ufw есть, а порт
# всё равно открыт всему интернету, потому что Docker пишет свои правила
# в iptables ВЫШЕ правил ufw. Базы, торчащие наружу, находят сканерами
# за часы. Службы общаются между собой по внутренней сети backend.
# Если порт понадобится для отладки — только "127.0.0.1:5432:5432".

# ⚠️ ИМЯ ПРОЕКТА ЗАДАНО ЯВНО, И БЕЗ ЭТОГО ВСЁ ЛОМАЕТСЯ ТИХО.
# Без ключа name compose берёт имя проекта от каталога, в котором лежит
# файл. Файл лежит в deploy/, значит проект назывался бы «deploy», а тома —
# deploy_pgdata вместо weconomics_pgdata. Compose не ругнулся бы: он молча
# создал бы ПУСТЫЕ тома, и сайт поднялся бы на чистой базе рядом с настоящей.
name: weconomics

services:
  postgres:
    image: postgres:17-alpine
    container_name: weco-postgres
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. См. комментарий выше.
    # ⚠️ ЗДЕСЬ НЕТ ПОДСТАНОВКИ ВИДА «доллар-фигурная-скобка», И ЭТО ГЛАВНОЕ
    # В ФАЙЛЕ. Такая подстановка выполняется НА ХОСТЕ и берёт значение из
    # файла .env, лежащего РЯДОМ С ЭТИМ ФАЙЛОМ. Этот файл лежит в клоне
    # репозитория, а пароли — в /srv/weconomics/.env, то есть в другом месте.
    # Подстановка молча дала бы пустые строки: compose лишь предупредил бы,
    # база поднялась бы без пароля, а healthcheck поймал бы это уже потом.
    # Поэтому значения приходят через env_file, который читает КОНТЕЙНЕР.
    #
    # Да, контейнер базы видит при этом и остальные ключи файла, включая
    # SECRET_KEY. Сказано прямо, а не спрятано: настоящей границы тут нет —
    # контейнеру базы и так доверены все данные проекта. Ради разделения
    # пришлось бы держать пароль в двух файлах, а это ровно тот способ,
    # каким пароли расходятся.
    env_file:
      - /srv/weconomics/.env
    environment:
      # C.UTF-8 — чтобы сортировка не поехала на кириллице
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # Два доллара — экранирование: переменную разворачивает оболочка ВНУТРИ
      # контейнера, а не compose на хосте.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: weco-redis
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. См. комментарий выше.
    # Через sh -c по той же причине, что у postgres: пароль подставляет
    # оболочка внутри контейнера из env_file, а не compose из чужого .env.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - /srv/weconomics/.env

  # ⚠️ КОНТЕЙНЕР web РОВНО ОДИН, И ВТОРОЙ ПОДНИМАТЬ НЕЛЬЗЯ.
  # entrypoint накатывает миграции при старте без всякой блокировки — это
  # безопасно ровно до тех пор, пока процесс один. Два контейнера пойдут
  # мигрировать одновременно, и схема развалится. Масштабирование — только
  # числом воркеров gunicorn внутри одного контейнера (GUNICORN_WORKERS).
  # Причина и порядок — docs/SERVER.md.
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: weconomics-web:latest
    container_name: weco-web
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. Наружу ходит только nginx, к web он обращается
    # по имени сервиса во внутренней сети backend.
    # ⚠️ ПУТЬ АБСОЛЮТНЫЙ, И ЭТО НАМЕРЕННО. Файл с паролями лежит вне клона
    # репозитория: клон можно снести и склонировать заново, .env — нельзя.
    env_file:
      - /srv/weconomics/.env
    # DATABASE_URL и REDIS_URL здесь БОЛЬШЕ НЕ СОБИРАЮТСЯ. Раньше они
    # строились тут из POSTGRES_* и REDIS_PASSWORD, и получалось два места
    # для одной строки подключения: environment перебивает env_file, поэтому
    # правка .env не давала бы никакого эффекта, а причину искали бы долго.
    # Теперь строки живут только в /srv/weconomics/.env.
    volumes:
      # Тома монтируются И СЮДА, И В nginx: web их наполняет, nginx отдаёт.
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # ⚠️ ЗАГОЛОВОК Host ОБЯЗАТЕЛЕН. Без него запрос попадает в
      # default_server nginx и получает 444 — но здесь мы стучимся прямо
      # в gunicorn, а у Django пустой Host не пройдёт ALLOWED_HOSTS и
      # вернётся 400. Проверка живости краснела бы на живом приложении.
      test: ["CMD-SHELL", "curl -fsS -H 'Host: weconomics.site' http://127.0.0.1:8000/healthz/ | grep -q '\"ok\": true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Первый старт долгий: миграции с нуля плюс сборка статики.
      start_period: 120s

  # ⚠️ СЕРВИС КОДИРОВАНИЯ ЗАПРОСОВ (С4). ПОРТ НАРУЖУ НЕ ПУБЛИКУЕТСЯ.
  # Секции `ports` здесь нет и быть не должно: эндпоинт /encode работает
  # без авторизации, и опубликованный порт раздавал бы кому угодно нашу
  # CPU-молотилку. Django ходит сюда по внутренней сети backend, по имени
  # `search`. Проверка изоляции — curl с хоста должен получить отказ,
  # curl из контейнера web — успех (порядок в docs/SERVER.md).
  #
  # ⚠️ ВТОРОЙ ЭКЗЕМПЛЯР ПОДНИМАТЬ НЕЛЬЗЯ, по той же причине, что и у web,
  # только наоборот: там дело в миграциях, здесь — в памяти. Каждая копия
  # держит свои 2,12 ГБ модели.
  search:
    build:
      context: ..
      dockerfile: search_service/Dockerfile
    image: weconomics-search:latest
    container_name: weco-search
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. См. комментарий выше.
    environment:
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_DIM: "1024"
      EMBEDDING_MODEL_BUILD: bge-m3/st-fp32
    volumes:
      # Модель качается один раз и переживает пересборку образа.
      - hfcache:/models
    networks:
      - backend
    healthcheck:
      # /healthz намеренно НЕ трогает модель: пока она грузится (минуты),
      # контейнер обязан считаться живым, иначе compose будет убивать его
      # по кругу и модель не догрузится никогда.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/healthz | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: weco-nginx
    restart: unless-stopped
    # Здесь порты публиковать НУЖНО: это единственная дверь наружу.
    # 80 и 443 разрешены в ufw.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - /srv/weconomics/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/weconomics/nginx/html:/usr/share/nginx/html:ro
      # Только чтение: отдавать nginx умеет, писать сюда ему незачем.
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - /srv/weconomics/certbot/conf:/etc/letsencrypt:ro
      - /srv/weconomics/certbot/www:/var/www/certbot:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Сам не поднимается (profile: tools). Запускается точечно:
  #   docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot:latest
    container_name: weco-certbot
    profiles: ["tools"]
    volumes:
      - /srv/weconomics/certbot/conf:/etc/letsencrypt
      - /srv/weconomics/certbot/www:/var/www/certbot

volumes:
  # Именованные тома: переживают docker compose down и пересоздание контейнеров.
  pgdata:
  # Кэш моделей сервиса поиска: 2,12 ГБ качаются один раз, а не при каждой
  # пересборке образа.
  hfcache:
  redisdata:
  # ⚠️ Статику наполняет collectstatic в entrypoint контейнера web, а НЕ
  # сборка образа: том монтируется при запуске и перекрыл бы собранное
  # на этапе сборки. Подробности — Dockerfile и docs/SERVER.md.
  static:
  media:

networks:
  backend:
    driver: bridge
