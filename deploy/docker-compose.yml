# Боевой сервер weconomics.site — фундамент.
# Django здесь пока НЕТ: он появится в следующей сессии.
#
# ⚠️ ГЛАВНОЕ ПРАВИЛО ЭТОГО ФАЙЛА: у postgres и redis НЕТ секции ports.
# Публикация портов в Docker обходит ufw — правило в ufw есть, а порт
# всё равно открыт всему интернету, потому что Docker пишет свои правила
# в iptables ВЫШЕ правил ufw. Базы, торчащие наружу, находят сканерами
# за часы. Службы общаются между собой по внутренней сети backend.
# Если порт понадобится для отладки — только "127.0.0.1:5432:5432".

services:
  postgres:
    image: postgres:17-alpine
    container_name: weco-postgres
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. См. комментарий выше.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # C.UTF-8 — чтобы сортировка не поехала на кириллице
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: weco-redis
    restart: unless-stopped
    # ports: НЕ ДОБАВЛЯТЬ. См. комментарий выше.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nginx:
    image: nginx:1.27-alpine
    container_name: weco-nginx
    restart: unless-stopped
    # Здесь порты публиковать НУЖНО: это единственная дверь наружу.
    # 80 и 443 разрешены в ufw.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Сам не поднимается (profile: tools). Запускается точечно:
  #   docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot:latest
    container_name: weco-certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  # Именованные тома: переживают docker compose down и пересоздание контейнеров.
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
