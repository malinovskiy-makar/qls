# Посредник Telegram для бота стены ВП (deploy/tg_relay/README.md).
# Кладётся на ОТДЕЛЬНЫЙ маленький сервер за рубежом: /etc/nginx/sites-available/tg_relay
#
# Наш боевой сервер ходит не в api.telegram.org (оттуда timeout), а сюда:
#   TELEGRAM_API_BASE=https://__RELAY_HOST__
# а посредник пересылает запрос в Telegram как есть.
#
# ⚠️ ЗАМЕНИТЬ ДВА ЗНАЧЕНИЯ – и только их. В файле они записаны метками, README даёт команду,
# которая подставляет их сразу везде:
#   __RELAY_HOST__      имя посредника, например tg.weconomics.ai (запись A в DNS)
#   __OUR_SERVER_IP__   адрес НАШЕГО боевого сервера (Selectel), с которого ходит бот
#
# ⚠️ ЧЕРЕЗ ПОСРЕДНИКА ИДЁТ ТОКЕН БОТА (он в адресе каждого запроса). Поэтому:
#   – пускаем только наш сервер (`allow` / `deny all`) – чужим посредник закрыт;
#   – журнал запросов выключен (`access_log off`), в журнал ошибок пишем только
#     критичное: строка ошибки nginx содержит адрес запроса, то есть токен;
#   – доступ к этому серверу – только у Андрея.

# Порт 80: только проверка сертификата (certbot). Всё остальное – обрыв соединения.
server {
    listen 80 default_server;
    server_name _;

    access_log off;
    error_log /var/log/nginx/tg_relay_error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# Порт 443: пересылка в Telegram.
server {
    listen 443 ssl;
    server_name __RELAY_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__RELAY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__RELAY_HOST__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # В адресах запросов – токен бота.
    access_log off;
    error_log /var/log/nginx/tg_relay_error.log crit;

    # Чужим – 403. Запись в DNS только A (IPv4), поэтому наш сервер приходит по IPv4.
    allow __OUR_SERVER_IP__;
    deny all;

    location / {
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Длинный опрос getUpdates держит соединение до 60 с (50 с у Telegram + запас).
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
