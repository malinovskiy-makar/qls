# Вход для VPN на машине tg-relay (VDSina, Нидерланды). README.md рядом.
#
# Кладётся setup.sh в /etc/nginx/web_relay_stream.conf и подключается строкой
# `include` в ГЛАВНОМ контексте /etc/nginx/nginx.conf (вне http{}): stream —
# не http, внутри http{} nginx его не примет.
#
# Пересылка TCP как есть: TLS здесь НЕ расшифровывается, сертификата на этой
# машине нет и не нужно — он только на боевом. Первой строкой соединения
# боевому уходит PROXY protocol с настоящим адресом клиента; боевой nginx
# верит ему только от адреса этой машины (WEB_RELAY_IP на боевом).
#
# Адрес боевого записан здесь прямо: он и так в deploy/tg_relay/ и в DNS.

stream {
    upstream prod_https { server 135.106.181.151:8443; }
    upstream prod_http  { server 135.106.181.151:8080; }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass prod_https;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Час, а не 10 минут по умолчанию: дуэль в WebSocket бывает до получаса
        # без единого байта между ответами (как proxy_read_timeout у /ws/ на боевом).
        proxy_timeout 1h;
    }

    server {
        listen 80;
        listen [::]:80;
        proxy_pass prod_http;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}
