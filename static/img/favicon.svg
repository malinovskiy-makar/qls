     части кисти уходят ниже пикселя и растворяются в сглаживании —
     знак читался, но был бледным. Проверено увеличением снимка.
     Масштабировать знак вместо утолщения нельзя: уже при 1,10 он
     вылезает за круг и обрезается краем.
     ⚠️ Это ЗНАЧОК ВКЛАДКИ, а не логотип. Канонический знак —
