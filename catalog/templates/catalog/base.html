<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Каталог задач{% endblock %} — Экономика</title>

  {% include '_tokens.html' %}

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="initKaTeX()"></script>

  <style>
/* Цветовые токены — в общем партиале _tokens.html (свет + тьма). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  transition: background-color .2s ease, color .2s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ── Шапка ─────────────────────────────────────────── */
.site-header {
  background: var(--sb);
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  letter-spacing: -.5px;
  text-decoration: none;
  flex-shrink: 0;
}
.header-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
}
.header-nav a {
  color: rgba(255,255,255,.55);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: var(--r);
  transition: color .12s, background .12s;
}
.header-nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
.header-nav a.active { color: #fff; }
.header-spacer { flex: 1; }
.header-auth {
  font-size: 12px;
  color: rgba(255,255,255,.35);
  padding: 5px 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: var(--r);
}

/* ── Основной контент ───────────────────────────────── */
.page-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ── Доступность: единый фокус-ринг для клавиатуры ──── */
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ── Доступность: уважать «уменьшить движение» (PRODUCT.md) ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

{% comment %}
⚠️ ВЫРАВНИВАНИЕ СТОЛБЦОВ — ОБЩЕЕ С КАБИНЕТОМ (ревью 16.08, п. 6.1).
Правило жило в наборе деталей, который каталог не подключает, и таблица
каталога оставалась с прежним разнобоем: «Сложн.» и «Реш.» прижаты влево,
а звёздочки и галочки в них — по центру своей колонки.
{% endcomment %}
{% include "_table_align.html" %}
{% block extra_style %}{% endblock %}
  </style>
</head>
<body>

{% include '_nav.html' %}

<main class="page-wrap">
  {% block content %}{% endblock %}
</main>

<script>
// Литеральные доллары и эскейпы «\$ \_ \& \#» — в общем партиале
// `_katex_dollars.html` (он подключён ниже). Там же объяснение, почему
// маскировать «\$» внутри формул нельзя.
</script>

{% include '_katex_dollars.html' %}

<script>

function initKaTeX() {
  maskEscapedDollars(document.body);
  renderMathInElement(document.body, {
    delimiters: [
      // ВАЖНО: $$ должен идти РАНЬШЕ $, иначе auto-render режет $$...$$ как два пустых $...$
      { left: '$$',   right: '$$',   display: true  },
      { left: '$',    right: '$',    display: false },
      { left: '\\[',  right: '\\]',  display: true  },
      { left: '\\(',  right: '\\)',  display: false }
    ],
    throwOnError: false
  });
  fixCurrencyDollars(document.body);
}

// Страховка: deferred-скрипты CDN выполняются ДО DOMContentLoaded, поэтому
// здесь KaTeX уже отработал; если CDN не загрузился вовсе (initKaTeX не
// вызван) — эскейпы всё равно чистятся. Повторный вызов безопасен.
document.addEventListener('DOMContentLoaded', function () {
  fixCurrencyDollars(document.body);
});
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
