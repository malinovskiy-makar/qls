<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант Б — загрузка с телефона по QR-коду</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="olymp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>
body { margin: 0; }
.ph-nav { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; background: var(--nav-bg); }
.tp-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pg .tp-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 48px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text); font-size: 15px; font-weight: 600; line-height: 1.1; }
.tp-tab span { font-size: 11px; font-weight: 500; color: var(--accent-ink); margin-top: 3px; white-space: nowrap; }
.tp-shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tp-shot { aspect-ratio: 3 / 4; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface-2);
  background-image: repeating-linear-gradient(to bottom, transparent 0 11px, var(--border-soft) 11px 12px);
  display: flex; align-items: flex-end; padding: 6px 8px; font-size: 12px; font-weight: 500; color: var(--text2); }
</style>
</helmet>
<div class="pg" data-theme="{{theme}}" style="width: 390px; min-height: 844px;">

  <nav class="ph-nav">
    <a href="#" class="nav-logo" aria-label="Weconomics" style="margin-right: 0;"><svg width="27" height="27" viewBox="462.93 309.68 518.88 518.88" aria-hidden="true"><circle cx="722.37" cy="569.12" r="259.44" fill="#fffce6"></circle><path fill="#00797a" d="M642.06,563.96c9.65,1.3,15.72-.48,19.34-2.17,33.6-15.63,8.24-93.38,37.43-103.25,2.14-.72,3.83-.83,5.3-.92,24.32-1.49,34.63,33.17,63.93,69.23,27.28,33.6,58.57,53.06,60.78,51.53,2.03-1.41-18.43-22.03-38.6-59.01-16.15-29.63-16.83-41.72-10.59-51.07,4.66-6.99,15.87-16.47,26.02-14.71,6.87,1.19,10.37,7.02,11.57,9.35,31,43.4,144.89,207.42,94.41,246.1-7.23,5.54-15.9,7.02-16.7,7.15-70.06,11.23-131.7-170.43-170.73-161.74-35.48,7.89-9.21,164.15-41.35,172.71-21.2,5.64-67.95-52.92-168.45-268.5-2.35-17.39-.72-27.19,4.86-29.42,14.43-5.76,55.36,39.16,122.78,134.73Z"></path></svg></a>
    <span style="font-size: 14px; font-weight: 600; color: #fff;">Фото решения</span>
    <span class="om-grow"></span>
    <button type="button" class="nav-icon-btn" aria-label="Сменить тему" onClick="{{toggleTheme}}" style="width: 40px; height: 40px;">{{themeIcon}}</button>
  </nav>

  <main style="padding: 16px 16px 28px;">
    <div class="meta">ВсОШ · заключительный 2025/26 · 11 класс · 2 тур</div>
    <h1 class="ol-title" style="font-size: 22px; margin-top: 2px;">Задание 6</h1>
    <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Торговля с ограничениями</div>

    <nav class="tp-tabs" aria-label="Задание">
      <a class="tp-tab" href="#">5<span>✓ 2 фото</span></a>
      <a class="tp-tab om-tn--on" href="#" aria-current="page">6</a>
      <a class="tp-tab" href="#">7</a>
      <a class="tp-tab" href="#">8</a>
    </nav>

    <section class="k-card" style="margin-top: 14px; padding: 14px 16px 16px;">
      <div class="tp-shots">
        <div class="tp-shot">Лист 1</div>
        <div class="tp-shot">Лист 2</div>
        <div class="tp-shot" style="background-image: none; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 6px; opacity: .6;"><span class="om-bar5" style="display: block;"><i style="width: 60%;"></i></span>Лист 3</div>
      </div>
      <a class="k-btn k-btn--hero" href="#" style="width: 100%; min-width: 0; margin-top: 14px; gap: 10px;"><svg class="om-ic" style="width: 22px; height: 22px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Сфотографировать</a>
      <a class="k-btn k-btn--plain" href="#" style="width: 100%; min-height: 44px; margin-top: 8px;">Выбрать из галереи</a>
    </section>

    <div class="k-state k-state--ok" style="margin-top: 14px;">
      <div class="k-state__body">
        <div class="k-state__title">Фото уже на компьютере</div>
        <div class="k-state__note">Лист 1 и Лист 2 · сдать тур можно там</div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    return {
      theme: theme,
      themeIcon: theme === 'dark' ? '☀' : '☾',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' })
    };
  }
}
</script>
</body>
</html>
