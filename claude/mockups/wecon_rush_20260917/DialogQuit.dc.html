<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    a { color: #006c6d; } a:hover { color: #016769; }
    .rush {
      --accent: #00797a; --accent-ink: #006c6d; --on-accent: #ffffff;
      --accent-tint: rgba(0,108,109,.09); --accent-ring: rgba(0,121,122,.32);
      --bg: #f4eed2; --surface: #fffce6; --surface-2: #f4eed2;
      --border: rgba(45,45,45,.16); --border-soft: rgba(45,45,45,.08);
      --text: #2d2d2d; --text2: #5c5346; --text3: #665e51;
      --amber: #d6a525; --amber-ink: #1d1a16; --btn-bg: #2e2b27; --on-btn: #ffffff; --skip: #a39a88;
      --nav-bg: #3c3531; --nav-accent: #81b5b4;
      --error: #b93526; --error-tint: rgba(185,53,38,.10); --green: #186e3c; --green-tint: rgba(24,110,60,.10);
      background: var(--bg); color: var(--text); position: relative; overflow: hidden; font-size: 14px; line-height: 1.45;
    }
    .rush button, .rush input { font: inherit; color: inherit; }
    .rush button { cursor: pointer; }
    .rush svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .rush svg.i.s { width: 14px; height: 14px; }
    .rush svg.medal { width: 22px; height: 22px; display: block; }
    .nav { height: 48px; background: var(--nav-bg); color: #e9e2d1; display: flex; align-items: center; padding: 0 24px; gap: 26px; flex: none; }
    .nav .mark { width: 30px; height: 30px; border-radius: 50%; background: var(--nav-accent); display: flex; align-items: center; justify-content: center; color: #2f2b28; font-weight: 800; font-size: 15px; }
    .nav a { color: #cfc8b8; text-decoration: none; font-size: 15px; }
    .nav a.on { color: var(--nav-accent); border-bottom: 2px solid var(--nav-accent); padding-bottom: 2px; }
    .nav .sp { flex: 1; }
    .nav .login { background: var(--amber); color: var(--amber-ink); font-weight: 700; border: 0; border-radius: 8px; padding: 7px 14px; }
    .nav .ghost { color: #e9e2d1; background: transparent; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 6px 12px; font-size: 15px; }
    .nav .ava { width: 32px; height: 32px; border-radius: 50%; background: #e9e2d1; color: #2f2b28; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .page { flex: 1; padding: 20px 40px 22px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; min-height: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-sizing: border-box; }
    .rush a.back { font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .lab { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); font-weight: 600; }
    .btn { height: 44px; border: 1px solid var(--border); border-radius: 12px; background: transparent; padding: 0 18px; font-size: 14.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; white-space: nowrap; }
    .rush a.btn { color: var(--text); text-decoration: none; }
    .btn:hover, .rush a.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .rush .btn.solid { background: var(--btn-bg); color: var(--on-btn); border-color: transparent; font-weight: 700; }
    .rush .btn.solid:hover { color: var(--on-btn); filter: brightness(1.12); }
    .rush .btn.solid:disabled { background: var(--surface-2); color: var(--text3); border-color: var(--border); cursor: default; filter: none; }
    .rush .btn.amber { background: var(--amber); color: var(--amber-ink); border-color: transparent; font-weight: 700; }
    .btn.sm { height: 34px; border-radius: 9px; padding: 0 12px; font-size: 13px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--text2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .chip b { color: var(--text); font-weight: 600; }
    .chip.t { background: var(--accent-tint); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: .08em; }
    .pane { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .ph { display: flex; align-items: baseline; gap: 12px; }
    .ph b { font-size: 17px; font-weight: 700; }
    .ph span { font-size: 12.5px; color: var(--text3); }
    .num { text-align: right; }
    .thead, .tr { display: grid; align-items: center; gap: 10px; padding: 0 12px; }
    .thead { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); font-weight: 600; height: 26px; }
    .trs { display: flex; flex-direction: column; gap: 4px; }
    .tr { height: 40px; border-radius: 9px; background: var(--surface-2); font-size: 14px; font-variant-numeric: tabular-nums; }
    .tr.first { background: var(--accent-tint); }
    .tr.me { background: transparent; border: 1.5px solid var(--accent); padding: 0 10.5px; }
    .tr .n { display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 13px; }
    .tr .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tr .who.anon { font-weight: 500; color: var(--text3); font-style: italic; }
    .tr .sc { font-weight: 800; font-size: 15.5px; }
    .tr .end { color: var(--text2); font-size: 13px; white-space: nowrap; }
    .qs { display: flex; flex-direction: column; }
    .q { display: grid; grid-template-columns: 22px minmax(0, 1fr) 100px 44px; align-items: center; gap: 12px; min-height: 33px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
    .q .qn { color: var(--text3); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .q .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q .qt.lock { color: var(--text3); display: flex; align-items: center; gap: 6px; }
    .q .qt small { display: block; font-size: 12px; color: var(--green); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: block; }
    .q .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
    .q.hard .bar i { background: var(--error); }
    .q .pc { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .q.hard .pc { color: var(--error); }
    .foot { font-size: 12.5px; color: var(--text3); line-height: 1.45; margin-top: auto; }
    .bg { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .bg .hud { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .bg .bd { flex: 1; padding: 22px 60px; display: flex; flex-direction: column; gap: 12px; }
    .bg .bl { border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .veil { position: absolute; inset: 0; background: rgba(29,26,22,.5); display: flex; align-items: center; justify-content: center; }
    .dlg { width: 460px; padding: 24px 26px 22px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 12px; }
    .dlg .t { font-size: 20px; font-weight: 800; letter-spacing: -.2px; display: flex; align-items: center; gap: 10px; }
    .dlg .p { font-size: 14.5px; color: var(--text2); line-height: 1.5; }
    .dlg .p b { color: var(--text); }
    .stake { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stake div { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--text2); }
    .stake b { display: block; font-size: 20px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .paused { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); font-size: 12.5px; font-weight: 700; width: fit-content; }
    .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
    .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 28px; display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; border-radius: 14px; background: var(--btn-bg); color: #fff; font-size: 14.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); white-space: nowrap; }
    .toast small { display: block; font-size: 12.5px; opacity: .75; }
    .rush .toast button { height: 38px; padding: 0 16px; border-radius: 10px; border: 0; background: #fff; color: #2d2d2d; font-weight: 700; font-size: 14px; }
  </style>
</helmet>

<div class="rush" style="width: 760px; height: 460px; box-sizing: border-box;">
  <div class="bg"><div class="hud"></div><div class="bd"><div class="bl" style="height: 96px;"></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;"><div class="bl" style="height: 54px;"></div><div class="bl" style="height: 54px;"></div><div class="bl" style="height: 54px;"></div><div class="bl" style="height: 54px;"></div></div></div></div>
  <div class="veil"><div class="dlg"><div class="t">Выйти из раунда?</div><span class="paused"><svg class="i s" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></svg>часы стоят, пока окно открыто</span><div class="stake"><div>сейчас<b>120 очков</b></div><div>до вашего рекорда<b>ещё 81</b></div></div><div class="p">Раунд сохранится как <b>незачётный</b>: в таблицу и рекорды не пойдёт, но итог и разбор ошибок вы увидите.</div><div class="acts"><button class="btn solid">Продолжить раунд</button><button class="btn">Выйти к итогу</button></div></div></div>
</div>
</x-dc>
