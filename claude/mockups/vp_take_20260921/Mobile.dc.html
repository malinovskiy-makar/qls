<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прохождение на телефоне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;background:#f4eed2;color:#2d2d2d}
a{color:#00797a}a:hover{color:#016769}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4eed2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-shrink: 0; background: #fffce6; border-bottom: 1px solid rgba(45,45,45,.14);">
    <div style="display: flex; align-items: center; padding: 10px 14px; gap: 12px;">
      <span style="font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px;">24:13</span>
      <span style="flex-grow: 1; font-size: 12px; color: #5c5346; line-height: 1.3;">отвечено 12 из 44<br>вариант 1 · 9–10 кл.</span>
      <button type="button" style="font-family: inherit; background: #2e2b27; color: #fffce6; border: 0; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer;">Сдать</button>
    </div>
    <div style="display: flex; gap: 6px; padding: 0 14px 10px 14px; overflow: hidden;">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="12">
        <a href="#" style="{{c.style}}">{{c.n}}</a>
      </sc-for>
      <span style="display: flex; align-items: center; font-size: 12px; color: #5c5346; padding-left: 2px;">…</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <div style="display: flex; align-items: baseline; gap: 8px;">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Задания 1–30</h2>
      <span style="font-size: 12.5px; color: #5c5346;">змейка · по 2 балла</span>
    </div>

    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="{{it.card}}">
        <div style="display: flex; gap: 8px;">
          <span style="font-size: 12.5px; font-weight: 600; color: #665e51; padding-top: 2px;">{{it.n}}</span>
          <span style="flex-grow: 1; font-size: 14.5px; line-height: 1.5;">{{it.text}}</span>
        </div>
        <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
          <label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);" for="{{it.id}}">Ответ на задание {{it.n}}</label>
          <input id="{{it.id}}" type="text" value="{{it.val}}" placeholder="{{it.ph}}" style="{{it.input}}">
          <sc-if value="{{it.post}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 14.5px; color: #5c5346; white-space: nowrap;">{{it.post}}</span>
          </sc-if>
        </div>
      </div>
    </sc-for>

    <div style="background: #fffce6; border: 1px solid rgba(45,45,45,.14); border-radius: 10px; padding: 14px;">
      <div style="display: flex; gap: 8px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #665e51; padding-top: 2px;">37</span>
        <span style="flex-grow: 1; font-size: 14.5px; line-height: 1.5;">Пекарня арендует помещение, платит пекарям сдельно и закупает муку. Выберите все верные утверждения.</span>
      </div>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
          <label style="{{o.style}}">
            <input type="checkbox" checked="{{o.on}}" style="accent-color: #00797a; width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;">
            <span style="font-size: 14px; line-height: 1.45;">{{o.text}}</span>
          </label>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var card = 'background: #fffce6; border: 1px solid rgba(45,45,45,.14); border-radius: 10px; padding: 14px;';
    var cardCur = 'background: #fffce6; border: 1px solid rgba(45,45,45,.14); box-shadow: inset 3px 0 0 #00797a; border-radius: 10px; padding: 14px;';
    var inp = 'font-family: inherit; font-size: 16px; padding: 12px 12px; border-radius: 8px; border: 1px solid rgba(45,45,45,.24); background: #ffffff; color: #2d2d2d; flex-grow: 1; min-width: 0; box-sizing: border-box;';
    var inpCur = 'font-family: inherit; font-size: 16px; padding: 12px 12px; border-radius: 8px; border: 2px solid #00797a; background: #ffffff; color: #2d2d2d; flex-grow: 1; min-width: 0; box-sizing: border-box;';
    var items = [
      { n: 3, text: 'Способность страны производить больше товара с такими же затратами ресурсов, как и другие страны', val: 'абсолютное преимущество', ph: '', post: '', id: 'm3', card: card, input: inp },
      { n: 4, text: 'Коэффициент, показывающий, во сколько раз может вырасти сумма депозитов при поступлении в кредитную систему дополнительной единицы резервов', val: '', ph: 'вводите ответ', post: '', id: 'm4', card: cardCur, input: inpCur },
      { n: 6, text: 'Число раз, которое денежная единица за год переходит из рук в руки при покупке конечных товаров и услуг', val: '', ph: '', post: 'денег', id: 'm6', card: card, input: inp }
    ];
    var answered = { 1: 1, 2: 1, 3: 1, 7: 1, 9: 1, 10: 1 };
    var cells = [];
    for (var i = 1; i <= 10; i++) {
      var s = 'display: flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; border-radius: 6px; font-size: 12.5px; font-weight: 500; text-decoration: none; flex-shrink: 0; ';
      if (i === 4) { s += 'background: #fffce6; border: 2px solid #2d2d2d; color: #2d2d2d;'; }
      else if (answered[i]) { s += 'background: rgba(0,108,109,.09); border: 1px solid #00797a; color: #006c6d;'; }
      else { s += 'background: #fffce6; border: 1px solid rgba(45,45,45,.2); color: #665e51;'; }
      cells.push({ n: i, style: s });
    }
    var off = 'display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 8px; border: 1px solid rgba(45,45,45,.16); background: #ffffff; cursor: pointer;';
    var on = 'display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 8px; border: 2px solid #00797a; background: rgba(0,108,109,.09); cursor: pointer;';
    var list = ['Сдельная оплата труда пекарей относится к постоянным издержкам.', 'Расходы на муку относятся к переменным издержкам.', 'Арендная плата относится к постоянным издержкам.'];
    var picked = [2, 3];
    var opts = list.map(function (t, i) {
      var sel = picked.indexOf(i + 1) >= 0;
      return { text: t, on: sel, style: sel ? on : off };
    });
    return { items: items, cells: cells, opts: opts };
  }
}
</script>
</body>
</html>
