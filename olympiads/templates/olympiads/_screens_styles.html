.om .om-mode-r { position: absolute; opacity: 0; pointer-events: none; }
.om .om-mode-r:nth-of-type(1):checked ~ .om-sol__hd .om-sol__seg label:nth-child(1),
.om .om-mode-r:nth-of-type(2):checked ~ .om-sol__hd .om-sol__seg label:nth-child(2) { background: var(--accent); color: var(--on-accent); }
.om .om-mode-r:nth-of-type(1):checked ~ .om-sol__text, .om .om-mode-r:nth-of-type(2):checked ~ .om-sol__photo { display: none; }
.om .om-mode-r:focus-visible ~ .om-sol__hd .om-sol__seg { outline: 2px solid var(--focus); }
.om .om-ways { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.om .om-ways:has(.om-qrway) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.om .om-drop { align-items: center; justify-content: center; gap: 10px; padding: 20px; background: var(--surface-2); text-align: center; }
.om .om-drop--on { border-color: var(--accent); background: var(--accent-tint); }
.om .om-drop__t { font-size: 15px; font-weight: 600; }
.om .om-drop label { cursor: pointer; }
.om .om-up-err:empty { display: none; }
.om .om-up-err { color: var(--error-ink); }
.om .om-sheets { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.om .om-sheets:empty { display: none; }
.om .om-sheet--real { position: relative; margin: 0; width: 96px; height: 128px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface-2); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.om .om-sheet--real img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.om .om-sheet--real figcaption { position: relative; font-size: 12px; font-weight: 500; color: var(--text2); background: var(--surface); padding: 3px 8px; }
.om .om-sheet__pdf { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--text2); }
.om .om-sheet__del { position: absolute; top: 2px; right: 2px; margin: 0; }
.om .om-sheet__del .k-btn { padding: 2px; background: var(--surface); border-radius: var(--r-pill); min-height: 0; }
.om .om-area { width: 100%; min-height: 220px; box-sizing: border-box; resize: vertical; font-size: 15px; }
.om .om-answers { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 16px; }
.om .om-answer { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.om .om-answer .k-input { width: 160px; min-height: 40px; }
.om .om-opts { display: flex; flex-direction: column; gap: 8px; }
.om .om-opt { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; min-height: 32px; }
.om .om-sol__go { margin-top: 16px; display: flex; justify-content: flex-end; }
.om .om-pager { display: flex; justify-content: space-between; margin: 18px 0 8px; gap: 12px; }
.om .om-sent { margin-top: 16px; padding: 18px 20px; }
.om .om-sent__text { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.om .om-check { margin-top: 16px; padding: 18px 20px 14px; }
.om .om-check__hd { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.om .om-ref { padding: 0 20px 14px; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
.om .om-check .om-det { margin: 0 -20px; }
.om .om-phone-only { display: none; }
@media (max-width: 720px) {
  .om .om-ttbar { height: 56px; gap: 10px; padding: 0 12px; margin: 0 -16px 16px; }
  .om .om-ttbar__t, .om .om-ttbar__save { display: none; }
  .om .om-ttbar__time { flex: 1 1 auto; }
  .om .om-ttbar .om-timer { font-size: 20px; }
  .om .om-ttbar .k-btn { min-height: 44px; }
  .om .om-modes, .om .om-intro-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .om .om-mode .k-btn--hero { min-width: 0; width: 100%; }
  .om .om-tasknav { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .om .om-tn { min-height: 48px; padding: 6px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .om .om-tn b { display: none; }
  .om .om-tn span { font-size: 11px; white-space: normal; line-height: 1.2; }
  .om .om-task { padding: 16px; }
  .om .om-sol, .om .om-sent, .om .om-check { padding: 16px; }
  .om .om-sol__seg label { min-height: 44px; }
  .om .om-ways:has(.om-qrway) { grid-template-columns: minmax(0, 1fr); }
  .om .om-desk-only { display: none; }
  .om .om-phone-only { display: inline-flex; }
  .om .om-drop { min-height: 0; padding: 14px; }
  .om .om-drop .k-btn { width: 100%; min-height: 48px; }
  .om .om-sheets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .om .om-sheet--real { width: auto; height: auto; aspect-ratio: 3 / 4; }
  .om .om-sheet__del .k-btn { min-height: 0; }
  .om .om-pager .k-btn { min-height: 44px; }
  .om .om-check .om-det { margin: 0 -16px; }
  .om .om-opt { min-height: 44px; align-items: center; }
  .om .om-answer .k-input { min-height: 44px; }
}

/* ── Фото с телефона по QR (Э6): доски UploadB и UploadBPhone ── */
.om .om-qrway { display: flex; gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); }
.om .om-qr { width: 148px; height: 148px; padding: 6px; display: flex; align-items: center; justify-content: center; }
.om .om-qr svg { width: 100%; height: 100%; display: block; }
.om .om-qrway__b { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.om .om-qrway__t { font-size: 15px; font-weight: 600; }
.om .om-qrway__st { display: inline-flex; align-items: center; gap: 6px; }
.om .om-dot-on { background: var(--accent); }
.om.om-phonepage { max-width: 480px; margin: 0 auto; }
.om .om-ph-title { font-size: 24px; margin-top: 4px; }
.om .om-ph-sub { font-size: 15px; font-weight: 600; }
.om .om-ph-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.om .om-ph-cam { min-height: 56px; font-size: 17px; font-weight: 700; border-radius: var(--r-panel); }
.om .om-ph-gal { min-height: 44px; }
.om .om-sheets--ph { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 0; }
.om .om-sheets--ph .om-sheet--real { width: auto; height: auto; aspect-ratio: 3 / 4; }

/* ── Результат тура и «Оспорить оценку» (Э8): доски Result, TakeFreeChat ── */
.om .om-res-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 6px; }
.om .om-res-top--two { grid-template-columns: minmax(0, 1fr) 240px; }
.om .om-res-big { font-size: 40px; margin: 4px 0; }
.om .om-queue { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.om .om-queue form { margin: 0; }
.om .om-others__hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.om .om-others__nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.om .om-others__n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.om .om-res-hd { display: flex; gap: 14px; padding: 14px 20px 6px; font-size: 13px; }
.om .om-res-c { width: 110px; text-align: right; flex-shrink: 0; }
.om .om-res-c--act { width: 80px; }
.om .om-res-row { border-top: 1px solid var(--border-soft); }
.om .om-res-sum { list-style: none; display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; }
.om .om-res-sum::-webkit-details-marker { display: none; }
.om .om-res-t { font-size: 15px; font-weight: 600; }
.om .om-res-me { font-weight: 600; font-variant-numeric: tabular-nums; }
.om .om-res-body { padding: 0 20px 16px 62px; }
.om .om-res-body .om-det { margin: 8px -20px 0 -62px; }
.om .om-res-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.om .om-res-acts form { margin: 0; }
.om .om-crit--on { background: var(--accent-tint); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: var(--r); }
.om .om-check__acts { display: flex; gap: 10px; margin-top: 14px; }
.om .om-dispute-btn { color: var(--accent-ink); }
.om .om-dispute-btn--on { border-color: var(--accent); }
.om.om-with-chat { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.om.om-take.om-with-chat { display: block; }
.om.om-take.om-with-chat .om-take-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; max-width: none; }
.om.om-take.om-with-chat .om-take-wrap > .om-tasknav, .om.om-take.om-with-chat .om-take-wrap > .sr-only { grid-column: 1 / -1; }
/* У7: верх прилипающей панели — под шапкой сайта (48 px) или полосой тура (60 px) + 16 px. */
.om .om-dispute { position: sticky; top: 64px; max-height: calc(100vh - 80px); }
.om.om-take--timed .om-dispute { top: 76px; max-height: calc(100vh - 92px); }
.om .om-dispute .ai-body { overflow-y: auto; min-height: 120px; }
.om .om-dispute .ai-head .k-btn { margin-left: auto; }
.om .om-dispute__q { font-size: 13px; }
.om .om-dispute .ai-sug button { cursor: pointer; }
.om .om-dispute .ai-send { cursor: pointer; }
main.page-wrap:has(.om-with-chat) { max-width: 1240px; }
@media (max-width: 720px) {
  .om .om-res-top--two { grid-template-columns: minmax(0, 1fr); }
  .om .om-others__nums { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .om .om-res-hd .om-res-c--act, .om .om-res-sum .om-res-c--act { display: none; }
  .om .om-res-c { width: auto; }
  .om .om-res-sum { padding: 12px 14px; gap: 10px; min-height: 44px; }
  .om .om-res-body { padding: 0 14px 14px; }
  .om .om-res-body .om-det { margin: 8px -14px 0; }
  .om .om-res-acts .k-btn { width: 100%; min-height: 44px; }
  .om .om-res-acts form { width: 100%; }
  .om.om-with-chat, .om.om-take.om-with-chat .om-take-wrap { display: block; }
  .om .om-dispute { position: static; max-height: none; margin-top: 16px; }
  .om .om-dispute .ai-sug button, .om .om-dispute .ai-send { min-height: 44px; min-width: 44px; }
  .om .om-dispute .ai-in textarea { min-height: 44px; }
  .om .om-check__acts .k-btn { min-height: 44px; }
}

/* @@NEXT@@ */

/* ── Своё окно раздела (день 30.10, У3): «Сдать тур?», «Завершить тур?» ── */
.om-dlg { position: fixed; inset: 0; margin: auto; height: fit-content; border: 1px solid var(--border); border-radius: var(--r-panel); padding: 0; width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop); font-family: var(--font-ui); }
.om-dlg::backdrop { background: color-mix(in srgb, var(--text) 45%, transparent); }
.om-dlg__in { display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 18px; margin: 0; }
.om-dlg__t { font-size: 20px; line-height: 1.25; margin: 0; font-weight: 700; }
.om-dlg__b { display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.45; }
.om-dlg__b p { margin: 0; }
.om-dlg__list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border-soft); border-radius: var(--r); max-height: 40vh; overflow: auto; }
.om-dlg__list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--border-soft); }
.om-dlg__list li:first-child { border-top: 0; }
.om-dlg__yes b { color: var(--green-ink); font-weight: 600; }
.om-dlg__no b { color: var(--error-ink); font-weight: 600; }
.om-dlg__time { font-weight: 600; }
.om-dlg__go { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.om-dlg__go .k-btn { min-height: 44px; font-family: inherit; }
.om-dlg .om-amber { background: var(--brand-amber); color: var(--brand-amber-ink); border-color: var(--brand-amber); font-weight: 700; }
.om-dlg .om-amber:hover { background: var(--brand-amber-hover); }
.om-dlg .k-btn--main { background: var(--btn-bg); color: var(--on-btn); border-color: var(--btn-bg); }
@media (max-width: 480px) { .om-dlg__go { flex-direction: column-reverse; } .om-dlg__go .k-btn { width: 100%; } }

/* У7: кнопка «только без JS» прячется атрибутом hidden — класс .k-btn его не перебивает. */
[data-nojs][hidden] { display: none !important; }

/* У8: подпись неподтверждённого события календаря — одной строкой «Заключительный · обычно март–апрель»;
   события без месяца — под названием олимпиады в левой колонке, а не через линию «сегодня». */
.om .om-bl .om-bl__one { display: inline; font-weight: 600; color: var(--text); }
.om .om-cal__name .om-cal__undated { font-size: 11.5px; font-weight: 500; color: var(--text3); margin-top: 4px; line-height: 1.35; }
.om .om-bl.om-bl--right { text-align: right; }
/* У8: месяц-ориентир в колонке даты ленты переносится, а не вылезает. */
.om .om-frow .om-date { white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
