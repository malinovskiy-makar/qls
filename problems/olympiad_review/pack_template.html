<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<style>
:root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#dedcd6;
        --accent:#2f5bd3; --ok:#1f7a3a; --warn:#a15c00; --bad:#b3261e; --ins:#d8f5dc; --del:#fde0dd; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font:18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; gap:14px; align-items:center; padding:8px 16px; flex-wrap:wrap; }
header h1 { font-size:18px; margin:0; font-weight:600; }
.progress { font-weight:600; }
.bar { flex:1; min-width:120px; height:8px; background:#e9e7e1; border-radius:4px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--ok); width:0; }
button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px;
  padding:6px 12px; }
button:hover { border-color:var(--accent); }
button:disabled { opacity:.4; cursor:not-allowed; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:0; height:calc(100% - 54px); }
.left { overflow:auto; background:#e9e7e1; border-right:1px solid var(--line); position:relative; }
.right { overflow:auto; padding:16px 22px 260px; }
.pagebar { position:sticky; top:0; z-index:2; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:6px 10px; background:#e9e7e1ee; border-bottom:1px solid var(--line); font-size:15px; }
.pagebar .lbl { color:var(--muted); }
.pageimg { display:block; margin:8px auto; max-width:100%; background:#fff; box-shadow:0 1px 4px #0002;
  cursor:zoom-in; }
.pageimg.zoom { max-width:none; width:200%; cursor:zoom-out; }
.head { font-size:15px; color:var(--muted); margin-bottom:6px; }
.checks { margin:0 0 10px; padding:10px 12px; border-left:4px solid var(--warn); background:#fff7ea;
  border-radius:4px; font-size:16px; white-space:pre-wrap; }
.checks p { margin:0 0 6px; }
.toggle { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
.toggle button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.task { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
.task h3 { margin:0 0 8px; font-size:20px; }
.task h4 { margin:14px 0 4px; font-size:16px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
.task ol.parts { list-style:none; padding-left:0; }
.task ol.parts li { margin:6px 0; }
.task .pans { color:var(--ok); font-size:15px; margin-left:8px; }
.task table { border-collapse:collapse; margin:8px 0; display:block; overflow-x:auto; }
.task td, .task th { border:1px solid var(--line); padding:4px 8px; }
.task img.problem-figure { max-width:100%; display:block; margin:8px 0; }
.fig-missing { color:var(--bad); font-weight:600; }
.pair-grid { display:grid; grid-template-columns:1fr; gap:12px; }
.pair-grid .lbl { font-weight:600; margin:6px 0 2px; }
.diff { background:#fff; border:1px dashed var(--line); border-radius:8px; padding:8px 12px; margin:10px 0;
  white-space:pre-wrap; font-size:15px; font-family: ui-monospace, Consolas, monospace; }
.diff ins { background:var(--ins); text-decoration:none; }
.diff del { background:var(--del); }
.actions { position:fixed; bottom:0; right:0; width:50%; background:var(--panel); border-top:1px solid var(--line);
  padding:10px 16px; display:flex; flex-direction:column; gap:8px; z-index:6; }
.actions .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.actions button.dec { font-size:16px; padding:6px 10px; }
.actions button.dec b { display:inline-block; min-width:1.2em; color:var(--muted); }
.actions button.dec.chosen { outline:3px solid var(--ok); background:#eaf7ee; }
.actions textarea { width:100%; height:42px; font:inherit; font-size:15px; }
.status { font-size:15px; color:var(--muted); }
.status.done { color:var(--ok); font-weight:600; }
.editor { display:none; background:#fff; border:2px solid var(--accent); border-radius:10px; padding:12px; margin:12px 0; }
.editor.open { display:block; }
.editor label { display:block; font-weight:600; margin-top:10px; }
.editor textarea, .editor input { width:100%; font:15px/1.45 ui-monospace, Consolas, monospace; padding:6px; }
.editor .part { display:grid; grid-template-columns: 70px 1fr 140px; gap:6px; margin:4px 0; }
.editor .prev { margin-top:12px; }
.defects label { display:inline-flex; gap:6px; align-items:center; margin:2px 10px 2px 0; font-size:16px; }
.defects .kbd { color:var(--muted); font-size:13px; }
.list { display:none; position:fixed; top:54px; right:0; width:420px; max-height:70%; overflow:auto;
  background:#fff; border:1px solid var(--line); z-index:7; box-shadow:0 4px 18px #0003; font-size:15px; }
.list.open { display:block; }
.list a { display:block; padding:4px 10px; color:inherit; text-decoration:none; border-bottom:1px solid #eee; }
.list a.cur { background:#eef2ff; }
.list a .d { float:right; color:var(--ok); }
.help { font-size:14px; color:var(--muted); }
@media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } .actions { width:100%; } }
</style>
</head>
<body>
<header>
  <h1 id="h-title"></h1>
  <span class="progress" id="progress"></span>
  <div class="bar"><i id="bar"></i></div>
  <button id="b-list" title="Список карточек">☰ Список</button>
  <button id="b-prev" title="Предыдущая (←)">← Назад</button>
  <button id="b-next" title="Следующая (→)">Вперёд →</button>
  <button class="primary" id="b-save">Скачать решения</button>
</header>
<div class="list" id="list"></div>
<main>
  <section class="left" id="left">
    <div class="pagebar">
      <button id="pg-prev">◀ стр.</button>
      <span class="lbl" id="pg-label"></span>
      <button id="pg-next">стр. ▶</button>
      <button id="pg-zoom">Увеличить</button>
      <span class="lbl">Щелчок по картинке — увеличить</span>
    </div>
    <div id="pages"></div>
  </section>
  <section class="right" id="right"></section>
</main>
<div class="actions" id="actions"></div>

<!--__DOLLARS__-->
<script>
'use strict';
var PACK = /*__DATA__*/null;
var META = PACK.meta, CARDS = PACK.cards;
var STORE = 'olympiad_review:' + META.pack_id;
var REVIEW = META.mode === 'review';
var state = { i: 0, view: 'current', page: 0, zoom: false, d: {} };

function load() {
  try { var s = window.localStorage.getItem(STORE); if (s) { var v = JSON.parse(s); state.d = v.d || {}; state.i = v.i || 0; } }
  catch (e) { /* без localStorage работаем в памяти */ }
}
function persist() {
  try { window.localStorage.setItem(STORE, JSON.stringify({ d: state.d, i: state.i })); } catch (e) {}
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* Формулы — как на сайте: маскировка «\$», те же разделители, $$ раньше $. */
function renderMath(root) {
  maskEscapedDollars(root);
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(root, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ], throwOnError: false, trust: false });
  }
  fixCurrencyDollars(root);
}

/* Предпросмотр правки: упрощённый markdown (абзацы, жирный, курсив, списки,
   таблицы). Основной вид — отрисованный сайтом; этот — только для правки. */
function miniMd(src) {
  var math = [];
  var s = String(src || ''), out = '', i = 0;
  while (i < s.length) {
    var end = mathSpanEnd(s, i);
    if (end > i) { math.push(s.slice(i, end)); out += '\u0001' + (math.length - 1) + '\u0002'; i = end; continue; }
    out += s.charAt(i); i++;
  }
  var lines = esc(out).split('\n'), html = '', para = [], list = null, table = [];
  function inline(t) {
    return t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
            .replace(/\[\[FIGURE:[0-9a-f]+\]\]/g, '<span class="fig-missing">[рисунок]</span>');
  }
  function flushPara() { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
  function flushList() { if (list) { html += '<' + list.tag + '>' + list.items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + list.tag + '>'; list = null; } }
  function flushTable() {
    if (!table.length) return;
    var rows = table.filter(function (r) { return !/^\s*\|?\s*:?-{2,}/.test(r); });
    html += '<table>' + rows.map(function (r) {
      var cells = r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
      return '<tr>' + cells.map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</table>';
    table = [];
  }
  lines.forEach(function (ln) {
    if (/^\s*\|.*\|\s*$/.test(ln)) { flushPara(); flushList(); table.push(ln); return; }
    flushTable();
    var m;
    if (!ln.trim()) { flushPara(); flushList(); return; }
    if ((m = ln.match(/^\s*#{1,6}\s+(.*)$/))) { flushPara(); flushList(); html += '<p><b>' + inline(m[1]) + '</b></p>'; return; }
    if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; } list.items.push(m[1]); return; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; } list.items.push(m[1]); return; }
    flushList(); para.push(ln);
  });
  flushPara(); flushList(); flushTable();
  return html.replace(/\u0001(\d+)\u0002/g, function (_, k) { return esc(math[+k]); });
}

function taskHtml(t) {
  if (!t || !t.statement && !t.title && !(t.parts || []).length) return '<p class="help">(пусто)</p>';
  var h = '';
  if (t.title) h += '<h3>' + t.title + '</h3>';
  h += '<div class="math-content">' + (t.statement || '') + '</div>';
  if ((t.parts || []).length) {
    h += '<ol class="parts">' + t.parts.map(function (p) {
      var lab = String(p.label || '').replace(/[).]+$/, '') + ')';
      return '<li><b>' + lab + '</b> <span class="math-content">' + p.html + '</span>' +
        (p.answer ? '<span class="pans">ответ: ' + p.answer + '</span>' : '') + '</li>';
    }).join('') + '</ol>';
  }
  if (t.answer) h += '<h4>Ответ</h4><div class="math-content">' + t.answer + '</div>';
  if (t.solution) h += '<h4>Решение</h4><div class="math-content">' + t.solution + '</div>';
  return h;
}

function card() { return CARDS[state.i]; }
function decided(c) { var d = state.d[c.item_id]; return !!(d && (d.decision || d.no_defects || (d.defects || []).length)); }

function renderPages() {
  var c = card(), box = document.getElementById('pages');
  if (!c.pages.length) { box.innerHTML = '<p class="help" style="padding:16px">Картинок страниц нет.</p>'; document.getElementById('pg-label').textContent = ''; return; }
  if (state.page >= c.pages.length) state.page = 0;
  var p = c.pages[state.page];
  box.innerHTML = '<img class="pageimg' + (state.zoom ? ' zoom' : '') + '" src="' + p.src + '" alt="' + esc(p.label) + '">';
  box.firstChild.onclick = function () { state.zoom = !state.zoom; renderPages(); };
  document.getElementById('pg-label').textContent = 'Страница ' + (state.page + 1) + ' из ' + c.pages.length + ': ' + p.label;
  document.getElementById('pg-zoom').textContent = state.zoom ? 'По ширине' : 'Увеличить';
}

function renderRight() {
  var c = card(), d = state.d[c.item_id] || {};
  var h = '<div class="head">' + esc(c.head) + ' · <code>' + esc(c.item_id) + '</code></div>';
  if (REVIEW) {
    h += '<div class="checks">' + c.details.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
  }
  if (c.kind === 'pair') {
    h += '<div class="pair-grid"><div><div class="lbl">Задание из PDF (эталон, в банке его ещё нет)</div><div class="task">' + taskHtml(c.current_html) + '</div></div>' +
         '<div><div class="lbl">Задача банка #' + c.pair.id + ' (' + esc(c.pair.source) + ')</div><div class="task">' + taskHtml(c.pair.html) + '</div></div></div>';
  } else {
    if (c.proposed_html) {
      h += '<div class="toggle"><button data-view="current" class="' + (state.view === 'current' ? 'on' : '') + '">Как сейчас</button>' +
           '<button data-view="proposed" class="' + (state.view === 'proposed' ? 'on' : '') + '">Как предлагает модель</button></div>';
    }
    var shown = (state.view === 'proposed' && c.proposed_html) ? c.proposed_html : c.current_html;
    h += '<div class="task" id="task">' + taskHtml(shown) + '</div>';
    if (c.diffs.length) {
      h += '<div class="help" style="margin-top:10px">Что меняет правка модели (исходный текст: <del>было</del>, <ins>стало</ins>):</div>' +
           c.diffs.map(function (x) { return '<div class="diff"><b>' + esc(x.field) + ':</b>\n' + x.html + '</div>'; }).join('');
    }
  }
  h += '<div class="editor" id="editor"></div>';
  var right = document.getElementById('right');
  right.innerHTML = h;
  right.querySelectorAll('.toggle button').forEach(function (b) {
    b.onclick = function () { state.view = b.getAttribute('data-view'); renderRight(); };
  });
  renderMath(right);
  if (d.decision === 'edit') openEditor(d.edited);
}

var DEC = [
  ['ok', 'Верно', 'оставить как есть'],
  ['accept_proposed', 'Принять правку', 'взять предложение модели'],
  ['edit', 'Исправить', 'поправить текст самому'],
  ['hide', 'Скрыть задачу', 'с сайта, до доработки'],
  ['not_a_task', 'Не задача', 'мусор, не задание'],
  ['skip', 'Пропустить', 'вернуть в очередь']
];
function labelsFor(c) {
  if (c.kind !== 'pair') return DEC;
  return DEC.map(function (x) {
    if (x[0] === 'ok') return ['ok', 'Разные задачи', 'завести задание новой задачей'];
    if (x[0] === 'accept_proposed') return ['accept_proposed', 'Та же задача', 'привязать к #' + c.pair.id];
    return x;
  });
}

function renderActions() {
  var c = card(), d = state.d[c.item_id] || {}, h = '';
  if (REVIEW) {
    h += '<div class="row">' + labelsFor(c).map(function (x, k) {
      var dis = (x[0] === 'accept_proposed' && c.kind !== 'pair' && !c.proposed);
      return '<button class="dec' + (d.decision === x[0] ? ' chosen' : '') + '" data-dec="' + x[0] + '"' + (dis ? ' disabled' : '') +
        ' title="' + esc(x[2]) + '"><b>' + (k + 1) + '</b> ' + esc(x[1]) + '</button>';
    }).join('') + '</div>';
  } else {
    var ds = d.defects || [];
    h += '<div class="row defects">' + Object.keys(META.defects).map(function (k, n) {
      return '<label><input type="checkbox" data-defect="' + k + '"' + (ds.indexOf(k) >= 0 ? ' checked' : '') + '> ' +
        esc(META.defects[k]) + ' <span class="kbd">' + (n + 1) + '</span></label>';
    }).join('') + '<label><input type="checkbox" id="nodef"' + (d.no_defects ? ' checked' : '') + '> <b>Дефектов нет</b> <span class="kbd">0</span></label></div>';
  }
  h += '<div class="row"><textarea id="comment" placeholder="Комментарий (необязательно)">' + esc(d.comment || '') + '</textarea></div>';
  h += '<div class="row"><span class="status' + (decided(c) ? ' done' : '') + '" id="status">' + statusText(c) + '</span>' +
       '<span class="help">Клавиши: ' + (REVIEW ? '1–6 решение' : '1–9 дефект, 0 — дефектов нет') + ', ← → карточки</span></div>';
  var box = document.getElementById('actions');
  box.innerHTML = h;
  box.querySelectorAll('button.dec').forEach(function (b) { b.onclick = function () { decide(b.getAttribute('data-dec')); }; });
  box.querySelectorAll('input[data-defect]').forEach(function (cb) { cb.onchange = function () { toggleDefect(cb.getAttribute('data-defect'), cb.checked); }; });
  var nd = document.getElementById('nodef'); if (nd) nd.onchange = function () { setNoDefects(nd.checked); };
  document.getElementById('comment').oninput = function (e) { entry(c).comment = e.target.value; touch(c); };
}

function statusText(c) {
  var d = state.d[c.item_id];
  if (!d) return 'Не решено';
  if (REVIEW) {
    var x = labelsFor(c).filter(function (y) { return y[0] === d.decision; })[0];
    return x ? 'Решено: ' + x[1] : 'Не решено';
  }
  if (d.no_defects) return 'Дефектов нет';
  return (d.defects || []).length ? 'Дефекты: ' + d.defects.map(function (k) { return META.defects[k]; }).join(', ') : 'Не решено';
}

function entry(c) { return state.d[c.item_id] || (state.d[c.item_id] = {}); }
function touch(c) { entry(c).ts = new Date().toISOString(); persist(); updateProgress(); }

function decide(dec) {
  var c = card();
  if (dec === 'accept_proposed' && c.kind !== 'pair' && !c.proposed) return;
  if (dec === 'edit') { openEditor(); return; }
  var e = entry(c); e.decision = dec; delete e.edited;
  touch(c); renderActions(); closeEditor();
}

function toggleDefect(k, on) {
  var c = card(), e = entry(c); e.defects = e.defects || [];
  var at = e.defects.indexOf(k);
  if (on && at < 0) e.defects.push(k);
  if (!on && at >= 0) e.defects.splice(at, 1);
  if (e.defects.length) e.no_defects = false;
  touch(c); renderActions();
}
function setNoDefects(on) { var c = card(), e = entry(c); e.no_defects = on; if (on) e.defects = []; touch(c); renderActions(); }

/* Правка: поля задачи как текст + живой предпросмотр. Сохраняются только изменённые поля. */
function openEditor(edited) {
  var c = card(), base = JSON.parse(JSON.stringify(c.current || {}));
  if (c.proposed) Object.keys(c.proposed).forEach(function (k) { base[k] = JSON.parse(JSON.stringify(c.proposed[k])); });
  if (edited) Object.keys(edited).forEach(function (k) { base[k] = JSON.parse(JSON.stringify(edited[k])); });
  var ed = document.getElementById('editor');
  var parts = base.parts || [];
  var h = '<b>Исправить задачу</b> <span class="help">— правьте исходный текст (markdown, формулы в $…$). Внизу — предпросмотр.</span>' +
    '<label>Заголовок</label><input id="e-title" value="' + esc(base.title || '') + '">' +
    '<label>Условие</label><textarea id="e-statement" rows="9">' + esc(base.statement || '') + '</textarea>' +
    '<label>Пункты / варианты теста (метка · текст · ответ; у верного варианта теста ответ «верно»)</label><div id="e-parts">' +
    parts.map(partRow).join('') + '</div><button type="button" id="e-addpart">+ пункт</button>' +
    '<label>Ответ (ключ теста)</label><textarea id="e-answer" rows="2">' + esc(base.answer || '') + '</textarea>' +
    '<label>Решение</label><textarea id="e-solution" rows="8">' + esc(base.solution || '') + '</textarea>' +
    '<div class="row" style="margin-top:10px;display:flex;gap:8px"><button class="primary" id="e-save">Сохранить правку</button><button id="e-cancel">Отмена</button></div>' +
    '<div class="prev"><div class="help">Предпросмотр (упрощённый):</div><div class="task" id="e-prev"></div></div>';
  ed.innerHTML = h; ed.classList.add('open');
  document.getElementById('e-addpart').onclick = function () {
    document.getElementById('e-parts').insertAdjacentHTML('beforeend', partRow({ label: '', statement: '', answer: '' })); bindPreview();
  };
  document.getElementById('e-save').onclick = saveEdit;
  document.getElementById('e-cancel').onclick = closeEditor;
  bindPreview(); preview();
  ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function partRow(p) {
  return '<div class="part"><input class="p-label" value="' + esc(p.label) + '" placeholder="метка">' +
    '<textarea class="p-text" rows="2">' + esc(p.statement) + '</textarea><input class="p-ans" value="' + esc(p.answer) + '" placeholder="ответ"></div>';
}
function bindPreview() { document.querySelectorAll('#editor input, #editor textarea').forEach(function (x) { x.oninput = preview; }); }
function readEditor() {
  var parts = [];
  document.querySelectorAll('#e-parts .part').forEach(function (r) {
    var p = { label: r.querySelector('.p-label').value.trim(), statement: r.querySelector('.p-text').value, answer: r.querySelector('.p-ans').value };
    if (p.label || p.statement.trim() || p.answer.trim()) parts.push(p);
  });
  return { title: document.getElementById('e-title').value, statement: document.getElementById('e-statement').value,
           parts: parts, answer: document.getElementById('e-answer').value, solution: document.getElementById('e-solution').value };
}
function preview() {
  var f = readEditor();
  var t = { title: esc(f.title), statement: miniMd(f.statement), answer: miniMd(f.answer), solution: miniMd(f.solution),
            parts: f.parts.map(function (p) { return { label: esc(p.label), html: miniMd(p.statement), answer: miniMd(p.answer) }; }) };
  var box = document.getElementById('e-prev'); box.innerHTML = taskHtml(t); renderMath(box);
}
function saveEdit() {
  var c = card(), f = readEditor(), cur = c.current || {}, changed = {};
  Object.keys(f).forEach(function (k) {
    if (JSON.stringify(f[k]) !== JSON.stringify(cur[k] == null ? (k === 'parts' ? [] : '') : cur[k])) changed[k] = f[k];
  });
  if (!Object.keys(changed).length) { alert('Ничего не изменено — если всё верно, нажмите «Верно».'); return; }
  var e = entry(c); e.decision = 'edit'; e.edited = changed;
  touch(c); renderActions();
  document.getElementById('editor').classList.remove('open');
}
function closeEditor() { var ed = document.getElementById('editor'); if (ed) ed.classList.remove('open'); }

function updateProgress() {
  var n = CARDS.filter(decided).length;
  document.getElementById('progress').textContent = 'Сделано ' + n + ' из ' + CARDS.length;
  document.getElementById('bar').style.width = (100 * n / CARDS.length) + '%';
}

function renderList() {
  var box = document.getElementById('list');
  box.innerHTML = CARDS.map(function (c, k) {
    return '<a href="#" data-k="' + k + '" class="' + (k === state.i ? 'cur' : '') + '">' + (k + 1) + '. ' + esc(c.head) +
      (decided(c) ? '<span class="d">✓</span>' : '') + '</a>';
  }).join('');
  box.querySelectorAll('a').forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); go(+a.getAttribute('data-k')); box.classList.remove('open'); }; });
}

function go(k) {
  if (k < 0 || k >= CARDS.length) return;
  state.i = k; state.page = 0; state.view = 'current'; state.zoom = false; persist();
  renderPages(); renderRight(); renderActions(); updateProgress();
  document.getElementById('right').scrollTop = 0; document.getElementById('left').scrollTop = 0;
}

function download() {
  var out = [];
  CARDS.forEach(function (c) {
    var d = state.d[c.item_id]; if (!d) return;
    if (REVIEW) {
      if (!d.decision) return;
      out.push({ item_id: c.item_id, decision: d.decision, edited: d.decision === 'edit' ? (d.edited || {}) : {},
                 reviewer: META.reviewer, comment: d.comment || '', ts: d.ts || '' });
    } else {
      if (!d.no_defects && !(d.defects || []).length) return;
      out.push({ item_id: c.item_id, decision: 'acceptance', defects: d.no_defects ? [] : (d.defects || []),
                 no_defects: !!d.no_defects, reviewer: META.reviewer, comment: d.comment || '', ts: d.ts || '' });
    }
  });
  var body = JSON.stringify({ pack_id: META.pack_id, reviewer: META.reviewer, mode: META.mode,
    saved: new Date().toISOString(), cards: CARDS.length, decisions: out }, null, 1);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
  a.download = 'решения_' + META.pack_id + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.addEventListener('keydown', function (ev) {
  var t = ev.target && ev.target.tagName;
  if (t === 'TEXTAREA' || t === 'INPUT' && ev.target.type !== 'checkbox' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'ArrowRight') { go(state.i + 1); ev.preventDefault(); return; }
  if (ev.key === 'ArrowLeft') { go(state.i - 1); ev.preventDefault(); return; }
  if (REVIEW && /^[1-6]$/.test(ev.key)) { decide(labelsFor(card())[+ev.key - 1][0]); ev.preventDefault(); return; }
  if (!REVIEW && /^[0-9]$/.test(ev.key)) {
    if (ev.key === '0') { setNoDefects(!(entry(card()).no_defects)); }
    else { var k = Object.keys(META.defects)[+ev.key - 1]; if (k) toggleDefect(k, (entry(card()).defects || []).indexOf(k) < 0); }
    ev.preventDefault();
  }
});

document.getElementById('b-prev').onclick = function () { go(state.i - 1); };
document.getElementById('b-next').onclick = function () { go(state.i + 1); };
document.getElementById('b-save').onclick = download;
document.getElementById('b-list').onclick = function () { renderList(); document.getElementById('list').classList.toggle('open'); };
document.getElementById('pg-prev').onclick = function () { var c = card(); if (c.pages.length) { state.page = (state.page - 1 + c.pages.length) % c.pages.length; renderPages(); } };
document.getElementById('pg-next').onclick = function () { var c = card(); if (c.pages.length) { state.page = (state.page + 1) % c.pages.length; renderPages(); } };
document.getElementById('pg-zoom').onclick = function () { state.zoom = !state.zoom; renderPages(); };
window.addEventListener('beforeunload', persist);

/* Самопроверка сборщика (index.html#selfcheck, headless Chrome): все карточки во всех
   видах — ошибки KaTeX, картинки, которые не открылись. Ответ — в <pre id="selfcheck">. */
function selfcheck() {
  var box = document.createElement('div'), report = { cards: CARDS.length, katex_errors: [], images: 0, broken: [] };
  document.body.appendChild(box);
  CARDS.forEach(function (c) {
    [['сейчас', c.current_html], ['модель', c.proposed_html], ['банк', c.pair && c.pair.html]].forEach(function (v) {
      if (!v[1]) return;
      var el = document.createElement('div'); el.innerHTML = taskHtml(v[1]); box.appendChild(el); renderMath(el);
      el.querySelectorAll('.katex-error').forEach(function (e) {
        report.katex_errors.push({ item_id: c.item_id, view: v[0], tex: (e.getAttribute('title') || e.textContent).slice(0, 160) });
      });
    });
    c.pages.forEach(function (p) { var im = new Image(); im.src = p.src; im.setAttribute('data-item', c.item_id); box.appendChild(im); });
  });
  var imgs = box.querySelectorAll('img');
  report.images = imgs.length;
  var left = imgs.length;
  function finish() {
    imgs.forEach(function (im) { if (!im.naturalWidth) report.broken.push((im.getAttribute('data-item') || '') + ' ' + im.getAttribute('src')); });
    var pre = document.createElement('pre'); pre.id = 'selfcheck'; pre.textContent = JSON.stringify(report);
    document.body.insertBefore(pre, document.body.firstChild);
  }
  if (!left) { finish(); return; }
  imgs.forEach(function (im) {
    if (im.complete) { if (--left === 0) finish(); return; }
    im.onload = im.onerror = function () { if (--left === 0) finish(); };
  });
}

document.getElementById('h-title').textContent = (REVIEW ? 'Проверка' : 'Приёмка') + ': ' + META.reviewer + ' · пакет ' + META.pack_id;
if (location.hash === '#selfcheck') { selfcheck(); } else { load(); go(Math.min(state.i, CARDS.length - 1)); }
</script>
</body>
