Письмо с кодом (docs/MAIL.md). Только встроенные стили: почтовые программы
выбрасывают <style> и внешние таблицы. Ни картинок, ни пикселей слежения;
ссылки только на главную и на Telegram-канал — ссылки, которая что-то делает
с аккаунтом, в письме нет и быть не должно (решение 26.10.2026).
Без doctype намеренно: почтовые программы его не читают, а сторожа сайта
считают каждый шаблон с doctype страницей сайта (Метрика, футер документов).
