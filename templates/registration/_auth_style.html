<style>

  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;

  text-rendering: optimizeLegibility;
}
.login-card {

}

}

   «econoics» просто пропадало: видна была одна бирюзовая W. Найдено на

   Ширина 170 px — меньше половины карточки: знак не спорит с заголовком. */
.login-logo-lockup { width: 170px; height: auto; display: block;
                     color: var(--text); }

  margin-bottom: 6px;
}
.login-sub {

  color: var(--text2);
  margin-bottom: 28px;
}
label {

  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 6px;
}
input[type=text],
input[type=password],
input[type=email] {

  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 12px;
  font-size: 14px;

.auth-foot a { color: var(--accent-ink); text-decoration: none; }

/* Переключатель темы и метка версии — в правом верхнем углу СТРАНИЦЫ:

/* Выбор роли при регистрации — плитки, а не выпадающий список (канон 3.10):

.role-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.role-tiles label {
  margin: 0;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 10px;
  text-align: center;
  cursor: pointer;
  background: var(--surface-2);
  transition: border-color .12s, background .12s;
}
.role-tiles input { position: absolute; opacity: 0; pointer-events: none; }
.role-tiles label:hover { border-color: var(--accent-ring); }
.role-tiles input:checked + span { color: var(--accent-ink); font-weight: 600; }
.role-tiles label:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-tint);
}
.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.45;
  cursor: pointer;
}

.consent span { font-weight: 400; }
