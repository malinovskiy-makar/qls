{% extends "admin/base.html" %}
{% load i18n %}

{# Переопределяем блок верхней панели, чтобы добавить ссылку на Desmos-калькулятор. #}
{% block nav-global %}
  <style>
    /* Кнопка «Графики» в шапке Admin */
    .desmos-nav-link {
      display: inline-block;
      margin-right: 12px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.15);
      color: #fff !important;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none !important;
      transition: background .15s;
    }
    .desmos-nav-link:hover {
      background: rgba(255,255,255,0.28);
    }
  </style>
  <a href="/desmos/" class="desmos-nav-link">Графики</a>
  <a href="/teacher/" class="desmos-nav-link">Кабинет</a>
{% endblock %}
