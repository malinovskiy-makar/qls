{% comment %}
Группа выбора: плитки (`.k-tile`), сегмент или пилюли — всегда `<label>` с
настоящим `<input>` внутри, поэтому работает и без скрипта. `aria-pressed` и
`k-tile--on` сервер ставит по сохранённому ответу; скрипт только переключает их.
Параметры: name, items ({code, label, note, on}), multi, look (tiles/seg/pills),
errors, cols (класс сетки плиток).
{% endcomment %}<div class="ob-{{ look }}{% if cols %} {{ cols }}{% endif %}">{% for c in items %}
  <label class="{% if look == 'tiles' %}k-tile ob-tile{% if c.on %} k-tile--on{% endif %}{% else %}ob-opt{% if c.on %} is-on{% endif %}{% endif %}" aria-pressed="{{ c.on|yesno:'true,false' }}">
    <input type="{{ multi|yesno:'checkbox,radio' }}" name="{{ name }}" value="{{ c.code }}"{% if c.on %} checked{% endif %}>{% if icon %}{% include 'onboarding/_role_icon.html' with code=c.code %}{% endif %}
    {% if look == 'tiles' %}<span class="k-tile__name">{{ c.label }}</span>{% if c.note %}<span class="k-tile__note">{{ c.note }}</span>{% endif %}{% else %}<span>{{ c.label }}</span>{% endif %}
  </label>{% endfor %}
</div>{% for error in errors %}
<div class="ob-err" role="alert">{{ error }}</div>{% endfor %}
