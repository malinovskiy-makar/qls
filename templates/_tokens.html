{% comment %}
  _tokens.html — единая система дизайн-токенов публичного сайта (свет + тьма).
  Подключается ПЕРВЫМ в <head> каждого публичного базового шаблона
  (catalog/student/teacher base + login). НЕ подключается в /calc2/ и /admin/ —
  у них свои изолированные миры токенов.

  Анти-мигание: скрипт ДО <style> ставит data-theme по сохранённому выбору,
  поэтому тёмная тема применяется без вспышки белого фона при загрузке.

  Палитра малинового акцента взята из /calc2/ (Scene). Акцент — ТОЛЬКО на
  мелочах (логотип, активный пункт nav, ссылки, фокус, чекбоксы, чипы).
  Крупные сплошные кнопки — графитовые (--btn-bg), НЕ малиновые.
  Сигналы священны: --amber = звёзды сложности, --green = «решение ✓».
{% endcomment %}
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<style>
:root {
  /* акцент — малиновый (как в /calc2/) */
  --accent: #BE185D;
  --accent-deep: #9D1450;
  --accent-tint: rgba(190,24,93,.10);
  --accent-ring: rgba(190,24,93,.34);
  /* ⚠️ АКЦЕНТ СОСТАВЛЯЮЩИМИ — ДЛЯ ЗАЛИВОК РАЗНОЙ ПЛОТНОСТИ (ревью 17.08,
     п. 3.1). Шкалу заливки календаря активности рисовали свойством
     `opacity` у самой клетки, а оно гасит ВСЁ содержимое: на первом уровне
     цифра дня оставалась при 22% и физически не читалась (контраст 1,01).
     Полупрозрачность обязана жить в ЦВЕТЕ ФОНА, а не в клетке. */
  --accent-rgb: 190, 24, 93;
  /* Чернила на такой заливке: до третьего уровня фон светлый (тёмный
     текст), на сплошном акценте — белый. Обе пары замерены тестом. */
  --act-ink: #1a1a1a;
  --act-ink-solid: #ffffff;
  /* поверхности и фон */
  --bg: #f5f5f3;          /* фон страницы */
  --surface: #ffffff;     /* карточки/панели с контентом */
  --surface-2: #f5f5f3;   /* рецессивные: рельс фильтров, инпуты */
  --border: rgba(22,26,38,.12);
  --border-soft: rgba(22,26,38,.07);
  /* текст */
  --text: #1a1a1a;
  --text2: #5b6472;
  --text3: #687180;
  /* крупные кнопки — графитовые, НЕ малиновые */
  --btn-bg: #1e293b;
  --btn-bg-hover: #293548;
  --on-btn: #ffffff;
  /* шапка/nav — графит (в обеих темах) */
  --nav-bg: #1a1f2e;
  /* нейтральный чип (тема задачи и т.п.) */
  --chip-bg: #f1f0ec;
  --chip-text: #5b6472;
  /* сигналы — сохраняем */
  --amber: #b26b00;
  --amber-tint: #fff7e8;
  --amber-border: #ffe0a3;
  /* ⚠️ ЯНТАРЬ РАЗВЕДЁН НА ДВА ТОКЕНА (решение владельца, ревью 15.08).
     `--amber` остаётся СИГНАЛОМ: звёзды сложности, полосы, заливки шкал,
     значки. `--amber-ink` — только ТЕКСТ на янтарной подложке.
     Причина: пара #b26b00 на #fff7e8 давала 3,95:1 при норме AA 4,5 — то
     есть каждый чип «частично верно» читался хуже нормы. Менять сам сигнал
     нельзя (за ним закреплён смысл), а контраст нужен там, где буквы.
     Замер: 6,00:1 на подложке, 6,39:1 на белом, 5,00:1 на плотном
     `--amber-border`, которым залит кружок счётчика. */
  --amber-ink: #8a5200;
  --green: #1d7e45;
  --green-tint: #e9faf0;
  --green-border: #b7dfb7;
  /* ошибки */
  --error: #c0392b;
  --error-tint: #fff0f0;
  --error-border: #ffd5d5;
  /* ⚠️ ЧЕРНИЛА НА ПЛОТНОМ КРАСНОМ — СВОЙ ТОКЕН, И ОН МЕНЯЕТСЯ ПО ТЕМЕ.
     Кружок счётчика «Задания» залит красным целиком, как уведомление в
     мессенджере (решение владельца, ревью 16.08). В светлой теме
     `--error` тёмный, и поверх него белое; в тёмной теме `--error`
     СВЕТЛЫЙ (#ff6b6b) — белое на нём даёт 2,78:1, то есть хуже нормы.
     Нового цвета это не заводит: обе величины уже есть в палитре
     (`--on-btn` и `--text`). Замер держится тестом. */
  --on-error: #ffffff;
  /* радиус (был в каждом base) */
  --r: 6px;
  /* легаси-алиасы старых имён — чтобы не переписывать каждую ссылку */
  /* Кольцо фокуса — НЕЙТРАЛЬНОЕ, не малиновое.
     ⚠️ Малиновый оставлен навигации и мелочам; поле ввода, обведённое
     акцентом, — крупный акцент на каждом клике, а их за работу сотни. */
  --focus: #64748b;
  --focus-ring: rgba(30,41,59,.16);
  /* Тень у прокручиваемого края таблицы: «лист продолжается вправо».
     Нейтральная — это признак прокрутки, а не состояние данных. */
  --fade-edge: rgba(15,23,42,.13);
  /* ⚠️ «ЖДЁТ ПРОВЕРКИ» — НЕЙТРАЛЬНЫЙ СЕРО-СИНИЙ, НЕ ЯНТАРЬ. Янтарь занят
     смыслом «частично верно», и на соседних экранах (проверка задачи →
     итоги проверки) одна и та же жёлтая полоса означала разное.
     Замер контраста: текст на своей подложке 6,67:1, полоса против белой
     карточки 7,50:1 — обе выше порога AA (4,5:1). */
  --pending: #43566f;
  --pending-tint: #eef2f7;
  --pending-border: #cfd9e6;
  --sb: var(--nav-bg);
  --panel: var(--surface-2);
}
[data-theme="dark"] {
  --accent: #FF4D94;
  --accent-deep: #FF6BA6;
  --accent-tint: rgba(255,77,148,.16);
  --accent-ring: rgba(255,77,148,.42);
  --accent-rgb: 255, 77, 148;
  /* ⚠️ В ТЁМНОЙ ТЕМЕ ЧЕРНИЛА МЕНЯЮТСЯ МЕСТАМИ. Сам акцент здесь СВЕТЛЫЙ
     (#FF4D94), и белым по нему выходит 3,12:1 — ниже нормы; на слабых
     заливках, наоборот, светлый текст единственно читаем. Та же пара, что
     у кружка счётчика (`--on-error`). */
  --act-ink: #ffffff;
  --act-ink-solid: #161b25;
  --bg: #10141c;
  --surface: #161b25;
  --surface-2: #1d2330;
  --border: rgba(255,255,255,.13);
  --border-soft: rgba(255,255,255,.07);
  --text: #e7e9ef;
  --text2: #a7aebc;
  --text3: #8e96a4;
  /* ⚠️ ГЛАВНАЯ КНОПКА В ТЁМНОЙ ТЕМЕ ЧИТАЛАСЬ БЛЁКЛОЙ — И ДЕЛО НЕ В ТЕКСТЕ.
     Замер: белый на прежнем #334155 давал 10,35:1, то есть с текстом всё
     было в порядке. Не хватало другого — САМА КНОПКА не отличалась от
     панели, на которой лежит: #334155 против #1d2330 это 1,52:1, разница
     в пару тонов. Заливка не читалась как заливка, отсюда «блёкло-серо-
     синяя». Осветлили до 2,11:1 с панелью, текст остался на 7,47:1. */
  --btn-bg: #46566d;
  --btn-bg-hover: #556883;
  --on-btn: #ffffff;
  --focus: #94a3b8;
  --focus-ring: rgba(148,163,184,.26);
  /* ⚠️ В ТЁМНОЙ ТЕМЕ КРАЙ СВЕТЛЫЙ, А НЕ ЧЁРНЫЙ (ревью 15.08, фаза 5).
     Владелец: «в светлой это выглядит лучше, в тёмной надо сделать более
     явное изменение цвета у границ». Замер объясняет почему: в светлой теме
     край даёт перепад яркости 1,28 против ровного места, а чёрный по тёмному
     не даёт и 1,21 — ДАЖЕ ЧИСТО ЧЁРНЫЙ (до правки было 1,10). Перепада той
     же силы в тёмной теме можно добиться только СВЕТЛЫМ краем.
     Замер по самим снимкам (`scripts/r15_fade_shots.js` + разбор пикселей):
     светлая 1,28, тёмная 1,32 — то есть догнали, как и просили. */
  --fade-edge: rgba(255,255,255,.10);
  /* Тёмная тема: 6,38:1 текста на своей подложке, 8,89:1 полосы на панели. */
  --pending: #a8bcd6;
  --pending-tint: rgba(168,188,214,.16);
  --pending-border: rgba(168,188,214,.34);
  --nav-bg: #1a1f2e;
  --chip-bg: rgba(255,255,255,.07);
  --chip-text: #a7aebc;
  --amber: #f5a623;
  --amber-tint: rgba(245,166,35,.15);
  --amber-border: rgba(245,166,35,.35);
  /* Тёмная тема: сам `--amber` на подложке даёт 5,81:1 и норму держит, но на
     ПЛОТНОМ фоне кружка (.35) падает до 3,98:1 — поэтому у чернил свой,
     более светлый оттенок: 8,15:1 на подложке и 5,05:1 на плотном фоне. */
  --amber-ink: #ffc25e;
  --green: #3fc77f;
  --green-tint: rgba(63,199,127,.15);
  --green-border: rgba(63,199,127,.32);
  --error: #ff6b6b;
  --error-tint: rgba(192,57,43,.16);
  --error-border: rgba(255,107,107,.30);
  --on-error: #14181f;
}
</style>
