{% comment %}
  _tokens.html — единая система дизайн-токенов публичного сайта (свет + тьма).
  Подключается ПЕРВЫМ в <head> каждого публичного базового шаблона
  (catalog/student/teacher base + login). НЕ подключается в /calc2/ и /admin/ —
  у них свои изолированные миры токенов.

  Анти-мигание: скрипт ДО <style> ставит data-theme по сохранённому выбору,
  поэтому тёмная тема применяется без вспышки белого фона при загрузке.

  Палитра малинового акцента взята из /calc2/ (Scene). Акцент — ТОЛЬКО на
  мелочах (логотип, активный пункт nav, ссылки, фокус, чекбоксы, чипы).
  Крупные сплошные кнопки — графитовые (--btn-bg), НЕ малиновые.
  Сигналы священны: --amber = звёзды сложности, --green = «решение ✓».

  31.08.2026: палитра переведена на Weconomics (решения владельца, чат
  31.08.2026) — тёплый кремовый/графит вместо холодного серо-синего,
  акцент — бирюза вместо малинового. Значения токенов ниже обновлены,
  ИМЕНА не менялись; шесть новых помечены [НОВЫЙ]. Malinovyi-формулировки
  в объяснениях выше и по тексту файла оставлены как исторический контекст
  решений — не переписаны заново, это точечная правка одних значений.
{% endcomment %}{% load static %}

/* ── MONTSERRAT ────────────────────────────────────────────────────────
   Пять начертаний из восемнадцати присланных: четыре прямых (400/500/600/700)
   и один курсив 400. Thin и Black на сайте не применяются, а каждый лишний
   файл — это ещё запрос и ещё вес. Каждое обрезано до кириллицы, латиницы,
   цифр и типографской пунктуации: 257 КБ TTF → 31 КБ WOFF2, впятером 148 КБ.
   Математики в наборе НЕТ намеренно — формулы рисует KaTeX своими шрифтами.
   Лицензия SIL OFL возится рядом: static/fonts/LICENSE.txt.

   ⚠️ `font-display: swap` ОБЯЗАТЕЛЕН. Без него браузер прячет текст, пока
   шрифт грузится: на медленной сети ученик видит пустую страницу вместо
   условия задачи. Со `swap` он сразу читает системным и переключается,
   когда шрифт доедет.
   ⚠️ Резерв — системный и настоящий, а не «на всякий случай». Если файл не
   доехал, страница обязана остаться читаемой, а не поехать. */
@font-face {
  font-family: 'Montserrat'; font-style: normal; font-weight: 400;
  font-display: swap; src: url("{% static 'fonts/montserrat-400.woff2' %}") format('woff2');
}
@font-face {
  font-family: 'Montserrat'; font-style: normal; font-weight: 500;
  font-display: swap; src: url("{% static 'fonts/montserrat-500.woff2' %}") format('woff2');
}
@font-face {

/* ⚠️ НАСТОЯЩИЙ КУРСИВ, А НЕ НАКЛОН. Без этого файла браузер рисует `<em>`

     кривой платформа не заводит. Собственное движение графики в /calc2/
     (появление кривых, перестроение сцены) под это правило НЕ подпадает:
     у него своя кривая и длительности до 300 мс. */
  --t:      .12s;   /* цвет, рамка, фон у элемента управления            */
  --t-slow: .2s;    /* переключение темы, появление крупного блока       */

  /* Ширина полосы содержания. 860 — там, где основное содержание это
     длинный текст с формулами: строка короче, условие читается легче. */
  --w-page: 960px;
  --w-read: 860px;

  /* ── ТИПОГРАФИКА (Montserrat, 31.08.2026) ─────────────────────────
     Ни один из этих токенов не меняется по темам — как и размерные шкалы
     выше, объявлены один раз здесь и в тёмный блок не попадают.

     ⚠️ ОСНОВНОЙ ТЕКСТ НЕ УМЕНЬШАЕТСЯ. Montserrat геометрический: круглые
     буквы, широкие пропорции, малая разница между «о» и «с». На мелких
     кеглях он читается хуже гротесков-гуманистов, которыми жил сайт до
     сих пор, поэтому 16 px основного текста — это пол, а не цель.

     ⚠️ НАЧЕРТАНИЙ РОВНО ЧЕТЫРЕ, И РОЛИ У НИХ ПОСТОЯННЫЕ:
       400 — весь текст;
       500 — подписи и метаданные;
       600 — заголовки и кнопки;
       700 — только числа-показатели на лендинге и акцент внутри заголовка.
     В остальных местах вес не меняется. Разнобой начертаний — самый частый
     способ превратить систему в кашу, и он же самый незаметный: каждая
     отдельная правка выглядит безобидно.

     ⚠️ СЛОВА В CSS-КОММЕНТАРИЯХ ЭТОГО ФАЙЛА ПОПАДАЮТ В HTML КАЖДОЙ
     СТРАНИЦЫ. Комментарий шаблонизатора вырезается при отрисовке, а
     комментарий CSS внутри `<style>` уезжает в разметку как есть. Первая
     версия объяснения выше начиналась со слова, которое стоит в старой
     легенде теплокарты, и проверка «старой легенды на странице больше нет»
     покраснела — не на цвете и не на шрифте, а на собственном комментарии.
     Тот же класс, что предупреждение про селектор тёмной темы выше. Не
     цитируй здесь текст, который может встретиться на экране.

     ⚠️⚠️ И НЕ ПИШИ ЗДЕСЬ ЗНАКИ ОТКРЫТИЯ И ЗАКРЫТИЯ КОММЕНТАРИЯ CSS — ДАЖЕ
     В КАВЫЧКАХ, ДАЖЕ КАК ПРИМЕР. Комментарии CSS не вкладываются: браузер
     закрывает комментарий на ПЕРВОМ же знаке закрытия и дальше читает текст
     объяснения как код. Разбор ошибки доедает всё до ближайшей точки с
     запятой — то есть съедает СЛЕДУЮЩЕЕ объявление целиком. Ровно это и
     случилось: прежняя версия этого абзаца приводила оба знака как пример,
     съедала `--font-ui`, тот становился пустым, `font-family: var(--font-ui)`
     — недействительным, и ВЕСЬ САЙТ рисовался Times с засечками. Сторожит
     `problems/tests/test_tokens_css.py`. */
  --font-ui: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI',
             Roboto, sans-serif;
  --fs-hero:   32px;   /* заголовок экрана                  600 */
  --fs-h1:     24px;   /* заголовок раздела                 600 */
  --fs-h2:     19px;   /* подзаголовок                      600 */
  --fs-body:   16px;   /* основной текст, условия задач     400 */
  --fs-ui:   14.5px;   /* кнопки, поля, пункты меню         400 */
  --fs-meta:   13px;   /* подписи, чипы, номера             500 */
  /* ⚠️ ПОЛ ШКАЛЫ ПОДНЯТ 01.09.2026, И ЭТО НЕ ВКУС. Прежние 12,5 стояли ниже
     пола, который канон сам же и называет для подписи, — 13. Заметили это
     только когда шрифт наконец начал отрисовываться: до того весь сайт
     рисовался Times, а он при том же кегле кажется мельче, и разговор шёл
     про «мелко вообще», а не про конкретную ступень.
     ⚠️ САМА ШКАЛА ПОКА НИКЕМ НЕ ЧИТАЕТСЯ: обращений `var(--fs-…)` по проекту
     НОЛЬ, кегли стоят числами прямо в экранах. Значения здесь — описание
     трёх ступеней, на которые экраны сведены (16 основной / 14 интерфейс /
     13 подпись), а не источник, из которого они берутся. Перевод экранов на
     токены — отдельная работа, к ней ещё никто не приступал. */
  --lh-tight: 1.25;    /* заголовки                             */
  --lh-body:  1.6;     /* текст                                 */
  --lh-ui:    1.45;    /* интерфейс                             */

  /* Тень — только у того, что физически висит НАД страницей: подсказка,
     меню. У поверхности в покое и под курсором тени нет, отличие дают
     рамка и фон. */
  --shadow-pop: 0 6px 20px rgba(0,0,0,.14);
  /* легаси-алиасы старых имён — чтобы не переписывать каждую ссылку */
  /* Кольцо фокуса — НЕЙТРАЛЬНОЕ, не акцентное.
     ⚠️ Акцент оставлен навигации и мелочам; поле ввода, обведённое
     акцентом, — крупный акцент на каждом клике, а их за работу сотни. */
  --focus: #7d7466;
  --focus-ring: rgba(125,116,102,.22);
  /* Тень у прокручиваемого края таблицы: «лист продолжается вправо».
     Нейтральная — это признак прокрутки, а не состояние данных.
     ⚠️ Плотность поднята на треть (ревью 17.08, п. 6.5): край работал
     правильно — гас при прокрутке до конца, — но был еле заметен, и до
     половины смотревших просто не догадывались, что таблица едет вбок.
     31.08.2026: новая палитра, тон сдвинут под тёплый графит текста. */
  --fade-edge: rgba(45,40,30,.17);
  /* ⚠️ «ЖДЁТ ПРОВЕРКИ» — НЕЙТРАЛЬНЫЙ СЕРО-СИНИЙ, НЕ ЯНТАРЬ. Янтарь занят
     смыслом «частично верно», и на соседних экранах (проверка задачи →
     итоги проверки) одна и та же жёлтая полоса означала разное.
     Замер контраста: текст на своей подложке 6,67:1, полоса против белой
     карточки 7,50:1 — обе выше порога AA (4,5:1).
     31.08.2026: НЕ ТРОГАЕМ — тот же холодный серо-синий читается как
     «чужое / нейтральное» и в тёплой гамме, это и есть смысл «ждёт
     проверки». Замер под новую палитру: 6,35:1 на подложке, 7,26:1 полоса
     против новой карточки — норма не нарушена. */
  --pending: #43566f;
  --pending-tint: rgba(67,86,111,.09);
  --pending-border: rgba(67,86,111,.28);
  /* Пунктир под числом, которое можно править (`.k-num`). Это тот же
     `--border`, только заметнее: у рамки его задача — очертить поле, а
     здесь линия ОДНА и на ней держится всё сообщение «сюда можно вписать».
     На .12 она читается как случайная царапина. Новым цветом в палитре не
     является: тот же оттенок границы, другая плотность.
     31.08.2026: новая палитра, тон сдвинут под тёплый графит текста. */
  --num-line: rgba(45,45,45,.34);
  --sb: var(--nav-bg);
  --panel: var(--surface-2);

  /* ── УЗЕЛ КАРТЫ ТЕМ (/catalog/map/) ────────────────────────────────
     ОДИН нейтральный цвет на все 372 узла. Раньше здесь лежали семь
     ПРЕДМЕТНЫХ цветов разделов корпуса (ADR 0036); от них отказались:
     семь оттенков пестрят, а без легенды перед глазами человек всё равно
     не помнит, что означает охра, — то есть цвет ничего не сообщал и ни к
     какому действию не вёл. Тема отличается от тега РАЗМЕРОМ узла, а
     подсветка — акцентом платформы (--accent). См. ADR 0038.
     Замер контраста к фону холста (порог узла 3:1): сам узел 7,21 в
     светлой и 11,68 в тёмной; тег рисуется тем же цветом с прозрачностью
     0,72, и его композит даёт 3,65 и 6,52. Акцент подсветки — 5,53 и
     5,92. Сторожит catalog/tests/test_topic_map.py.
     31.08.2026: значение НЕ меняем (владелец решил замерить, не красить
     заново). Контраст к новому фону холста --bg пересчитан: 6,75 в
     светлой теме, 11,42 в тёмной — обе заметно выше порога 3:1, править
     не требуется. */
  --map-node: #4A5260;
  /* ⚠️ ТРЕТИЙ ЦВЕТ КАРТЫ, И ОН НУЖЕН ИМЕННО ТРЕТИЙ. Надписи-ориентиры по
     разделам корпуса (ADR 0044) — отдельный слой: не объект и не подсветка.
     Акцент платформы (--accent, малиновый) занят подсветкой и означает «вот
     то, что ты держишь»; нейтральный --map-node занят узлами и означает «вот
     из чего сделан корпус». Написать ориентиры любым из двух — значит соврать
     про слой: серым они терялись среди узлов (это и увидел владелец на
     приёмке), малиновым притворялись бы подсветкой. Холодный синий читается
     как слой географии — так подписаны страны на бумажных картах — и не
     спорит ни с узлами, ни с подсветкой. См. ADR 0046.
     Замер контраста к фону холста (порог 4,5:1): 5,05 в светлой теме и
     9,32 в тёмной. Сторожит catalog/tests/test_topic_map.py. */
  --map-region: #3E6C99;
  /* ⚠️ СЕМЬ ЦВЕТОВ РАЗДЕЛОВ КОРПУСА — ЧЕТВЁРТАЯ РОЛЬ КАРТЫ. Тема и все её
     теги красятся цветом своего раздела; тег рисуется тем же цветом с
     прозрачностью 0,72. Это ВОЗВРАТ: цвета уже были (ADR 0036), их сняли в
     пользу одного нейтрального --map-node (ADR 0038) с доводом «пестрит, а
     легенду никто не помнит». Довод оказался неполным — без цвета карта
     читается как однородная сеть, и вопрос «где я» на ней не решается. Про
     легенду решение другое, чем в прошлый раз: отдельного блока-легенды
     нет, цвет назван прямо на органе управления — заголовок раздела в
     правой панели написан своим цветом. См. ADR 0053.
     Краски разведены ДВУМЯ осями: по тону (с пропуском участка, занятого
     --accent и --map-region) и по светлоте — соседние по тону пары (два
     зелёных, два фиолетовых) стоят на разных порогах контраста, потому что
     только тон различает не всякий глаз.
     Порог у самого цвета 4,5:1 — текстовый, а не 3:1 для графики: цвет
     здесь несёт смысл, а не украшает. Замер к фону холста:
     base 5,16 · market 6,60 · firm 5,76 · state 6,64 · macro 5,51 ·
     fin 6,28 · tools 5,12; композит тега при 0,72 — 3,14…3,59 при пороге 3.
     Сторожит catalog/tests/test_topic_map.py. */
  --map-g-base:   #A94223;   /* Основы и выбор          */
  --map-g-market: #704C10;   /* Рынок и потребитель     */
  --map-g-firm:   #576114;   /* Фирма и структуры рынка */
  --map-g-state:  #1C5F25;   /* Государство и доходы    */
  --map-g-macro:  #6847C2;   /* Мир и макроэкономика    */
  --map-g-fin:    #8C3180;   /* Финансы и инвестиции    */
  --map-g-tools:  #B53054;   /* Методы и прочее         */
  /* ⚠️ ПЛОТНОСТЬ СЛОЯ НИЖЕ, ЧЕМ В МАКЕТЕ, И ЭТО НЕ ПРОИЗВОЛ. В макете 11
     стоит .15; при ней самый тёмный знак паттерна сдвигает фон страницы до
     #cfdcc4, и ВЕСЬ текст, лежащий прямо на фоне, проваливает норму:
     --text3 4,49, --accent-ink 4,38, сигнальный янтарь 4,28 при пороге 4,5.
     Замер по ХУДШЕЙ точке паттерна, а не по средней — под знаком человек
     читает так же, как между знаками.
     Порог возвращается на .11; взято .10 с запасом: --text3 4,81,
     --accent-ink 4,69, янтарь 4,58. Разница .15 → .10 на экране почти не
     видна, а долг по контрасту — виден сразу. */
  --bg-pattern-alpha: .10;
  /* Светлые знаки в СВЕТЛОЙ теме идут вровень с тёмным — владелец смотрел и
     сказал, что здесь хорошо. Значение то же; отдельный токен заведён ради
     тёмной темы (см. ниже). */
  --bg-pattern-bright-alpha: .10;
}

  /* ⚠️ ГЛУБЖЕ И ТЕПЛЕЕ — ПРАВКА 01.09.2026 ПО ОТСМОТРУ ВЛАДЕЛЬЦА.
