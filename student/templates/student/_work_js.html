{% comment %}
Скрипты страницы работы: защита формы, подсказки и вопрос преподавателю.
Общие для домашки и контрольной.
{% endcomment %}
{% load static %}
<script src="{% static 'platform/work_form.js' %}"></script>

<script>
// Подсказки: показываем по одной при каждом клике.
function showHint(itemPk) {
  var key = 'hint_idx_' + itemPk;
  var idx = parseInt(sessionStorage.getItem(key) || '0', 10);
  var tpls = document.querySelectorAll('#hints-' + itemPk + ' template.hint-tpl');
  if (idx >= tpls.length) { return; }

  var container = document.getElementById('hint-shown-' + itemPk);
  var box = document.createElement('div');
  box.className = 'hint-box';
  box.innerHTML = '<div class="hint-label">Подсказка ' + (idx + 1) + '</div>'
    + tpls[idx].innerHTML;
  container.appendChild(box);
  if (typeof maskEscapedDollars === 'function') { maskEscapedDollars(box); }
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(box, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ], throwOnError: false
    });
  }
  if (typeof fixCurrencyDollars === 'function') { fixCurrencyDollars(box); }

  sessionStorage.setItem(key, idx + 1);
  if (idx + 1 >= tpls.length) {
    var btn = document.querySelector('#hints-' + itemPk + ' .hint-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Все подсказки открыты'; }
  }
}
</script>

<script>
// Вопрос ученика по задаче — без перезагрузки страницы.
// Видимость всегда приватная: её ставит СЕРВЕР, клиент её не выбирает.
//
// ⚠️ Блок вопроса — НЕ <form>: он стоит внутри формы отправки работы, а
// вложенную форму браузер молча выбрасывает вместе с обработчиком. Поэтому
// слушаем клик по кнопке, а не submit формы.
(function () {
  var url = "{% url 'teacher:api_comment_create' %}";
  var csrf = document.cookie.match(/csrftoken=([^;]+)/);

  function send(block) {
    var status = block.querySelector('.pf-status');
    var textarea = block.querySelector('textarea');
    var button = block.querySelector('.pf-ask');
    var text = (textarea.value || '').trim();
    if (!text) {
      status.textContent = 'Напишите вопрос.';
      textarea.focus();
      return;
    }
    button.disabled = true;
    status.textContent = 'Отправляю…';
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'X-CSRFToken': csrf ? csrf[1] : '' },
      body: JSON.stringify({ item_id: block.dataset.item, text: text })
    })
    .then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) { throw new Error(d.error || 'Ошибка'); }
        return d;
      });
    })
    .then(function (data) {
      var list = block.closest('.pf-comments').querySelector('.pf-comment-list');
      var empty = list.querySelector('.pf-comment-empty');
      if (empty) { empty.remove(); }
      // Свежее сообщение собираем ТЕМИ ЖЕ классами, что и остальные:
      // иначе оно выглядело бы иначе до перезагрузки страницы. Пишет
      // ученик — значит подложка.
      var wrap = document.createElement('div');
      wrap.className = 'pf-comment pf-comment--student';
      var head = document.createElement('div');
      head.className = 'pf-comment-head';
      var who = document.createElement('span');
      who.className = 'pf-comment-author';
      who.textContent = data.author;
      var when = document.createElement('span');
      when.className = 'pf-comment-when';
      when.textContent = data.created_at;
      head.appendChild(who);
      head.appendChild(when);
      // Пометку считает СЕРВЕР — иначе она разошлась бы с той, что
      // нарисована у остальных сообщений.
      if (data.note) {
        var note = document.createElement('span');
        note.className = 'pf-comment-note';
        note.textContent = data.note;
        head.appendChild(note);
      }
      var body = document.createElement('div');
      body.className = 'pf-comment-text';
      body.textContent = data.text;
      wrap.appendChild(head);
      wrap.appendChild(body);
      list.appendChild(wrap);
      textarea.value = '';
      status.textContent = 'Отправлено';
      setTimeout(function () { status.textContent = ''; }, 2000);
    })
    .catch(function (error) { status.textContent = error.message; })
    .then(function () { button.disabled = false; });
  }

  document.querySelectorAll('.pf-comment-form').forEach(function (block) {
    var button = block.querySelector('.pf-ask');
    if (!button) { return; }
    button.addEventListener('click', function () { send(block); });
    // Ctrl+Enter — привычная отправка из поля.
    block.querySelector('textarea').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { send(block); }
    });
  });
})();
</script>
