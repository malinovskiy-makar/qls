    равна $MPS=0{,}2$. В 2018г. численность населения страны А сократилась на 2% по сравнению с 2017г. Также правительство
    провело пенсионную реформу, повысив возраст выхода на пенсию, в связи с чем доля пенсионеров в общем количестве
    жителей страны А снизилась до 20% (считайте, что все бывшие пенсионеры, перешедшие в категорию молодежи, гарантированно
