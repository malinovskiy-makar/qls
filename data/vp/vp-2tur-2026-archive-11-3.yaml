  solution: Считаем численность в миллионах. Молодых было 70, стало $98\cdot0{,}8=78{,}4$; пенсионеров – 30 и 19,6.
    Обозначим совокупный ВВП через $Y_{\Sigma}$, а число молодых и пенсионеров – через $N_y$ и $N_p$. При $MPC=0{,}8$
