  statement: 'Пете в наследство от бабушки досталось 150 кг муки. У него есть 2 варианта использования полученного
    ресурса:


    1) Запустить собственное производство хлеба. Известно, что для производства 1 кг хлеба потребуется 500 гр муки
    и еще несколько ингредиентов, совокупная стоимость которых составляет 20 рублей. Спрос на хлеб (выраженный в
    килограммах хлеба) равен $D(P)=1200-20P$, где P – цена за килограмм хлеба.


    2) Начать печь пирожки. Для производства 1 кг пирожков потребуется 500 гр муки и несколько ингредиентов, совокупная
    стоимость которых составляет 25 рублей. Спрос на пирожки (выраженный в килограммах пирожков) равен $D(P)=400-5P$,
    где P – цена за килограмм пирожков.


    Известно, что в случае входа на каждый из представленных рынков Петя будет являться монополистом.


    Найдите максимальную прибыль, которую получит Петя при условии, что он может войти только на один рынок. Ответ
    дайте в рублях.


