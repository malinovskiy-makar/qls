  statement: 'Спрос на продукцию монополиста линеен, а средние издержки ее производства постоянны. В настоящий момент
    эластичность спроса по цене равна $-2$, и с целью увеличения оборота в краткосрочном периоде руководство компании
    собирается перейти от стратегии максимизации прибыли к стратегии максимизации выручки.


    Сколькими процентами от прибыли придется пожертвовать монополисту?


    Высшая проба – 2011'
  accepted: []
  solution: Запишем обратный спрос как $P=a-bQ$, постоянные средние издержки как $c$. В оптимуме прибыли $Q=(a-c)/(2b)$
    и $|\varepsilon|=(a+c)/(a-c)=2$, поэтому $a=3c$. Исходные выручка и прибыль равны $2c^2/b$ и $c^2/b$. При максимизации
    выручки $Q=3c/(2b)$, выручка $2{,}25c^2/b$, прибыль $0{,}75c^2/b$. Прибыль уменьшается на $25\%$.
