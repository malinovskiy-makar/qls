  statement: 'В Медовой стране спрос на мёд имеет вид $P_D(Q)=24+\sqrt{Q+4}-Q$, где $P$ – цена, $Q_D$ – количество,
    которое хочет купить потребитель, а предложение – функцией $P_S(Q)=\sqrt{Q+4}$, $Q_S$ – количество, которое
    готовы продать производители по соответствующей цене.


    Чему равна цена для потребителя при потоварном налоге, максимизирующем налоговые сборы?


    Высшая проба – 2022/2023'
  answer: '16'
  accepted: []
  solution: Налоговый клин равен $t=P_D-P_S=24-Q$. Сборы $T=(24-Q)Q$ максимальны при $Q=12$, $t=12$. Цена покупателя
    $P_D(12)=24+\sqrt{16}-12=16$.
