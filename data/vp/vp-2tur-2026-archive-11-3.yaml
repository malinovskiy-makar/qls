    энергии с биомассы на уголь, произошедшее в середине-конце [[1]] века. К началу нового века доля угля в общем
    объеме потребления первичной энергии достигла примерно [[2]]. Следующая волна была связана с распространением
    [[3]]; важной вехой стал энергетический кризис 70-х гг. XX века. Дальнейшее разнообразие источников привело
    к частичному вытеснению угля как источника [[4]] энергии. В настоящее время расширяется переход к низкоуглеродной
