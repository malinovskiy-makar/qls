  statement: 'Юный экономист Евгений решает, как распорядиться 4000 рублей, накопленными со школьных обедов, и хочет
    инвестировать эту сумму на два года. В приложении «Инвестиции для всех» он может выбрать акции или облигации.
    Поскольку Евгений – начинающий инвестор, ему доступен ограниченный функционал. Так, он может купить акции компании
    А стоимостью 100 рублей или облигации компании B номиналом 250 рублей и с датой погашения через 2 года. Облигации
    компании В сейчас торгуются по номиналу. Известно, что согласно прогнозу, стоимость акций компании А будет расти
    каждый год на 10% относительно предыдущего года. Компания B, в свою очередь, обещает купонную выплату в размере
    15% от номинала в дату погашения.


    В реальности Евгений решил перестраховаться и вложил половину накоплений в акции компании A, а другую половину
    – в облигации компании B. Какой оказалась его прибыль, если прогноз относительно доходности акций оказался правдивым
    только в первый год, а во второй их стоимость упала на 5%? Считайте, что фирма B выполнила все свои обязательства.


    Высшая проба – 2024/2025'
