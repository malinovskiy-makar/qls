  statement: 'Функция предельной выручки фирмы-монополиста описывается уравнением $MR(Q) = 90 - 6Q$, а функция предельных
    издержек $MC(Q) = 10 + 2Q$ (где $Q$ - объем произведенной продукции). Прибыль монополиста максимальна и равна
    100. Найдите постоянные издержки монополиста.


    Высшая проба – 2009'
  answer: '300'
  accepted: []
  solution: Оптимум $90-6Q=10+2Q$ даёт $Q=10$. Выручка $TR=90Q-3Q^2=600$, переменные издержки $VC=10Q+Q^2=200$.
    Из прибыли 100 получаем $FC=600-200-100=300$. Производство выгоднее остановки.
