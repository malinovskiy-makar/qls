    время владелец фирмы A никогда не слышал о фирме Б, поэтому он думает, что является единственным продавцом носков
    на рынке. В то же время владелец фирмы Б прекрасно осведомлён о конкуренте. Издержки обеих фирм идентичны и
    задаются функцией $TC(Q_i)=Q_i^2$, где $Q_i$ – количество пар носков, произведенных i-ым продавцом. Обе фирмы
    принимают решение о количестве одновременно, независимо и максимизируют прибыль.


    Какое количество пар носков поставит на рынок фирма A?


    Высшая проба – 2025/2026'
