  statement: 'В стране «Учёба» производятся уроки и перемены. Альтернативные издержки производства одного урока
    постоянны и составляют 2 перемены, при этом в стране невозможно произвести больше 8 перемен. Однажды в стране
    наступил кризис: снизился урожай главного «двигателя» экономики – кофе. В результате этого альтернативные издержки
    производства одного урока для неё выросли и составили 4 перемены, при этом максимально возможное количество
    произведённых перемен осталось прежним.


    В борьбе с кризисом на помощь стране «Учёба» пришла соседняя страна «Вдохновение». Она, в свою очередь, максимально
    может произвести 3 урока или 2 перемены, при этом технология производства такова, что альтернативные издержки
    производства уроков постоянны. Для того, чтобы успешно справиться с кризисом, жителям объединившихся стран необходимо
    потреблять уроки и перемены в соотношении 1 к 1. Сколько комплектов из уроков и перемен будет потреблено жителями?


    Высшая проба – 2025'
  answer: '4'
  accepted: []
  solution: 'После кризиса граница «Учёбы»: $4L_U+R_U=8$. Для «Вдохновения»: $2L_V/3+R_V=2$. Уроки сравнительно
    выгоднее производить во «Вдохновении», где один урок стоит $2/3$ перемены вместо 4. При его полной специализации
    на уроках имеем $L_V=3$, $R_V=0$. В «Учёбе» нужно выбрать $L_U=x$, $R_U=8-4x$. Для равных количеств двух благ
    $3+x=8-4x$, поэтому $x=1$, всего по 4 урока и перемены. Точка лежит на внешней границе совместных возможностей,
    поэтому четыре комплекта – максимум.'
