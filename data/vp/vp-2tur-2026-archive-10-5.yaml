  statement: 'За одну шведскую крону можно купить 50 сомалийских шиллингов. А за одну хорватскую куну можно приобрести
    75 сомалийских шиллингов.


    Определите кросс-курс шведской кроны к хорватской куне, в ответ укажите, сколько шведских крон должен заплатить
    покупатель за 100 хорватских кун.


    Высшая проба – 2023/2024'
  answer: '150'
  accepted: []
  solution: Сто кун эквивалентны $100\cdot75=7500$ шиллингам. Одна крона равна 50 шиллингам, поэтому нужно $7500/50=150$
    крон. Это условные котировки исторической задачи; они не являются текущими курсами.
