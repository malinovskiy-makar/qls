  statement: 'В мире Х на данный момент проживает 8 млрд человек. В этом мире так же, как и в нашем, страны делятся
    на развитые и развивающиеся. По данным ООН в мире Х, ежегодный относительный темп роста численности населения
    в развитых странах составляет 0,5%, а в развивающихся – 1%. Сейчас жителей развитых стран 12,5% всего населения.


    На сколько процентных пунктов изменится через 2 года доля живущих в развивающихся странах людей во всем населении,
    при прочих равных? Ответ – новая доля минус старая, округлённый до сотых.


    Высшая проба – 2022/2023'
  answer: 0,11
  accepted: []
  solution: Через два года в развитых странах 1,010025 млрд, в развивающихся $7\cdot1{,}01^2=7{,}1407$ млрд. Новая
    доля развивающихся $100\cdot7{,}1407/(7{,}1407+1{,}010025)\approx87{,}60816\%$. Исходная доля 87,5%, увеличение
    примерно на 0,10816 процентного пункта, то есть 0,11.
