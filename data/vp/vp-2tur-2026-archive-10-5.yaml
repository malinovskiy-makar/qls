  statement: 'Кривая спроса, заданная линейно, сдвинулась параллельно вправо вдоль оси выпуска на 4 единицы. Ценовая
    эластичность первоначальной функции спроса (по модулю) в точке, где выпуск был равен 8, составляла единицу.
    Найти ценовую эластичность функции спроса (по модулю), полученной в результате вышеописанного сдвига в точке,
    где выпуск равен 2.


    Высшая проба – 2008'
  answer: '9'
  accepted: []
  solution: Линейный спрос с единичной эластичностью при $Q=8$ пересекает ось количества в 16. После сдвига на 4
    вправо пересечение 20. При $Q=2$ модуль эластичности $(20-2)/2=9$.
