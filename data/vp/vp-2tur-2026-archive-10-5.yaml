  statement: 'Экономика первоначально находилась в состоянии полной занятости. Краткосрочная кривая совокупного
    предложения AS была представлена как P = 1,0, где P – уровень цен. Уравнение кривой совокупного спроса в исходном
    состоянии имело вид: $Y=1{,}5M/P$, где Y – реальный ВВП, M – денежная масса. Потенциальный ВВП составлял 4500.
    Произошел неблагоприятный шок предложения. Новая краткосрочная кривая совокупного предложения приняла вид: P
    = 1,2. В результате стабилизационной политики Центрального банка экономика вернулась к состоянию полной занятости.
    На сколько процентов Центральный банк увеличил предложение денег в экономике?


    Высшая проба – 2009'
  answer: '20'
  accepted: []
  solution: До шока $M_0=4500/1{,}5=3000$. Для восстановления выпуска при $P=1{,}2$ необходимо $M_1=4500\cdot1{,}2/1{,}5=3600$.
    Рост равен 20%.
