  statement: 'Школа «Радуга» проводит большую лотерею в пользу ремонта спортзала. Они напечатали 1200 билетов и
    решили продавать их тремя способами: наличными на месте, через терминал (банковская карта) и через онлайн-платформу
    (с помощью мобильного приложения). Цена билета – 250 руб. Чтобы организовать лотерею нужно оплатить печать билетов
    и призы; часть выручки идёт на пополнение призового фонда. В день лотереи продано 950 билетов в следующем распределении
    по каналам продаж:


    Каждый онлайн-билет куплен отдельной транзакцией: всего проведено 200 онлайн-транзакций.'
  table_html: '<table><caption>Каналы продаж</caption><thead><tr><th>Канал продаж</th><th>Количество проданных билетов</th></tr></thead><tbody><tr><td>Наличные</td><td>400</td></tr><tr><td>Терминал
