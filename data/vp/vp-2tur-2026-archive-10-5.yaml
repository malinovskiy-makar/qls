  statement: 'Функция краткосрочных общих издержек совершенно конкурентной фирмы имеет вид $TC(Q) = 2Q^3 - 20Q^2
    + 80Q + 60$, где $Q$-объем произведенной продукции. Найти минимальную цену, при которой совершенно конкурентная
    фирма не прекратит производство в краткосрочном периоде.


    Высшая проба – 2009'
  answer: '30'
  accepted: []
  solution: Средние переменные издержки $AVC=2Q^2-20Q+80=2(Q-5)^2+30$. Минимум 30 при $Q=5$. Именно эта цена позволяет
    покрыть переменные издержки; постоянные 60 на порог остановки не влияют.
