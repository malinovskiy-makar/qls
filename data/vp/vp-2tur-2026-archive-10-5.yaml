  statement: 'Далеко в тайге живет стая из 20 волков. После каждой охоты в стае принято делить добычу. Самая большая
    часть добычи, 40 %, как правило, достается четырем старым и мудрым волкам. Хотя их мало, но они пользуются авторитетом
    в стае, решают жизненно важные вопросы и дают всем мудрые советы. Остальная часть добычи делится в пропорции
    5 к 1 между молодыми волками и волчатами (предполагается, что волчата в стае самые «бедные», а старые волки
    – самые «богатые»).

    Считайте, что внутри каждой из трёх групп добыча распределяется поровну.


    Определите, сколько в стае волчат, если коэффициент Джини равен 0,3.


    Высшая проба – 2011'
  accepted: []
  solution: 'Волчата получают $0{,}1$ всей добычи, молодые волки – $0{,}5$, старые – $0{,}4$. Если волчат $n$, точки
    кривой Лоренца: $(0,0)$, $(n/20,0{,}1)$, $(0{,}8,0{,}6)$, $(1,1)$. Удвоенная площадь под ней $0{,}1n/20+0{,}7(0{,}8-n/20)+1{,}6\cdot0{,}2=0{,}88-0{,}03n$.
    Поэтому $G=0{,}12+0{,}03n=0{,}3$, откуда $n=6$.'
