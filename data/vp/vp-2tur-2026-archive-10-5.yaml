  statement: 'На рынке авторских блокнотов действует два потребителя, функции спроса которых заданы в виде $Q^d_1(P)=10-2P$
    и $Q^d_2(P)=20-P$, где $P$ – цена, а $Q^d_1$ и $Q^d_2$ – количество, которое хочет купить соответствующий потребитель.
    Предложение представлено в виде $Q^s(P)=-2+P$, где $Q^s$ – количество, которое готовы продать производители
    по соответствующей цене.


    Сколько будет куплено блокнотов обоими потребителями, если цена равна $P=18$?


