  statement: 'Десятиклассница Катя делает школьную презентацию на тему «Макроэкономическая ситуация в стране X».
    Катя уже включила в презентацию следующую информацию: в стране X в 2024 году размер ВВП составил 3,5 млн у.д.е.
    Государственные закупки составили 1,2 млн у.д.е., а потребительские расходы составили 1/5 часть от ВВП. Размер
    инвестиций составил 1,5 млн у.д.е. Величина экспорта равнялась 700 тыс. у.д.е.


    В рамках своего исследования Катя узнала, что правительство страны X приняло решение перейти к закрытому типу
    экономики. После принятия нововведений размер государственных закупок в стране X будет увеличен на 600 тыс.
    у.д.е., потребительские расходы вырастут до 1,5 млн у.д.е., а объём инвестиций вырастет на 10%. Найдите размер
    ВВП страны X после принятия нововведений в тыс. у.д.е.


    Высшая проба – 2025'
  answer: '4950'
  accepted: []
  solution: 'В тысячах у.д.е.: новые закупки $G=1200+600=1800$, инвестиции $I=1500\cdot1{,}1=1650$, потребление
    $C=1500$. Закрытая экономика означает $X=M=0$. Поэтому $Y=1500+1650+1800=4950$.'
