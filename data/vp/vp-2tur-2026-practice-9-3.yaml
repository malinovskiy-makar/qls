  - Рост номинального ВВП всегда означает такой же рост физического выпуска.
  - Расширение доступа к образованию может снижать барьеры получения квалификации.
  - При прочих равных старение населения может увеличивать нагрузку на пенсионную систему.
  - Низкая доля занятых в промышленности сама по себе доказывает отсутствие развитой промышленности.
