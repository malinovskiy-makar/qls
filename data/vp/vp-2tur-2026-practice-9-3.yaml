  statement: 'Исследователь сравнивает положение семей в условном городе. Сначала он устанавливает стоимость минимального
    набора благ, необходимого для удовлетворения базовых потребностей. Доход ниже такой границы служит одним из
    критериев [[1]] бедности. Затем он использует другой подход: сравнивает доход семьи с типичным доходом общества.
    Этот подход описывает [[2]] бедность.


    Если доходы богатых выросли, а доход рассматриваемой семьи не изменился, её положение относительно типичного
    уровня может ухудшиться без сокращения количества доступных ей товаров. Поэтому выбор критерия важен. Средний
    доход сам по себе также не показывает, насколько равномерно распределены деньги.


    Для описания неравенства используют коэффициент [[3]]. При полном равенстве доходов он равен [[4]], а более
