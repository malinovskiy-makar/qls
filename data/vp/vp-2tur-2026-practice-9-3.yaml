  statement: 'У предпринимателя есть 140 тыс. рублей. Он выбирает одно из трёх вложений на год: (1) нанять сотрудника
    с зарплатой 29 тыс. рублей в месяц, получив дополнительную годовую выручку 570 тыс. рублей; (2) купить оборудование
    за 140 тыс. рублей, получить дополнительную выручку 500 тыс. рублей и продать оборудование в конце года за 80
    тыс. рублей; (3) положить 140 тыс. рублей в банк под 8% годовых с ежемесячной капитализацией. Указанная дополнительная
    выручка уже очищена от всех иных расходов. Зарплата выплачивается из текущих поступлений. Выбор сотрудника исключает
    вложение тех же средств в оборудование или депозит. Какова альтернативная стоимость выбора первого варианта?
    Сравнивайте чистый прирост денег за год относительно исходного капитала. Ответ дайте в тыс. рублей, округлив
    до сотых при необходимости.'
  answer: '440'
  accepted: []
  solution: Нужно выбрать лучший из отвергнутых вариантов. Оборудование даёт $500+80-140=440$ тыс. рублей чистого
    прироста. Депозит даёт $140(1+8/1200)^{12}-140\approx11{,}62$. Альтернативная стоимость – 440 тыс. рублей. Выгода
    самого выбранного варианта не является его альтернативной стоимостью.
