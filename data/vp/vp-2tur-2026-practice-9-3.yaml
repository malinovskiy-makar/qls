  statement: На рынке труда спрос задан функцией $L_d=160-4w$, а предложение – $L_s=6w$, где $w$ – зарплата, $L$
    – число работников. Государство ввело обязательную минимальную зарплату выше равновесной. После этого занятость
    уменьшилась на 16 человек; число занятых определяется спросом фирм. Чему равна новая минимальная зарплата?
  answer: '20'
  accepted: []
  solution: До вмешательства $160-4w=6w$, поэтому $w_0=16$, $L_0=96$. Новая занятость $96-16=80$. Из $160-4w=80$
    получаем $w=20$. Предложение при этой зарплате превышает спрос.
