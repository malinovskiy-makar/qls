  statement: 'Анна оценивает час своего рабочего времени в 250 рублей. Поездка на автобусе длится 6 часов и стоит
    600 рублей; работать в автобусе нельзя. Поездка на поезде длится 4 часа и стоит 1000 рублей. В поезде предлагают
    платный доступ к интернету: только с ним Анна сможет работать ровно 2 часа из четырёх. Перелёт с дорогой в аэропорт
    занимает 2 часа и стоит 2500 рублей; работать в пути нельзя. Без поездки Анна работала бы всё соответствующее
    время. Она выбирает маршрут с наименьшей суммой денежных расходов и стоимости потерянного рабочего времени.
    Какую наибольшую плату за интернет она готова внести, чтобы поездка на поезде с интернетом была не дороже лучшей
    альтернативы без интернета? Других затрат нет. Ответ дайте в рублях.'
  answer: '500'
  accepted: []
  solution: 'Без интернета полные издержки равны: автобус – $600+6\cdot250=2100$, поезд – $1000+4\cdot250=2000$,
    самолёт – $2500+2\cdot250=3000$. Лучшая альтернатива стоит 2000. Поезд с интернетом при плате $x$ стоит $1000+2\cdot250+x=1500+x$.
    Условие выбора: $1500+x\leq2000$, поэтому максимальная плата – 500 рублей. Сравнивать нужно со всеми маршрутами,
    включая поезд без интернета.'
  n: 6
  points: 6
