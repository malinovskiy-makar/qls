  statement: Выручка мастерской равна 12000 рублей, бухгалтерская прибыль – 2400 рублей. Четверть общих издержек
    составляют постоянные расходы. Переменные издержки состоят только из материалов, сдельной оплаты труда и электроэнергии.
    На электроэнергию приходится четверть переменных издержек, а на материалы тратят вдвое больше, чем на сдельную
    оплату труда. Сколько рублей расходуется на материалы?
  answer: '3600'
  accepted: []
  solution: 'Общие издержки $12000-2400=9600$. Переменные – $3\cdot9600/4=7200$. После электроэнергии остаётся $3\cdot7200/4=5400$;
    материалы составляют две трети этой суммы: $7200\cdot3/4\cdot2/3=3600$.'
