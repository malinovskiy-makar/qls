  statement: Две мастерские выпускают столы и стулья. Первая за месяц может изготовить 80 столов или 40 стульев,
    вторая – 40 столов или 80 стульев. Их границы производственных возможностей линейны. Все ресурсы используются.
    Если вместе необходимо произвести ровно 90 стульев, какое наибольшее число столов можно изготовить? Объёмы выпуска
    в этой модели делимы.
  answer: '60'
  accepted: []
  solution: Стул обходится первой мастерской в 2 стола, второй – в 0,5 стола. Сначала все 80 стульев производит
    вторая мастерская. Ещё 10 стульев выпускает первая, потеряв $20$ столов. Остаётся $80-2\cdot10=60$ столов.
