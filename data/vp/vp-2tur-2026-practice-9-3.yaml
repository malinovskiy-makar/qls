  statement: На закрытом рынке спрос равен $Q_d=160-2P$, предложение отечественных фирм – $Q_s=20+3P$. После открытия
    рынка импортёры готовы поставить любое количество товара по мировой цене 22. Отечественные фирмы сохраняют прежнюю
    функцию предложения. На сколько изменится их выручка после открытия рынка? Если выручка уменьшится, ответ запишите
    со знаком минус.
  answer: '-1020'
  accepted: []
  solution: 'Закрытый рынок: $160-2P=20+3P$, $P_0=28$, $Q_0=104$, $TR_0=2912$. Мировая цена ниже $P_0$; при ней
    спрос превышает отечественное предложение, разницу покрывает импорт. $Q_1=20+3\cdot22=86$, $TR_1=1892$. Изменение
    $1892-2912=-1020$.'
