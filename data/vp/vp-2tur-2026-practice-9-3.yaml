  block: number
  statement: Монополист продаёт напиток по цене $P=58-Q$. Первые 12 единиц напитка обходятся по 10 рублей каждая,
    а каждая следующая единица – по 20 рублей. Повышенная стоимость применяется только к единицам сверх 12, а не
    ко всему выпуску. Постоянные издержки равны 20 рублям и возникают даже при нулевом выпуске. Выпуск непрерывен
    и неотрицателен; цена не может быть отрицательной. Определите максимальную прибыль.
  answer: '461'
  accepted: []
  solution: На первом участке $\pi=(58-10)Q-Q^2-20$; его вершина лежит правее 12, поэтому лучший выпуск на этом
    участке – 12. На втором $\pi=(58-20)Q-Q^2+10\cdot12-20$, вершина $Q=19>12$. Прибыль в ней 461, больше прибыли
    в точке 12 и при нулевом выпуске. Это максимум.
  n: 13
  points: 6
  intro: Авторский аналог Weconomics.
