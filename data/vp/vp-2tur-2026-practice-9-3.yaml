  statement: Монополист сталкивается со спросом $P=96-2Q$. Каждая единица труда позволяет произвести 4 единицы товара,
    труд можно делить. Цена единицы труда равна 56. Других переменных издержек нет; постоянные издержки равны 30.
    Какой объём выпуска максимизирует прибыль?
  answer: 20,5
  accepted: []
  solution: На единицу товара требуется $1/4$ единицы труда, поэтому $MC=56/4=14$. Предельная выручка $MR=96-4Q$.
    Из $MR=MC$ получаем $Q=20{,}5$. Прибыль – строго вогнутая квадратичная функция; постоянные издержки не меняют
    оптимальный выпуск.
