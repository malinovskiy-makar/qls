  statement: Монополист сталкивается со спросом $P=88-2Q$. Каждая единица труда позволяет произвести 4 единицы товара,
    труд можно делить. Цена единицы труда равна 48. Других переменных издержек нет; постоянные издержки равны 30.
    Какой объём выпуска максимизирует прибыль?
  answer: '19'
  accepted: []
  solution: На единицу товара требуется $1/4$ единицы труда, поэтому $MC=48/4=12$. Предельная выручка $MR=88-4Q$.
    Из $MR=MC$ получаем $Q=19$. Прибыль – строго вогнутая квадратичная функция; постоянные издержки не меняют оптимальный
    выпуск.
