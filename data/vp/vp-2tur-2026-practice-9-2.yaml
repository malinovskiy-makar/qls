  penalty: true
  solution: 1. Неверно. Выпуск может расти при увеличении или уменьшении неравенства. 2. Верно. Первичный сектор
    непосредственно использует природные ресурсы. 3. Неверно. Это обрабатывающая промышленность, вторичный сектор.
    4. Верно. Так бывает при достаточно быстром росте производительности. 5. Верно. Лучшие транспортные связи способны
    удешевлять перевозки.
