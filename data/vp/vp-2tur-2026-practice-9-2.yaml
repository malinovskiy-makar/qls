  statement: Структура экономики. Выберите все верные утверждения.
  options:
  - Экономический рост и равномерное распределение его выгод – одно и то же.
  - Выращивание пшеницы относится к первичному сектору экономики.
  - Производство станков относится к сфере услуг.
  - Сокращение числа занятых в сельском хозяйстве совместимо с ростом его выпуска.
  - Развитая инфраструктура может снижать транспортные издержки фирм.
  correct:
