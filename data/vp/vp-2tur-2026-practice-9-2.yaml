  statement: Выручка мастерской равна 11000 рублей, бухгалтерская прибыль – 2200 рублей. Четверть общих издержек
    составляют постоянные расходы. Переменные издержки состоят только из материалов, сдельной оплаты труда и электроэнергии.
    На электроэнергию приходится четверть переменных издержек, а на материалы тратят вдвое больше, чем на сдельную
    оплату труда. Сколько рублей расходуется на материалы?
  answer: '3300'
  accepted: []
  solution: 'Общие издержки $11000-2200=8800$. Переменные – $3\cdot8800/4=6600$. После электроэнергии остаётся $3\cdot6600/4=4950$;
    материалы составляют две трети этой суммы: $6600\cdot3/4\cdot2/3=3300$.'
