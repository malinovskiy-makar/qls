  statement: На закрытом рынке спрос равен $Q_d=140-2P$, предложение отечественных фирм – $Q_s=20+3P$. После открытия
    рынка импортёры готовы поставить любое количество товара по мировой цене 19. Отечественные фирмы сохраняют прежнюю
    функцию предложения. На сколько изменится их выручка после открытия рынка? Если выручка уменьшится, ответ запишите
    со знаком минус.
  answer: '-745'
  accepted: []
  solution: 'Закрытый рынок: $140-2P=20+3P$, $P_0=24$, $Q_0=92$, $TR_0=2208$. Мировая цена ниже $P_0$; при ней спрос
    превышает отечественное предложение, разницу покрывает импорт. $Q_1=20+3\cdot19=77$, $TR_1=1463$. Изменение
    $1463-2208=-745$.'
