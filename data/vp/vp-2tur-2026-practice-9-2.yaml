- kind: number
  block: number
  statement: 'Анна оценивает час своего рабочего времени в 400 рублей. Поездка на автобусе длится 6 часов и стоит
    500 рублей; работать в автобусе нельзя. Поездка на поезде длится 4 часа и стоит 1100 рублей. В поезде предлагают
    платный доступ к интернету: только с ним Анна сможет работать ровно 2 часа из четырёх. Перелёт с дорогой в аэропорт
    занимает 2 часа и стоит 2400 рублей; работать в пути нельзя. Без поездки Анна работала бы всё соответствующее
    время. Она выбирает маршрут с наименьшей суммой денежных расходов и стоимости потерянного рабочего времени.
    Какую наибольшую плату за интернет она готова внести, чтобы поездка на поезде с интернетом была не дороже лучшей
    альтернативы без интернета? Других затрат нет. Ответ дайте в рублях.'
  answer: '800'
  accepted: []
  solution: 'Без интернета полные издержки равны: автобус – $500+6\cdot400=2900$, поезд – $1100+4\cdot400=2700$,
    самолёт – $2400+2\cdot400=3200$. Лучшая альтернатива стоит 2700. Поезд с интернетом при плате $x$ стоит $1100+2\cdot400+x=1900+x$.
    Условие выбора: $1900+x\leq2700$, поэтому максимальная плата – 800 рублей. Сравнивать нужно со всеми маршрутами,
    включая поезд без интернета.'
  n: 6
  points: 6
