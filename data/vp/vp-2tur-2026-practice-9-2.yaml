  statement: На рынке труда спрос задан функцией $L_d=140-4w$, а предложение – $L_s=6w$, где $w$ – зарплата, $L$
    – число работников. Государство ввело обязательную минимальную зарплату выше равновесной. После этого занятость
    уменьшилась на 12 человек; число занятых определяется спросом фирм. Чему равна новая минимальная зарплата?
  answer: '17'
  accepted: []
  solution: До вмешательства $140-4w=6w$, поэтому $w_0=14$, $L_0=84$. Новая занятость $84-12=72$. Из $140-4w=72$
    получаем $w=17$. Предложение при этой зарплате превышает спрос.
