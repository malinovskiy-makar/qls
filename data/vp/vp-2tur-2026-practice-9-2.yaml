    Предположим, первая страна теряет меньше ткани при увеличении производства зерна на тонну, чем вторая. Тогда
    первая страна имеет в зерне [[2]] преимущество. Это не обязательно означает, что она тратит на зерно меньше
    часов труда: показатель основан на соотношении затрат, а не на их абсолютной величине.


    Если цена международного обмена находится между соответствующими внутренними соотношениями затрат, страны могут
