  statement: Фирма действует на совершенно конкурентном рынке и принимает рыночную цену 50 как заданную. Её общие
    издержки $TC(Q)=2Q^2+6Q+90$, где $Q$ – непрерывный неотрицательный выпуск. Постоянные издержки возникают даже
    при $Q=0$. Сколько единиц товара следует произвести для максимизации прибыли?
