  statement: Две мастерские выпускают столы и стулья. Первая за месяц может изготовить 70 столов или 35 стульев,
    вторая – 35 столов или 70 стульев. Их границы производственных возможностей линейны. Все ресурсы используются.
    Если вместе необходимо произвести ровно 80 стульев, какое наибольшее число столов можно изготовить? Объёмы выпуска
    в этой модели делимы.
  answer: '50'
  accepted: []
  solution: Стул обходится первой мастерской в 2 стола, второй – в 0,5 стола. Сначала все 70 стульев производит
    вторая мастерская. Ещё 10 стульев выпускает первая, потеряв $20$ столов. Остаётся $70-2\cdot10=50$ столов.
