  statement: Монополист продаёт напиток по цене $P=54-Q$. Первые 11 единиц напитка обходятся по 10 рублей каждая,
    а каждая следующая единица – по 20 рублей. Повышенная стоимость применяется только к единицам сверх 11, а не
    ко всему выпуску. Постоянные издержки равны 20 рублям и возникают даже при нулевом выпуске. Выпуск непрерывен
    и неотрицателен; цена не может быть отрицательной. Определите максимальную прибыль.
  answer: '379'
  accepted: []
  solution: На первом участке $\pi=(54-10)Q-Q^2-20$; его вершина лежит правее 11, поэтому лучший выпуск на этом
    участке – 11. На втором $\pi=(54-20)Q-Q^2+10\cdot11-20$, вершина $Q=17>11$. Прибыль в ней 379, больше прибыли
    в точке 11 и при нулевом выпуске. Это максимум.
  n: 13
  points: 6
