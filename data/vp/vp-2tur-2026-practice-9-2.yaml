  statement: 'У предпринимателя есть 120 тыс. рублей. Он выбирает одно из трёх вложений на год: (1) нанять сотрудника
    с зарплатой 27 тыс. рублей в месяц, получив дополнительную годовую выручку 510 тыс. рублей; (2) купить оборудование
    за 120 тыс. рублей, получить дополнительную выручку 450 тыс. рублей и продать оборудование в конце года за 70
    тыс. рублей; (3) положить 120 тыс. рублей в банк под 12% годовых с ежемесячной капитализацией. Указанная дополнительная
    выручка уже очищена от всех иных расходов. Зарплата выплачивается из текущих поступлений. Выбор сотрудника исключает
    вложение тех же средств в оборудование или депозит. Какова альтернативная стоимость выбора первого варианта?
    Сравнивайте чистый прирост денег за год относительно исходного капитала. Ответ дайте в тыс. рублей, округлив
    до сотых при необходимости.'
  answer: '400'
  accepted: []
  solution: Нужно выбрать лучший из отвергнутых вариантов. Оборудование даёт $450+70-120=400$ тыс. рублей чистого
    прироста. Депозит даёт $120(1+12/1200)^{12}-120\approx15{,}22$. Альтернативная стоимость – 400 тыс. рублей.
    Выгода самого выбранного варианта не является его альтернативной стоимостью.
