  - Возвратная тара может использоваться повторно.
  - Солнечная энергетика использует возобновляемый поток энергии.
  - Затраты на очистку выбросов обязательно равны ущербу от загрязнения.
  - Если загрязнение не имеет рыночной цены, оно не может причинять экономического ущерба.
