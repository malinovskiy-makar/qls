- kind: number
  block: number
  statement: 'У предпринимателя есть 180 тыс. рублей. Он выбирает одно из трёх вложений на год: (1) нанять сотрудника
    с зарплатой 33 тыс. рублей в месяц, получив дополнительную годовую выручку 690 тыс. рублей; (2) купить оборудование
    за 180 тыс. рублей, получить дополнительную выручку 600 тыс. рублей и продать оборудование в конце года за 100
    тыс. рублей; (3) положить 180 тыс. рублей в банк под 6% годовых с ежемесячной капитализацией. Указанная дополнительная
    выручка уже очищена от всех иных расходов. Зарплата выплачивается из текущих поступлений. Выбор сотрудника исключает
    вложение тех же средств в оборудование или депозит. Какова альтернативная стоимость выбора первого варианта?
    Сравнивайте чистый прирост денег за год относительно исходного капитала. Ответ дайте в тыс. рублей, округлив
    до сотых при необходимости.'
  answer: '520'
  accepted: []
  solution: Нужно выбрать лучший из отвергнутых вариантов. Оборудование даёт $600+100-180=520$ тыс. рублей чистого
    прироста. Депозит даёт $180(1+6/1200)^{12}-180\approx11{,}1$. Альтернативная стоимость – 520 тыс. рублей. Выгода
    самого выбранного варианта не является его альтернативной стоимостью.
  n: 11
