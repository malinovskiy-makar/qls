  statement: Общие природные ресурсы. Выберите все верные утверждения.
  options:
  - Очистка воды может давать выгоды людям, которые непосредственно её не оплачивали.
  - Рыночная стоимость любого природного ресурса всегда равна нулю.
  - Загрязнение воздуха затрагивает только покупателя и продавца загрязняющего товара.
  - Установление правил доступа может влиять на стимулы сберегать ресурс.
  - Если доступ к ресурсу свободен и использование одним уменьшает доступность другим, возможно чрезмерное использование.
  correct:
  - 1
  - 4
  - 5
  penalty: true
  solution: 1. Верно. Возможны положительные внешние эффекты. 2. Неверно. Многие ресурсы имеют цену и альтернативные
    способы использования. 3. Неверно. Ущерб может распространяться на третьих лиц. 4. Верно. Права и ограничения
    меняют частные выгоды и затраты. 5. Верно. Пользователь может не учитывать ущерб остальным.
