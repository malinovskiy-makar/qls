  statement: В городе N проходят выборы мэра. Известно, что население точно не проголосует за кандидата, который
    транслирует неверные экономические суждения. Господин К выдвинул свою кандидатуру и поручил помощнику написать
    речь для выступления перед населением. Однако помощник намеренно допустил ошибки в некоторых утверждениях, чтобы
    подорвать авторитет политика среди населения. Какие из приведенных ниже высказываний позволят господину К продемонстрировать
    знание экономики. <em>Выберите все верные утверждения.</em>
  options:
  - Снижение импортных пошлин на ввоз иностранных автомобилей приведёт к росту спроса на отечественные автомобили.
  - Дефицит рабочей силы на рынке производства сапог приведёт к увеличению зарплат сапожников в краткосрочном периоде.
  - Увеличение количества выпускников вузов экономических специальностей ведёт к росту предложения труда работников
    с высшим экономическим образованием.
  - Если увеличить стоимость аренды самокатов, то спрос на поездки на автобусе обязательно уменьшится.
  - Увеличение ставки по ипотеке приведёт к росту спроса на недвижимость.
  correct:
  - 2
  - 3
  solution: 'Верны пункты 2 и 3. Дефицит работников создаёт давление на зарплату вверх, а новые выпускники увеличивают
    предложение соответствующего труда. Снижение пошлины делает импортные автомобили дешевле относительно отечественных;
    удорожание ипотеки сдерживает спрос на жильё. Для автобуса нет основания утверждать обязательное снижение спроса:
    он может заменять поездку на самокате.'
  penalty: true
