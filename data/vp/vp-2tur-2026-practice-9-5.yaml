  statement: Показатели благосостояния. Выберите все верные утверждения.
  options:
  - ВВП отражает рыночную стоимость конечного производства за период.
  - Два общества с одинаковым ВВП на человека обязательно имеют одинаковое здоровье населения.
  - Рост ВВП сам по себе измеряет изменение качества окружающей среды.
  - Повышение ожидаемой продолжительности жизни может отражать улучшение условий жизни.
  - Неоплачиваемая работа в домашнем хозяйстве полностью включена в обычный расчёт ВВП.
  correct:
  - 1
  - 4
  penalty: true
  solution: 1. Верно. Выпуск учитывается за период, с исключением двойного счёта промежуточной продукции. 2. Неверно.
    Здоровье зависит также от распределения ресурсов, среды и системы здравоохранения. 3. Неверно. ВВП не является
    полноценным показателем экологического качества. 4. Верно. Это один из используемых показателей, хотя не исчерпывающий.
    5. Неверно. Большая часть таких услуг не учитывается в стандартных границах производства.
  n: 1
  points: 4
  intro: В этом блоке задания №2 – архив ВП 2025/26. Остальные – авторские аналоги Weconomics.
