  statement: У Ильи 6400 рублей. Он рассматривает акции, которые, по его ожиданиям, подорожают на 20% в первый год,
    подешевеют на 10% во второй и подорожают на 15% в третий, а также банковский вклад под 25% годовых с ежегодной
    капитализацией. Илья выбрал вклад и не снимал проценты. Сколько рублей будет на вкладе в конце третьего года?
    Налоги и комиссии не учитывайте.
