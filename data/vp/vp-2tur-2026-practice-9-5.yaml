  statement: На закрытом рынке спрос равен $Q_d=200-2P$, предложение отечественных фирм – $Q_s=20+3P$. После открытия
    рынка импортёры готовы поставить любое количество товара по мировой цене 28. Отечественные фирмы сохраняют прежнюю
    функцию предложения. На сколько изменится их выручка после открытия рынка? Если выручка уменьшится, ответ запишите
    со знаком минус.
  answer: '-1696'
  accepted: []
  solution: 'Закрытый рынок: $200-2P=20+3P$, $P_0=36$, $Q_0=128$, $TR_0=4608$. Мировая цена ниже $P_0$; при ней
    спрос превышает отечественное предложение, разницу покрывает импорт. $Q_1=20+3\cdot28=104$, $TR_1=2912$. Изменение
    $2912-4608=-1696$.'
  n: 12
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Монополист продаёт напиток по цене $P=66-Q$. Первые 14 единиц напитка обходятся по 10 рублей каждая,
    а каждая следующая единица – по 20 рублей. Повышенная стоимость применяется только к единицам сверх 14, а не
    ко всему выпуску. Постоянные издержки равны 20 рублям и возникают даже при нулевом выпуске. Выпуск непрерывен
    и неотрицателен; цена не может быть отрицательной. Определите максимальную прибыль.
  answer: '649'
  accepted: []
  solution: На первом участке $\pi=(66-10)Q-Q^2-20$; его вершина лежит правее 14, поэтому лучший выпуск на этом
    участке – 14. На втором $\pi=(66-20)Q-Q^2+10\cdot14-20$, вершина $Q=23>14$. Прибыль в ней 649, больше прибыли
    в точке 14 и при нулевом выпуске. Это максимум.
  n: 13
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Монополист сталкивается со спросом $P=112-2Q$. Каждая единица труда позволяет произвести 4 единицы
    товара, труд можно делить. Цена единицы труда равна 72. Других переменных издержек нет; постоянные издержки
    равны 30. Какой объём выпуска максимизирует прибыль?
  answer: 23,5
  accepted: []
  solution: На единицу товара требуется $1/4$ единицы труда, поэтому $MC=72/4=18$. Предельная выручка $MR=112-4Q$.
    Из $MR=MC$ получаем $Q=23{,}5$. Прибыль – строго вогнутая квадратичная функция; постоянные издержки не меняют
    оптимальный выпуск.
  n: 14
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Фирма действует на совершенно конкурентном рынке и принимает рыночную цену 62 как заданную. Её общие
    издержки $TC(Q)=2Q^2+6Q+120$, где $Q$ – непрерывный неотрицательный выпуск. Постоянные издержки возникают даже
    при $Q=0$. Сколько единиц товара следует произвести для максимизации прибыли?
  answer: '14'
  accepted: []
  solution: $\pi=(62-6)Q-2Q^2-120$. Вершина этой параболы достигается при $4Q=62-6$, то есть $Q=14$. Выпуск положителен;
    он даёт больше прибыли, чем нулевой.
  n: 15
