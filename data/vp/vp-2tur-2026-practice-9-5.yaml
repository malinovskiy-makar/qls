- kind: number
  block: number
  statement: 'Анна оценивает час своего рабочего времени в 350 рублей. Поездка на автобусе длится 6 часов и стоит
    450 рублей; работать в автобусе нельзя. Поездка на поезде длится 4 часа и стоит 950 рублей. В поезде предлагают
    платный доступ к интернету: только с ним Анна сможет работать ровно 2 часа из четырёх. Перелёт с дорогой в аэропорт
    занимает 2 часа и стоит 2700 рублей; работать в пути нельзя. Без поездки Анна работала бы всё соответствующее
    время. Она выбирает маршрут с наименьшей суммой денежных расходов и стоимости потерянного рабочего времени.
    Какую наибольшую плату за интернет она готова внести, чтобы поездка на поезде с интернетом была не дороже лучшей
    альтернативы без интернета? Других затрат нет. Ответ дайте в рублях.'
  answer: '700'
  accepted: []
  solution: 'Без интернета полные издержки равны: автобус – $450+6\cdot350=2550$, поезд – $950+4\cdot350=2350$,
    самолёт – $2700+2\cdot350=3400$. Лучшая альтернатива стоит 2350. Поезд с интернетом при плате $x$ стоит $950+2\cdot350+x=1650+x$.
    Условие выбора: $1650+x\leq2350$, поэтому максимальная плата – 700 рублей. Сравнивать нужно со всеми маршрутами,
    включая поезд без интернета.'
  n: 6
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
