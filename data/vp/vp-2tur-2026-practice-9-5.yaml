  statement: На рынке труда спрос задан функцией $L_d=200-4w$, а предложение – $L_s=6w$, где $w$ – зарплата, $L$
    – число работников. Государство ввело обязательную минимальную зарплату выше равновесной. После этого занятость
    уменьшилась на 24 человек; число занятых определяется спросом фирм. Чему равна новая минимальная зарплата?
  answer: '26'
  accepted: []
  solution: До вмешательства $200-4w=6w$, поэтому $w_0=20$, $L_0=120$. Новая занятость $120-24=96$. Из $200-4w=96$
    получаем $w=26$. Предложение при этой зарплате превышает спрос.
  n: 7
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Две мастерские выпускают столы и стулья. Первая за месяц может изготовить 100 столов или 50 стульев,
    вторая – 50 столов или 100 стульев. Их границы производственных возможностей линейны. Все ресурсы используются.
    Если вместе необходимо произвести ровно 110 стульев, какое наибольшее число столов можно изготовить? Объёмы
    выпуска в этой модели делимы.
  answer: '80'
  accepted: []
  solution: Стул обходится первой мастерской в 2 стола, второй – в 0,5 стола. Сначала все 100 стульев производит
    вторая мастерская. Ещё 10 стульев выпускает первая, потеряв $20$ столов. Остаётся $100-2\cdot10=80$ столов.
  n: 8
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Выручка мастерской равна 14000 рублей, бухгалтерская прибыль – 2800 рублей. Четверть общих издержек
    составляют постоянные расходы. Переменные издержки состоят только из материалов, сдельной оплаты труда и электроэнергии.
    На электроэнергию приходится четверть переменных издержек, а на материалы тратят вдвое больше, чем на сдельную
    оплату труда. Сколько рублей расходуется на материалы?
  answer: '4200'
  accepted: []
  solution: 'Общие издержки $14000-2800=11200$. Переменные – $3\cdot11200/4=8400$. После электроэнергии остаётся
    $3\cdot8400/4=6300$; материалы составляют две трети этой суммы: $8400\cdot3/4\cdot2/3=4200$.'
  n: 9
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Фирма может выпустить целое число единиц товара от 0 до 9 включительно. В таблице показаны дополнительная
    выручка и дополнительные издержки от продажи и производства каждой очередной единицы. При нулевом выпуске прибыль
