  answer: '99'
  accepted: []
  solution: 'Прибыль при выпуске $Q$ равна сумме первых $Q$ значений $MR-MC$. Эти разности: 29, 24, 19, 14, 9, 4,
    -1, -6, -11. Выгодно произвести 6 единиц; дальше дополнительные издержки превышают дополнительную выручку. Максимальная
    прибыль – 99.'
  table_html: <table><thead><tr><th>Единица</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr></thead><tbody><tr><td>MR</td><td>33</td><td>30</td><td>27</td><td>24</td><td>21</td><td>18</td><td>15</td><td>12</td><td>9</td></tr><tr><td>MC</td><td>4</td><td>6</td><td>8</td><td>10</td><td>12</td><td>14</td><td>16</td><td>18</td><td>20</td></tr></tbody></table>
  n: 10
