  statement: 'Фабрика производит товар, но её выбросы ухудшают качество воздуха в соседнем квартале. Жители не участвуют
    в сделке купли-продажи товара, однако несут ущерб. Такое воздействие называют отрицательным [[1]] эффектом.
    Если фирма не оплачивает ущерб, её частные издержки ниже соответствующих [[2]] издержек.


    Государство может назначить плату за каждую единицу выбросов. Тогда сокращение загрязнения становится для фабрики
    способом уменьшить обязательные платежи. Фирма будет сравнивать затраты очистки с экономией на этой плате, то
    есть изменятся её экономические [[3]].


    Другой вариант – установить максимальное допустимое количество выбросов и выдать права на них. Если эти права
    разрешено продавать, возникает рынок разрешений. Предприятия с относительно [[4]] затратами очистки могут сокращать
    выбросы больше и продавать лишние права. Выбор способа регулирования требует учитывать и стоимость контроля:
    отсутствие рыночной цены загрязнения не означает отсутствие его [[5]].'
