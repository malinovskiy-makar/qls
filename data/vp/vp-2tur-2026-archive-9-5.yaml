  statement: 'Предприниматель Филипп руководит необычной компанией, производящей стилусы, технологию производства
    которых он купил у одного из НИИ. На создание одного стилуса необходимо затратить 200 граммов пластика и 2 единицы
    электричества.


    Умные роботы, которых Филипп приобрел для автоматизации сборки, каждый месяц требуют оплату подписки на ПО вне
    зависимости от того, сколько они работали. Сам себе Филипп платит сдельно: 20 рублей за каждый произведённый
    стилус. Счетчиков для электричества на заводе нет, поэтому Филипп платит за него одну и ту же сумму каждый месяц
    вне зависимости от объёмов потребления.


    Известно, что Филипп не планирует ни продавать имеющихся роботов, ни покупать новых, а деятельность его компании
    будет длиться бесконечно. Какие из перечисленных ниже издержек для компании Филиппа являются постоянными?


    Высшая проба – 2025'
  options:
  - Затраты на пластик.
  - Оплата подписки на ПО.
  - Выплаты Филиппу самому себе.
  - Затраты на патент, который даёт право использовать технологию, разработанную НИИ.
  - Затраты на электричество.
  correct:
