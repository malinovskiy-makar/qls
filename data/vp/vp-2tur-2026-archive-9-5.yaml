  statement: 'Фирма «Там Сям» производит перчатки для взрослых и детей. Производство новой пары детских перчаток
    стоит 124 рубля, а новой пары взрослых перчаток – 163 рубля. Фирме пришло несколько запросов от магазинов, продающих
    одежду: Магазин «Все по 250» предлагает выкупить у фирмы 100 пар детских и 100 пар взрослых перчаток и платит
    за каждую пару по 250 рублей. Магазин «Меховая империя» хочет купить 200 пар взрослых и 50 пар детских перчаток
    и предлагает по 220 рублей и по 150 рублей за пару соответственно. На данный момент у фирмы в наличии имеется
    по 50 пар перчаток каждого вида, которые она не может реализовать самостоятельно, считайте, что затраты на их
    производство равны 0. Также известно, что фирма сможет обработать только один заказ от магазинов. Фирма может
    допроизвести недостающее количество перчаток.


    Пока фирма «Там Сям» думала над имеющимися вариантами, ей поступило предложение от магазина «Миллионер», который
    хочет приобрести 3267 пар взрослых перчаток и 2744 пар детских перчаток. За пару взрослых перчаток магазин предлагает
    167 рублей, а за пару детских – 127 рублей. В ответ запишите модуль разности между прибылями от самых выгодных
    вариантов продажи фирмы «Там Сям» до появления магазина «Миллионер» и после.


    Высшая проба – 2024/2025'
  answer: '0'
  accepted: []
  solution: Прибыль от нового заказа $3267\cdot167+2744\cdot127-(3267-50)\cdot163-(2744-50)\cdot124=35650$. Это
    ровно прибыль первого заказа, поэтому лучший результат не изменился. Разность равна 0.
