  statement: 'Вы исследователь и готовите статью о рыночном равновесии. Во время поиска информации вы нашли работу,
    в которой охарактеризована ситуация на рынке зимних шин в некоторой стране. Вы предполагаете, что спрос и предложение
    линейны (при положительных объёмах).


    «...Согласно данным о продажах зимних шин компании не готовы продавать шины дешевле 250 рублей за штуку. Автолюбители
    же не выражают интереса в покупке шин дороже 750 рублей за штуку. Известно, что когда государство установило
    потолок цены в 500 рублей за единицу товара, потребители были готовы купить 1000 шин, а производители могли
    продать только 250...»


    Используя представленную информацию, найдите равновесную цену на рынке шин без государственного ограничения
    цены.


    Высшая проба – 2025'
  answer: '650'
  accepted: []
  solution: 'По наблюдению при цене 500 восстанавливаем обратные функции: $P_D=750-0{,}25Q$ и $P_S=250+Q$. В равновесии
    без ограничения цены $750-0{,}25Q=250+Q$, поэтому $Q=400$, $P=650$. Упоминание потолка в исходном тексте служит
    наблюдением для восстановления функций; искомый рыночный уровень не равен этому потолку.'
