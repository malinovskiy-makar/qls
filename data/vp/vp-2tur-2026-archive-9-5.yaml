  statement: 'Иван с детства увлекается творчеством. После окончания школы он решил поступить на направление “Дизайн”
    в университет “ЭРДД”, где его мама Анна работает в течение последних 8 лет. По результатам всех вступительных
    испытаний Иван набрал 367 баллов (из них 98 баллов за творческое задание) и не поступил на бюджет бакалавриата
    по направлению «Дизайн», где проходной балл составлял 380 баллов. Сначала Иван очень расстроился, ведь обучение
    стоит 650 тыс. рублей в год (при условии неизменности цены обучения), но вспомнил, что детям сотрудников предоставляются
    скидки по следующей схеме: дети сотрудников, имеющих 5-10 лет стажа в ЭРДД, могут претендовать на скидку 80%
    при недоборе от 1 до 10 баллов до проходной суммы баллов на бюджет. Дети сотрудников, имеющих 5-10 лет стажа
    в ЭРДД, могут претендовать на скидку 55% при недоборе от 11 до 40 баллов на бюджет.


    Более того, любой поступающий также вправе претендовать на скидку по сумме баллов: если сумма баллов превышает
    370, а балл за творческое испытание от вуза больше 85, то скидка составит 75%; если сумма баллов превышает 365,
    то скидка составит 65%; если сумма баллов находится в диапазоне от 340 до 364, то скидка составит 50%; если
    сумма баллов находится в диапазоне от 320 до 339, то скидка составит 35% Все вышеперечисленные скидки не суммируются
    и действуют на протяжении всего периода обучения.


    Еще один способ снизить стоимость обучения – это раннее заключение и оплата договора в срок до 20 августа. В
    таком случае студент получает дополнительную скидку 5% на оплату первого года обучения (данная скидка может
    применяться одновременно с основными скидками, при этом отсчитывается от стоимости с учетом основной скидки,
    например, по суммарному баллу). Иван знает об этом, поэтому договор будет оформлять как можно раньше.


    Сколько составит минимальная стоимость обучения Ивана за первый год? Ответ дайте в рублях.


    Высшая проба – 2022/2023'
  answer: '216125'
  accepted: []
  solution: Недобор равен $380-367=13$ баллов, поэтому скидка ребёнку сотрудника – 55%. За сумму баллов доступна
    более выгодная скидка 65%. Базовая цена после неё $650000\cdot0{,}35=227500$. Дополнительная скидка за раннюю
    оплату даёт $227500\cdot0{,}95=216125$ рублей.
