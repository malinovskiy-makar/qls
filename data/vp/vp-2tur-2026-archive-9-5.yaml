  statement: 'В настоящее время достаточно актуальной остается проблема [[1]] среди населения, выражающаяся в неравномерном
    распределении благ в обществе. В разных странах острота этой проблемы различается. Для снижения неравенства
    в конкретной стране может быть введена [[2]] шкала налогообложения, что позволит перераспределить налоговую
    нагрузку с бедных слоев населения на богатые. Также эффективным инструментом борьбы с неравенством является
    введение [[3]] для беднейших слоев населения.


    Не менее важным является снижение неравенства среди стран. Одной из мер решения этой проблемы является введение
    странами-импортёрами [[4]] тарифов на товары, экспортируемые наименее развитыми государствами. Такая мера способствует
    [[5]] внутри этих стран.


    Высшая проба – 2022/2023'
