  statement: 'Рабочий день Васи и Пети составляет 8 часов для каждого. Это время каждый распределяет между составлением
    задач и просмотром видео на Выштьюбе. Вася составляет по одной задаче в час, а Петя же в первые 2 часа работы
    составляет 5 задач, в следующие 2 часа работы – 3 задачи, затем 2 часа работает над ещё одной задачей, а в последние
    2 часа не может составить ни одной задачи. Для грядущей олимпиады Васю и Петю попросили составить ровно 10 задач
    вместе. Известно, что Вася и Петя распределили работу между собой так, чтобы суммарное время, оставшееся на
    просмотр Выштьюба, было максимальным. Чему равно это время в часах?


    Внутри каждого указанного двухчасового отрезка производительность Пети постоянна.


    Высшая проба – 2025'
  answer: '10'
  accepted: []
  solution: 'В первые четыре часа Петя составляет $5+3=8$ задач: оба этих двухчасовых отрезка производительнее труда
    Васи. Следующие задачи у Пети требуют уже по два часа, тогда как у Васи – по одному. Поэтому две оставшиеся
    задачи делает Вася за два часа. На работу уходит $4+2=6$ человеко-часов из $8+8=16$, на просмотр остаётся $16-6=10$
    часов.'
