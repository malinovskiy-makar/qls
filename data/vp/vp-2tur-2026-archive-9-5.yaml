  solution: 'Переменные расходы меняются с выпуском: к ним относятся сырьё и индивидуальная упаковка. Постоянные
    издержки не обязаны быть положительными. Предельные издержки – прирост затрат при увеличении выпуска, а экономические
    издержки включают явные и неявные.'
