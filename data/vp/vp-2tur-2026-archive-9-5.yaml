  statement: 'Выберите все верные утверждения.


    Высшая проба – 2023/2024'
  options:
  - Предельные издержки – это величина общих издержек фирмы, при которой она будет получать нулевую прибыль.
  - У фирмы всегда есть положительные постоянные издержки.
  - К переменным издержкам фирмы относятся затраты на сырье.
  - К постоянным издержкам фирмы относится плата за индивидуальную упаковку товара.
  - Сумма явных и неявных издержек называется экономическими издержками.
