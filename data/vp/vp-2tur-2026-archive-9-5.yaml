  statement: 'Игорь занимается хоккеем и посещает тренировки 3 раза в неделю. После каждой тренировки он стирает
    форму и остальные вещи, накопившиеся к этому моменту. Игорю стало интересно, сколько воды он тратит на одну
    стирку, для этого он замерил показания на счетчике с холодной водой до запуска стиральной машины и после. Согласно
    его замеру, который совпал с информацией из технической характеристики стиральной машины, расход получился 60
    литров за цикл стирки, что эквивалентно $0{,}06\ \text{м}^3$. Для стирки машина использует только холодную воду,
    кубометр холодной воды стоит 41 рубль. Известно, что Игорь тренируется каждую неделю.


    Посчитайте, сколько всего рублей на стирку тратит Игорь за не високосный февраль, начинающийся в понедельник.
    Известно, что Игорь покупает капсулы для стирки по цене 336 рублей за упаковку, которая содержит 6 капсул, а
    для одного цикла стирки нужна ровно одна капсула. Также для одного цикла стирки требуется 0,95 кВтч электроэнергии,
    которая стоит 4,98 рубля за кВтч.


    Высшая проба – 2024/2025'
  answer: 758,29
  accepted: []
  solution: Всего 12 стирок. Капсула стоит $336/6=56$ рублей. Вода за цикл – 2,46, электричество – $0{,}95\cdot4{,}98=4{,}731$.
    Полные расходы $12(56+2{,}46+4{,}731)=758{,}292$, после округления 758,29 рубля.
