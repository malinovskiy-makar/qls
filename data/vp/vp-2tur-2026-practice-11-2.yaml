  statement: Фирма продаёт продукцию по цене 1 и имеет технологию $Q=20L-L^2$ на участке $0\leq L\leq10$. Других
    затрат, кроме оплаты труда, нет. Профсоюз назначает неотрицательную ставку зарплаты $w$, после чего фирма выбирает
    делимый объём труда $L$, максимизируя прибыль. Профсоюз стремится максимизировать общий фонд оплаты труда $wL$.
    Каков объём выпуска в результате?
  answer: '75'
  accepted: []
  solution: При $0\leq w\leq20$ фирма выбирает $L=(20-w)/2$, при более высокой зарплате труд не нанимает. Фонд оплаты
    $w(20-w)/2$ максимален при $w=20/2$, поэтому $L=20/4$. Выпуск $Q=20\cdot20/4-(20/4)^2=75$.
