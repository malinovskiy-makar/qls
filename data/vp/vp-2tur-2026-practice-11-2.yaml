  statement: Ресурсы и внешние эффекты. Выберите все <strong>неверные</strong> утверждения.
  options:
  - Разовые расходы на энергосберегающее оборудование не следует учитывать при оценке проекта.
  - Бесплатный доступ к исчерпаемому ресурсу исключает его экономическую редкость.
  - Выгода сохранения леса может включать услуги, которые не продаются на отдельном рынке.
  - Общественные предельные издержки могут превышать частные из-за ущерба третьим лицам.
  - Полное устранение любого загрязнения всегда эффективно независимо от стоимости очистки.
  correct:
