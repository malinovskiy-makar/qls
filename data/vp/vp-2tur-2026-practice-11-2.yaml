  statement: Спрос на товар монополиста имеет постоянную ценовую эластичность по абсолютной величине 4. Средние
    и предельные издержки постоянны и равны 30. После введения налога за каждую проданную единицу фирма сохранила
    положительный выпуск и максимизирует прибыль. Цена выросла на 20 денежных единиц. Какой процент первоначальных
    средних издержек составляет налог? Округлите до сотых при необходимости.
  answer: '50'
  accepted: []
  solution: При постоянной эластичности оптимальная цена $P=\frac{4}{3}MC$. Поэтому прирост цены равен $\frac{4}{3}t$,
    налог $t=20\cdot3/4=15$. Относительно исходных издержек это $15/30\cdot100=50\%$.
