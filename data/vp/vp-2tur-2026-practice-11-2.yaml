  statement: 'Проектирование изделия, изготовление компонентов, сборка и продажа могут находиться в разных странах.
    Такая организация формирует международную цепочку [[1]] стоимости. Валовая стоимость пересекающего границу товара
    включает не только вклад последнего производителя, но и ранее использованные промежуточные товары. Поэтому валовой
    экспорт и созданная внутри страны добавленная стоимость экспорта – разные показатели.


    Размещение отдельных операций за рубежом может быть связано с различиями в затратах и [[2]] работников. Координацию
    облегчает развитие транспорта и связи, снижающее [[3]] издержки взаимодействия. При этом концентрация критического
    компонента у единственного поставщика увеличивает зависимость остальных участников.


    Если поставки внезапно прекращаются, производственный [[4]] может распространяться дальше по цепочке. Чтобы
    снизить такую уязвимость, фирма может использовать нескольких поставщиков, то есть проводить [[5]] снабжения.
    Это способ уменьшить некоторые риски, но он способен увеличить текущие расходы.


    Решение вернуть ранее вынесенное производство в страну происхождения называют [[6]]. Оно не всегда означает
    наименьшую себестоимость: при выборе учитывают устойчивость и сроки. Запас компонентов создаёт страховой резерв,
    но требует [[7]] капитала и расходов на хранение. Поэтому фирма сопоставляет ожидаемые потери от сбоев с ценой
    повышения [[8]] поставок.'
