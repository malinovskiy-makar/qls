  - 2
  - 5
  penalty: true
  solution: 1. Неверно. Первоначальные инвестиции – часть затрат проекта. 2. Неверно. Отсутствие цены не устраняет
    ограниченность ресурса. 3. Верно. Например, поддержание водного режима и разнообразия видов. 4. Верно. Неучтённый
    внешний ущерб добавляется к частным затратам. 5. Неверно. Экономическая оценка сравнивает предельные выгоды
    и затраты.
