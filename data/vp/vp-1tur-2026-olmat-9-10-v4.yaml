    statement: "Страна А имеет кривую производственных возможностей 𝑦= 90 −3𝑥. Страна Б — кусочно-линейную КПВ: 𝑦= 40 −𝑥при 0 ≤𝑥≤10 и 𝑦= 60 −3𝑥при 10 < 𝑥≤20. Страны объединяют ресурсы и распределяют производство между собой так, чтобы при заданном суммарном выпуске 𝑥произвести как можно больше 𝑦. Чему равен максимальный суммарный выпуск блага 𝑦, если суммарно нужно произвести 30 единиц блага 𝑥?"
    options:
      - "40"
      - "50"
      - "60"
      - "70"
      - "Нет верного ответа"
    correct: [3]
    solution: "60. Производство 𝑥отдают тому, у кого оно дешевле. Первые 10 единиц 𝑥страна Б делает по 1 единице 𝑦за штуку (дешевле, чем 3 у страны А): Б выпускает (10; 30). Следующие 20 единиц стоят по 3 𝑦и у А, и у Б на втором участке — их даёт страна А: 𝑦= 90 −3 · 20 = 30. Итого 𝑦= 30 + 30 = 60."
