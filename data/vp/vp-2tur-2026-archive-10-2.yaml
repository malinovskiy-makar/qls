  statement: 'Энергетическим переходом называют процесс структурных изменений в энергетической системе. В истории
    энергетики выделяют несколько перекрывающихся волн изменений. К первой относится изменение основного источника
    энергии с биомассы на уголь, произошедшее в середине-конце [[1]] века. К началу нового века доля угля в общем
    объеме потребления первичной энергии достигла примерно [[2]]. Следующая волна была связана с распространением
    [[3]]; важной вехой стал энергетический кризис 70-х гг. XX века. Дальнейшее разнообразие источников привело
    к частичному вытеснению угля как источника [[4]] энергии. В настоящее время расширяется переход к низкоуглеродной
    энергетике, одной из главных причин которого стала глобальная [[5]], в частности, высокие [[6]], с которыми
    сопряжено использование нефтяного топлива. Поэтому переход осуществляется на [[7]], в то время как роль [[8]]
    как переходного источника энергии усиливается.


    Высшая проба – 2022/2023'
