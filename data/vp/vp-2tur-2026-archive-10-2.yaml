    объем нанимаемого труда увеличится.
  - При некоторых уровнях заработной платы кривая предложения труда отдельного работника может иметь отрицательный
    наклон, так как работник становится достаточно богатым и может позволить себе работать меньше.
  - Если спрос на труд предъявляет множество небольших фирм, а работников на рынке труда представляет профсоюз,
    то уровень равновесной заработной платы на рынке будет не меньше, чем в случае, если бы профсоюза не было.
  - Если фирма – единственный наниматель в регионе и кривая предложения труда имеет положительный наклон, то для
    привлечения большего числа работников фирме нужно предложить более высокую заработную плату.
  - Если на совершенно конкурентном рынке труда вводится потолок заработной платы, то равновесный уровень заработной
    платы увеличится.
