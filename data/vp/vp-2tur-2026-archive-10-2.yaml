  statement: 'Известно, что индекс цен в первом году был равен 100%, во втором – 130%, в третьем - 180% (каждый
    рассчитан по отношению к первому году). Номинальный доход во втором году по сравнению с первым увеличился на
    50%, а в третьем году по сравнению со вторым – на 20%. Если номинальный доход в первом году был равен 1000 ден.
    ед., то необходимо определить абсолютную величину реального дохода в третьем году.


    Высшая проба – 2009'
  answer: '1000'
  accepted: []
  solution: Номинальный доход третьего года $1000\cdot1{,}5\cdot1{,}2=1800$. Индекс цен третьего года относительно
    первого равен 1,8. Реальный доход в ценах первого года $1800/1{,}8=1000$.
