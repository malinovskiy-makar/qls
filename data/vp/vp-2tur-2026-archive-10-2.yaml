  statement: 'Экономика, первоначально находившаяся на уровне потенциального объема выпуска, испытала негативный
    шок предложения, в результате которого в краткосрочный период уровень цен поднялся на 10 %. Исходное уравнение
    кривой совокупного спроса имело вид $Y = 2500 - 250P$. Потенциальный ВВП равен 2000 ден. ед. Определите, на
    сколько процентов в краткосрочном периоде увеличился/снизился объем выпуска после шока.


    В ответе укажите изменение в процентах со знаком: рост – положительное число, снижение – отрицательное.


    Высшая проба – 2009'
  answer: -2,5
  accepted: []
  solution: Исходная цена из $2000=2500-250P$ равна 2. После роста на 10% она равна 2,2. Новый выпуск $2500-250\cdot2{,}2=1950$,
    изменение $(1950/2000-1)\cdot100=-2{,}5\%$.
