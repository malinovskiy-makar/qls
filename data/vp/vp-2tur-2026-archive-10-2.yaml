  statement: 'Выберите верные утверждения о неравенстве доходов.


    Все доходы неотрицательны, совокупный доход положителен.


    Высшая проба – 2022/2023'
  options:
  - Если кривая Лоренца состоит из нескольких участков, каждый из которых задан линейной функцией, то ни у одного
    из этих участков наклон не может быть больше 1.
  - Если доходы всего населения сократились в 3 раза, степень неравенства в обществе не изменилась.
  - Кривая Лоренца всегда является кусочно-заданной функцией.
  - Меньшее значение коэффициента Джини соответствует меньшему неравенству в распределении доходов в стране.
  - Кривая Лоренца может иметь отрицательный наклон на некоторых промежутках.
  correct:
