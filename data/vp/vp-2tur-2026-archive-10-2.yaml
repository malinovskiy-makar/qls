  penalty: true
  solution: Пропорциональное изменение всех доходов сохраняет их доли и кривую Лоренца. Меньший Джини означает меньшее
    неравенство. Наклон верхних участков может превышать единицу; кривая может быть плавной. В используемой здесь
    стандартной модели неотрицательных доходов накопленная доля дохода не убывает.
