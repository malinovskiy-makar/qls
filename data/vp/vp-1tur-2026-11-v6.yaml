    intro: "В каждом задании выберите все верные утверждения. Балл начисляется пропорционально доле выбранных верных вариантов, за выбор неверных вариантов — пропорциональный штраф."
    statement: "Выберите все верные утверждения о минимальной оплате труда."
    options:
      - "Минимальная оплата труда, установленная ниже равновесной ставки, не меняет ни зарплату, ни число занятых."
      - "Если минимальную оплату установить выше равновесной ставки, фирмам станет не хватать работников: вакансий окажется больше, чем желающих работать."
      - "Если на рынке труда всего один работодатель, минимальная оплата может поднять одновременно и ставку, и занятость."
      - "Повышение минимальной оплаты сильнее всего сказывается на работниках низкой квалификации."
      - "Введение минимальной оплаты при любых условиях увеличивает суммарный заработок всех работников, получающих зарплату."
    correct: [1, 3, 4]
    solution: "Минимум ниже равновесной ставки ни на что не влияет: рынок и так платит больше. На рынке с единственным работодателем (монопсония) минимум может поднять и ставку, и занятость. Сильнее всего повышение минимума касается низкоквалифицированных работников, чья зарплата близка к минимальной. Утверждение 2 неверно: минимум выше равновесия создаёт избыток предложения труда – желающих работать больше, чем рабочих мест, то есть возникает безработица. Утверждение 5 неверно: при эластичном спросе на труд потери от сокращения занятости перевесят прибавку к ставке, и суммарный заработок снизится."
    points: 3
    penalty: true
