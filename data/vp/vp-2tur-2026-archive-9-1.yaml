  statement: 'Андрей поставил автомат, в котором можно распечатать фотографии. Печать каждой фотографии стоит 100
    рублей. В автомате в среднем распечатывается 500 фотографий в неделю. Каждый клиент печатает только одну фотографию.
    Прибыль Андрея составляет 20 000 рублей в неделю, а издержки на расходные материалы для печати каждой фотографии
    20 рублей, все остальные издержки считайте постоянными.


    Определите, чему были равны недельные постоянные издержки автомата печати фотографий.


