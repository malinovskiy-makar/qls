  statement: 'Функция спроса на труд имеет вид $L^d = 60 - 3w$, где $L^d$ - величина спроса на труд, а $w$ - ставка
    заработной платы в рублях в час. Предложение труда задано функцией $L^s = 3w$, где $L^s$ - величина предложения
    труда. Правительство решило ввести минимальную заработную плату, равную 12 рублям в час. На какую величину увеличится/сократится
    занятость в этой экономике по сравнению со временем, когда правительство не регулировало заработную плату?


    В ответе укажите изменение занятости; сокращение обозначьте отрицательным числом.


    Высшая проба – 2008'
  answer: '-6'
  accepted: []
  solution: Равновесие $60-3w=3w$ даёт $w=10$, $L=30$. Минимальная зарплата 12 выше равновесной; работают $60-3\cdot12=24$.
    Изменение занятости $24-30=-6$.
