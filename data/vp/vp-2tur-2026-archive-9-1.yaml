  statement: 'На совершенно конкурентном рынке сложилась равновесная цена блага $P=14$. Определите максимальную
    прибыль фирмы, имеющей функцию общих издержек

    $$TC=\begin{cases}Q^2, & Q<10\\ Q^2/2+50, & Q\geq 10\end{cases},$$

    при условии, что фирма может выбрать только <em>целочисленный</em> объем производства.


    Высшая проба – 2011'
  accepted: []
  solution: 'При $Q<10$: $\pi=14Q-Q^2=49-(Q-7)^2$, максимум 49 при $Q=7$. При $Q\geq10$: $\pi=14Q-Q^2/2-50=48-(Q-14)^2/2$,
    максимум 48 при $Q=14$. Оба выпуска целые; больший максимум равен 49.'
