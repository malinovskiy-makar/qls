  statement: 'Предположим, что существуют две страны А и Б, причем каждая из этих стран имеет лишь один фактор производства
    (трудовые ресурсы) и может выпускать только два вида товаров: яблоки и груши. Страна А располагает трудовыми
    ресурсами в количестве 1200 единиц, а страна Б в количестве 900 единиц. Для производства 1 кг яблок в стране
    А требуется 3 единицы труда, а в стране Б 5 единиц труда. Для производства 1 кг груш в стране А требуется 2
    единицы труда, а в стране Б 1 единица труда. Объединив свои производственные возможности, обе страны могут произвести
    300 кг груш, тогда для этих условий определите максимально возможный объем производства яблок.


    Высшая проба – 2009'
  answer: '520'
  accepted: []
  solution: У А 400 яблок или 600 груш, у Б 180 яблок или 900 груш. Груша стоит А $2/3$ яблока, Б – $1/5$. Поэтому
    все 300 груш производит Б, используя 300 единиц труда. Остаток Б даёт 120 яблок, А – 400. Всего 520.
