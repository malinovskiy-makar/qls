  statement: 'Катя решила, что ей необходимо как-то распорядиться своими накоплениями в размере 400000 руб. на ближайшие
    2 года. Она рассматривает 2 варианта:


    1) Вложить все средства в акции компании ПАО «Фигрынки». Стоимость одной акции составляет 40000 руб., по ним
    не выплачиваются дивиденды, а доходность формируется только за счет ежегодного изменения их рыночной стоимости.
