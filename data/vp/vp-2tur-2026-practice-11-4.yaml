  statement: 'При свободном доступе к рыбному промыслу каждый участник получает выручку от собственного улова, но
    сокращение запаса рыбы влияет и на остальных. Ресурс в этом случае является конкурентным в потреблении, а исключить
    пользователей трудно. Такая ситуация создаёт риск чрезмерной [[1]] общего ресурса.


    В расчёте рыбака могут не учитываться потери других пользователей. Возникает расхождение между частными и [[2]]
    издержками. Само отсутствие платы за доступ не означает, что дополнительный улов не имеет альтернативной стоимости
    для общества.


    Один из способов регулирования – ограничить общий улов и распределить индивидуальные [[3]]. Если права разрешено
    передавать, участники могут обмениваться ими. Цена права отражает его [[4]] при заданном общем ограничении;
    она не равна автоматически всем затратам промысла.


    Для устойчивого использования важна скорость естественного [[5]] запаса. Возобновляемость ресурса не гарантирует
    его сохранения при любом объёме добычи. Контроль соблюдения правил требует расходов на [[6]], а непрозрачное
    распределение прав может порождать борьбу за [[7]]. Выбор политики зависит от биологических ограничений, стоимости
    контроля и того, какие экономические [[8]] получают пользователи.'
