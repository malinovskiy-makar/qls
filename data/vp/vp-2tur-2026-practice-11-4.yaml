  statement: Спрос на товар монополиста имеет постоянную ценовую эластичность по абсолютной величине 3. Средние
    и предельные издержки постоянны и равны 25. После введения налога за каждую проданную единицу фирма сохранила
    положительный выпуск и максимизирует прибыль. Цена выросла на 18 денежных единиц. Какой процент первоначальных
    средних издержек составляет налог? Округлите до сотых при необходимости.
  answer: '48'
  accepted: []
  solution: При постоянной эластичности оптимальная цена $P=\frac{3}{2}MC$. Поэтому прирост цены равен $\frac{3}{2}t$,
    налог $t=18\cdot2/3=12$. Относительно исходных издержек это $12/25\cdot100=48\%$.
  n: 5
