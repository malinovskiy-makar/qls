  statement: 'Начинающий предприниматель Иван решает, стоит ли ему открыть собственную хлебопекарню, выпускающую
    «Нарезной» батон. Рынок этого продукта является совершенно конкурентным, и цена на один «Нарезной» установилась
    на уровне 20 рублей. Для открытия хлебопекарни необходимо арендовать помещение по цене 2 млн рублей в год и
    оборудование по ставке 1,5 млн рублей в год. Предприниматель также должен нанять на год 5 работников с заработной
    платой 30000 рублей в месяц у каждого. Количество зерна, необходимое для производства одного «Нарезного» батона,
    можно купить на рынке за 10 рублей. Обозначим через $Q$ количество батонов, производимых хлебопекарней Ивана
    в год.


    Осознавая социальную ответственность бизнеса, Иван хочет перечислять 2 руб. с каждого проданного батона детскому
    дому. Сколько батонов хлеба нужно теперь продать Ивану, чтобы окупить вложенные в хлебопекарню средства (то
    есть только покрыть свои затраты) за один год?


    Высшая проба – 2011'
  accepted: []
  solution: После пожертвования на покрытие постоянных расходов остаётся $20-10-2=8$ руб. с батона. Для безубыточности
    нужно $5300000/8=662500$ батонов.
