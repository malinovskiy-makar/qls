  statement: 'В закрытой экономике совокупный спрос определяется уравнением количественной теории денег $MV=PY$,
    где $M$ – денежная масса, равная 200, а $V$ – скорость обращения денег, равная 1. Краткосрочное совокупное предложение
    задаётся уравнением $Y=2P$. Считайте, что изначально экономика находится в долгосрочном равновесии.


