  statement: 'Успешной политикой в преодолении последствий Великой депрессии прославился Франклин Рузвельт. Основной
    его политикой стал «Новый курс», в ходе которого увеличивались государственные расходы на помощь фермерам, пособия
    по безработице и прочие социальные выплаты. Эти меры помогли улучшить не только экономическую, но и социальную
    ситуацию во время кризиса, и продолжают сглаживать экономический цикл до сих пор. Выберите понятия, которые
    могут быть использованы для описания этих процессов.


