  answer: '40'
  accepted: []
  solution: Из условия $Q^*=15$. Предельные издержки $MC(Q)=2Q+10$. При внутреннем оптимуме конкурентной фирмы $P=MC(15)=40$.
    Средние переменные издержки равны 25, поэтому производство выгоднее остановки.
