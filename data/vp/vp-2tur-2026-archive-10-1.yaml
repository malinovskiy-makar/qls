  statement: 'На рынке две группы производителей численностью 20 и 120 фирм. Кривая предложения каждой фирмы из
    первой группы определяется уравнением $P(Q) = 2Q + 10$, а каждой фирмы из второй группы $P(Q) = 4Q + 20$, где
    $Q$ - объем произведенной продукции, $P$ - цена на продукцию. Рассматривая рыночное предложение, определите,
    какому значению цены соответствует объем предложения $Q$ равный 80.


    Высшая проба – 2008'
  answer: '18'
  accepted: []
  solution: При $10<P<20$ работает только первая группа. Её общее предложение $20(P-10)/2=10P-100$. Равенство 80
    даёт $P=18$; порог второй группы 20 не достигнут.
