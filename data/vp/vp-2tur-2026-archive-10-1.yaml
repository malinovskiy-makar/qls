  statement: 'Компания Альфа, действующая на конкурентном рынке, выпускает 10 ед. товара в краткосрочном периоде.
    Ее общие издержки описываются функцией $TC(Q)=Q^2+10Q+40$, где $Q$ – объем выпуска. Анализируя деятельность
    компании, экономист Александр пришел к выводу, что ее выпуск на 5 ед. меньше оптимального (т.е. выпуска, при
    котором достигается максимальная прибыль).


    Какая цена установилась на рынке в краткосрочном периоде?


