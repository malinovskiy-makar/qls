    kind: number
    group: 1
    statement: "Компания «Крутые аналитики» изучает экспорт стран А и Б по двум товарам: автомобили и сельскохозяйственные продукты. В таблице представлены данные за год в млрд долларов.\nРассчитайте показатель выявленных сравнительных преимуществ Баласса (RCA) для всех товаров каждой из стран. В ответе напишите наибольшее значение RCA. Для расчёта используйте формулу $RCA_{ij} = (X_{ij}/X_{wj}) / (X_i/X_w)$, где $X$ – экспорт, $i$ – страна, $j$ – товар, $w$ – мир в целом."
    table_html: "<table><thead><tr><th>Товар</th><th>Экспорт страны А</th><th>Экспорт страны Б</th><th>Мировой экспорт товара</th></tr></thead><tbody><tr><td>Автомобили</td><td>50</td><td>20</td><td>200</td></tr><tr><td>Сельскохозяйственные продукты</td><td>20</td><td>40</td><td>250</td></tr></tbody></table>"
    answer: "1,61"
    points: 5
    solution: "Мировой экспорт 450, экспорт А 70, Б 60. RCA: А, автомобили (50/200)/(70/450) ≈ 1,607; А, сельхозпродукты ≈ 0,514; Б, автомобили 0,75; Б, сельхозпродукты 1,2. Наибольшее – 1,61."
