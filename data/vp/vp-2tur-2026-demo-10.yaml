    statement: "Пусть экономика страны Вышландия существует на конечном временном горизонте, равном 3 периодам. Номинальный располагаемый доход домашних хозяйств Вышландии за первый период сократился на 15%, а за последующие два периода суммарно увеличился на 20%. Общий уровень цен в Вышландии за описываемый трёхлетний период увеличился на 2%. Рассчитайте темп прироста номинального располагаемого дохода домашних хозяйств Вышландии суммарно за три периода (в процентах)."
