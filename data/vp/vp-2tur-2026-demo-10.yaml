  - n: 5
    block: number
    kind: number
    statement: "Андрей поставил автомат, в котором можно распечатать фотографии. Печать каждой фотографии стоит 100 рублей. В автомате в среднем распечатывается 500 фотографий в неделю. Каждый клиент печатает только одну фотографию. Прибыль Андрея составляет 20 000 рублей в неделю, а издержки на расходные материалы для печати каждой фотографии – 20 рублей, все остальные издержки считайте постоянными.\nАндрей поменял оборудование, что увеличило качество печати. Поток клиентов увеличился на 50%. Новый автомат иногда выдаёт бракованные фотографии в 1 из 5 случаев. Если фото бракованное, то деньги возвращаются клиенту, также клиент разочаровывается в автомате, уходит и не пытается сделать повторную печать. Постоянные издержки и цена расходных материалов остались неизменными. Считайте, что Андрей поменялся техникой с другом, поэтому смог обменять свой старый автомат на новый без доплат. Чему будет равна прибыль Андрея в этом случае?"
    answer: "25000"
    points: 5
    solution: "Постоянные издержки: 100 · 500 − 20 · 500 − 20 000 = 20 000. Клиентов стало 750, деньги остаются у 4/5 из них: выручка 600 · 100 = 60 000. Материалы тратятся на все 750 снимков: 15 000. Прибыль 60 000 − 15 000 − 20 000 = 25 000."
  - n: 6
    block: number
    kind: number
    statement: "Молодая семья, Борис и Анна, решили стать фермерами. На своём участке они выращивают картошку и крапиву, а затем продают экзотический «Крапивно-картофельный салат». Борис за месяц может собрать 20 кг картошки или 20 кг крапивы. Анна за месяц может собрать 10 кг картошки или 5 кг крапивы. Альтернативные издержки производства крапивы и картофеля для Анны и Бориса постоянны. Для приготовления 1 порции салата необходимо 40 г картошки и 80 г крапивы. Какое максимальное количество салатов удастся произвести молодой семье за месяц?"
    answer: "250"
    points: 5
    solution: "У Анны картошка дешевле (0,5 кг крапивы за 1 кг против 1 кг у Бориса), поэтому Анна собирает только картошку – 10 кг. Крапивы нужно вдвое больше картошки: если Борис соберёт x кг картошки и 20 − x кг крапивы, то 20 − x = 2(10 + x), откуда x = 0. Картошки 10 кг, крапивы 20 кг – это 10 / 0,04 = 250 порций."
  - n: 7
    block: number
    kind: number
    statement: "На рынке авторских блокнотов действуют два потребителя, функции спроса которых заданы в виде $Q_1(P) = 10 - 2P$ и $Q_2(P) = 20 - P$, где $P$ – цена, а $Q_1$ и $Q_2$ – количество, которое хочет купить соответствующий потребитель. Предложение представлено в виде $Q(P) = -2 + P$, где $Q$ – количество, которое готовы продать производители по соответствующей цене. Найдите равновесную цену."
    answer: "11"
    points: 5
    solution: "При цене выше 5 первый потребитель ничего не покупает, спрос – только второго: 20 − P = P − 2, P = 11 > 5, условие выполнено."
  - n: 8
    block: number
    kind: number
    statement: "Компания «Альфа», действующая на конкурентном рынке, выпускает 10 ед. товара в краткосрочном периоде. Её общие издержки описываются функцией $TC(Q) = Q^2 + 10Q + 40$, где $Q$ – объём выпуска. Анализируя деятельность компании, экономист Александр пришёл к выводу, что её выпуск на 5 ед. меньше оптимального (то есть выпуска, при котором достигается максимальная прибыль). Какая цена установилась на рынке в краткосрочном периоде?"
    answer: "40"
    points: 5
    solution: "Оптимальный выпуск 15, у конкурентной фирмы в оптимуме P = MC = 2Q + 10 = 40."
  - n: 9
    block: number
    kind: number
    statement: "Совершенно конкурентный рынок перца в стране В находится в равновесии. Предложение на данном рынке имеет вид $q_s = -2 + 5p$, а спрос – $q_d = 238 - p$, где $p$ – цена (в условных рыночных единицах) тонны перца, $q_s$ – количество, которое производители готовы продать, а $q_d$ – количество тонн перца, которое потребители готовы купить, при цене $p$. Власти страны решили ограничить цену перца, установив её на уровне 50% от равновесной, и покрыть образовавшийся излишний спрос за счёт собственных резервов. Найдите, какое количество перца будут реализовывать производители в ситуации такого ценового ограничения."
    answer: "98"
    points: 5
    solution: "Равновесие: −2 + 5p = 238 − p, p = 40. Потолок 20, производители продают q_s(20) = 98."
  - n: 10
    block: number
    kind: number
    statement: "Юный экономист Евгений решает, как распорядиться 4000 рублей, накопленными со школьных обедов, и хочет инвестировать эту сумму на два года. В приложении «Инвестиции для всех» он может выбрать акции или облигации. Поскольку Евгений – начинающий инвестор, ему доступен ограниченный функционал. Так, он может купить акции компании А стоимостью 100 рублей или облигации компании B номиналом 250 рублей и с датой погашения через 2 года. Облигации компании B сейчас торгуются по номиналу. Известно, что, согласно прогнозу, стоимость акций компании А будет расти каждый год на 10% относительно предыдущего года. Компания B, в свою очередь, обещает купонную выплату в размере 15% от номинала в дату погашения. Какую прибыль может получить Евгений, если вложит все накопления в акции компании А, а прогноз относительно их роста реализуется?"
    answer: "840"
    points: 5
    solution: "40 акций по 100 рублей через два года стоят по 100 · 1,1² = 121: прибыль 40 · 21 = 840."
  - n: 11
    block: number
    kind: number
    statement: "На планете Джи население делится на 3 группы: рыцари, фермеры и ремесленники. Доля фермеров и ремесленников в населении планеты одинаковая и составляет 40% для каждой группы, при этом они получают 10% и 40% доходов соответственно, тогда как остальное принадлежит рыцарям. Считайте, что внутри групп доходы распределены равномерно. В ходе классовой борьбы рыцари были изгнаны с планеты Джи вместе с их богатством. Найдите, на сколько изменился индекс Джини."
    answer: "-0,12"
    points: 5
    solution: "До изгнания кривая Лоренца проходит через (0,4; 0,1), (0,8; 0,5), (1; 1): площадь под ней 0,02 + 0,12 + 0,15 = 0,29, Джини 1 − 2 · 0,29 = 0,42. После: фермеры – половина населения и 20% дохода, точки (0,5; 0,2), (1; 1), площадь 0,05 + 0,3 = 0,35, Джини 0,3. Изменение 0,3 − 0,42 = −0,12."
  - n: 12
    block: number
    kind: number
    statement: "В деревне Зелёный Луг у единственного крестьянина Петра есть единственное поле, на котором он может выращивать пшеницу (W) и овощи (V). Земли у него ограниченное количество: чем больше площади он отдаёт под пшеницу, тем меньше остаётся под овощи. Производственные возможности поля Петра описываются уравнением $2W + V = 100$, где $W$ – количество мешков пшеницы, а $V$ – количество корзин овощей. На Агробирже, где деревни региона торгуют между собой пшеницей и овощами, два мешка пшеницы обмениваются на одну корзину овощей. С открытием Агробиржи Пётр получил возможность специализироваться только на одном виде продовольствия. Второй вид продовольствия Пётр может закупить на Агробирже, продав выращенное на своём поле. Определите максимальное количество единиц продовольствия, которое Пётр закупил на Агробирже, продав выращенное на своём поле. Считайте, что Пётр продаёт всё продовольствие, на котором он специализируется."
    answer: "200"
    points: 5
    solution: "Специализация на пшенице даёт 50 мешков и 25 корзин на бирже; на овощах – 100 корзин и 200 мешков пшеницы. Максимум – 200 единиц."
  - n: 13
    block: number
    kind: number
    statement: "В посёлке Акив действует единственная фирма, которая производит и продаёт гранатовый сок. Один работник может произвести 5 бутылок гранатового сока. Работа эта несложная, поэтому фирма может нанять любое количество работников с одинаковой производительностью. Других факторов производства помимо труда у фирмы нет. Стоимость оплаты труда одного работника составляет 100 денежных единиц. Спрос на гранатовый сок в посёлке Акив задаётся функцией $P_d = 1220 - Q$, где $P$ – цена за бутылку сока, $Q$ – количество бутылок гранатового сока в штуках. В целях пополнения бюджета государство вводит налог на заработную плату по ставке 50% (по типу НДФЛ). Бремя налогообложения ложится на фирму, так что зарплата работника после налогообложения по-прежнему составляет 100 денежных единиц. Фирма, как и ранее, максимизирует прибыль. Какова сумма налоговых сборов государства?"
    answer: "11800"
    points: 5
    solution: "Начисленная зарплата W такова, что W · (1 − 0,5) = 100, W = 200, налог 100 с работника. Предельные издержки 200 / 5 = 40 на бутылку: 1220 − 2Q = 40, Q = 590, работников 118, налог 118 · 100 = 11 800."
