  - n: 16
    block: number
    kind: number
    statement: "Долгосрочное совокупное предложение в экономике фиксировано на уровне $Y^* = 1000$. Совокупный спрос задан уравнением $Y = 2 · M/P$, где $M = 1000$ – денежная масса в экономике. Пусть экономика изначально находится в состоянии долгосрочного равновесия. Определите равновесный общий уровень цен ($P$)."
