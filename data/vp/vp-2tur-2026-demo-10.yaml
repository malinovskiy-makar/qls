  statement: 'Страна имеет выявленное сравнительное преимущество в экспорте определённого товара, если показатель
    Баласса по этому товару превышает 1. Насколько стране А нужно увеличить экспорт автомобилей, чтобы иметь выявленное
    сравнительное преимущество по их экспорту?


    Найдите минимально необходимое увеличение экспорта автомобилей, в млрд долларов; если увеличивать экспорт не
    требуется, запишите 0.'
  answer: '0'
  points: 5
  solution: 'RCA страны А по автомобилям уже 1,61 > 1, увеличивать экспорт не нужно.


    Редакционные уточнения к PDF: Указаны минимальное изменение и единицы ответа.'
