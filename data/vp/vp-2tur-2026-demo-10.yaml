    statement: "Понятие «ловушка среднего дохода» описывает ситуацию, когда страна достигла уровня дохода выше низкого, но не может перейти в категорию [[1]] экономик. Чаще всего это связано с утратой конкурентоспособности в традиционных отраслях при отсутствии перехода к инновационной модели. Страны, оказавшиеся в ловушке, теряют преимущества дешёвой [[2]], но при этом ещё не обладают развитой системой образования и науки. В отличие от стран Восточной Азии, успешно перешедших к инновационной модели, многие латиноамериканские экономики десятилетиями остаются в ловушке среднего дохода. Одной из причин является высокая [[3]] доходов, измеряемая с помощью коэффициента [[4]].\nСтраны, оказавшиеся в ловушке, часто сталкиваются с феноменом «плохого равновесия», когда слабые [[5]] препятствуют защите прав собственности. При этом государства продолжают полагаться на [[6]] модель развития за счёт увеличения объёма использования ресурсов, а не повышения эффективности.\nОсобенно много проблем у стран, развившихся благодаря экспорту природных ресурсов: с одной стороны, это позволяет государству получать ресурсную [[7]] с минимальными издержками, из-за чего у него нет стимулов к институциональному развитию, а с другой – зависимость от мировых цен приводит к сильной волатильности [[8]], что плохо сказывается на макроэкономической стабильности."
