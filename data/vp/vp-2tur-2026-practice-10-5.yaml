  statement: Автомат продаёт снимки по 180 рублей. Раньше он печатал 800 снимков за неделю без брака, а недельная
    прибыль составляла 32000 рублей. Материалы на один снимок стоят 40 рублей; остальные издержки постоянны. После
    бесплатной замены автомата число заказов выросло на 50%, но доля бракованных снимков стала 10%. Деньги за брак
    возвращают, материал при этом расходуется, повторного заказа нет. Цена, расход материалов на снимок и постоянные
    издержки не изменились. Какова новая недельная прибыль?
  answer: '66400'
  accepted: []
  solution: $FC=(180-40)\cdot800-32000=80000$. Заказов стало 1200, из них оплачены 1080. Новая прибыль $180\cdot1080-40\cdot1200-80000=66400$.
