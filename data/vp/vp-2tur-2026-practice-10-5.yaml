  statement: 'В модели закрытой экономики без внешней торговли совокупные планируемые расходы состоят из потребления,
    инвестиций и государственных [[1]]. Потребление обычно увеличивается при росте располагаемого дохода, то есть
    дохода после уплаты [[2]]. Доля дополнительного дохода, направляемая на потребление, называется предельной [[3]]
    к потреблению.


    Если предприятия произвели больше, чем покупатели намеревались приобрести, непроданные товары увеличивают незапланированные
    [[4]]. Фирмы могут сократить выпуск. При обратной ситуации запасы уменьшаются, создавая стимул расширить производство.
    Равновесие достигается, когда выпуск равен планируемым расходам.


    Рост автономных расходов создаёт доход у первых получателей, часть которого они тратят снова. Поэтому итоговое
    изменение выпуска может превышать исходный импульс; соответствующий коэффициент называют [[5]]. Его величина
    в простой модели зависит от склонности к потреблению.


    Такая модель предполагает фиксированные [[6]] и возможность расширения реального выпуска. Её выводы нельзя механически
    переносить на ситуацию полной загрузки всех ресурсов, где дополнительный спрос может сильнее влиять на цены.
    Разницу между фактическим и потенциальным выпуском называют разрывом [[7]]. При фактическом выпуске ниже потенциального
    разрыв является [[8]].'
