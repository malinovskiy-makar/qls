    solution: "Разница между ценой и переменными издержками со всех проданных столов должна покрыть 180 000 + 45 000 = 225 000. При цене 700 с каждого стола остаётся 700 − 400 = 300, нужно продать 225 000 / 300 = 750 столов. При цене 850 остаётся 450, нужно 225 000 / 450 = 500 столов – на 250 меньше. Если забыть про желаемую прибыль и сравнить только точки безубыточности (600 и 400 столов), получится неверное 200; 750 и 500 – это сами объёмы продаж, а не их разница."
