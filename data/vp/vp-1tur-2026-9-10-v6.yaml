    intro: "Решите задачу и выберите один верный ответ из пяти предложенных."
    statement: "Семья застраховала автомобиль на год на сумму 1 200 000 ден. ед. Страховая премия составляет 3% от страховой суммы. В договоре предусмотрена безусловная франшиза 15 000 ден. ед. на каждый страховой случай: по каждому случаю компания возмещает только ту часть ущерба, которая превышает франшизу. За год произошло два страховых случая: ущерб в первом составил 12 000 ден. ед., во втором – 95 000 ден. ед. На сколько выплаты страховой компании за год превысили уплаченную семьёй премию?"
