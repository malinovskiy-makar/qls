      - "80 000"
      - "56 000"
      - "44 000"
      - "Нет верного ответа"
    correct: [4]
    solution: "Премия: 1 200 000 · 0,03 = 36 000. Первый ущерб (12 000) меньше франшизы, поэтому по нему компания ничего не платит; по второму она выплачивает 95 000 − 15 000 = 80 000. Выплаты превысили премию на 80 000 − 36 000 = 44 000. Типичные ошибки: забыть вычесть премию (80 000), вычесть франшизу один раз из общего ущерба (107 000 − 15 000 − 36 000 = 56 000) или считать франшизу условной и оплатить второй случай целиком (95 000 − 36 000 = 59 000)."
