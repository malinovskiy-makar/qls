- n: 1
  block: multi
  kind: multi
  statement: Европейский союз выступает за развитие зелёной экономики, в том числе в области сельского хозяйства.
    Выберите ВСЕ <strong>неверные</strong> утверждения о мерах озеленения сельского хозяйства.
  options:
  - Строительство ветряных электростанций (ЭС) способствует не только повышению углеродной нейтральности сельского
    хозяйства, но и развитию отдалённых районов, где затруднено строительство традиционных ЭС.
  - Государственные субсидии и «зелёные» платежи в рамках программ стран ЕС всегда полностью компенсируют фермерам
    все возможные потери доходов и дополнительные риски.
  - Повышение ресурсоэффективности, например, точное внесение удобрений с использованием GPS-навигации и данных
    анализа почвы, может повысить экономическую устойчивость ферм в долгосрочной перспективе.
  - Меры по сокращению поголовья скота являются исключительно экономически выгодными для животноводческих ферм благодаря
    снижению затрат на корма и ветеринарные услуги.
  - Отказ от химических удобрений и пестицидов в пользу экологически безопасных аналогов приводит к снижению операционных
    издержек фермерских хозяйств.
  correct:
  - 2
  - 4
  - 5
  points: 6
  penalty: true
  solution: 'Неверны утверждения 2, 4 и 5. Субсидии не гарантируют полного покрытия всех потерь и рисков; сокращение
    стада уменьшает не только расходы, но и возможную выручку; экологичные способы производства не обязательно дешевле.
    Ветрогенерация и точное использование ресурсов могут поддерживать экологическую и экономическую устойчивость.


    Редакционные уточнения к PDF: GPS определяет координаты, а не сканирует состав почвы. Исправлен пример и исключена
    безусловная гарантия экономического результата; ключ сохранён.'
- n: 2
  block: multi
  kind: multi
  statement: Международные финансовые институты играют ключевую роль в поддержке стран-членов, предоставляя кредиты
    и содействуя развитию. Выберите ВСЕ <strong>верные</strong> утверждения о МВФ и Всемирном банке.
  options:
  - МВФ и Всемирный банк в основном предоставляют кредиты на безвозмездной основе, чтобы не увеличивать долговую
    нагрузку стран-заёмщиков.
  - Всемирный банк ориентирован на долгосрочное финансирование инфраструктурных и социальных проектов в развивающихся
    странах, а не на краткосрочную стабилизацию платёжного баланса.
  - Помимо кредита от МВФ страна-заёмщик также получает от него рекомендации по проведению макроэкономических реформ.
  - Решения в руководящих органах как МВФ, так и Всемирного банка принимаются на основе принципа «одна страна –
    один голос» для обеспечения справедливого представительства всех членов.
  - МВФ предоставляет финансовую помощь исключительно правительствам развивающихся стран для преодоления кризисов
    платёжного баланса.
  correct:
  - 2
  - 3
  points: 6
  penalty: true
  solution: Верны утверждения 2 и 3. Всемирный банк финансирует развитие, инфраструктуру и социальные проекты. МВФ
    помогает решать макроэкономические проблемы и сопровождает финансирование рекомендациями. Кредит предполагает
    возврат; голосование учитывает экономические доли участников. МВФ кредитует не только развивающиеся страны.
- n: 3
  block: gaptext
  kind: match
  intro: Заполните пропуски в тексте. Форма слова из списка может не совпадать с формой, которую требуют правила
    русского языка.
  statement: 'Одной из целей устойчивого развития ООН является создание стойкой инфраструктуры, содействие всеохватной
    и устойчивой индустриализации и инновациям. В Сингапуре реализация этой цели связана в первую очередь с решением
    [[1]] коллапсов. Быстрый рост населения и числа автомобилей создавал угрозу пробок и загрязнения [[2]].

    Город внедрил систему электронных [[3]] в транспорте и развил сеть подземного [[4]], что позволило сократить
    нагрузку на дороги. Одновременно с этим стимулировалось использование [[5]] транспорта.

    Эти меры помогли повысить экологическую [[6]] города и обеспечить более высокий [[7]] жизни граждан, но до достижения
    цели ещё далеко, так как страна занимает второе место по [[8]] населения (8230 человек на квадратный километр).'
  options:
  - автобус
  - вода
  - воздух
  - метро
  - общественный
  - платёж
  - плотность
  - престиж
  - самокат
  - самостоятельность
  - система
  - социальный
  - транспортный
  - уровень
  - устойчивость
  - экономический
  correct:
    '1': 13
    '2': 3
    '3': 6
    '4': 4
    '5': 5
    '6': 15
    '7': 14
    '8': 7
  points: 9
  solution: 1 – транспортный; 2 – воздух; 3 – платёж; 4 – метро; 5 – общественный; 6 – устойчивость; 7 – уровень;
    8 – плотность. Пробки связаны с транспортной нагрузкой, выбросы – с воздухом, а число жителей на квадратный
    километр измеряет плотность населения. Форму каждого слова при чтении нужно согласовать с текстом.
- n: 4
  block: matching
  kind: match
  statement: Соотнесите методы регулирования внешней торговли и их характеристики.
  rows:
  - Воздействуют на стоимость импортного товара посредством установления таможенной пошлины.
  - Перераспределяют доходы между потребителями, национальными производителями и государством, обеспечивая бюджету
    поступления от таможенных пошлин.
  - В долгосрочной перспективе способны стимулировать импортёров к инвестициям в адаптацию продукции под национальные
    требования.
  - Позволяют государству создавать дополнительные административные и финансовые сложности для импортёров, снижая
    конкурентоспособность иностранных товаров без прямого запрета на ввоз товаров в страну.
  options:
  - А – тарифные
  - Б – нетарифные
  correct:
    '1': 1
    '2': 1
    '3': 2
    '4': 2
  points: 9
  solution: 'А, А, Б, Б. Тарифные меры используют таможенные пошлины и при наличии импорта дают соответствующие
    бюджетные поступления. Технические требования и административные процедуры относятся к нетарифным мерам. В исходном
    PDF второе описание было слишком общим: перераспределять доходы могут и нетарифные ограничения; в рабочей редакции
    уточнено, что речь идёт о поступлениях от пошлин.


    Редакционные уточнения к PDF: В исходнике перераспределение доходов и влияние на цену не уникальны для тарифов:
    квоты тоже обладают этими эффектами. В двух строках уточнён механизм пошлины.'
- n: 5
  block: number
  kind: number
  statement: 'В межгалактической империи монополист-производитель уникальной пряности, максимизирующий свою прибыль,
    в течение длительного времени поддерживал цену продукта на уровне 100 ден. ед. Однако введение императором нового
    потоварного налога заставило монополиста увеличить цену пряности до 120 ден. ед. Средние издержки производства,
    эластичность спроса по цене и ставка налога постоянны для любого объёма производства и продаж. Определите, сколько
    процентов по отношению к средним издержкам производства составила ставка налога, введённого императором.


    Под средними издержками производства понимаются издержки без нового налога.'
  answer: '20'
  points: 5
  solution: 'При постоянной эластичности и постоянных издержках цена – постоянная наценка к издержкам: P = c · e/(e
    − 1). С налогом P = (c + t) · e/(e − 1), поэтому (c + t)/c = 120/100, t = 0,2c – 20%.


    Редакционные уточнения к PDF: Уточнено, какие средние издержки являются базой сравнения.'
- n: 6
  block: number
  kind: number
  statement: В городе K две совершенно конкурентные фирмы занимаются производством общественного блага – благоустраивают
    парки. Известно, что для благоустройства каждого квадратного метра парка (количество квадратных метров может
    быть не целым числом) любой фирме нужно понести издержки в размере 2 д. е. на оплату труда рабочих; помимо этого,
    фирмам 1 и 2 нужно потратить $q_1^2 + q_1$ и $2q_2^2 + 2q_2$ д. е. на материалы для благоустройства $q_1$ и
    $q_2$ квадратных метров парка соответственно. Какие суммарные издержки фирма 1 понесёт на благоустройство 10
    квадратных метров парка?
  answer: '130'
  points: 5
  solution: 2 · 10 + 10² + 10 = 130.
- n: 7
  block: number
  kind: number
  statement: 'Монополист Владимир производит кроссовки для бега и рассматривает различные варианты увеличения спроса
    на свой товар. Сейчас спрос на кроссовки, которые производит фирма Владимира, составляет $q = 20 - 0{,}8p$,
    где $p$ – рыночная цена пары кроссовок, $q$ – количество пар кроссовок, которое потребители готовы купить при
    цене $p$. Издержки фирмы заданы функцией $TC = 5q$. Для того чтобы увеличить спрос, Владимир обратился в рекламное
    агентство «Солнышко», где ему пообещали увеличение спроса на 25%. За свои услуги рекламное агентство просит
    20% от его новой прибыли. Найдите прибыль Владимира после обращения в агентство, то есть после предоставления
    услуг агентством и после оплаты услуг агентства Владимиром.


    При каждой цене величина спроса увеличивается на 25%. Вознаграждение агентства равно 20% прибыли, рассчитанной
    после рекламы, но до оплаты услуг агентства.'
  answer: '80'
  points: 5
  solution: 'Новый спрос 1,25 · (20 − 0,8p) = 25 − p. MR = 25 − 2q = 5, q = 10, p = 15, прибыль 100; после оплаты
    агентству 20% – 80.


    Редакционные уточнения к PDF: Уточнены сдвиг спроса при каждой цене и база комиссии агентства.'
- n: 8
  block: number
  kind: number
  statement: 'Данил прилетел во Владивосток с небольшим опозданием, и ему срочно нужно попасть на встречу в центре
    города, где его уже ждут коллеги. Существует всего два способа добраться из аэропорта в центр города: поехать
    на такси или на пригородном поезде. Во Владивосток на самолёте помимо Данила летело ещё 299 человек, и им всем
    также необходимо попасть в центр города. Время в пути в зависимости от числа людей на дороге равно $T_1 = 60
    + N_1$, аналогичная зависимость для поезда имеет вид $T_2 = 140$, где $T_i$ – время в пути на такси или поезде,
    а $N_i$ – количество желающих воспользоваться каждым видом транспорта соответственно. Найдите, сколько времени
    Данил будет в пути, если каждый человек хочет быстрее добраться до центра города.


    Рассматривайте равновесное распределение пассажиров. Если после собственного выбора пассажиру требуется одинаковое
    время на такси и на поезде, он выбирает такси. Ответ дайте в минутах.'
  answer: '140'
  points: 5
  solution: 'Люди пересаживаются на такси, пока оно быстрее поезда: равновесие при 60 + N₁ = 140, N₁ = 80. Время
    в пути у всех 140.


    Редакционные уточнения к PDF: При 300 отдельных пассажирах равновесие без правила ничьей допускает 79 или 80
    пассажиров такси и разное время Данила. Уточнено правило ничьей.'
- n: 9
  block: number
  kind: number
  statement: 'Михаил является монополистом на рынке огурцов в своём городе. Цена на этом рынке издавна является
    фиксированной и для продавца, и для покупателей и равна $P_0 = 5$ д. е. Известно, что Михаил может продать любое
    целое количество огурцов от 0 до 10 по своему желанию. Михаил упаковывает все продаваемые огурцы в одну банку
    и самостоятельно доставляет их покупателю. Издержки Михаила на банку равны 3 д. е., а стоимость доставки – 2
    д. е. В прежние годы продаваемое количество огурцов определялось знаком свыше, однако в этом году монополист
    решил взять всё в свои руки и максимизировать получаемую выручку. Чему равна прибыль, полученная монополистом
    в этом году?


    Других издержек, кроме стоимости банки и доставки, нет.'
  answer: '45'
  points: 5
  solution: 'Выручка максимальна при 10 огурцах: 50. Издержки на банку и доставку 5, прибыль 45.


    Редакционные уточнения к PDF: Для вычисления прибыли оговорена полнота перечисленных издержек.'
- n: 10
  block: number
  kind: number
  statement: В некотором городе V на рынке труда действует фирма-монопсонист «Розовый фламинго». Производственная
    функция фирмы имеет вид $Q = 180L - 1{,}5L^2$, где $L$ – количество занятых, $Q$ – выпуск фирмы. Для простоты
    предположим, что цена готовой продукции, выпускаемой фирмой, нормирована к единице. Все работники города V объединились
    в профсоюз. Профсоюз максимизирует фонд оплаты труда, устанавливая заработную плату работникам. Фирма «Розовый
    фламинго» максимизирует прибыль и выбирает уровень занятости, принимая зарплату как заданную. Определите равновесный
    выпуск фирмы «Розовый фламинго».
  answer: '4050'
  points: 5
  solution: 'Фирма нанимает, пока MPL = w: w = 180 − 3L. Профсоюз максимизирует wL = (180 − 3L)L: L = 30, w = 90.
    Выпуск 180 · 30 − 1,5 · 900 = 4050.'
- n: 11
  block: number
  kind: number
  statement: 'На рынке спортивных кроссовок есть 2 группы потребителей: спортсмены, чей совокупный спрос описывается
    функцией $q_d(sport) = 123 - 1{,}5P$, и остальные покупатели, чей совокупный спрос имеет вид $q_d(other) = 442
    - 8{,}5P$. Предложение кроссовок на рынке имеет вид $Q_s = 4P + 19$. Для поддержания стремления домохозяйств
    к спорту была введена дополнительная субсидия на кроссовки для категории «спортсмены». Субсидия составила 2/3
    от стоимости кроссовок для спортсменов. Определите, на сколько изменилась цена кроссовок, уплачиваемая спортсменами
    в равновесии, после введения субсидии. <u>Ответ дайте по модулю.</u>


    Размер субсидии равен двум третям цены, получаемой продавцом; спортсмен оплачивает оставшуюся треть.'
  answer: '25'
  points: 5
  solution: 'До субсидии 565 − 10P = 4P + 19, P = 39. Спортсмены платят P/3: их спрос 123 − 0,5P, равновесие 565
    − 9P = 4P + 19, P = 42, спортсмены платят 14. Изменение 39 − 14 = 25.


    Редакционные уточнения к PDF: Субсидия должна считаться от цены продавца, а не от личных расходов спортсмена.'
- n: 12
  block: number
  kind: number
  statement: В небольшой стране V действует только одна фирма, производящая чугунные сковородки, с функцией общих
    издержек $TC = 2Q^2 - 26Q + 88$, где $Q$ – количество чугунных сковородок в штуках. До 2020 года страна V была
    открытой экономикой, и потребители страны V могли приобретать сковородки на мировом рынке. Мировая цена сковородок
    постоянна и равна 150 денежным единицам за 1 сковородку. Внутренний спрос в стране V на чугунные сковородки
    имеет вид $Q_d = 438 - 2P$. В 2020 году международные границы закрылись, и внутренний спрос на чугунные сковородки
    теперь может удовлетворить только отечественная фирма. На сколько изменилась выручка фирмы после закрытия границ
    в 2020 году? Ответ дайте по модулю.
  answer: 2930,5
  points: 5
  solution: 'В открытой экономике фирма – ценополучатель: 4Q − 26 = 150, Q = 44, выручка 6600. После закрытия она
    монополист: MR = 219 − Q = 4Q − 26, Q = 49, P = 194,5, выручка 9530,5. Разница 2930,5.'
- n: 13
  block: number
  kind: number
  statement: В городе M работает единственная компания по производству чая. Владелец фирмы обладает информацией
    о том, что общие издержки фирмы имеют вид $TC = 0{,}5Q^2 - 14Q + 102$, где $Q$ – количество произведённого чая
    в тоннах. Экономист, работающий в данной фирме, определил, что функция спроса имеет постоянную эластичность
    по цене, по абсолютной величине равную 4. Также в процессе анализа было выявлено, что максимум прибыли достигается
    при производстве и продаже 20 тонн чая. Мэр города решил увеличить объём доходов бюджета и ввёл аккордный налог
    на фирму в размере 4. Определите величину прибыли фирмы в новых экономических условиях.
  answer: '134'
  points: 5
  solution: MC(20) = 20 − 14 = 6, при эластичности 4 цена P = MC · 4/3 = 8. Прибыль 8 · 20 − (200 − 280 + 102) =
