    statement: "Одной из целей устойчивого развития ООН является создание стойкой инфраструктуры, содействие всеохватной и устойчивой индустриализации и инновациям. В Сингапуре реализация этой цели связана в первую очередь с решением [[1]] коллапсов. Быстрый рост населения и числа автомобилей создавал угрозу пробок и загрязнения [[2]].\nГород внедрил систему электронных [[3]] в транспорте и развил сеть подземного [[4]], что позволило сократить нагрузку на дороги. Одновременно с этим стимулировалось использование [[5]] транспорта.\nЭти меры помогли повысить экологическую [[6]] города и обеспечить более высокий [[7]] жизни граждан, но до достижения цели ещё далеко, так как страна занимает второе место по [[8]] населения (8230 человек на квадратный километр)."
