  - n: 5
    block: number
    kind: number
    statement: "В межгалактической империи монополист-производитель уникальной пряности, максимизирующий свою прибыль, в течение длительного времени поддерживал цену продукта на уровне 100 ден. ед. Однако введение императором нового потоварного налога заставило монополиста увеличить цену пряности до 120 ден. ед. Средние издержки производства, эластичность спроса по цене и ставка налога постоянны для любого объёма производства и продаж. Определите, сколько процентов по отношению к средним издержкам производства составила ставка налога, введённого императором."
    answer: "20"
    points: 5
    solution: "При постоянной эластичности и постоянных издержках цена – постоянная наценка к издержкам: P = c · e/(e − 1). С налогом P = (c + t) · e/(e − 1), поэтому (c + t)/c = 120/100, t = 0,2c – 20%."
  - n: 6
    block: number
    kind: number
    statement: "В городе K две совершенно конкурентные фирмы занимаются производством общественного блага – благоустраивают парки. Известно, что для благоустройства каждого квадратного метра парка (количество квадратных метров может быть не целым числом) любой фирме нужно понести издержки в размере 2 д. е. на оплату труда рабочих; помимо этого, фирмам 1 и 2 нужно потратить $q_1^2 + q_1$ и $2q_2^2 + 2q_2$ д. е. на материалы для благоустройства $q_1$ и $q_2$ квадратных метров парка соответственно. Какие суммарные издержки фирма 1 понесёт на благоустройство 10 квадратных метров парка?"
    answer: "130"
    points: 5
    solution: "2 · 10 + 10² + 10 = 130."
  - n: 7
    block: number
    kind: number
    statement: "Монополист Владимир производит кроссовки для бега и рассматривает различные варианты увеличения спроса на свой товар. Сейчас спрос на кроссовки, которые производит фирма Владимира, составляет $q = 20 - 0{,}8p$, где $p$ – рыночная цена пары кроссовок, $q$ – количество пар кроссовок, которое потребители готовы купить при цене $p$. Издержки фирмы заданы функцией $TC = 5q$. Для того чтобы увеличить спрос, Владимир обратился в рекламное агентство «Солнышко», где ему пообещали увеличение спроса на 25%. За свои услуги рекламное агентство просит 20% от его новой прибыли. Найдите прибыль Владимира после обращения в агентство, то есть после предоставления услуг агентством и после оплаты услуг агентства Владимиром."
    answer: "80"
    points: 5
    solution: "Новый спрос 1,25 · (20 − 0,8p) = 25 − p. MR = 25 − 2q = 5, q = 10, p = 15, прибыль 100; после оплаты агентству 20% – 80."
  - n: 8
    block: number
    kind: number
    statement: "Данил прилетел во Владивосток с небольшим опозданием, и ему срочно нужно попасть на встречу в центре города, где его уже ждут коллеги. Существует всего два способа добраться из аэропорта в центр города: поехать на такси или на пригородном поезде. Во Владивосток на самолёте помимо Данила летело ещё 299 человек, и им всем также необходимо попасть в центр города. Время в пути в зависимости от числа людей на дороге равно $T_1 = 60 + N_1$, аналогичная зависимость для поезда имеет вид $T_2 = 140$, где $T_i$ – время в пути на такси или поезде, а $N_i$ – количество желающих воспользоваться каждым видом транспорта соответственно. Найдите, сколько времени Данил будет в пути, если каждый человек хочет быстрее добраться до центра города."
    answer: "140"
    points: 5
    solution: "Люди пересаживаются на такси, пока оно быстрее поезда: равновесие при 60 + N₁ = 140, N₁ = 80. Время в пути у всех 140."
  - n: 9
    block: number
    kind: number
    statement: "Михаил является монополистом на рынке огурцов в своём городе. Цена на этом рынке издавна является фиксированной и для продавца, и для покупателей и равна $P_0 = 5$ д. е. Известно, что Михаил может продать любое целое количество огурцов от 0 до 10 по своему желанию. Михаил упаковывает все продаваемые огурцы в одну банку и самостоятельно доставляет их покупателю. Издержки Михаила на банку равны 3 д. е., а стоимость доставки – 2 д. е. В прежние годы продаваемое количество огурцов определялось знаком свыше, однако в этом году монополист решил взять всё в свои руки и максимизировать получаемую выручку. Чему равна прибыль, полученная монополистом в этом году?"
    answer: "45"
    points: 5
    solution: "Выручка максимальна при 10 огурцах: 50. Издержки на банку и доставку 5, прибыль 45."
  - n: 10
    block: number
    kind: number
    statement: "В некотором городе V на рынке труда действует фирма-монопсонист «Розовый фламинго». Производственная функция фирмы имеет вид $Q = 180L - 1{,}5L^2$, где $L$ – количество занятых, $Q$ – выпуск фирмы. Для простоты предположим, что цена готовой продукции, выпускаемой фирмой, нормирована к единице. Все работники города V объединились в профсоюз. Профсоюз максимизирует фонд оплаты труда, устанавливая заработную плату работникам. Фирма «Розовый фламинго» максимизирует прибыль и выбирает уровень занятости, принимая зарплату как заданную. Определите равновесный выпуск фирмы «Розовый фламинго»."
    answer: "4050"
    points: 5
    solution: "Фирма нанимает, пока MPL = w: w = 180 − 3L. Профсоюз максимизирует wL = (180 − 3L)L: L = 30, w = 90. Выпуск 180 · 30 − 1,5 · 900 = 4050."
  - n: 11
    block: number
    kind: number
    statement: "На рынке спортивных кроссовок есть 2 группы потребителей: спортсмены, чей совокупный спрос описывается функцией $q_d(sport) = 123 - 1{,}5P$, и остальные покупатели, чей совокупный спрос имеет вид $q_d(other) = 442 - 8{,}5P$. Предложение кроссовок на рынке имеет вид $Q_s = 4P + 19$. Для поддержания стремления домохозяйств к спорту была введена дополнительная субсидия на кроссовки для категории «спортсмены». Субсидия составила 2/3 от стоимости кроссовок для спортсменов. Определите, на сколько изменилась цена кроссовок, уплачиваемая спортсменами в равновесии, после введения субсидии. Ответ дайте по модулю."
    answer: "25"
    points: 5
    solution: "До субсидии 565 − 10P = 4P + 19, P = 39. Спортсмены платят P/3: их спрос 123 − 0,5P, равновесие 565 − 9P = 4P + 19, P = 42, спортсмены платят 14. Изменение 39 − 14 = 25."
  - n: 12
    block: number
    kind: number
    statement: "В небольшой стране V действует только одна фирма, производящая чугунные сковородки, с функцией общих издержек $TC = 2Q^2 - 26Q + 88$, где $Q$ – количество чугунных сковородок в штуках. До 2020 года страна V была открытой экономикой, и потребители страны V могли приобретать сковородки на мировом рынке. Мировая цена сковородок постоянна и равна 150 денежным единицам за 1 сковородку. Внутренний спрос в стране V на чугунные сковородки имеет вид $Q_d = 438 - 2P$. В 2020 году международные границы закрылись, и внутренний спрос на чугунные сковородки теперь может удовлетворить только отечественная фирма. На сколько изменилась выручка фирмы после закрытия границ в 2020 году? Ответ дайте по модулю."
    answer: "2930,5"
    points: 5
    solution: "В открытой экономике фирма – ценополучатель: 4Q − 26 = 150, Q = 44, выручка 6600. После закрытия она монополист: MR = 219 − Q = 4Q − 26, Q = 49, P = 194,5, выручка 9530,5. Разница 2930,5."
  - n: 13
    block: number
    kind: number
    statement: "В городе M работает единственная компания по производству чая. Владелец фирмы обладает информацией о том, что общие издержки фирмы имеют вид $TC = 0{,}5Q^2 - 14Q + 102$, где $Q$ – количество произведённого чая в тоннах. Экономист, работающий в данной фирме, определил, что функция спроса имеет постоянную эластичность по цене, по абсолютной величине равную 4. Также в процессе анализа было выявлено, что максимум прибыли достигается при производстве и продаже 20 тонн чая. Мэр города решил увеличить объём доходов бюджета и ввёл аккордный налог на фирму в размере 4. Определите величину прибыли фирмы в новых экономических условиях."
    answer: "134"
    points: 5
    solution: "MC(20) = 20 − 14 = 6, при эластичности 4 цена P = MC · 4/3 = 8. Прибыль 8 · 20 − (200 − 280 + 102) = 138, после аккордного налога 134."
  - n: 14
    block: number
    kind: number
    statement: "В некоторой экономике сумма наличных денег ($C$) составляет 250 млрд руб. Депозиты до востребования ($D$) равны 1000 млрд руб. Норма обязательных резервов ($rr$), установленная Центральным банком, равна 15%; резервов сверх обязательных банки не поддерживают. Определите величину денежного мультипликатора в данной экономике."
    answer: "3,13"
    accepted: ["3,125"]
    points: 5
    solution: "cr = 250/1000 = 0,25; мультипликатор (1 + 0,25)/(0,25 + 0,15) = 3,125, по правилам ввода – 3,13."
  - n: 15
    block: number
    kind: number
    statement: "Долгосрочное совокупное предложение в экономике фиксировано на уровне $Y^* = 1000$. Совокупный спрос задаётся уравнением $Y = 2 · M/P$, где $M = 1000$ – объём денежной массы. Пусть экономика изначально находится в состоянии долгосрочного равновесия. В результате кризиса доверия скорость обращения денег ($V$) в экономике перманентно сократилась в два раза. Если совокупный спрос задаётся уравнением количественной теории денег, а Центральный банк сохраняет денежную массу ($M$) на неизменном уровне, каким будет новый равновесный общий уровень цен в долгосрочном периоде?"
    answer: "1"
    points: 5
    solution: "Сейчас V = 2. После падения V = 1: 1000 = 1000 / P, P = 1."
  - n: 16
    block: number
    kind: number
    statement: "В закрытой экономике функция совокупного потребления домохозяйств имеет вид $C = 200 + 0{,}6Y_d$, где $Y_d$ – располагаемый доход домохозяйств. Валовые автономные инвестиции заданы как $I = 150$, государственные закупки товаров и услуг составляют $G = 100$. Налоги являются аккордными и равны $T = 100$. Трансферты отсутствуют. Правительство увеличивает государственные закупки на 50 с целью сглаживания циклических колебаний. Определите, на сколько изменился равновесный совокупный доход по модулю в результате фискального стимулирования."
    answer: "125"
    points: 5
    solution: "Мультипликатор госзакупок 1/(1 − 0,6) = 2,5, прирост дохода 2,5 · 50 = 125."
  - n: 17
    block: number
    kind: number
    group: 1
    statement: "Начинающий корейский инвестор Чимин анализирует возможности для вложений сроком на 1 год. Сейчас у него есть 456 млн вон. Он рассматривает 2 варианта:\n1) вложить в активы в вонах под ставку 2% в Корее;\n2) конвертировать воны в рубли, вложить в российские рублёвые активы под ставку 18%, а через год конвертировать обратно в воны.\nТекущий курс рубля составляет 17 вон, и Чимин ожидает, что через год он упадёт до 16,5 вон за рубль. Определите, какая из стратегий будет выгоднее. В ответ запишите конечную сумму, которую он получит через год, в млн вон."
    answer: "522,25"
    points: 5
    solution: "В вонах: 456 · 1,02 = 465,12. Через рубли: 456/17 · 1,18 · 16,5 ≈ 522,25 – выгоднее."
  - n: 18
    block: number
    kind: number
    group: 1
    statement: "Используя теорию непокрытого паритета процентных ставок, определите, какой ожидаемый курс рубля через год сделал бы инвестора Чимина безразличным к выбору между двумя стратегиями при условии, что ставки остаются неизменными."
    answer: "14,69"
    points: 5
    solution: "Нужно 456/17 · 1,18 · E = 465,12: E = 465,12 · 17 / (456 · 1,18) ≈ 14,69 вон за рубль."
