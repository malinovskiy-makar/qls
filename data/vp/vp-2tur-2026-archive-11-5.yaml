  statement: 'Две фирмы «Лем» и «Мел», производящие сепульки в стране Альфа, имеют одинаковые технологии производства
    с постоянными средними издержками, равными 1. Функции спроса на продукцию первой и второй фирмы имеют вид $y_1=17-bp_1+p_2$
    и $y_2=17-bp_2+p_1$ соответственно, где $p_1$ и $p_2$ – цены за единицу продукции в д.е. (денежных единицах),
    $y_1$ и $y_2$ – объемы выпуска продукции «Лем» и «Мел». Обе фирмы знают все друг о друге, но, давно враждуя,
    ни за что не готовы объединить свои усилия по выпуску сепулек. Юристы обеих фирм договорились, что директор
    каждой фирмы в условленный час напишет на бумажке цену своей продукции, а затем юристы прилюдно огласят решение
    каждой фирмы. В результате каждая фирма назначила цену своей продукции, равной 4 д.е. Каково должно было быть
    значение параметра $b$, чтобы каждая из фирм не пожалела о своем решении, узнав цену, которую назначила другая
    фирма?


    Высшая проба – 2021/2022'
  answer: '3'
  accepted: []
  solution: При цене соперника 4 прибыль первой фирмы $(p_1-1)(21-bp_1)$. Условие максимума $21+b-2bp_1=0$. При
    $p_1=4$ получаем $21-7b=0$, то есть $b=3$. Вторая производная равна −6, спрос 9 положителен. Из симметрии тот
    же выбор оптимален второй фирме.
