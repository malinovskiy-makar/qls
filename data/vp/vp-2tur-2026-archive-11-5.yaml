  statement: 'Выберите все неверные утверждения о макроэкономических взаимосвязях.


    Высшая проба – 2025'
  options:
  - В краткосрочной перспективе реальный ВВП страны не может быть равен потенциальному ВВП.
  - Реальная ставка в экономике увеличивается при росте номинальной ставки при прочих равных условиях.
  - Во время рецессионного разрыва наблюдаемый реальный ВВП в экономике больше потенциального ВВП.
  - При росте безработицы выше естественного уровня в экономике наблюдается инфляционный разрыв.
  - Шоки, увеличивающие совокупный спрос, способны привести к росту уровня цен в экономике.
  correct:
  - 1
  - 3
  - 4
  solution: 'Неверны пункты 1, 3 и 4. Верны 2 и 5. При неизменной инфляции рост номинальной ставки повышает реальную:
    $1+r=(1+i)/(1+\pi)$. Реальный ВВП может совпасть с потенциальным и в краткосрочном периоде. При рецессионном
    разрыве он ниже потенциального; безработица выше естественной соответствует рецессионному, а не инфляционному
    разрыву. Увеличение совокупного спроса может повышать цены.'
