  statement: Две мастерские выпускают столы и стулья. Первая за месяц может изготовить 90 столов или 45 стульев,
    вторая – 45 столов или 90 стульев. Их границы производственных возможностей линейны. Все ресурсы используются.
    Если вместе необходимо произвести ровно 100 стульев, какое наибольшее число столов можно изготовить? Объёмы
    выпуска в этой модели делимы.
  answer: '70'
  accepted: []
  solution: Стул обходится первой мастерской в 2 стола, второй – в 0,5 стола. Сначала все 90 стульев производит
    вторая мастерская. Ещё 10 стульев выпускает первая, потеряв $20$ столов. Остаётся $90-2\cdot10=70$ столов.
