  statement: Открытая экономика. Выберите все верные утверждения.
  options:
  - Ограничения торговли могут иметь разные последствия для производителей и покупателей.
  - Падение курса национальной валюты может удорожать импорт в национальной валюте.
  - Международная торговля может связывать изменение цен в разных странах.
  - Запрет импорта обязательно увеличивает выбор товаров у потребителя.
  - Сравнительное преимущество и наибольшая абсолютная производительность всегда совпадают.
  correct:
  - 1
  - 2
  - 3
  penalty: true
  solution: 1. Верно. Защита внутреннего производителя может сопровождаться удорожанием для покупателей. 2. Верно.
    При неизменной иностранной цене за валюту приходится платить больше. 3. Верно. Поставки и арбитраж связывают
    рынки. 4. Неверно. Запрет может убрать часть доступных товаров. 5. Неверно. Первое связано с относительными
    затратами, второе – с абсолютными.
  n: 2
