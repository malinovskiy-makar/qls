  block: number
  statement: 'Анна оценивает час своего рабочего времени в 500 рублей. Поездка на автобусе длится 6 часов и стоит
    300 рублей; работать в автобусе нельзя. Поездка на поезде длится 4 часа и стоит 1400 рублей. В поезде предлагают
    платный доступ к интернету: только с ним Анна сможет работать ровно 2 часа из четырёх. Перелёт с дорогой в аэропорт
    занимает 2 часа и стоит 2600 рублей; работать в пути нельзя. Без поездки Анна работала бы всё соответствующее
    время. Она выбирает маршрут с наименьшей суммой денежных расходов и стоимости потерянного рабочего времени.
    Какую наибольшую плату за интернет она готова внести, чтобы поездка на поезде с интернетом была не дороже лучшей
    альтернативы без интернета? Других затрат нет. Ответ дайте в рублях.'
  answer: '900'
  accepted: []
  solution: 'Без интернета полные издержки равны: автобус – $300+6\cdot500=3300$, поезд – $1400+4\cdot500=3400$,
    самолёт – $2600+2\cdot500=3600$. Лучшая альтернатива стоит 3300. Поезд с интернетом при плате $x$ стоит $1400+2\cdot500+x=2400+x$.
    Условие выбора: $2400+x\leq3300$, поэтому максимальная плата – 900 рублей. Сравнивать нужно со всеми маршрутами,
    включая поезд без интернета.'
  n: 6
  points: 6
