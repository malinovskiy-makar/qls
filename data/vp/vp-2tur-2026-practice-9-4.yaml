  statement: Монополист продаёт напиток по цене $P=62-Q$. Первые 13 единиц напитка обходятся по 10 рублей каждая,
    а каждая следующая единица – по 20 рублей. Повышенная стоимость применяется только к единицам сверх 13, а не
    ко всему выпуску. Постоянные издержки равны 20 рублям и возникают даже при нулевом выпуске. Выпуск непрерывен
    и неотрицателен; цена не может быть отрицательной. Определите максимальную прибыль.
  answer: '551'
  accepted: []
  solution: На первом участке $\pi=(62-10)Q-Q^2-20$; его вершина лежит правее 13, поэтому лучший выпуск на этом
    участке – 13. На втором $\pi=(62-20)Q-Q^2+10\cdot13-20$, вершина $Q=21>13$. Прибыль в ней 551, больше прибыли
    в точке 13 и при нулевом выпуске. Это максимум.
  n: 13
  points: 6
  intro: Авторский аналог Weconomics.
