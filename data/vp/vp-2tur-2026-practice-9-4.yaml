  statement: Рынок труда и человеческий капитал. Выберите все верные утверждения.
  options:
  - Повышение квалификации может увеличить производительность работника.
  - При прочих равных рост спроса на труд способен повышать равновесную зарплату.
  - Безработный по экономическому определению – любой человек, не получающий зарплату.
  - Миграция может изменять предложение труда в принимающей стране.
  - Диплом автоматически гарантирует одинаковую зарплату всем выпускникам.
  correct:
  - 1
  - 2
  - 4
  penalty: true
  solution: 1. Верно. Новые навыки могут позволить выполнять работу эффективнее. 2. Верно. При неизменном предложении
    сдвиг спроса вправо повышает равновесную цену труда. 3. Неверно. Нужны готовность и поиск работы; студенты и
    пенсионеры без поиска могут быть вне рабочей силы. 4. Верно. Приезжающие работники пополняют рынок труда. 5.
    Неверно. Зарплаты зависят от множества условий, включая спрос, навыки и опыт.
  n: 1
  points: 4
  intro: Авторский аналог Weconomics.
