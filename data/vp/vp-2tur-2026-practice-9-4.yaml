  statement: Две группы потребителей имеют спрос $Q_1=\max(0,20-P)$ и $Q_2=\max(0,60-P)$. Единственный продавец
    назначает общую цену для обеих групп; ценовая дискриминация запрещена. Его издержки $TC=4Q+20$. Государство
    запретило устанавливать цену ниже 35. Товар и деньги делимы. Какой объём продаж выберет максимизирующий прибыль
    монополист?
  answer: '25'
  accepted: []
  solution: 'При $P\leq20$ совокупный спрос $80-2P$, выше 20 – $60-P$ до исчезновения спроса. Проверяем вершины
