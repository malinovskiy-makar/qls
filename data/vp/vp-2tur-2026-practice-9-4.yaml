  statement: Фирма действует на совершенно конкурентном рынке и принимает рыночную цену 58 как заданную. Её общие
    издержки $TC(Q)=2Q^2+6Q+110$, где $Q$ – непрерывный неотрицательный выпуск. Постоянные издержки возникают даже
