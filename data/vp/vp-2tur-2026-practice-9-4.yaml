  statement: Монополист сталкивается со спросом $P=104-2Q$. Каждая единица труда позволяет произвести 4 единицы
    товара, труд можно делить. Цена единицы труда равна 64. Других переменных издержек нет; постоянные издержки
    равны 30. Какой объём выпуска максимизирует прибыль?
  answer: '22'
  accepted: []
  solution: На единицу товара требуется $1/4$ единицы труда, поэтому $MC=64/4=16$. Предельная выручка $MR=104-4Q$.
    Из $MR=MC$ получаем $Q=22$. Прибыль – строго вогнутая квадратичная функция; постоянные издержки не меняют оптимальный
    выпуск.
  n: 14
  points: 6
  intro: Авторский аналог Weconomics.
