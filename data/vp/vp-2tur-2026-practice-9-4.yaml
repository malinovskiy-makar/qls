  statement: 'У предпринимателя есть 160 тыс. рублей. Он выбирает одно из трёх вложений на год: (1) нанять сотрудника
    с зарплатой 31 тыс. рублей в месяц, получив дополнительную годовую выручку 630 тыс. рублей; (2) купить оборудование
    за 160 тыс. рублей, получить дополнительную выручку 550 тыс. рублей и продать оборудование в конце года за 90
    тыс. рублей; (3) положить 160 тыс. рублей в банк под 15% годовых с ежемесячной капитализацией. Указанная дополнительная
    выручка уже очищена от всех иных расходов. Зарплата выплачивается из текущих поступлений. Выбор сотрудника исключает
    вложение тех же средств в оборудование или депозит. Какова альтернативная стоимость выбора первого варианта?
    Сравнивайте чистый прирост денег за год относительно исходного капитала. Ответ дайте в тыс. рублей, округлив
    до сотых при необходимости.'
  answer: '480'
  accepted: []
  solution: Нужно выбрать лучший из отвергнутых вариантов. Оборудование даёт $550+90-160=480$ тыс. рублей чистого
    прироста. Депозит даёт $160(1+15/1200)^{12}-160\approx25{,}72$. Альтернативная стоимость – 480 тыс. рублей.
    Выгода самого выбранного варианта не является его альтернативной стоимостью.
