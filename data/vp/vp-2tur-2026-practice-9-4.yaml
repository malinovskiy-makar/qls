  statement: На рынке труда спрос задан функцией $L_d=180-4w$, а предложение – $L_s=6w$, где $w$ – зарплата, $L$
    – число работников. Государство ввело обязательную минимальную зарплату выше равновесной. После этого занятость
    уменьшилась на 20 человек; число занятых определяется спросом фирм. Чему равна новая минимальная зарплата?
  answer: '23'
  accepted: []
  solution: До вмешательства $180-4w=6w$, поэтому $w_0=18$, $L_0=108$. Новая занятость $108-20=88$. Из $180-4w=88$
    получаем $w=23$. Предложение при этой зарплате превышает спрос.
