  statement: На закрытом рынке спрос равен $Q_d=180-2P$, предложение отечественных фирм – $Q_s=20+3P$. После открытия
    рынка импортёры готовы поставить любое количество товара по мировой цене 25. Отечественные фирмы сохраняют прежнюю
    функцию предложения. На сколько изменится их выручка после открытия рынка? Если выручка уменьшится, ответ запишите
    со знаком минус.
  answer: '-1337'
  accepted: []
  solution: 'Закрытый рынок: $180-2P=20+3P$, $P_0=32$, $Q_0=116$, $TR_0=3712$. Мировая цена ниже $P_0$; при ней
    спрос превышает отечественное предложение, разницу покрывает импорт. $Q_1=20+3\cdot25=95$, $TR_1=2375$. Изменение
    $2375-3712=-1337$.'
  n: 12
