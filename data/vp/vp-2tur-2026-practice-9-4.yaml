  statement: Выручка мастерской равна 13000 рублей, бухгалтерская прибыль – 2600 рублей. Четверть общих издержек
    составляют постоянные расходы. Переменные издержки состоят только из материалов, сдельной оплаты труда и электроэнергии.
    На электроэнергию приходится четверть переменных издержек, а на материалы тратят вдвое больше, чем на сдельную
    оплату труда. Сколько рублей расходуется на материалы?
  answer: '3900'
  accepted: []
  solution: 'Общие издержки $13000-2600=10400$. Переменные – $3\cdot10400/4=7800$. После электроэнергии остаётся
    $3\cdot7800/4=5850$; материалы составляют две трети этой суммы: $7800\cdot3/4\cdot2/3=3900$.'
