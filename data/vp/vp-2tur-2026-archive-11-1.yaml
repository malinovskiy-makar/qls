  statement: 'В межгалактической империи монополист-производитель уникальной пряности, максимизирующий свою прибыль,
    в течение длительного времени поддерживал цену продукта на уровне 100 ден.ед. Однако введение императором нового
    потоварного налога заставило монополиста увеличить цену пряности до 120 ден. ед. Средние издержки производства,
    эластичность спроса по цене и ставка налога постоянны для любого объема производства и продаж.


    Определите, сколько процентов по отношению к средним издержкам производства составила ставка налога, введенного
    императором.


    Высшая проба – 2022/2023'
  answer: '20'
  accepted: []
  solution: При постоянной эластичности оптимальная цена пропорциональна постоянным предельным издержкам. До налога
    это $c$, после – $c+t$, поэтому $(c+t)/c=120/100=1{,}2$. Отсюда $t/c=0{,}2$, то есть 20%.
