  solution: Лучшая из первых двух альтернатив приносит 598000 рублей. Из $477000+100000(1+r/100)^2=598000$ получаем
    $(1+r/100)^2=1{,}21$. Неотрицательный коэффициент наращения равен 1,1, значит $r=10\%$.
