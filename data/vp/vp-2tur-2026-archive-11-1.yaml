    для фирмы издержками $TC(Q)=Q^2$, где $Q$ – объем дополнительного выпуска.


    Пусть теперь $q_0=14$, но продукция эта быстро портится, и если она не будет продана до конца периода, то фирма
    понесет издержки в размере 4 на ликвидацию каждой из оставшихся на складе единиц. Найдите оптимальный объем
    продаж в этом случае.


    Высшая проба – 2011'
  accepted: []
  solution: 'Если продажи $q\leq14$, дополнительное производство не нужно: $\pi=(20-q)q-4(14-q)=24q-q^2-56$. Максимум
