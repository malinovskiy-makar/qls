    Ожидается, что акции вырастут на 30% за следующий год, а затем (во второй год) еще на 15%.


    2) Разместить все накопления на вклад под 16% годовых с ежегодной капитализацией сроком на 2 года.


    Помимо вышеперечисленных вариантов у Кати есть третья опция – создать собственный бизнес, вложив в него 300000
    руб., а также оставшиеся 100000 руб. положить на вклад под $r$% годовых сроком на 2 года с ежегодной капитализацией.
    В конце второго года Катя сможет продать свой бизнес за 477000 руб., при этом до момента продажи она не будет
    получать никакого дохода. При каком значении ставки процента по вкладу третий вариант принесет такой же доход,
    как и наилучший из первых двух вариантов? Ответ запишите в процентах без указания знака процента.


    Высшая проба – 2025/2026'
