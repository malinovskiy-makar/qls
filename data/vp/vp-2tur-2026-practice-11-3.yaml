  statement: Спрос на товар монополиста имеет постоянную ценовую эластичность по абсолютной величине 5. Средние
    и предельные издержки постоянны и равны 40. После введения налога за каждую проданную единицу фирма сохранила
    положительный выпуск и максимизирует прибыль. Цена выросла на 25 денежных единиц. Какой процент первоначальных
    средних издержек составляет налог? Округлите до сотых при необходимости.
  answer: '50'
  accepted: []
  solution: При постоянной эластичности оптимальная цена $P=\frac{5}{4}MC$. Поэтому прирост цены равен $\frac{5}{4}t$,
    налог $t=25\cdot4/5=20$. Относительно исходных издержек это $20/40\cdot100=50\%$.
  n: 5
