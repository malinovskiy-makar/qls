  statement: 'В упрощённой денежной системе население держит часть денег наличными, а часть – на депозитах. Сумма
    наличных у населения и банковских депозитов образует денежную [[1]]. Сумма наличных и резервов коммерческих
    банков в центральном банке входит в денежную [[2]]. Эти агрегаты различаются: депозит клиента является обязательством
    коммерческого банка, а не дополнительной банкнотой.


    Отношение первого агрегата ко второму называют денежным [[3]]. Его величина зависит от предпочтения наличных,
    требований к резервам и поведения банков. Формула, равная обратной норме обязательных резервов, требует специальных
    упрощающих условий и не должна автоматически применяться при значительной доле наличных.


    Если банки добровольно хранят резервы сверх установленного минимума, такие резервы называют [[4]]. При прочих
    равных их рост ограничивает многократное расширение депозитов на заданной базе. Изменение денежной массы не
    обязательно в той же пропорции меняет текущие расходы: важна также [[5]] обращения денег.


    В уравнении обмена произведение денежной массы и этого показателя равно номинальному [[6]]. Последний можно
    представить как произведение уровня цен и реального выпуска. В долгосрочной модели с фиксированным потенциальным
    выпуском устойчивое увеличение денег при неизменной скорости главным образом отражается в [[7]]. Если в краткосрочном
    периоде цены медленно реагируют на спрос, говорят об их [[8]]; это может допускать временное изменение реального
    выпуска.'
