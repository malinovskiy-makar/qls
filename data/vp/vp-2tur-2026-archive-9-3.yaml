  statement: 'Евдоким получил премию в 30 тыс. рублей, 10 тысяч из которых он потратил на потребление, а оставшиеся
    средства – решил инвестировать. У Евдокима есть возможность положить деньги на депозит в банке «Туманное будущее»
    под ставку 10% годовых, причем выплата по вкладу добавляется к сумме депозита в конце каждого года.


    У Евдокима появилась возможность стать акционером компании «Кава». Известно, что любая вложенная сумма увеличится
    в 1,5 раза спустя три года. Полагая, что у Евдокима есть 20 тысяч купюрами номиналом только в 1000 рублей, какое
    минимальное количество денег необходимо вложить в акции «Кавы», чтобы прибыль от вложения в акции превысила
    заработок по вкладу?


    Сравните прибыль по акциям с процентным доходом от размещения всех 20 000 рублей на депозите на три года.


    Высшая проба – 2024/2025'
  answer: '14000'
  accepted: []
  solution: По вкладу на все 20000 рублей проценты за три года составили бы 6620. Прибыль по акциям равна $0{,}5x$.
    Требуется $0{,}5x>6620$, то есть $x>13240$. Сумма кратна 1000, поэтому минимальное вложение – 14000 рублей.
