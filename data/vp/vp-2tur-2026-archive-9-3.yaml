  statement: 'В мировой экономике существует страна А и страна В. Международная организация, занимающаяся поддержанием
    и укреплением международного мира и безопасности, провела исследование и вывела статистические показатели по
    странам А и В. Известно, что:


    • страна А использует интенсивные факторы экономического роста, принимает усиленные меры по повышению квалификации
    работников и предоставляет своим гражданам сильную систему социальной защиты.


    • страна В развивает свою экономику преимущественно благодаря экстенсивным факторам экономического роста, является
    импортером технологий и услуг технологического характера и имеет низкие государственные расходы на образование
    и здравоохранение.


    Соотнесите статистические показатели и страны, которым они наиболее вероятно характерны.


