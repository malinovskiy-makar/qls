  statement: 'Любимое лакомство гражданина С. – сгущенное молоко. Для того, чтобы полностью удовлетворить свою потребность
    в сладком, С. должен опустошить 5 банок сгущенки (любое другое количество ему неинтересно). У гражданина С.
    есть знакомый фермер Т, который по старой дружбе просит всего лишь 100 рублей за банку сгущенки. Навестить друга
    С. всегда не против, однако дорога до села, в котором живет Т., и обратно занимает 2 часа. Также фермер Т. сотрудничает
    с местной курьерской фирмой, поэтому за дополнительные 500 рублей может отправить нужное количество банок прямо
    до квартиры С. Более того, у С. есть возможность заказать сгущенку, не выходя из дома, где одна банка заветного
    лакомства стоит 125 рублей, но в этом случае ему придется заплатить х рублей за доставку. Известно, за час работы
    дома С. получает 110 рублей.


    Определите экономические издержки С. на покупку сгущенки, если ему дали скидку на доставку в интернет-магазине,
    поэтому доставка будет стоить 90 рублей?


    Высшая проба – 2023/2024'
  answer: '715'
  accepted: []
  solution: Интернет-заказ стоит $5\cdot125+90=715$ рублей. Самостоятельная поездка с учётом времени – 720, доставка
    от фермера – 1000. Минимальные экономические издержки равны 715 рублям.
