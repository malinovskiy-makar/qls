    политику. В 15 веке Англия являлась основным поставщиком необработанных тканей и сырья в европейские страны.
    В конце XV века был введён запрет на [[1]] многих видов необработанного сукна, а позднее запрет распространился
    и на необработанную шерсть. Данные действия могли [[2]] производственные возможности европейских производителей
    готового платья, которые раньше осуществляли [[3]] ткани из Англии. Также эти меры были направлены на стимулирование
    английского производства и защиту [[4]] одежды. Подобные законы и ограничения являются типичными проявлениями
