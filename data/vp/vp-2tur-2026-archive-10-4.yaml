  statement: 'Мистера Дарси, владельца фирмы Эпсилон, обвиняют в финансовых махинациях. У него есть проверенный
    независимой комиссией документ о производстве плюшевых капибар и сурикатиков на заводах А и В в апреле. Однако
    документ оказался испорчен. Мистер Дарси нанял специалиста Нэнси для защиты. К сожалению, других документов
    у мистера Дарси нет. Помоги Нэнси произвести необходимые расчеты для предоставления их в суде.


    По официальным документам была продана партия капибар в размере 620 единиц, произведенных на обоих заводах фирмы
    Эпсилон в апреле. Посчитайте, какое максимальное количество сурикатиков мог произвести завод В.'
  answer: '300'
  accepted: []
