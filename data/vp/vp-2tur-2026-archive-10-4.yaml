  statement: 'Экономист Алексей решил купить у Сергея машину. Алексей сообщает, что готов заплатить 200 тыс. рублей.
    Сергей объявляет начальную цену S тыс. рублей, и начинается торг. Это не первая их сделка, поэтому Сергей знает,
    что каждый раз, когда он предложит снизить цену продажи на x% от изначальной цены (т.е. от S), Алексей увеличит
    цену покупки на x% от своей изначальной цены (все изменения цен спроса и предложения происходят по правилу простых
    процентов). Через 5 таких предложений машина была продана за 300 тыс. рублей. Какую цену S тыс. рублей изначально
    назначил Сергей?


    Высшая проба – 2020/2021'
  answer: '600'
  accepted: []
  solution: 'За пять раундов предложение покупателя выросло с 200 до 300, поэтому $200\cdot5x/100=100$ и $x=10$.
    Продавец за эти раунды снизил исходную цену на 50%: $S(1-0{,}5)=300$. Следовательно, $S=600$ тыс. рублей.'
