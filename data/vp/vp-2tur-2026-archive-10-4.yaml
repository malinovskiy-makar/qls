  statement: 'Банк «Праздничный» с радостью принимает депозиты у населения, начисляет на сумму депозита 5 процентов
    каждые полгода по схеме сложных процентов, а каждый Новый год (в ночь с 31 декабря на 1 января), в честь праздника,
    после начисления процентов добавляет от себя к сумме вклада 1 000 рублей. Богатый Иннокентий утром сразу после
    празднования Нового года пошёл в этот банк и положил на депозит 100 тыс. рублей сроком на три (3) года.


    Сколько рублей будет на счете у Иннокентия через 3 года после открытия вклада? Ответ дайте в целых числах, округлив
    до ближайшего целого.


    Высшая проба – 2022/2023'
  answer: '137328'
  accepted: []
  solution: 'Каждый год два начисления по 5%, затем премия 1000 рублей. После первого года на счёте 111250 рублей,
    после второго – 123653,125 рубля. Через три года сумма равна $100000\cdot1{,}05^6+1000\cdot1{,}05^4+1000\cdot1{,}05^2+1000=137327{,}5703125$.
    При округлении до ближайшего целого получается 137328 рублей.


    В исходном PDF указан ответ 137327 без согласованного правила округления. В этой учебной редакции явно требуется
    округление до ближайшего целого; ключ исправлен по расчёту.'
