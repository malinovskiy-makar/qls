  statement: 'Правительство Справедливой страны решило сократить неравенство в доходах своего населения и ввело
    подоходный налог в размере Х% для каждого жителя, который относится к категории богатых. Собранные с богатых
    налоги равномерно распределяются между всеми жителями, которые относятся к категории бедных. До введения подоходного
    налога в стране было две группы населения – богатые и бедные. Внутри каждой группы все жители страны имеют одинаковые
    доходы. Бедных было в 9 раз больше богатых, а их совокупные доходы в 1,5 раза меньше совокупных доходов богатых.
    Какой подоходный налог (в процентах) был введен для богатых жителей страны, если индекс Джини снизился в 2,5
    раза?


    Высшая проба – 2021/2022'
  answer: '50'
  accepted: []
  solution: 'Доля бедных в населении 0,9, в доходах – $1/(1+1{,}5)=0{,}4$, поэтому исходный Джини 0,5. Нужен новый
    Джини $0{,}5/2{,}5=0{,}2$. При доле налога $t$ бедным достаётся $0{,}4+0{,}6t$, значит $0{,}9-(0{,}4+0{,}6t)=0{,}2$,
    откуда $t=0{,}5$. Порядок групп сохраняется: бедным принадлежит 70% дохода при 90% населения. При смене порядка
    групп Джини не может превысить 0,1, так что второго решения нет.'
