  statement: 'Десятиклассница Катя делает школьную презентацию на тему «Макроэкономическая ситуация в стране X».
    Катя уже включила в презентацию следующую информацию: в стране X в 2024 году размер ВВП составил 3,5 млн у.д.е.
    Государственные закупки составили 1,2 млн у.д.е., а потребительские расходы составили 1/5 часть от ВВП. Размер
    инвестиций составил 1,5 млн у.д.е. Величина экспорта равнялась 700 тыс. у.д.е.


    Кате осталось сделать последние слайды в презентации, описывающие торговый баланс страны X. Помогите Кате закончить
    презентацию и найдите величину импорта в тыс. у.д.е.


    Высшая проба – 2025'
  answer: '600'
  accepted: []
  solution: Считаем в тысячах у.д.е. Потребление $C=3500/5=700$. Из $Y=C+I+G+X-M$ получаем $M=700+1500+1200+700-3500=600$.
    В ответе нужны тысячи, поэтому ответ – 600, а не 600000.
