  statement: 'Экономика первоначально находилась в состоянии полной занятости. Уравнение кривой совокупного спроса
    в исходном состоянии имело вид: $Y=2M/P$, где Y – реальный ВВП, M – денежная масса, P – уровень цен. Краткосрочная
    кривая AS была представлена как P = 1,0, при этом предложение денег составляло 2500. Произошел неблагоприятный
    шок предложения. Новая краткосрочная кривая совокупного предложения приняла вид: P = 1,3. В результате стабилизационной
    политики Центрального банка экономика вернулась к состоянию полной занятости. На сколько процентов Центральный
    банк увеличил предложение денег в экономике?


    Высшая проба – 2009'
  answer: '30'
  accepted: []
  solution: Исходный потенциальный выпуск $Y=2\cdot2500/1=5000$. После шока для этого выпуска при цене 1,3 нужна
    денежная масса $5000\cdot1{,}3/2=3250$. Её рост 30%.
