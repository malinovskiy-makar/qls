  statement: 'Исследователь Игорь Витальевич пишет статью о торговле России и Китая. Он знает, что Россия производит
    сельскохозяйственные товары с меньшими издержками, чем другие страны. Поговорив с коллегами, он также узнал,
    что у Китая есть как абсолютное, так и сравнительное преимущество в производстве микросхем. Какие тезисы из
    его статьи являются экономически верными?


    Рассматривайте стандартную модель торговли двух стран и двух товаров с постоянными альтернативными издержками.
    До торговли обе страны производят оба товара; мировая относительная цена лежит строго между их внутренними относительными
    ценами. Ресурсы между странами не перемещаются.


    Высшая проба – 2025'
  options:
  - Китай будет производить больше микросхем после начала торговли с Россией.
  - России будет выгодно поставлять микросхемы в Китай
  - Россия обладает абсолютным преимуществом в производстве сельскохозяйственных товаров.
  - Если страны начнут активную торговлю, при которой не будет торговых издержек, то Россия не проиграет от появления
    дополнительного рынка сбыта.
  - Китаю будет выгодно открыть в России новые филиалы фирм, где будут производиться микросхемы.
  correct:
  - 1
  - 3
  - 4
  solution: Ключ 1, 3, 4 соответствует стандартной модели торговли на основе сравнительных преимуществ. Китай специализируется
    на микросхемах, а меньшие издержки России в сельском хозяйстве означают абсолютное преимущество. Дополнительная
    возможность торговли без торговых издержек расширяет доступный выбор страны. Из условия не следует выгода экспорта
    российских микросхем или переноса китайского производства в Россию. Указанное в условии преимущество Китая относится
    к производству в Китае, а не автоматически к его зарубежным филиалам.
