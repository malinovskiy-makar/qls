  statement: 'Граждане «Сферграда» любят потреблять сферы. Спрос сферградцев на сферы линеен по цене: при увеличении
    цены на 1 денежную единицу величина спроса падает на 2. При цене 90 денежных единиц и выше граждане «Сферграда»
    не готовы покупать сферы. На рынке сфер покупатели и продавцы не могут единолично влиять на цену, предложение
    описывается функцией $Q_s=P$, где $Q_s$ – величина предложения сфер, $P$ – цена одной сферы. Считайте, что сферы
    абсолютно делимы.


    Правительство «Сферграда» в преддверии выборов осознало, что производство сфер вредит окружающей среде и решило
    ввести потоварный налог на производителя в размере t. Определите, какой налог необходимо установить правительству
    «Сферграда», чтобы максимизировать налоговые сборы.


    Высшая проба – 2024/2025'
  answer: '45'
  accepted: []
  solution: 'При налоге $t$ цена покупателя $P_b=P_s+t$, предложение $Q=P_s$. Спрос даёт $Q=180-2(Q+t)$, значит
    $Q=60-2t/3$. Сборы $t(60-2t/3)$ максимальны в вершине параболы: $t=45$, при этом $Q=30>0$.'
