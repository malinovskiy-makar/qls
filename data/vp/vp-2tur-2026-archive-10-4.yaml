  statement: 'На рынке две группы потребителей численностью 20 и 120 человек. Кривая спроса каждого человека из
    первой группы определяется уравнением $P(Q)=10-2Q$, а каждого человека из второй группы $P(Q)=20-4Q$, где $Q$
    - величина спроса, $P$- цена товара. Рассматривая рыночный спрос, определите, какому значению цены соответствует
