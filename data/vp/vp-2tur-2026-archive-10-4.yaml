  answer: '84000'
  accepted: []
  solution: Рост спроса на доллар при прочих равных повышает его рублёвую цену. Новый курс $70\cdot1{,}2=84$ рубля
    за доллар. Покупка 1000 долларов стоит 84000 рублей.
