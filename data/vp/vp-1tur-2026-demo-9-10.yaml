    statement: "Класс 8Б решил устроить школьную ярмарку, чтобы собрать деньги на поездку в аквапарк. Учитель экономики пообещал: если ярмарка принесёт прибыль не меньше 5000 рублей, школа добавит столько же на поездку. Школьники выбрали главный хит – кексы по секретному рецепту бабушки Маши. За ночь им удалось испечь 200 штук. Себестоимость одного кекса (ингредиенты, упаковка) составляет 20 рублей. Проанализировав цены в магазине, ребята договорить продавать каждый кекс по 50 рублей. Для того, чтобы привлечь больше покупателей, также было принято решение украсить стенд шариками, плакатами и гирляндами, на что потребовалось 1000 рублей. Прямо перед открытием ярмарки ребята не удержались и в честь праздника съели 40 кексов, все остальные кексы продали посетителям. Если ребята хотят получить хотя бы 5000 рублей прибыли, какое минимальное количество кексов им нужно испечь и продать (при тех же ценах и издержках, считая, что на этот раз ребята удержатся от поедания товара)?"
    options:
      - "0."
      - "200."
      - "199."
      - "201."
      - "Нет верного ответа."
