    statement: "В городе проводится ежегодная благотворительная школьная ярмарка. 8 «А» класс организовал стенд с лимонадом, приготовленным по старому семейному рецепту одного из учеников 8 «А». Экономисты-волонтёры заранее оценили поведение покупателей и продавцов лимонада, описав спрос и предложение следующими функциями:\n\n$$Q^d = 100 - 2P$$\n\n$$Q^s = 20 + 3P$$\n\nгде $P$ – цена за стакан (в руб.), $Q$ – количество стаканов. Однако в день ярмарки школьникам не повезло с погодой: с утра начался дождь, стало прохладно, и многие потенциальные покупатели решили взять с собой чай в термосах. Экономисты-волонтёры скорректировали свой прогноз относительно функции спроса: вне зависимости от назначенной цены желающих купить лимонад окажется на 10 человек меньше, чем ожидалось при хорошей погоде. Как изменится объем продаж (по сравнению с равновесным), если в день ярмарки организаторы установят одинаковую для всех участников цену лимонада, равную 20 руб.?"
    options:
      - "0."
      - "10."
      - "12."
      - "14."
      - "Нет верного ответа."
    correct: [3]
    points: 4
