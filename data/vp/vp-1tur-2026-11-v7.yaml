    solution: "Прибыль совершенно конкурентной фирмы максимальна при $P = MC$ (1 верно). Фирма – ценополучатель: если она поднимет цену выше рыночной, покупатели уйдут к другим продавцам того же товара (2 неверно). Экономическая прибыль привлекает в отрасль новые фирмы, предложение растёт, цена падает, и прибыль исчезает (3 верно). В краткосрочном периоде работать с убытком выгоднее, чем закрыться, пока выручка покрывает переменные издержки: так фирма возмещает хотя бы часть постоянных (4 верно). Товар на таком рынке однороден, поэтому реклама марки – не главный способ конкуренции (5 неверно)."
