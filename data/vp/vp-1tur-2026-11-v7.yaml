    solution: "Непредвиденная инфляция обесценивает долг: заёмщик возвращает деньги, на которые можно купить меньше, поэтому он выигрывает, а кредитор проигрывает (5 верно), и реальная тяжесть долга падает, а не растёт (1 неверно). Индексация пенсий хотя бы частично возмещает пенсионерам рост цен (2 верно). Неизменный денежный доход при росте цен покупает всё меньше, так что его получатели проигрывают (3 неверно). Высокая и неустойчивая инфляция мешает предсказывать цены и затраты, поэтому долгосрочное планирование затрудняется, а не облегчается (4 неверно)."
