    statement: "Проект требует вложить сегодня 4500 ден. ед. Через год он принесёт 3600 ден. ед., а через два года – ещё 2880 ден. ед. Ставка процента равна 20% годовых. Чему равна чистая приведённая стоимость проекта?"
    options:
      - "1250"
      - "900"
      - "1980"
      - "500"
      - "Нет верного ответа"
    correct: [4]
    solution: "Приводим поступления к сегодняшнему дню: $3600 / 1{,}2 = 3000$ и $2880 / (1{,}2)^2 = 2880 / 1{,}44 = 2000$. Тогда $NPV = -4500 + 3000 + 2000 = 500$. Без дисконтирования получилось бы $3600 + 2880 - 4500 = 1980$; если второй платёж дисконтировать только на один год – $3000 + 2400 - 4500 = 900$; если по ошибке дисконтировать и сегодняшнее вложение – $5000 - 4500 / 1{,}2 = 1250$."
