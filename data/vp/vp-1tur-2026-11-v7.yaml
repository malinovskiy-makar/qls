    intro: "Решите задачу и выберите один верный ответ из пяти предложенных."
    statement: "Фирма – единственный продавец на рынке. Спрос на её продукцию задан функцией $P = 180 - 3Q$, а общие издержки – функцией $TC = 600 + 30Q$. Фирма выбирает объём выпуска, при котором её прибыль максимальна. Чему равна эта прибыль?"
    options:
      - "1875"
      - "2625"
      - "1275"
      - "1200"
      - "Нет верного ответа"
    correct: [3]
    solution: "Выручка $TR = 180Q - 3Q^2$, предельная выручка $MR = 180 - 6Q$, предельные издержки $MC = 30$. Условие $MR = MC$ даёт $Q = 25$ и $P = 180 - 3 \\cdot 25 = 105$. Прибыль: $105 \\cdot 25 - (600 + 30 \\cdot 25) = 2625 - 1350 = 1275$. Если забыть постоянные издержки, получится 1875; 2625 – это выручка, а не прибыль; 1200 – прибыль при выпуске $Q = 30$, который максимизирует выручку ($MR = 0$), а не прибыль."
