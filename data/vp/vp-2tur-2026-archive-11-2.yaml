  statement: 'В стране N на начало 2006г. государственный долг составлял 50 млрд. рублей, при этом ежегодные процентные
    выплаты составляют 10% от суммы долга на начало года (основная сумма долга не погашается). Правительство использует
    только долговое финансирование дефицита государственного бюджета. В 2006г. объем ВВП в стране N составил 80
    млрд. рублей. В 2007 году ВВП увеличился на 10% .Доходы государственного бюджета в 2006г. и в 2007г. составляли
    25% ВВП. Расходы государственного бюджета с учетом выплат процентов по госдолгу в 2006г. и 2007г. не менялись
    и составляли 40 млрд. рублей в год.

    Определить величину непроцентных расходов бюджета в 2007 г. (в млрд. руб.).


    Высшая проба – 2008'
  answer: '33'
  accepted: []
  solution: В 2006 году доходы $0{,}25\cdot80=20$, дефицит 20 увеличивает долг с 50 до 70. Проценты в 2007 году
    $70\cdot0{,}1=7$. Из общих расходов 40 непроцентные составляют $40-7=33$.
