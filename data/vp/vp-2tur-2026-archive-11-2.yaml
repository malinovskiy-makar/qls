  statement: 'Михаил является монополистом на рынке огурцов в своем городе. Цена на этом рынке издавна является
    фиксированной и для продавца, и для покупателей, и равна $P_0=5$ д.е. Известно, что Михаил может продать любое
    целое количество огурцов от 0 до 10 по своему желанию. Михаил упаковывает все продаваемые огурцы в одну банку
    и самостоятельно доставляет их покупателю. Издержки Михаила на банку равны 3 д.е., а стоимость доставки – 2
    д.е.


    Государство решило ввести налог на беспечного монополиста. Если Михаил продает 5 огурцов и менее, то величина
    налога составляет $T(Q)=Q$, если больше 5 и меньше 9 огурцов, то $T(Q)=15$, где Q – количество огурцов. Если
    же количество огурцов 9 и больше, то налог составляет 60% от прибыли до уплаты этого налога. Какое количество
    огурцов продаст Михаил, если в следующем году он решил максимизировать получаемую прибыль?


    Высшая проба – 2024/2025'
  answer: '8'
  accepted: []
  solution: При $1\le Q\le5$ чистая прибыль $4Q-5$ и максимум 15. При $Q=6,7,8$ прибыль $5Q-20$, максимум 20 при
    $Q=8$. При $Q=9,10$ после 60%-ного налога остаётся $0{,}4(5Q-5)$, то есть 16 и 18. Лучший результат 20 достигается
    при восьми огурцах.
  n: 9
  points: 5
