  statement: 'Предположим, что в мире существует система золотого стандарта. При такой системе любой держатель бумажных
    денег может по первому требованию обменять свои деньги на законодательно определенное количество золота в отделениях
    выпустившего их банка. Единица валюты страны А называется «акс» и имеет фиксированное золотое содержание при
    цене 20 аксов за 1 унцию золота. Единица валюты страны Б называется «бакс» и имеет фиксированное золотое содержание
    при цене 4 бакса за 1 унцию золота.


    Некий миллионер из страны Б имеет 100 млн баксов, а некий банк в стране Б согласен обменивать валюту в любую
    сторону по курсу 6 аксов = 1 баксу.


    Если миллионер обменивает свои баксы на аксы, покупает золото в стране A и привозит его в свою страну, то сколько
    это золото будет стоить в баксах? Ответ дайте в миллионах баксов.


    Высшая проба – 2013'
  answer: '120'
  accepted: []
  solution: После обмена у миллионера $100\cdot6=600$ млн аксов. На них он купит $600/20=30$ млн унций. В стране
    Б золото стоит $30\cdot4=120$ млн баксов. Прибыль от цикла – 20 млн, но вопрос требует итоговую стоимость 120.
