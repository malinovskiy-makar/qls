  statement: 'Мама Макарони хочет сварить 40 порций макарон. Для этого у нее есть кастрюля и сотейник вместимостью
    35 и 20 порций макарон соответственно, которыми она может пользоваться одновременно. Время закипания воды в
    кастрюле составляет 7 минут, в сотейнике – 2 минуты. Время варки пасты в кастрюле – $2s_1$ минут, в сотейнике
    – $3s_2$ минут, где $s_1,s_2$ – это количество порций макарон в кастрюле и сотейнике соответственно.


    Готовится одна загрузка в каждом сосуде; время считается от начала нагрева воды до готовности всех порций.


    Сколько времени будет вариться паста, если мама очень хочет приготовить блюдо как можно быстрее, а сварить необходимо
    50 порций вместо 40?


    Высшая проба – 2024/2025'
  answer: '67'
  accepted: []
  solution: Для 50 порций равенство сроков потребовало бы $s_2=21$, но сотейник вмещает лишь 20. Поэтому оптимальны
    $s_2=20$, $s_1=30$. Сроки 62 и 67 минут; весь заказ будет готов через 67 минут.
