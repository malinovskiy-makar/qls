  statement: 'Поселки Чайка и Донской Лес расположены по соседству. Рынки лапши быстрого приготовления в этих поселках
    являются монопольными, функции годового спроса и годовых общих издержек представлены в таблице. Изначально фирмы,
    продающие товар на двух рынках, принадлежат разным владельцам и максимизируют каждая свою прибыль. Хоть лапша
    быстрого приготовления и производится по разным технологиям, ее качество абсолютно идентично вне зависимости
