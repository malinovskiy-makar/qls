  statement: 'Фирма, изготавливающая матрешки, продает их на совершенно конкурентном рынке по цене 20 евро за штуку.
    Рынок труда, на котором фирма нанимает работников, является также совершенно конкурентным. Заработная плата
    одного работника составляет 480 евро. Существует только четыре способа организации производства матрешек, при
    которых нанимается 5, $L_2$, $L_3$ и $L_4$ работников.

    Средняя и предельная производительность труда заданы в таблице:


    Предельная производительность в каждом столбце – отношение прироста выпуска к приросту числа работников при
    переходе от предыдущего способа. Для первого способа исходные выпуск и число работников равны нулю.'
  accepted: []
  solution: 'Из средней и предельной производительности: $45L_2-210=50(L_2-5)$, поэтому $L_2=8$; $35L_3-360=25(L_3-8)$,
    поэтому $L_3=16$; $30L_4-560=22(L_4-16)$, поэтому $L_4=26$. Прибыли без фиксированных затрат при четырёх способах:
    1800, 3360, 3520 и 3120 евро. Максимальная прибыль равна 3520 евро.'
  answer: '3520'
