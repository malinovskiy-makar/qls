  statement: 'Выберите все НЕверные утверждения.


    Высшая проба – 2023/2024'
  options:
  - Внешнеторговый оборот страны может быть больше совокупного объёма произведённых товаров и услуг в этой стране.
  - Во времена кризиса, как правило, импорт стран, подверженных кризису, снижается.
  - Объем мировой торговли рассчитывается как разница между совокупным объемом мирового экспорта и совокупным объемом
    мирового импорта.
  - Страны всегда самостоятельно на законодательном уровне определяют правила торговли друг с другом в двустороннем
    формате исключительно исходя из своих интересов.
  - 'Международной торговли услугами не существует: например, услуги парикмахера в России (Санкт-Петербург) не могут
    быть проданы в Великобритании (Лондон).'
  correct:
  - 3
  - 4
  - 5
  penalty: true
  solution: Неверны 3, 4 и 5. Экспорт минус импорт – сальдо, а не объём торговли. Международные правила и договоры
    ограничивают односторонний выбор. Услуги продаются международно, в том числе через поездки потребителей. Оборот
    может превышать ВВП, поскольку это разные показатели; кризис обычно снижает импортный спрос.
