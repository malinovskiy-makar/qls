  statement: 'Спрос на товар монополии задается уравнением $Q^d(p) = 8 - 0{,}1p$. По статистике, 10% товара, продаваемого
    этой монополией, потребители сдают обратно и получают назад свои деньги. Сданный товар повторной продаже не
    подлежит.


    Зная это, определите, сколько товара выпустит на рынок для продажи данная фирма, если ее издержки на производство
    $Q$ единиц товара равны $Q^2$?


    Высшая проба – 2011'
  accepted: []
  solution: 'Обратный спрос $p=80-10Q$. После возвратов остаётся 90% выручки, а издержки понесены на весь выпуск:
