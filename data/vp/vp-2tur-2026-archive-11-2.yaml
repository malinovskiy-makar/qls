  statement: 'Пассив баланса коммерческого банка содержит следующие статьи (в млрд. рублей): вклады до востребования
    – 1200; срочные вклады – 400; собственный капитал, в том числе акции – 250. Норма обязательных резервов по вкладам
    до востребования равна 15%, по срочным вкладам равна 10%. Определите сумму, на которую банк сможет увеличить
    свои кредитные возможности, если третья часть вкладов до востребования будет переоформлена на срочные вклады?


    Высшая проба – 2008'
  answer: '20'
  accepted: []
  solution: Переводится $1200/3=400$ млрд вкладов. Норма резервов по ним падает на $0{,}15-0{,}10=0{,}05$. Освободится
    $400\cdot0{,}05=20$ млрд для кредитования. Собственный капитал не относится к вкладам.
