      - "Вырастет на 90 000"
      - "Вырастет на 30 000"
      - "Нет верного ответа"
    correct: [4]
    solution: "Сейчас прибыль: 300 · (2000 − 1200) − 150 000 = 240 000 − 150 000 = 90 000. После снижения цены: 450 · (1800 − 1200) − 150 000 = 270 000 − 150 000 = 120 000, то есть прибыль вырастет на 30 000; аренда от решения не зависит и на изменение прибыли не влияет. Рост выручки на 210 000 – это ещё не рост прибыли. Ответы −60 000 и +90 000 получаются, если учесть только потерю на прежних 300 рюкзаках (по 200 ден. ед.) или только выигрыш от 150 новых (по 600 ден. ед.)."
