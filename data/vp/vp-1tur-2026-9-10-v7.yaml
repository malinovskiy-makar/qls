    statement: "Магазин продаёт 300 рюкзаков в месяц по цене 2000 ден. ед. Закупочная цена рюкзака – 1200 ден. ед., аренда помещения обходится в 150 000 ден. ед. в месяц. Если снизить цену до 1800 ден. ед., продажи вырастут до 450 рюкзаков в месяц. Как изменится месячная прибыль магазина?"
    options:
      - "Снизится на 60 000"
