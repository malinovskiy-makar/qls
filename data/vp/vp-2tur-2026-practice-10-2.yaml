  statement: Автомат продаёт снимки по 120 рублей. Раньше он печатал 500 снимков за неделю без брака, а недельная
    прибыль составляла 20000 рублей. Материалы на один снимок стоят 25 рублей; остальные издержки постоянны. После
    бесплатной замены автомата число заказов выросло на 50%, но доля бракованных снимков стала 40%. Деньги за брак
    возвращают, материал при этом расходуется, повторного заказа нет. Цена, расход материалов на снимок и постоянные
    издержки не изменились. Какова новая недельная прибыль?
  answer: '7750'
  accepted: []
  solution: $FC=(120-25)\cdot500-20000=27500$. Заказов стало 750, из них оплачены 450. Новая прибыль $120\cdot450-25\cdot750-27500=7750$.
