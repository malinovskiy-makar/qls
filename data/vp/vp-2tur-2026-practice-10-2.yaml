  statement: 'В малой стране производят и потребляют ткань. До открытия границ внутренняя равновесная цена была
    выше мировой. После допуска иностранных поставщиков часть внутреннего спроса стала покрываться [[1]]. Местным
    производителям пришлось конкурировать с зарубежными по более низкой цене; положение покупателей могло улучшиться
    благодаря удешевлению товара.


    Правительство рассматривает налог на каждую ввозимую единицу. Такая мера называется импортной [[2]]. При стандартных
    условиях малой страны она повышает внутреннюю цену, сокращает объём ввоза и создаёт поступления в [[3]]. Эти
    поступления нельзя отождествлять со всей выгодой страны: часть потерь покупателей лишь перераспределяется, а
    часть представляет собой чистые потери эффективности.


    Другой инструмент – ограничение количества ввоза, то есть импортная [[4]]. Право ввезти товар может получить
    ценность, которую называют квотной [[5]]. Кому она достанется, зависит от распределения прав на импорт.


    Защита внутреннего производителя от внешней конкуренции относится к политике [[6]]. Она отличается от движения
    к [[7]] торговле, при которой барьеры сокращают. Оценка политики требует учитывать последствия для разных групп
    и возможность [[8]] мер со стороны партнёров: односторонний барьер может вызвать новые ограничения для экспортёров.'
  options:
