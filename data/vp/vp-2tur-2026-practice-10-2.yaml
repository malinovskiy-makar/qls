  solution: 'По всем жителям, учитывая численности групп, $G=\frac{\sum_i\sum_j|y_i-y_j|}{2n\sum_i y_i}=189/590$.
    После ухода богатой группы нужно заново нормировать численность и доходы: $G_1=18/91$. Разность $189/590-18/91=6579/53690$,
