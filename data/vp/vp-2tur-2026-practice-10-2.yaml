  - 3
  - 5
  penalty: true
  solution: 1. Неверно. Даже при положительном капитале может не хватить ликвидности для немедленных выплат. 2.
    Верно. Срочные обязательства вкладчикам и менее ликвидные активы создают разные требования к наличным и к капиталу.
    3. Верно. Большая доля наличности оставляет банкам меньше средств для резервов и депозитного расширения. 4.
    Неверно. Массовые паники предшествовали закрытию банков. 5. Верно. Индивидуальная попытка защитить средства
    увеличивает давление на банк.
