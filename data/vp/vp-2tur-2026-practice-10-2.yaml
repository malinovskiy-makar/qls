  statement: Банковские паники начала 1930-х годов. Выберите все верные утверждения.
  options:
  - Для предотвращения паники в любой момент достаточно положительной разности балансовой стоимости активов и обязательств.
  - Изъятие вкладов в наличные могло ухудшать ликвидность банков даже до признания их неплатёжеспособными.
  - Переход вкладчиков из депозитов в наличность мог ослаблять депозитное расширение при заданной денежной базе.
  - Банковские паники начались только после общенациональных банковских каникул 1933 года.
  - Стремление отдельного вкладчика первым получить наличные могло усиливать общую панику.
  correct:
