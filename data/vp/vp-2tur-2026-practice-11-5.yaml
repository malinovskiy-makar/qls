  statement: Спрос на товар монополиста имеет постоянную ценовую эластичность по абсолютной величине 4. Средние
    и предельные издержки постоянны и равны 50. После введения налога за каждую проданную единицу фирма сохранила
    положительный выпуск и максимизирует прибыль. Цена выросла на 24 денежных единиц. Какой процент первоначальных
    средних издержек составляет налог? Округлите до сотых при необходимости.
  answer: '36'
  accepted: []
  solution: При постоянной эластичности оптимальная цена $P=\frac{4}{3}MC$. Поэтому прирост цены равен $\frac{4}{3}t$,
    налог $t=24\cdot3/4=18$. Относительно исходных издержек это $18/50\cdot100=36\%$.
  n: 5
