  statement: Оценка экологических проектов. Выберите все <strong>неверные</strong> утверждения.
  options:
  - Дисконтирование будущей выгоды и утверждение, что будущая выгода равна нулю, – одно и то же.
  - Если проект снизил прямые выбросы на заводе, его полные выбросы за жизненный цикл обязательно снизились.
  - Неопределённость будущего ущерба может влиять на оценку риска.
  - Рост цены энергии не может влиять на привлекательность утепления здания.
  - Экономическая оценка может сравнивать несколько способов достижения одинаковой экологической цели.
  correct:
  - 1
  - 2
  - 4
  penalty: true
  solution: 1. Неверно. Дисконтирование меняет приведённую стоимость, но не обязательно обнуляет её. 2. Неверно.
    Выбросы могут переместиться к поставщикам или другим этапам. 3. Верно. Распределение возможных последствий имеет
    значение для решения. 4. Неверно. Экономия энергии становится дороже и влияет на окупаемость. 5. Верно. Можно
    искать наименее затратный способ.
  n: 1
