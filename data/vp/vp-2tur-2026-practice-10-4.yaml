  statement: Банковская реформа США 1933 года. Выберите все верные утверждения.
  options:
  - Банковский закон 1933 года связан с созданием Федеральной корпорации страхования депозитов – FDIC.
  - Одним из направлений закона стало разграничение коммерческой и инвестиционной банковской деятельности.
  - Доверие к защите вкладов может уменьшить стимул срочно забирать деньги из опасения потерь.
  - Закон Гласса – Стиголла был принят до биржевого краха 1929 года.
  - Страхование вкладов и предоставление банку краткосрочной ликвидности – один и тот же инструмент.
  correct:
  - 1
  - 2
  - 3
  penalty: true
  solution: 1. Верно. FDIC появилась в рамках реформы банковской системы. 2. Верно. Это характерная особенность
    закона, а не введение единой мировой валюты. 3. Верно. Меняется ожидаемый риск вкладчика; это один из механизмов
    снижения склонности к панике. 4. Неверно. Он относится к 1933 году, то есть к реакции на уже развившийся кризис.
    5. Неверно. Страхование защищает вкладчика при предусмотренном событии; кредит ликвидности обеспечивает банку
    текущие платёжные средства.
