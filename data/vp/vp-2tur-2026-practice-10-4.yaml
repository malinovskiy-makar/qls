  statement: Автомат продаёт снимки по 160 рублей. Раньше он печатал 700 снимков за неделю без брака, а недельная
    прибыль составляла 28000 рублей. Материалы на один снимок стоят 35 рублей; остальные издержки постоянны. После
    бесплатной замены автомата число заказов выросло на 50%, но доля бракованных снимков стала 30%. Деньги за брак
    возвращают, материал при этом расходуется, повторного заказа нет. Цена, расход материалов на снимок и постоянные
    издержки не изменились. Какова новая недельная прибыль?
  answer: '21350'
  accepted: []
  solution: $FC=(160-35)\cdot700-28000=59500$. Заказов стало 1050, из них оплачены 735. Новая прибыль $160\cdot735-35\cdot1050-59500=21350$.
