  statement: 'Для анализа доходов жителей сначала располагают людей от самых бедных к самым богатым. График накопленной
    доли дохода в зависимости от накопленной доли населения называют кривой [[1]]. При полном равенстве он совпадает
    с диагональю, а отклонение от неё связано с коэффициентом [[2]].


    Одинаковое значение среднего дохода не означает одинакового распределения. Важно также различать доход до налогов
    и располагаемый доход. Денежная выплата государства семье без встречной поставки текущего товара или услуги
    относится к [[3]], а не к государственным закупкам.


    При [[4]] налогообложении доля дохода, уплачиваемая в виде налога, растёт с доходом. Такая система вместе с
    социальными выплатами может уменьшать неравенство располагаемых доходов, но результат зависит от конструкции
    программы и поведения людей.


    Границу, основанную на стоимости минимального набора необходимых благ, используют для оценки [[5]] бедности.
    Граница, связанная с типичным доходом общества, характеризует [[6]] бедность. Второй показатель может измениться
    даже при неизменной покупательной способности конкретной семьи.


    Если выплаты сокращаются по мере роста заработка, дополнительные доходы могут частично компенсироваться потерей
    поддержки. Поэтому при проектировании программы учитывают экономические [[7]]. При этом снижение неравенства
    не тождественно росту совокупного [[8]]: распределение и общий объём благ – разные характеристики.'
