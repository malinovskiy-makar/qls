    оборудование по ставке 1,5 млн рублей в год. Предприниматель также должен нанять на год 5 работников с заработной
    платой 30000 рублей в месяц у каждого. Количество зерна, необходимое для производства одного «Нарезного» батона,
    можно купить на рынке за 10 рублей. Обозначим через $Q$ количество батонов, производимых хлебопекарней Ивана
    в год.


    В этом пункте число работников можно выбирать. Предположим, что максимально возможный объем выпуска на хлебопекарне
    Ивана зависит от количества нанятых работников, причем N-ый нанятый работник может произвести не более $70000-(N-1)\cdot3000$
    батонов хлеба в месяц, $N \geq 1$. Сколько работников стоит нанять Ивану при указанных ценах и заработной плате,
    чтобы максимизировать свою прибыль?


    Высшая проба – 2011'
  accepted: []
