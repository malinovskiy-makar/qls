  statement: 'Семья Петровых, состоящая из четырех человек: отца, матери и двух сыновей- школьников – живет в городе
    N. Отец работает на производстве и получает 50 тыс. рублей в месяц до налогообложения. Мать трудится воспитателем
    в детском саду и зарабатывает 30 тыс. рублей до налогообложения. На каждого из сыновей выплачивается ежемесячное
    федеральное пособие в размере 10 тыс. рублей. В то же время один школьник получает городскую стипендию за успехи
    в учебе в размере 5 тыс. рублей в месяц. Отцу семейства поступило предложение о смене работы и переезде в город
    K. В новых условиях его заработная плата до налогообложения пока неизвестна. При этом известно, что мать не
    сможет продолжить работать и будет получать пособие в размере 10 тыс. рублей. Более того, школьник-стипендиат
    потеряет свою ежемесячную выплату, поскольку в городе К не существует программы поддержки талантливой молодежи.


    Считайте, что ставка налога на трудовые доходы в городе N составляет 13%.


    При ставке налога на трудовые доходы 13% в городе К найдите, при какой заработной плате отца на новом месте
    семье будет безразлично, переехать в город К или остаться в городе N. Ответ запишите в тысячах рублей и округлите
    до сотых.


    Высшая проба – 2022/2023'
  answer: 74,25
  accepted: []
  solution: 'До переезда доход семьи: $(50+30)\cdot0{,}87+2\cdot10+5=94{,}6$ тыс. рублей. После переезда: $0{,}87w+10+20$.
    Равенство даёт $w=64{,}6/0{,}87\approx74{,}25$ тыс. рублей.'
