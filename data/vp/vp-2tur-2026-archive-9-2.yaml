  statement: 'Вася выиграл в лотерею 500 000 рублей и решил вложить эту сумму сроком на 3 года. Он рассматривает
    3 альтернативных варианта размещения средств:


    1) Вложить 400 000 рублей в бизнес своего друга Пети. Согласно предварительным расчетам, за первый год бизнес
    полностью окупится, а в каждый из последующих 2 лет будет приносить доход в 12,5% от вложенных изначально средств.
    Оставшиеся 100 000 рублей Вася не будет никуда инвестировать и оставит лежать в банке на беспроцентном счету;


    2) Вложить 500 000 рублей под 6,6% (с ежегодной капитализацией) в Сложный муниципальный банк;


    3) Купить облигации стоимостью 7 000 рублей за штуку. Облигации можно будет погасить через 3 года и получить
    8 000 рублей за каждую. Облигации могут быть только целыми. Остаток средств Вася положит на беспроцентный счет
    в банке.


    Сколько составит располагаемая Васей сумма денег, если он выберет вариант с наибольшей доходностью? Ответ дайте
    в рублях, округлив до сотых.


    Высшая проба – 2022/2023'
  answer: 605677,75
  accepted: []
  solution: 'Бизнес даёт 600 000 рублей. Вклад: $500000\cdot1{,}066^3=605677{,}748$. Облигаций можно купить $\lfloor500000/7000\rfloor=71$,
    остаток 3000; итог $71\cdot8000+3000=571000$. Максимален вклад: 605677,75 рубля.'
