  statement: 'Спрос на премьерный показ нового фильма в кинотеатре «Космос» задан функцией $D(p)=4000-5p$, где p
    – цена одного билета, D(p) – количество купленных билетов. В зрительном зале этого кинотеатра 1500 мест. Ценовая
    дискриминация запрещена: каждый билет должен продаваться по одной и той же цене. При описанных выше условиях:


    Какая цена на билет обеспечит кинотеатру максимальную выручку от реализации билетов на премьерный показ?


    Высшая проба – 2010'
  answer: '500'
  accepted: []
  solution: Без ограничения мест максимум $p(4000-5p)$ достигается при $p=400$, спрос 2000. Вместимость 1500 связывает
    рынок. Цена продажи всех 1500 мест $p=(4000-1500)/5=500$. Ниже этой цены выручка $1500p$ возрастает, выше –
    уменьшается.
