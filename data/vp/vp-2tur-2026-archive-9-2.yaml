  statement: 'Функция краткосрочных общих издержек совершенно конкурентной фирмы имеет вид $TC(Q) = Q^3 - 10Q^2
    + 30Q + 15$, где $Q$-объем произведенной продукции. Найти минимальную цену, при которой совершенно конкурентная
    фирма не прекратит производство в краткосрочном периоде.


    Высшая проба – 2008'
  answer: '5'
  accepted: []
  solution: Средние переменные издержки $AVC=Q^2-10Q+30=(Q-5)^2+5$. Их минимум равен 5 при $Q=5$. При этой цене
    фирма может продолжать выпуск, покрывая переменные затраты.
