  - В результате снижения числа покупателей спрос уменьшится при прочих равных условиях.
  - При увеличении цены на товар величина спроса снижается при прочих равных условиях.
  - Введение потоварного налога приведёт к сдвигу кривой спроса на товар вправо при прочих равных условиях.
