    solution: "4500. Выгодно рассматривать только цены, равные оценкам групп. Прибыль $(P - 20) \\cdot Q$: при $P = 100$ — $80 \\cdot 30 = 2400$, $P = 80$ — $60 \\cdot 60 = 3600$, $P = 70$ — $50 \\cdot 90 = 4500$, $P = 50$ — $30 \\cdot 120 = 3600$, $P = 40$ — $20 \\cdot 150 = 3000$. Максимум 4500 руб. при цене 70."
