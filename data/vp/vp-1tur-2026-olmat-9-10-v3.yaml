    intro: "Решите задачу и выберите один верный ответ из пяти предложенных."
    statement: "Спрос и предложение на рынке заданы функциями $Q_d = 180 - 2P$ и $Q_s = 2P - 20$. Государство ввело потоварный налог на продавцов и собрало в бюджет 1500 руб. Какую минимальную ставку налога (в руб. за единицу) оно могло ввести?"
    options:
      - "10"
      - "20"
      - "40"
      - "50"
      - "Нет верного ответа"
    correct: [5]
    solution: "Нет верного ответа. При налоге $t$ предложение $Q_s = 2(P - t) - 20$. Равновесие: $180 - 2P = 2P - 2t - 20 \\Rightarrow P = 50 + 0{,}5t$, $Q = 80 - t$. Сборы $t(80 - t) = 1500 \\Rightarrow t^2 - 80t + 1500 = 0 \\Rightarrow t = 30$ или $t = 50$. Минимальная ставка — 30 руб., которой среди вариантов нет."
