    block: number
    kind: number
    statement: "Вася выиграл в лотерею 500 000 рублей и решил вложить эту сумму сроком на 3 года. Он рассматривает 3 альтернативных варианта размещения средств:\n1) вложить 400 000 рублей в бизнес своего друга Пети; согласно предварительным расчётам, за первый год бизнес полностью окупится, а в последующие 2 года будет приносить доход в 12,5% от вложенных изначально средств; оставшиеся 100 000 рублей Вася не будет никуда инвестировать и оставит лежать в банке на беспроцентном счету;\n2) вложить 500 000 рублей под 6,6% (с ежегодной капитализацией) в Сложный муниципальный банк;\n3) купить облигации стоимостью 7000 рублей за штуку; облигации можно будет погасить через 3 года и получить 8000 рублей за каждую; облигации могут быть только целыми; остаток средств Вася положит на беспроцентный счёт в банке.\nНайдите, какой суммой (в рублях) Вася будет располагать через 3 года, если он выберет вложить деньги в бизнес своего друга Пети."
    answer: "600000"
    points: 6
    solution: "Бизнес за первый год возвращает 400 000, затем два года по 12,5% от 400 000 = 50 000. Плюс 100 000 на счёте: 400 000 + 100 000 + 100 000 = 600 000."
  - n: 17
    block: number
    kind: number
    statement: "В некотором городе Н-ске есть 2 группы потребителей: взрослые и дети. Спрос взрослых на конфеты задан функцией $Q_a = 150 - 3P$, а спрос детей – $Q_k = 200 - 2P$, где $Q_a$ и $Q_k$ – количество, которое готовы купить взрослые и дети при цене $P$ соответственно. Издержки фирмы-производителя конфет задаются функцией $TC = 40Q + 350$, где $Q$ – объём производства фирмы, а $TC$ – соответствующие издержки. Известно, что фирма максимизирует свою прибыль, действует как монополист на рынке конфет, но не может проводить ценовую дискриминацию. Государство переживает за здоровье зубов своих жителей и вводит минимальную цену в размере 60 золотых монет за килограмм конфет. Цена измеряется в бесконечно делимых золотых монетах, а количество – в килограммах. Каким будет объём продаж конфет в городе Н-ске?"
    answer: "60"
    points: 6
    solution: "Без ограничения монополисту выгоднее продавать только детям: MR = 100 − Q = 40, Q = 60, P = 70, прибыль 1450 (при цене 50 и ниже, когда покупают и взрослые, прибыль не больше 650). Цена 70 выше минимальной 60 – ограничение не действует, продажи 60."
