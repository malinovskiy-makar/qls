    statement: "Предприниматель Артём владеет небольшим кондитерским цехом. У него есть 120 тыс. рублей, которые он готов инвестировать в развитие бизнеса. Он рассматривает два взаимоисключающих варианта инвестирования на ближайший год:\n(1) Нанять дополнительного сотрудника-кондитера. Кондитер будет получать зарплату 35 тыс. рублей в месяц. По расчётам Артёма, благодаря увеличению объёма производства это принесёт цеху дополнительную выручку в 580 тыс. рублей за год.\n(2) Купить новую многофункциональную печь. Современное оборудование стоит ровно 120 тыс. рублей и полностью окупится за год. По оценкам, новая печь позволит сэкономить на электроэнергии и сократить время приготовления продукции, что принесёт дополнительную выручку в размере 500 тыс. рублей за год. По истечении года печь планируется продать за 80 тыс. рублей.\nАртём также знает, что мог бы просто положить эти деньги на депозит в банке под 10% годовых с ежемесячной капитализацией.\nРассчитайте альтернативную стоимость (в тыс. рублей за год) выбора варианта с наймом сотрудника-кондитера."
    answer: "460"
    points: 6
    solution: "Альтернативная стоимость – выгода лучшего из отвергнутых вариантов. Печь: 500 + 80 − 120 = 460. Депозит: около 12,7. Лучший отвергнутый – печь, 460."
  - n: 12
