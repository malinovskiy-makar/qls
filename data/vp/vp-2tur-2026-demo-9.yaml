    statement: "В стране Канелле билет на поезд из точки А в точку Б стоит 100 денежных единиц, а билет на самолёт – 1500 денежных единиц. Поездка и на поезде, и на самолёте занимает 2 часа. Однако в поезде на протяжении всей поездки пассажиры могут пользоваться интернетом за дополнительную плату, а на самолёте использование интернета недоступно. Использование интернета в пути позволяет Матвею работать удалённо. Фрилансеру Матвею, которому для работы необходим интернет, нужно добраться из точки А в точку Б. Считайте, что при одинаковых экономических выгодах от поездки на поезде и поездки на самолёте Матвей выберет поездку на поезде. Матвей в час зарабатывает 1000 денежных единиц. Какую максимальную сумму он согласится заплатить за пользование интернетом (за час) при выборе поездки на поезде?"
    answer: "1700"
    points: 6
    solution: "Поезд с интернетом: расходы 100 + 2x, заработок 2000. Самолёт: расходы 1500. Поезд не хуже, пока 100 + 2x − 2000 ≤ 1500, то есть x ≤ 1700."
  - n: 7
    block: number
    kind: number
    statement: "В стране МьюзикЛэнд местные жители очень любят музыку, поэтому каждый второй житель работает в музыкальной сфере, а остальные не работают вообще. Рыночный спрос на труд в музыкальной сфере имеет вид $L_d = 120 - 2w$, а рыночное предложение задаётся функцией $L_s = 3w - 30$, где $L$ – количество сотрудников музыкальной сферы, $w$ – ставка заработной платы. Правительство установило минимальную заработную плату в музыкальной сфере МьюзикЛэнда. Однако это привело к тому, что 50 местных жителей потеряли работу. Найдите величину минимальной заработной платы в музыкальной сфере, установленную правительством."
    answer: "55"
    points: 6
    solution: "Равновесие: 120 − 2w = 3w − 30, w = 30, L = 60. Работу потеряли 50 человек – занятых осталось 10: 120 − 2w = 10, w = 55."
  - n: 8
    block: number
    kind: number
    statement: "Пусть в некоторой стране проживают два кролика: Лютик и Одуванчик. Оба кролика владеют личными огородами и могут выращивать на них только два товара: капусту и морковку. Будем считать, что Лютик может вырастить или 20 штук морковок и ни одного кочана капусты, или 10 кочанов капусты и ни одной морковки. Одуванчик же выращивает или 25 штук морковок и ни одного кочана капусты, или же 50 кочанов капусты и ни одной морковки. Предположим, что кролики по-соседски решили объединить огороды и теперь вместе выращивают капусту и морковку. Сколько будет выращено кочанов капусты, если Лютик и Одуванчик совместно вырастили 25 морковок?"
    answer: "40"
    points: 6
    solution: "Морковь дешевле у Лютика (полкочана за морковку против двух у Одуванчика). Лютик даёт 20 морковок, Одуванчик – оставшиеся 5, отказываясь от 10 кочанов: капусты 50 − 10 = 40."
