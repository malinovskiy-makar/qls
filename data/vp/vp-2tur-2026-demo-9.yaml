    solution: "Закрытый рынок: 25 + 3P = 100 − 2P, P = 15, Q = 70, выручка 1050. Открытый: при цене 12 отечественные продают 61, выручка 732. Изменение −318."
  - n: 13
    block: number
    kind: number
    statement: "В маленьком городке возле озера открылось первое и единственное кафе «Лягушка». Владелец кафе продаёт лимонад. Спрос горожан на лимонад описывается функцией $Q = 120 - 2P$, где $Q$ – количество стаканов лимонада, $P$ – цена за стакан лимонада в рублях. Фиксированные издержки производства лимонада составляют 100. Функция предельных затрат имеет вид: $MC = 10$ при $Q < 40$ и $MC = 12$ при $Q ≥ 40$. Определите значение максимальной прибыли владельца кафе."
    answer: "1052"
    accepted: ["1132"]
    points: 6
    solution: "MR = 60 − Q. На участке Q ≥ 40 MR = 12 при Q = 48, цена 36, выручка 1728. Ключ ВШЭ (1052) считает издержки 12 на каждый из 48 стаканов: 1728 − 576 − 100. Если 12 – это издержки только стаканов сверх 40, издержки 400 + 96 = 496 и прибыль 1132. Засчитываем оба ответа."
  - n: 14
    block: number
    kind: number
    statement: "В посёлке Акив действует единственная фирма, которая производит и продаёт гранатовый сок. Один работник может произвести 5 бутылок гранатового сока. Работа эта несложная, поэтому фирма может нанять любое количество работников с одинаковой производительностью. Других факторов производства помимо труда у фирмы нет. Стоимость оплаты труда одного работника составляет 100 денежных единиц. Спрос на гранатовый сок в посёлке Акив задаётся функцией $P_d = 1220 - Q$, где $P$ – цена за бутылку сока, $Q$ – количество бутылок гранатового сока в штуках. Сколько гранатового сока произведёт фирма, если она максимизирует прибыль?"
    answer: "600"
    points: 6
    solution: "Издержки на бутылку 100 / 5 = 20. MR = 1220 − 2Q = 20, Q = 600."
