    statement: "Фирма «На все случаи жизни» производит открытки ручной работы. Затраты на производство состоят только из поштучной заработной платы мастерам, расходов на материалы и расходов на аренду помещения. В прошлом году затраты на заработную плату мастерам были равны расходам на материалы, при этом переменные затраты превышали постоянные в 5 раз. За предыдущий год фирма произвела 10 000 открыток и продала каждую за 100 рублей, а её прибыль составила 400 000 денежных единиц. Найдите, сколько в прошлом году фирма «На все случаи жизни» потратила на материалы."
