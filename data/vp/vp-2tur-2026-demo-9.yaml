  statement: 'Вася выиграл в лотерею 500 000 рублей и решил вложить эту сумму сроком на 3 года. Он рассматривает
    3 альтернативных варианта размещения средств:

    1) вложить 400 000 рублей в бизнес своего друга Пети; согласно предварительным расчётам, за первый год бизнес
    полностью окупится, а в каждый из последующих 2 лет будет приносить доход в 12,5% от вложенных изначально средств;
    оставшиеся 100 000 рублей Вася не будет никуда инвестировать и оставит лежать в банке на беспроцентном счету;

    2) вложить 500 000 рублей под 6,6% (с ежегодной капитализацией) в Сложный муниципальный банк;

    3) купить облигации стоимостью 7000 рублей за штуку; облигации можно будет погасить через 3 года и получить
    8000 рублей за каждую; облигации могут быть только целыми; остаток средств Вася положит на беспроцентный счёт
    в банке.

    Найдите, какой суммой (в рублях) Вася будет располагать через 3 года, если он выберет вложить деньги в бизнес
    своего друга Пети.'
  answer: '600000'
  points: 6
  solution: 'Бизнес за первый год возвращает 400 000, затем два года по 12,5% от 400 000 = 50 000. Плюс 100 000
    на счёте: 400 000 + 100 000 + 100 000 = 600 000.


    Редакционные уточнения к PDF: Явно указано, что доход 12,5% выплачивается каждый год, как предполагает ключ.'
