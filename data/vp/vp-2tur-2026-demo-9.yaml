    statement: "Предложение на рынке плюшевых мишек задано функцией $Q_s = 25 + 3P$ для любой неотрицательной цены $P$ (в денежных единицах). Рыночный спрос можно описать функцией $Q_d = 100 - 2P$. Государство отменило политику протекционизма, разрешив иностранным производителям игрушек поставлять свои товары на национальные рынки. Теперь иностранный сектор готов предложить любое количество мишек по цене 12 денежных единиц за штуку. Найдите, на сколько изменилась выручка отечественных продавцов по сравнению с ситуацией закрытого рынка. (Если выручка сократилась, поставьте знак «-» перед числовым ответом.)"
    answer: "-318"
