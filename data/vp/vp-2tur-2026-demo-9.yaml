- n: 1
  block: multi
  kind: multi
  statement: Укажите все верные утверждения, касающиеся экономической географии и классификации стран по уровню
    развития.
  options:
  - В развивающихся странах преобладает сфера услуг, составляющая более 70% экономики.
  - Доступность природных ресурсов – один из важнейших факторов при выборе локации для размещения производства.
  - Горная рента возникает при добыче полезных ископаемых.
  - Политическая нестабильность характерна в первую очередь для развитых стран, а не для развивающихся.
  - Богатые природными ресурсами страны всегда становятся развитыми.
  correct:
  - 2
  - 3
  points: 4
  penalty: true
  solution: Верны утверждения 2 и 3. Ресурсы влияют на размещение производства, а горная рента возникает в добывающих
    отраслях. Доля услуг свыше 70% не является общей чертой развивающихся стран. Политическая нестабильность и богатство
    ресурсами сами по себе не определяют принадлежность к развитым странам.
- n: 2
  block: multi
  kind: multi
  statement: Выберите все верные утверждения о мировом хозяйстве и роли торговли в мировой экономике.
  options:
  - Иногда протекционизм помогает развивать новые отрасли и сохранять рабочие места, но при этом приводит к росту
    цен на товары.
  - Внешняя торговля создаёт исключительно положительные эффекты для международного рынка и экономического развития
    стран.
  - Международная торговля способствует ускорению научно-технического прогресса.
  - Международная торговля снижает уровень зависимости стран друг от друга.
  - Членство в ВТО запрещает стране использовать какие-либо импортные пошлины.
  correct:
  - 1
  - 3
  points: 4
  penalty: true
  solution: 'Верны утверждения 1 и 3. Защита внутреннего рынка может поддержать отдельные отрасли и занятость, но
    ограничение конкуренции может повысить цены. Торговля распространяет технологии, создаёт и выгоды, и издержки
    адаптации, а также взаимозависимость стран. ВТО регулирует применение пошлин и обязательства по их ставкам,
    а не запрещает все пошлины.


    Редакционные уточнения к PDF: В PDF смешаны идеальный принцип свободной торговли и юридический запрет. Формулировка
    про ВТО делает ложность пункта однозначной, ключ 1 и 3 сохранён.'
- n: 3
  block: multi
  kind: multi
  statement: Проанализируйте представленные ниже суждения о принципах устойчивого развития и возобновляемой энергетики.
    Выберите все верные суждения.
  options:
  - Переход на возобновляемые источники энергии не влияет на положение работников, занятых в сфере устойчивого развития.
  - Устойчивое развитие исключает экономический рост в пользу сохранения природных ресурсов.
  - Суть «зелёного» потребления заключается в том, чтобы стимулировать экономический рост за счёт увеличения потребления
    и производства.
  - Солнечные батареи и ветряные электростанции являются примерами технологий, использующих возобновляемые источники
    энергии.
  - «Зелёное» потребление подразумевает осознанный выбор или частичный отказ от товаров, произведённых с использованием
    невозобновляемых ресурсов.
  correct:
  - 4
  - 5
  points: 4
  penalty: true
  solution: Верны утверждения 4 и 5. Солнце и ветер – возобновляемые источники энергии. Осознанное потребление учитывает
    использование ресурсов. Энергопереход меняет спрос на труд; устойчивое развитие сочетает экономические, социальные
    и экологические цели, а не требует отказа от любого роста или увеличения любого потребления.
- n: 4
  block: gaptext
  kind: match
  intro: Заполните пропуски в тексте. Форма слова из списка может не совпадать с формой, которую требуют правила
    русского языка.
  statement: 'Кризис в Аргентине, начавшийся в 1999 году, стал одним из самых разрушающих для экономики Латинской
    Америки. В течение десятилетия курс песо был жёстко привязан к доллару США, что сделало страну крайне уязвимой
    к внешним шокам. Это постепенно лишило государство [[1]] на мировых рынках: аргентинские товары становились
    слишком дорогими для экспорта, что приводило к значительному снижению спроса. Для покрытия расходов правительство
    активно занимало деньги за рубежом, что привело к хроническому [[2]] бюджета. Когда доверие инвесторов рухнуло,
    начался стремительный [[3]] капитала, ослабивший финансовую систему. Банки столкнулись с большими проблемами
    с [[4]], что вызвало заморозку долларовых вкладов граждан и массовые протесты, известные как «Argentinazo»,
    или «Аргентинское побоище». Кульминацией кризиса стало объявление крупнейшего в истории страны [[5]] по государственным
    обязательствам.'
  options:
  - банкротство
  - дефицит
  - дефолт
  - инфляция
  - капитализация
  - конкурентоспособность
  - ликвидность
  - отток
  - приток
  - профицит
  correct:
    '1': 6
    '2': 2
    '3': 8
    '4': 7
    '5': 3
  points: 8
  solution: 1 – конкурентоспособность; 2 – дефицит; 3 – отток; 4 – ликвидность; 5 – дефолт. Дорогой экспорт теряет
    конкурентоспособность; нехватка бюджетных доходов означает дефицит. Вывод средств – отток капитала; невозможность
    своевременно выплатить деньги связана с ликвидностью, а неисполнение долговых обязательств – дефолт.
- n: 5
  block: matching
  kind: match
  statement: Определите, в ВВП какой страны – России или Китая – будет учтено описанное производство товара (он
    подчеркнут).
  rows:
  - Китайская компания по производству <u>оборудования</u> открыла завод в Татарстане. Ключевые сотрудники – китайцы.
    Выпускаемая продукция пользуется высоким спросом не только на внутреннем рынке, но и успешно экспортируется
    в Китай.
  - Китайский завод закупает российские ягоды, которые собирают в Краснодаре и обрабатываются там же. На китайском
    заводе производят популярные в СНГ <u>батончики</u> с пометкой, что ягоды из России.
  - Художник из Санкт-Петербурга написал <u>картину</u> маслом дома, затем он продал её через аукционный дом в Пекине
    китайскому коллекционеру, который в свою очередь перепродал модной выставке в Шанхае.
  - Китайский музыкант, постоянно живущий и выступающий в Китае, провёл <u>платный онлайн-концерт</u> отдельно для
    своих фанатов из России, куда могли попасть только россияне, заплатив за доступ юанями через китайскую платформу.
  options:
  - А – ВВП России
  - Б – ВВП Китая
  correct:
    '1': 1
    '2': 2
    '3': 1
    '4': 2
  points: 8
  solution: 'А, Б, А, Б. Учитывается место производства, а не гражданство владельцев, валюта оплаты или страна покупателя.
    Оборудование и картина произведены в России; батончики и онлайн-концерт – в Китае. Перепродажа уже созданной
    картины не означает повторного производства картины.


    Редакционные уточнения к PDF: Уточнены производство оборудования и место производства услуги: гражданство исполнителя
    само по себе не определяет ВВП.'
- n: 6
  block: number
  kind: number
  statement: 'В стране Канелле билет на поезд из точки А в точку Б стоит 100 денежных единиц, а билет на самолёт
    – 1500 денежных единиц. Поездка и на поезде, и на самолёте занимает 2 часа. Однако в поезде на протяжении всей
    поездки пассажиры могут пользоваться интернетом за дополнительную плату, а на самолёте использование интернета
    недоступно. Использование интернета в пути позволяет Матвею работать удалённо. Фрилансеру Матвею, которому для
    работы необходим интернет, нужно добраться из точки А в точку Б. Считайте, что при одинаковых экономических
    выгодах от поездки на поезде и поездки на самолёте Матвей выберет поездку на поезде. Матвей в час зарабатывает
    1000 денежных единиц. Какую максимальную сумму он согласится заплатить за пользование интернетом (за час) при
    выборе поездки на поезде?


    В этой задаче Матвей выбирает только между поездом с интернетом на все два часа и самолётом. Поездку на поезде
    без интернета он не рассматривает.'
  answer: '1700'
  points: 6
  solution: 'Поезд с интернетом: расходы 100 + 2x, заработок 2000. Самолёт: расходы 1500. Поезд не хуже, пока 100
    + 2x − 2000 ≤ 1500, то есть x ≤ 1700.


    Редакционные уточнения к PDF: Ключ 1700 требует исключить третий вариант – поезд без интернета.'
- n: 7
  block: number
  kind: number
  statement: В стране МьюзикЛэнд местные жители очень любят музыку, поэтому каждый второй житель работает в музыкальной
    сфере, а остальные не работают вообще. Рыночный спрос на труд в музыкальной сфере имеет вид $L_d = 120 - 2w$,
    а рыночное предложение задаётся функцией $L_s = 3w - 30$, где $L$ – количество сотрудников музыкальной сферы,
    $w$ – ставка заработной платы. Правительство установило минимальную заработную плату в музыкальной сфере МьюзикЛэнда.
    Однако это привело к тому, что 50 местных жителей потеряли работу. Найдите величину минимальной заработной платы
    в музыкальной сфере, установленную правительством.
  answer: '55'
  points: 6
  solution: 'Равновесие: 120 − 2w = 3w − 30, w = 30, L = 60. Работу потеряли 50 человек – занятых осталось 10: 120
    − 2w = 10, w = 55.'
- n: 8
  block: number
  kind: number
  statement: 'Пусть в некоторой стране проживают два кролика: Лютик и Одуванчик. Оба кролика владеют личными огородами
    и могут выращивать на них только два товара: капусту и морковку. Будем считать, что Лютик может вырастить или
    20 штук морковок и ни одного кочана капусты, или 10 кочанов капусты и ни одной морковки. Одуванчик же выращивает
    или 25 штук морковок и ни одного кочана капусты, или же 50 кочанов капусты и ни одной морковки. Предположим,
    что кролики по-соседски решили объединить огороды и теперь вместе выращивают капусту и морковку. Какое максимальное
    число кочанов капусты можно вырастить, если Лютик и Одуванчик совместно вырастили 25 морковок?


    Альтернативные издержки у каждого кролика постоянны.'
  answer: '40'
  points: 6
  solution: 'Морковь дешевле у Лютика (полкочана за морковку против двух у Одуванчика). Лютик даёт 20 морковок,
    Одуванчик – оставшиеся 5, отказываясь от 10 кочанов: капусты 50 − 10 = 40.


    Редакционные уточнения к PDF: Крайние точки сами по себе не задают КПВ; вопрос должен требовать максимум.'
- n: 9
  block: number
  kind: number
  statement: Фирма «На все случаи жизни» производит открытки ручной работы. Затраты на производство состоят только
    из поштучной заработной платы мастерам, расходов на материалы и расходов на аренду помещения. В прошлом году
    затраты на заработную плату мастерам были равны расходам на материалы, при этом переменные затраты превышали
    постоянные в 5 раз. За предыдущий год фирма произвела 10 000 открыток и продала каждую за 100 рублей, а её прибыль
    составила 400 000 денежных единиц. Найдите, сколько в прошлом году фирма «На все случаи жизни» потратила на
    материалы.
  answer: '250000'
  points: 6
  solution: 'Выручка 1 000 000, издержки 600 000 = FC + 5FC, FC = 100 000, переменные 500 000 пополам между зарплатой
    и материалами: 250 000.'
- n: 10
  block: number
  kind: number
  statement: 'Команда «Лунороботы» из школьного технопарка делает мини-роботов для соревнований и продажи на школьных
    ярмарках. Руководитель решил: в течение недели команда может собрать от 0 до 9 роботов (по моральным соображениям
    команда не хочет выпускать частичные, дробные роботы – только целые). Он попросил знакомого аналитика составить
    прогнозы предельной выручки и предельных издержек при разных объёмах производства, чтобы принять решение о недельном
    плане выпуска роботов. Прогнозы аналитика представлены в таблице ниже.

    Какую прибыль получит команда при оптимальном объёме, если постоянные издержки равны нулю?'
  table_html: <table><thead><tr><th>Количество роботов</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr></thead><tbody><tr><td>Предельная
    выручка</td><td>–</td><td>100</td><td>95</td><td>90</td><td>85</td><td>80</td><td>75</td><td>70</td><td>65</td><td>60</td></tr><tr><td>Предельные
    издержки</td><td>–</td><td>105</td><td>95</td><td>80</td><td>50</td><td>30</td><td>40</td><td>60</td><td>80</td><td>100</td></tr></tbody></table>
  answer: '135'
  points: 6
  solution: 'Прибыль от каждого следующего робота (MR − MC): −5, 0, 10, 35, 50, 35, 10, −15, −40. Накопленная прибыль
    максимальна на 7 роботах: −5 + 0 + 10 + 35 + 50 + 35 + 10 = 135.'
- n: 11
  block: number
  kind: number
  statement: 'Предприниматель Артём владеет небольшим кондитерским цехом. У него есть 120 тыс. рублей, которые он
    готов инвестировать в развитие бизнеса. Он рассматривает два взаимоисключающих варианта инвестирования на ближайший
    год:

    (1) Нанять дополнительного сотрудника-кондитера. Кондитер будет получать зарплату 35 тыс. рублей в месяц. По
    расчётам Артёма, благодаря увеличению объёма производства это принесёт цеху дополнительную выручку в 580 тыс.
    рублей за год.

    (2) Купить новую многофункциональную печь. Современное оборудование стоит ровно 120 тыс. рублей и полностью
    окупится за год. По оценкам, новая печь позволит сэкономить на электроэнергии и сократить время приготовления
    продукции, что принесёт дополнительную выручку в размере 500 тыс. рублей за год. По истечении года печь планируется
    продать за 80 тыс. рублей.

    Артём также знает, что мог бы просто положить эти деньги на депозит в банке под 10% годовых с ежемесячной капитализацией.

    Рассчитайте альтернативную стоимость (в тыс. рублей за год) выбора варианта с наймом сотрудника-кондитера.


    Указанные дополнительные поступления от печи уже учитывают экономию расходов. Других дополнительных доходов
    и расходов, кроме перечисленных, нет.'
  answer: '460'
  points: 6
  solution: 'Альтернативная стоимость – выгода лучшего из отвергнутых вариантов. Печь: 500 + 80 − 120 = 460. Депозит:
    около 12,7. Лучший отвергнутый – печь, 460.


    Редакционные уточнения к PDF: Выручка и экономия в исходнике смешаны; обозначены границы модели.'
- n: 12
  block: number
  kind: number
  statement: Предложение на рынке плюшевых мишек задано функцией $Q_s = 25 + 3P$ для любой неотрицательной цены
    $P$ (в денежных единицах). Рыночный спрос можно описать функцией $Q_d = 100 - 2P$. Государство отменило политику
    протекционизма, разрешив иностранным производителям игрушек поставлять свои товары на национальные рынки. Теперь
    иностранный сектор готов предложить любое количество мишек по цене 12 денежных единиц за штуку. Найдите, на
    сколько изменилась выручка отечественных продавцов по сравнению с ситуацией закрытого рынка. (Если выручка сократилась,
    поставьте знак «-» перед числовым ответом.)
  answer: '-318'
  points: 6
  solution: 'Закрытый рынок: 25 + 3P = 100 − 2P, P = 15, Q = 70, выручка 1050. Открытый: при цене 12 отечественные
    продают 61, выручка 732. Изменение −318.'
- n: 13
  block: number
  kind: number
  statement: 'В маленьком городке возле озера открылось первое и единственное кафе «Лягушка». Владелец кафе продаёт
    лимонад. Спрос горожан на лимонад описывается функцией $Q = 120 - 2P$, где $Q$ – количество стаканов лимонада,
    $P$ – цена за стакан лимонада в рублях. Фиксированные издержки производства лимонада составляют 100. Функция
    предельных затрат имеет вид: $MC = 10$ при $Q < 40$ и $MC = 12$ при $Q ≥ 40$. Определите значение максимальной
    прибыли владельца кафе.


    Объём выпуска в этой модели может быть любым неотрицательным действительным числом; переменные издержки непрерывны
    по объёму выпуска.'
  answer: '1132'
  accepted: []
  points: 6
  solution: 'При $0\le Q\le40$ переменные издержки равны $10Q$, а при $Q\ge40$ – $400+12(Q-40)=12Q-80$. Обратный
    спрос: $P=60-Q/2$.


    На первом участке $\pi=50Q-Q^2/2-100$ растёт до границы $Q=40$, где прибыль равна $1100$. На втором участке
    $\pi=48Q-Q^2/2-20=1132-(Q-48)^2/2$. Максимум $1132$ достигается при $Q=48$, $P=36$. Проверка: $1728-496-100=1132$.


    В опубликованном PDF указан ключ 1052. Он ошибочно применяет ставку 12 ко всему выпуску, хотя первые 40 единиц
    имеют меньшие предельные издержки. В тренажёре используется исправленный математический ответ.'
