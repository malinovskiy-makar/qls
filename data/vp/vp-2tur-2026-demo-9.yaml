# 3 теста по 4, соотнесение 8, текст с пропусками 8 – итого 100. Заданий 17, не 18.
# Ручные правки (все перечислены):
#   №12 – в ключе ВШЭ «- 318» с пробелом; эталон «-318».
#   №13 – ВЛАДЕЛЕЦ РЕШАЕТ. Ключ ВШЭ – 1052: так выходит, если считать издержки 12 на
#         КАЖДЫЙ стакан при Q ≥ 40. Но тогда выгоднее остановиться на 39 стаканах
#         (прибыль 1089,5), то есть 1052 – не максимум. Если 12 – издержки только
