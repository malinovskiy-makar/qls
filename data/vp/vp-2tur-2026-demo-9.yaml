    block: number
    kind: number
    statement: "Рассмотрим совершенно конкурентный рынок клубничного варенья, на котором действуют 20 фирм, каждая из которых максимизирует свою прибыль. Функция совокупных издержек каждой фирмы имеет вид $TC(q) = 2q^2 + 5q + 7$, где $q$ – количество произведённого этой фирмой клубничного варенья в литрах. Рыночный спрос на клубничное варенье задаётся функцией $Q_d = 178 - 2P$, где $P$ – цена за литр варенья. Какое количество клубничного варенья произвела бы каждая фирма при цене $P = 33$?"
    answer: "7"
    points: 6
    solution: "P = MC: 33 = 4q + 5, q = 7. Цена выше минимума средних переменных издержек (5), фирма работает."
