    statement: "Кризис в Аргентине, начавшийся в 1999 году, стал одним из самых разрушающих для экономики Латинской Америки. В течение десятилетия курс песо был жёстко привязан к доллару США, что сделало страну крайне уязвимой к внешним шокам. Это постепенно лишило государство [[1]] на мировых рынках: аргентинские товары становились слишком дорогими для экспорта, что приводило к значительному снижению спроса. Для покрытия расходов правительство активно занимало деньги за рубежом, что привело к хроническому [[2]] бюджета. Когда доверие инвесторов рухнуло, начался стремительный [[3]] капитала, ослабивший финансовую систему. Банки столкнулись с большими проблемами с [[4]], что вызвало заморозку долларовых вкладов граждан и массовые протесты, известные как «Argentinazo», или «Аргентинское побоище». Кульминацией кризиса стало объявление крупнейшего в истории страны [[5]] по государственным обязательствам."
