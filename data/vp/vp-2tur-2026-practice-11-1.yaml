  statement: Первая фирма выпускает товар по технологии $Q=2\sqrt{L}$, где $L$ – труд. Цена единицы труда равна
    8, материалы стоят 3 за каждую единицу выпуска, постоянных расходов нет. Вторая фирма использует технологию
    $Q=5\sqrt{L}$, но её затраты в вопросе не учитываются. Найдите общие издержки первой фирмы при выпуске 10 единиц.
  answer: '230'
  accepted: []
  solution: Для первой фирмы $L=Q^2/4$. Издержки $TC=8L+3Q=2Q^2+3Q$. При $Q=10$ получаем $200+30=230$.
