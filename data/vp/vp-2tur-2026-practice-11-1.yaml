  solution: 'По порядку: интеграция; торговля; ЕС; добавленный; рабочие места; климат; рынки; экономический рост.
    Регионализация углубляет интеграцию; торговые изменения и цепочки добавленной стоимости относятся к экономическим
    связям. ЕС – региональное интеграционное объединение. Глобальное потепление относится к климату, изоляция –
    к рынкам, устойчивость в последнем предложении – к экономическому росту.


    Историческая оговорка: НАФТА в исходном тексте – пример соглашения прошлых лет. С 1 июля 2020 года его заменило
    USMCA. Название в оригинальном задании сохранено; считать НАФТА действующим соглашением не следует.'
