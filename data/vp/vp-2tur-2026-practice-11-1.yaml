  statement: Экономика окружающей среды. Выберите все <strong>неверные</strong> утверждения.
  options:
  - Экологический ущерб, не учтённый участниками сделки, может создавать расхождение частных и общественных издержек.
  - Налог на единицу выбросов может создавать стимул сокращать загрязнение там, где это дешевле.
  - Рост энергоэффективности всегда гарантирует уменьшение суммарного потребления энергии.
  - Разрешение на выброс и субсидия на каждую единицу выпуска – экономически тождественные инструменты.
  - Положительная цена квот на выбросы гарантирует нулевые выбросы всех фирм.
  correct:
  - 3
  - 4
  - 5
  penalty: true
  solution: 1. Верно. Это отрицательный внешний эффект. 2. Верно. Фирма сравнивает цену выброса с предельной стоимостью
    его сокращения. 3. Неверно. Удешевление полезного результата и рост объёма использования могут частично или
    полностью компенсировать экономию. 4. Неверно. Они по-разному меняют стимулы к выпуску и загрязнению. 5. Неверно.
    Фирмы могут покупать квоты и продолжать выбрасывать в пределах разрешений.
