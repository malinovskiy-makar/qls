  statement: Спрос на товар монополиста имеет постоянную ценовую эластичность по абсолютной величине 3. Средние
    и предельные издержки постоянны и равны 20. После введения налога за каждую проданную единицу фирма сохранила
    положительный выпуск и максимизирует прибыль. Цена выросла на 15 денежных единиц. Какой процент первоначальных
    средних издержек составляет налог? Округлите до сотых при необходимости.
  answer: '50'
  accepted: []
  solution: При постоянной эластичности оптимальная цена $P=\frac{3}{2}MC$. Поэтому прирост цены равен $\frac{3}{2}t$,
    налог $t=15\cdot2/3=10$. Относительно исходных издержек это $10/20\cdot100=50\%$.
  n: 5
  points: 5
  intro: Авторский аналог Weconomics.
