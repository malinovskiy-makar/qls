  statement: Фирма продаёт продукцию по цене 1 и имеет технологию $Q=16L-L^2$ на участке $0\leq L\leq8$. Других
    затрат, кроме оплаты труда, нет. Профсоюз назначает неотрицательную ставку зарплаты $w$, после чего фирма выбирает
    делимый объём труда $L$, максимизируя прибыль. Профсоюз стремится максимизировать общий фонд оплаты труда $wL$.
    Каков объём выпуска в результате?
  answer: '48'
  accepted: []
  solution: При $0\leq w\leq16$ фирма выбирает $L=(16-w)/2$, при более высокой зарплате труд не нанимает. Фонд оплаты
    $w(16-w)/2$ максимален при $w=16/2$, поэтому $L=16/4$. Выпуск $Q=16\cdot16/4-(16/4)^2=48$.
