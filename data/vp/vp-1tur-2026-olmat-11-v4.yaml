    statement: "Кривая производственных возможностей страны задана кусочно: $y = 40 - x$ при $0 \\le x \\le 20$ и $y = 60 - 2x$ при $20 < x \\le 30$. Страна может торговать с остальным миром по соотношению цен $P_x/P_y = 1{,}5$ в любых количествах и выбирает производство, максимизирующее возможности потребления. Какое максимальное количество блага $y$ она сможет потребить, если хочет потреблять ровно 25 единиц блага $x$?"
    options:
      - "5"
      - "7,5"
      - "10"
      - "12,5"
      - "Нет верного ответа"
    correct: [4]
    solution: "12,5. Альтернативные издержки единицы $x$: 1 единица $y$ на первом участке и 2 — на втором. Мировая цена 1,5 лежит между ними: выгодно производить $x$ только там, где он обходится дешевле мировой цены, то есть в точке излома (20; 20). Недостающие 5 единиц $x$ покупаются за $5 \\cdot 1{,}5 = 7{,}5$ единиц $y$: потребление $y = 20 - 7{,}5 = 12{,}5$. Производство (30; 0) дало бы 7,5, а (0; 40) — 2,5 единиц $y$."
