    solution: "124. ИПЦ: $\\frac{100 \\cdot 12 + 50X}{100 \\cdot 10 + 50 \\cdot 20} = 1{,}25 \\Rightarrow 1200 + 50X = 2500 \\Rightarrow X = 26$. Номинальный ВВП $= 120 \\cdot 12 + 40 \\cdot 26 = 2480$, реальный $= 120 \\cdot 10 + 40 \\cdot 20 = 2000$. Дефлятор $= 2480/2000 = 1{,}24$, то есть 124%. Дефлятор (индекс Пааше) ниже ИПЦ (индекса Ласпейреса): веса сместились в пользу подешевевшего относительно блага."
