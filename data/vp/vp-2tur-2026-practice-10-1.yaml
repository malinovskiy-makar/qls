  statement: Автомат продаёт снимки по 100 рублей. Раньше он печатал 400 снимков за неделю без брака, а недельная
    прибыль составляла 16000 рублей. Материалы на один снимок стоят 20 рублей; остальные издержки постоянны. После
    бесплатной замены автомата число заказов выросло на 50%, но доля бракованных снимков стала 20%. Деньги за брак
    возвращают, материал при этом расходуется, повторного заказа нет. Цена, расход материалов на снимок и постоянные
    издержки не изменились. Какова новая недельная прибыль?
  answer: '20000'
  accepted: []
  solution: $FC=(100-20)\cdot400-16000=16000$. Заказов стало 600, из них оплачены 480. Новая прибыль $100\cdot480-20\cdot600-16000=20000$.
  n: 5
