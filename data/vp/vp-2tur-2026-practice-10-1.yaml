  statement: 'В условной экономике долгое время выпуск увеличивался главным образом за счёт привлечения новых работников
    и строительства дополнительных предприятий. Рост, основанный на увеличении количества используемых ресурсов,
    называют [[1]]. Однако постепенно возможности привлечения труда сократились, а одинаковое наращивание оборудования
    перестало давать прежний прирост выпуска.


    Для продолжения развития важен рост [[2]] труда – выпуска в расчёте на работника. Он может быть связан с новыми
    технологиями, организацией производства и образованием. Знания и навыки людей образуют [[3]] капитал. Вложения
    в них отличаются от простого увеличения числа станков, хотя оба вида вложений могут дополнять друг друга.


    У фирм должны быть стимулы внедрять новые решения. Система правил, обеспечивающая защиту прав собственности
    и исполнение договоров, относится к экономическим [[4]]. Слабая защита результатов труда может уменьшать готовность
    инвестировать.


    Устойчивое повышение эффективности позволяет перейти к [[5]] росту. При этом увеличение среднего дохода не гарантирует
    равномерного распределения выгод. Степень неравенства можно описывать коэффициентом [[6]], а её изменения важно
    отличать от изменений среднего выпуска. Для международного сравнения объёма благ денежные показатели иногда
    пересчитывают по [[7]] покупательной способности. Слишком сильная зависимость экспортных поступлений от единственного
    сырьевого товара делает экономику более уязвимой к внешним ценовым [[8]].'
