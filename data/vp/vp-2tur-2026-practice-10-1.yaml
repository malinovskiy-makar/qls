  solution: Пусть новый экспорт электроники равен $x$. Условие $x/(x+70)=(x+100)/(x+570)$ после раскрытия скобок
    даёт $400x=100\cdot70$, то есть $x=17{,}5$. Сокращение $(1-17{,}5/30)\cdot100=\frac{125}{3}\%$. После округления
    до сотых ответ – 41,67.
