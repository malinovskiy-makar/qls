    готовы продать производители по соответствующей цене.


    Чему будет равна сумма налоговых сборов при $Q=4$?


    Высшая проба – 2022/2023'
  answer: '80'
  accepted: []
  solution: При данном выпуске разница между ценой спроса и ценой предложения $t=(24+\sqrt8-4)-\sqrt8=20$. Сборы
    $T=tQ=20\cdot4=80$.
