  statement: Автомат продаёт снимки по 140 рублей. Раньше он печатал 600 снимков за неделю без брака, а недельная
    прибыль составляла 24000 рублей. Материалы на один снимок стоят 30 рублей; остальные издержки постоянны. После
    бесплатной замены автомата число заказов выросло на 50%, но доля бракованных снимков стала 25%. Деньги за брак
    возвращают, материал при этом расходуется, повторного заказа нет. Цена, расход материалов на снимок и постоянные
    издержки не изменились. Какова новая недельная прибыль?
  answer: '25500'
  accepted: []
  solution: $FC=(140-30)\cdot600-24000=42000$. Заказов стало 900, из них оплачены 675. Новая прибыль $140\cdot675-30\cdot900-42000=25500$.
