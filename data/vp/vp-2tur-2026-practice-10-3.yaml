  - Зона свободной торговли всегда требует единой валюты.
  - Таможенный союз предусматривает общий внешний таможенный тариф участников.
  - Все формы интеграции одинаковы по глубине согласования экономической политики.
  - Переключение с дешёвого внешнего поставщика на более дорогого участника союза может создавать потери.
  correct:
