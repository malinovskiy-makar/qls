  statement: 'Банк принимает краткосрочные вклады и выдаёт часть средств на длительный срок. Погашение выданных
    ссуд ожидается позднее, чем возможное требование вкладчиков вернуть деньги. Это различие сроков создаёт риск
    [[1]]. Даже если стоимость активов превышает обязательства, банк может не суметь немедленно превратить все активы
    в платёжные средства без потерь.


    Оценку способности покрыть обязательства стоимостью активов нужно отличать от текущей возможности произвести
    платёж. Если активы меньше обязательств, собственный [[2]] банка отрицателен. При таком состоянии простой перенос
    сроков не обязательно устраняет проблему.


    Вкладчики не всегда обладают полной информацией о качестве кредитного портфеля; это пример информационной [[3]].
    Слухи могут вызвать одновременное изъятие средств, известное как банковская [[4]]. Вынужденная быстрая продажа
    активов способна снизить их цену и усилить потери.


    Банки держат часть средств в форме [[5]], а другие вложения приносят процентный доход. Требования к устойчивости
    ограничивают допустимый риск, но сами по себе не отменяют необходимости оценивать заёмщиков. Невыполнение заёмщиком
    долгового обязательства в установленный срок называется [[6]]. Передача части риска другой организации может
    менять стимулы к его контролю; это проблема морального [[7]]. Распределение вложений между несколькими независимыми
    источниками риска называют [[8]], хотя оно не устраняет все возможные убытки.'
