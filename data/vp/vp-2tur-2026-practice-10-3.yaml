  penalty: true
  solution: 1. Верно. Это эффект создания торговли. 2. Неверно. Отмена взаимных барьеров не предполагает обязательного
    валютного союза. 3. Верно. Это дополнительная черта по сравнению с обычной зоной свободной торговли. 4. Неверно.
    Степень согласования сильно различается. 5. Верно. Это риск отклонения торговли из-за дискриминации внешнего
    поставщика.
