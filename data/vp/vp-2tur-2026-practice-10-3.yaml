  statement: Золотой стандарт и кризис 1931 года. Выберите все верные утверждения.
  options:
  - Повышение процентных ставок для защиты золотого паритета могло вступать в противоречие с задачей поддержать
    внутренний спрос.
  - Отток золота из США был экономически тем же явлением, что и рост золотовалютных резервов США.
  - Внутреннее изъятие вкладов и внешний отток золота не могли происходить одновременно.
  - В 1931 году Великобритания отказалась от обязательства обменивать банкноты на золото по фиксированному соотношению.
  - Сохранение фиксированного золотого паритета и свободное расширение денежного предложения могли конфликтовать.
  correct:
  - 1
  - 4
  - 5
  penalty: true
  solution: 1. Верно. Более высокая доходность привлекает капитал, но удорожает кредит внутри страны. 2. Неверно.
    Отток уменьшал запас золота, а не увеличивал его. 3. Неверно. Оба процесса действовали одновременно и усиливали
    давление на денежную систему. 4. Верно. Так проявился выход страны из золотого стандарта. 5. Верно. Поддержка
    размена ограничивала свободу денежной политики при потере золотых резервов.
