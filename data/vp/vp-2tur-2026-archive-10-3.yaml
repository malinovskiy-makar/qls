  statement: 'Номинальный ВВП в 2006 г. (базовом) был равен 15000 млрд. руб., в 2007 г. ВВП, рассчитанный в ценах
    базового года, составил 14000 млрд. руб. Известно также, что индекс дефлятор ВВП в 2007 г. составил 1,5. Предложение
    денег в 2007 году выросло по сравнению с 2006г. в 1,25 раза. Определить, на сколько процентов выросла/снизилась
    скорость обращения денег в 2007г. (в соответствии с уравнением количественной теории)?


    В ответе укажите изменение в процентах со знаком: рост – положительное число, снижение – отрицательное.


    Высшая проба – 2008'
  answer: '12'
  accepted: []
  solution: Номинальный ВВП нового года $14000\cdot1{,}5=21000$, его ростовой коэффициент 1,4. Скорость по $MV=PY$
    изменилась в $1{,}4/1{,}25=1{,}12$ раза, то есть выросла на 12%.
