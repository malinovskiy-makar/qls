  statement: 'В 2023–2025 годах мировой рынок какао пережил редкий ценовой шок из-за неблагоприятных климатических
    условий и болезней какао-деревьев в Западной Африке. Доля Кот-д’Ивуара и Ганы, располагающихся в этом регионе,
    составляет около 60% в мировом производстве какао, поэтому сбои урожая в этих странах сильно отражаются на мировых
    ценах. В 2022–2025 годах сформировались последовательные дефициты – мировые запасы какао упали до многолетних
    минимумов. Быстро нарастить выпуск сложно, ведь новое какао-дерево приносит плоды лишь через несколько лет,
    а старые насаждения с каждым годом дают всё меньше урожая и требуют обновления.


    В апреле 2024 года цены, указанные в контрактах на поставки какао, превышали 12 тыс. долларов за тонну (исторический
    максимум). Помимо погоды, на урожай повлияли старение плантаций и вирус вздутия побегов какао, который в среднем
    сокращает урожай на 15-50%. На этом фоне растущее потребление шоколада в мире и подорожавшая транспортировка
    только усугубили реакцию рынка.


    Чтобы приготовить шоколад, вам потребуются какао, сахар и молоко в пропорции, где на какао приходится половина
    стоимости ингредиентов. Допустим, стоимость ингредиентов составляет 40% от конечной цены плитки шоколада.


    Если какао подорожает с 6 тыс. до 12 тыс. долларов за тонну, на сколько процентов вырастет цена плитки шоколада,
    если все прочие издержки неизменны, и фирма полностью перекладывает издержки на потребителей?


    Высшая проба – 2026'
