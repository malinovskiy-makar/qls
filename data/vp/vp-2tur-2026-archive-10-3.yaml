  statement: 'Ценовая эластичность (по модулю) функции спроса, заданной линейно в точке, где выпуск равен 20, составляла
    5. Найти ценовую эластичность данной функции спроса (по модулю), в точке, где выпуск равен 30.


    Высшая проба – 2009'
  answer: '3'
  accepted: []
  solution: Пусть $Q=a-bP$. Модуль эластичности $(a-Q)/Q$. Из $(a-20)/20=5$ следует $a=120$. При $Q=30$ эластичность
    $(120-30)/30=3$.
