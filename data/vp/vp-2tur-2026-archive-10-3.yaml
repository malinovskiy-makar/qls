  statement: 'Стоимость одного доллара США в российских рублях составляет 70 руб. При этом курс доллара США равен
    490 казахстанских тенге.


    Примечание: кросс-курс – это соотношение между 2-мя валютами, которое определяется на основе валютного курса
    каждой из них по отношению к какой-либо 3-ей валюте.


    Определите кросс-курс рубля к казахстанскому тенге, в ответе укажите, сколько тенге должен заплатить покупатель
    за 1 рубль.


    Высшая проба – 2022/2023'
  answer: '7'
  accepted: []
  solution: Один доллар эквивалентен 70 рублям и 490 тенге. Поэтому один рубль равен $490/70=7$ тенге.
