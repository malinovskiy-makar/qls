  statement: 'Министерство финансов Индии поставило перед собой задачу по увеличению уровня совокупного дохода страны.
    Отметьте, изменения каких из перечисленных факторов могут при прочих равных напрямую повлиять на уровень совокупного
    дохода Индии?


    Высшая проба – 2024/2025'
  options:
  - Расходы семьи на продукты питания.
  - Государственный долг Индии.
  - Покупка нового здания местной компанией.
  - Заработная плата государственным служащим.
  - Увеличение экспорта древесины из России в Китай.
