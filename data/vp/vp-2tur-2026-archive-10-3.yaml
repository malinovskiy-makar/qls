  statement: 'В деревню, где живут баба Света и баба Валя, приехала автолавка с бакалеей. Спрос бабы Светы на макароны
    представлен функцией $q_C=20-p$, спрос бабы Вали $q_B=40-9p$, где $q_C$ и $q_B$ – количество пачек макарон соответственно,
    а $p$ – цена за пачку макарон. У продавца в лавке есть только 40 пачек макарон, других магазинов в деревне нет,
    а других любителей макарон, кроме бабы Светы и бабы Вали, в деревне не живет. Несмотря на преклонный возраст
    бабушек, продавец не готов упустить выгоду от торговли макаронами, поэтому стремится продать их как можно более
    выгодно для себя. Продавать любую пачку макарон он может только по одинаковой цене. Какую цену за пачку макарон
    он установит, если никаких дополнительных издержек, связанных с их продажей, он не несет?


