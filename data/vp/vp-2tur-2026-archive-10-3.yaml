  statement: 'Даша работает репетитором по экономике, за неделю она проводит пять занятий, стоимостью 1 800 рублей
    каждое. Дашин одногруппник предложил ей устроиться в его стартап аналитиком, с возможностью получать 45 000
    рублей в месяц. Также Даша прошла отбор на оплачиваемую стажировку в компании “NOZO” сроком на 2 месяца с выплатами
    15 000 рублей каждые две недели. Так как Даша еще учится в университете, ей хватит времени только на один из
    вариантов трудоустройства. Считайте, что в каждом месяце ровно 4 недели (28 дней), а в году 12 месяцев.


    Даша выбирает место работы, которое будет приносить ей самый высокий доход. Сколько денег она будет получать
    в месяц, если с каждого вида дохода нужно уплачивать подоходный налог (13% – при работе в любой компании, 4%
    – при работе репетитором)? Ответ запишите в рублях.


    Высшая проба – 2023/2024'
  answer: '39150'
  accepted: []
  solution: 'После налогов: репетиторство $36000\cdot0{,}96=34560$; стартап $45000\cdot0{,}87=39150$; стажировка
    $30000\cdot0{,}87=26100$. Максимум – 39150 рублей в месяц.'
