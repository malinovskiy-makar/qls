  statement: 'В одной стране, имеющей плановую экономику, среднестатистический рабочий тратит ежемесячно 50% своей
    зарплаты на хлеб, 30% – на одежду и 10% – на книги. Кроме того, при любом уровне доходов 10% заработка он отдает
    государству в качестве подоходного налога. После очередного повышения государственных цен хлеб подорожал на
    10%, одежда – на 20%, книги – на 70%.

    На сколько процентов государство должно повысить зарплату рабочего, чтобы он мог приобретать хлеб, одежду и
    книги в тех же количествах, что и раньше?


    Высшая проба – 2011'
  accepted: []
  solution: 'Обозначим прежнюю зарплату через $Y$. Старая корзина теперь стоит $(0{,}5\cdot1{,}1+0{,}3\cdot1{,}2+0{,}1\cdot1{,}7)Y=1{,}08Y$.
    После налога остаётся $0{,}9Y_{new}$. Значит, $Y_{new}=1{,}2Y$: увеличение на 20%.'
  answer: '20'
