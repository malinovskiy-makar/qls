  statement: 'Известно, что в экономике некоторой страны потребительские расходы домашних хозяйств составили 2000,
    валовые инвестиции были равны 600, чистые налоги были собраны в объеме 500, величина чистого экспорта составила
    -200, объем импорта был равен 400, сумма инъекций в экономике оценивалась в 1900.

    Используя модель кругооборота, определить величину валового внутреннего продукта.


    Высшая проба – 2008'
  answer: '3500'
  accepted: []
  solution: Экспорт $X=NX+M=-200+400=200$. Из инъекций $I+G+X=1900$ находим $G=1100$. ВВП $2000+600+1100-200=3500$.
