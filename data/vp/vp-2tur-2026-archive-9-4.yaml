  statement: 'В экономической теории проблема [[1]] возникает, когда те, кто пользуется [[2]] благами и услугами,
    не платят за них. Как правило, справедливо распределить финансирование таких благ довольно сложно. Это происходит
    потому, что ответственный за распределение блага орган не располагает достаточной информацией о ценности блага
    для каждого конкретного индивида. Как только платеж за такие товары становится [[3]], может возникать эта проблема.
    В свою очередь, такое явление приводит к тому, что производство этих благ [[4]]. Получается, что для поддержания
    их производства на нужном уровне остальные члены общества вынуждены платить еще [[5]]. Если число тех, кто не
    платит за использование таких благ, увеличивается, то возможно полное прекращение их производства. Решение этой
    проблемы без значительных затрат могло бы повысить эффективность в экономике.


