  statement: 'Аня каждое утро начинает свой день с завтрака, который состоит из одной кружки кофе и одного малинового
    круассана. Аня может съесть несколько завтраков за день или не есть их вообще. При этом девочка хочет купить
    как можно больше завтраков в течение месяца. Мама дала Ане 10 000 рублей на месяц. В любимой булочной Ани кружка
    кофе стоит 150 рублей, а круассан 90 рублей. Считайте, что количество завтраков может быть только целым, а Аня
    тратит деньги исключительно на завтраки.


    Булочная решила провести акцию “каждый 5-й завтрак в подарок”. Сколько денег потратит Аня за месяц, если она
    постарается купить как можно больше завтраков? Неиспользованный остаток нельзя перенести на следующий месяц;
    брать деньги в долг нельзя.


