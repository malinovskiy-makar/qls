  statement: 'Из-за введения комендантского часа в Бруклине на ночном совершенно конкурентном рынке пиццы спрос
    предъявляют только 4 черепашки-ниндзя. Обычная кривая спроса каждой из черепашек имеет вид $q_d=10-p$, где $q_d$
    – покупаемое этой черепашкой количество пиццы, а $p$ – цена пиццы. Суммарное предложение пиццы задается функцией
    $q_s=4p$, где $q_s$ – продаваемое количество пиццы. Если кого-то из черепашек наказывает их отец, то кривая
    спроса черепашки меняется на $q_d^*=6-p$, где $q_d^*$ показывает, сколько пиццы может купить наказанная черепашка
    при заданной цене $p$.


    Сколько пиццы купят черепашки, если никто не наказан?


    Высшая проба – 2024/2025'
  answer: '20'
  accepted: []
  solution: Общий спрос $4(10-p)=40-4p$. В равновесии $40-4p=4p$, откуда $p=5$, $Q=20$. Цена ниже порога участия
    10.
