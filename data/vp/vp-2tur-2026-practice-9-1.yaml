- kind: number
  block: number
  statement: 'У предпринимателя есть 100 тыс. рублей. Он выбирает одно из трёх вложений на год: (1) нанять сотрудника
    с зарплатой 25 тыс. рублей в месяц, получив дополнительную годовую выручку 450 тыс. рублей; (2) купить оборудование
    за 100 тыс. рублей, получить дополнительную выручку 400 тыс. рублей и продать оборудование в конце года за 60
    тыс. рублей; (3) положить 100 тыс. рублей в банк под 10% годовых с ежемесячной капитализацией. Указанная дополнительная
    выручка уже очищена от всех иных расходов. Зарплата выплачивается из текущих поступлений. Выбор сотрудника исключает
    вложение тех же средств в оборудование или депозит. Какова альтернативная стоимость выбора первого варианта?
    Сравнивайте чистый прирост денег за год относительно исходного капитала. Ответ дайте в тыс. рублей, округлив
    до сотых при необходимости.'
  answer: '360'
  accepted: []
  solution: Нужно выбрать лучший из отвергнутых вариантов. Оборудование даёт $400+60-100=360$ тыс. рублей чистого
    прироста. Депозит даёт $100(1+10/1200)^{12}-100\approx10{,}47$. Альтернативная стоимость – 360 тыс. рублей.
    Выгода самого выбранного варианта не является его альтернативной стоимостью.
  n: 11
  points: 6
