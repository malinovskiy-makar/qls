- kind: number
  block: number
  statement: 'Анна оценивает час своего рабочего времени в 300 рублей. Поездка на автобусе длится 6 часов и стоит
    400 рублей; работать в автобусе нельзя. Поездка на поезде длится 4 часа и стоит 900 рублей. В поезде предлагают
    платный доступ к интернету: только с ним Анна сможет работать ровно 2 часа из четырёх. Перелёт с дорогой в аэропорт
    занимает 2 часа и стоит 2300 рублей; работать в пути нельзя. Без поездки Анна работала бы всё соответствующее
    время. Она выбирает маршрут с наименьшей суммой денежных расходов и стоимости потерянного рабочего времени.
    Какую наибольшую плату за интернет она готова внести, чтобы поездка на поезде с интернетом была не дороже лучшей
    альтернативы без интернета? Других затрат нет. Ответ дайте в рублях.'
  answer: '600'
  accepted: []
  solution: 'Без интернета полные издержки равны: автобус – $400+6\cdot300=2200$, поезд – $900+4\cdot300=2100$,
    самолёт – $2300+2\cdot300=2900$. Лучшая альтернатива стоит 2100. Поезд с интернетом при плате $x$ стоит $900+2\cdot300+x=1500+x$.
    Условие выбора: $1500+x\leq2100$, поэтому максимальная плата – 600 рублей. Сравнивать нужно со всеми маршрутами,
    включая поезд без интернета.'
  n: 6
  points: 6
  intro: Авторский аналог Weconomics.
