- kind: number
  block: number
  statement: У Ильи 10000 рублей. Он рассматривает акции, которые, по его ожиданиям, подорожают на 20% в первый
    год, подешевеют на 10% во второй и подорожают на 15% в третий, а также банковский вклад под 10% годовых с ежегодной
    капитализацией. Илья выбрал вклад и не снимал проценты. Сколько рублей будет на вкладе в конце третьего года?
    Налоги и комиссии не учитывайте.
  answer: '13310'
  accepted: []
  solution: Нужен результат выбранного вклада, а не сравнение с акциями. $S=10000(1+10/100)^3=13310$ рублей. Промежуточные
    суммы не округляем.
