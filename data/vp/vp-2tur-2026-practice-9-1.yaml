  statement: Использование природных ресурсов. Выберите все верные утверждения.
  options:
  - Отрицательный внешний эффект возникает, когда часть ущерба несут третьи лица без компенсации.
  - Общественный транспорт при достаточной загрузке может сокращать выбросы на одного пассажира.
  - Уголь относится к возобновляемым источникам энергии в человеческом временном масштабе.
  - Повышение энергоэффективности обязательно увеличивает расход энергии на единицу продукции.
  - Переработка вторичного сырья может сократить потребность в первичном сырье.
  correct:
  - 1
  - 2
  - 5
  penalty: true
  solution: 1. Верно. Часть общественных затрат не учтена участниками сделки. 2. Верно. Результат зависит от загрузки
    и технологии; возможность, а не гарантия, корректна. 3. Неверно. Ископаемый уголь формируется гораздо медленнее,
    чем расходуется. 4. Неверно. Энергоэффективность означает меньший расход на заданный полезный результат. 5.
    Верно. Вторичные материалы могут заменять часть первичных.
