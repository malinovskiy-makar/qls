  statement: На рынке труда спрос задан функцией $L_d=120-4w$, а предложение – $L_s=6w$, где $w$ – зарплата, $L$
    – число работников. Государство ввело обязательную минимальную зарплату выше равновесной. После этого занятость
    уменьшилась на 8 человек; число занятых определяется спросом фирм. Чему равна новая минимальная зарплата?
  answer: '14'
  accepted: []
  solution: До вмешательства $120-4w=6w$, поэтому $w_0=12$, $L_0=72$. Новая занятость $72-8=64$. Из $120-4w=64$
    получаем $w=14$. Предложение при этой зарплате превышает спрос.
  n: 7
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Две мастерские выпускают столы и стулья. Первая за месяц может изготовить 60 столов или 30 стульев,
    вторая – 30 столов или 60 стульев. Их границы производственных возможностей линейны. Все ресурсы используются.
    Если вместе необходимо произвести ровно 70 стульев, какое наибольшее число столов можно изготовить? Объёмы выпуска
    в этой модели делимы.
  answer: '40'
  accepted: []
  solution: Стул обходится первой мастерской в 2 стола, второй – в 0,5 стола. Сначала все 60 стульев производит
    вторая мастерская. Ещё 10 стульев выпускает первая, потеряв $20$ столов. Остаётся $60-2\cdot10=40$ столов.
  n: 8
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Выручка мастерской равна 10000 рублей, бухгалтерская прибыль – 2000 рублей. Четверть общих издержек
    составляют постоянные расходы. Переменные издержки состоят только из материалов, сдельной оплаты труда и электроэнергии.
    На электроэнергию приходится четверть переменных издержек, а на материалы тратят вдвое больше, чем на сдельную
    оплату труда. Сколько рублей расходуется на материалы?
  answer: '3000'
  accepted: []
  solution: 'Общие издержки $10000-2000=8000$. Переменные – $3\cdot8000/4=6000$. После электроэнергии остаётся $3\cdot6000/4=4500$;
    материалы составляют две трети этой суммы: $6000\cdot3/4\cdot2/3=3000$.'
  n: 9
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Фирма может выпустить целое число единиц товара от 0 до 9 включительно. В таблице показаны дополнительная
    выручка и дополнительные издержки от продажи и производства каждой очередной единицы. При нулевом выпуске прибыль
    равна нулю, постоянных издержек нет. Найдите максимальную прибыль фирмы.
  answer: '55'
  accepted: []
  solution: 'Прибыль при выпуске $Q$ равна сумме первых $Q$ значений $MR-MC$. Эти разности: 21, 16, 11, 6, 1, -4,
    -9, -14, -19. Выгодно произвести 5 единиц; дальше дополнительные издержки превышают дополнительную выручку.
    Максимальная прибыль – 55.'
  table_html: <table><thead><tr><th>Единица</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr></thead><tbody><tr><td>MR</td><td>25</td><td>22</td><td>19</td><td>16</td><td>13</td><td>10</td><td>7</td><td>4</td><td>1</td></tr><tr><td>MC</td><td>4</td><td>6</td><td>8</td><td>10</td><td>12</td><td>14</td><td>16</td><td>18</td><td>20</td></tr></tbody></table>
  n: 10
