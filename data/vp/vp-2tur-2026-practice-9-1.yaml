  statement: Две группы потребителей имеют спрос $Q_1=\max(0,20-P)$ и $Q_2=\max(0,50-P)$. Единственный продавец
    назначает общую цену для обеих групп; ценовая дискриминация запрещена. Его издержки $TC=4Q+20$. Государство
    запретило устанавливать цену ниже 18. Товар и деньги делимы. Какой объём продаж выберет максимизирующий прибыль
    монополист?
  answer: '23'
  accepted: []
  solution: 'При $P\leq20$ совокупный спрос $70-2P$, выше 20 – $50-P$ до исчезновения спроса. Проверяем вершины
    прибыли на допустимых участках и их границы. Кандидаты (цена; прибыль): (18; 456); (19,5; 460,5); (20; 460);
    (27; 509); (50; -20). Лучшая цена $27$, продажи $23$.'
