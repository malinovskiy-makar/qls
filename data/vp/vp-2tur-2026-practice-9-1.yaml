  statement: Экономическое развитие. Выберите все верные утверждения.
  options:
  - Рост производительности труда может повышать выпуск без увеличения числа работников.
  - Большие запасы полезных ископаемых сами по себе гарантируют высокий доход каждого жителя.
  - Доля услуг может расти по мере увеличения доходов и изменения структуры спроса.
  - Инвестиции в образование могут увеличивать человеческий капитал.
  - ВВП на душу населения показывает доход каждого человека по отдельности.
  correct:
  - 1
  - 3
  - 4
  penalty: true
  solution: 1. Верно. Больше выпуска на одного работника означает рост производительности. 2. Неверно. Доход зависит
    также от институтов, распределения, технологий и других факторов. 3. Верно. Спрос и производственная структура
    меняются с развитием. 4. Верно. Знания и навыки – составляющие человеческого капитала. 5. Неверно. Это средняя
    величина; она не описывает распределение между людьми.
  n: 1
  points: 4
  intro: В этом блоке задания №2 – архив ВП 2025/26. Остальные – авторские аналоги Weconomics.
