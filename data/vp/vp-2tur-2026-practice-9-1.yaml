  statement: На закрытом рынке спрос равен $Q_d=120-2P$, предложение отечественных фирм – $Q_s=20+3P$. После открытия
    рынка импортёры готовы поставить любое количество товара по мировой цене 16. Отечественные фирмы сохраняют прежнюю
    функцию предложения. На сколько изменится их выручка после открытия рынка? Если выручка уменьшится, ответ запишите
    со знаком минус.
  answer: '-512'
  accepted: []
  solution: 'Закрытый рынок: $120-2P=20+3P$, $P_0=20$, $Q_0=80$, $TR_0=1600$. Мировая цена ниже $P_0$; при ней спрос
    превышает отечественное предложение, разницу покрывает импорт. $Q_1=20+3\cdot16=68$, $TR_1=1088$. Изменение
    $1088-1600=-512$.'
  n: 12
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Монополист продаёт напиток по цене $P=50-Q$. Первые 10 единиц напитка обходятся по 10 рублей каждая,
    а каждая следующая единица – по 20 рублей. Повышенная стоимость применяется только к единицам сверх 10, а не
    ко всему выпуску. Постоянные издержки равны 20 рублям и возникают даже при нулевом выпуске. Выпуск непрерывен
    и неотрицателен; цена не может быть отрицательной. Определите максимальную прибыль.
  answer: '305'
  accepted: []
  solution: На первом участке $\pi=(50-10)Q-Q^2-20$; его вершина лежит правее 10, поэтому лучший выпуск на этом
    участке – 10. На втором $\pi=(50-20)Q-Q^2+10\cdot10-20$, вершина $Q=15>10$. Прибыль в ней 305, больше прибыли
    в точке 10 и при нулевом выпуске. Это максимум.
  n: 13
  points: 6
  intro: Авторский аналог Weconomics.
- kind: number
  block: number
  statement: Монополист сталкивается со спросом $P=80-2Q$. Каждая единица труда позволяет произвести 4 единицы товара,
    труд можно делить. Цена единицы труда равна 40. Других переменных издержек нет; постоянные издержки равны 30.
    Какой объём выпуска максимизирует прибыль?
  answer: 17,5
  accepted: []
  solution: На единицу товара требуется $1/4$ единицы труда, поэтому $MC=40/4=10$. Предельная выручка $MR=80-4Q$.
    Из $MR=MC$ получаем $Q=17{,}5$. Прибыль – строго вогнутая квадратичная функция; постоянные издержки не меняют
    оптимальный выпуск.
  n: 14
  points: 6
  intro: Авторский аналог Weconomics.
