  statement: Фирма действует на совершенно конкурентном рынке и принимает рыночную цену 46 как заданную. Её общие
    издержки $TC(Q)=2Q^2+6Q+80$, где $Q$ – непрерывный неотрицательный выпуск. Постоянные издержки возникают даже
    при $Q=0$. Сколько единиц товара следует произвести для максимизации прибыли?
  answer: '10'
  accepted: []
  solution: $\pi=(46-6)Q-2Q^2-80$. Вершина этой параболы достигается при $4Q=46-6$, то есть $Q=10$. Выпуск положителен;
    он даёт больше прибыли, чем нулевой.
