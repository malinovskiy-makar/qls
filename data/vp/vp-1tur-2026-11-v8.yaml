    statement: "Выберите все верные утверждения о ценовой дискриминации."
    options:
      - "Чем легче покупателям перепродать товар друг другу, тем проще продавцу назначать им разные цены."
      - "Если продавец берёт с разных покупателей разную плату за одинаковый товар, хотя издержки на их обслуживание одинаковы, он проводит ценовую дискриминацию."
      - "Дискриминирующий монополист назначает более высокую цену тем группам покупателей, чей спрос более эластичен."
      - "Фирма на рынке совершенной конкуренции не может проводить ценовую дискриминацию: она принимает рыночную цену как данную."
