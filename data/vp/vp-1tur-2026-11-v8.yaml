    correct: [2, 4, 5]
    solution: "Ценовая дискриминация – это разные цены на один и тот же товар при одинаковых издержках (утверждение 2 верно). Фирма – ценополучатель не властна над ценой и не может брать с разных покупателей разную плату (4 верно). Скидки студентам и пенсионерам – классический пример дискриминации по группам покупателей (5 верно). Утверждение 1 неверно: если товар легко перепродать, купившие дёшево перепродадут его тем, с кого берут дорого, и дискриминация разрушится. Утверждение 3 неверно: более высокую цену назначают покупателям с менее эластичным спросом – они слабее реагируют на цену."
