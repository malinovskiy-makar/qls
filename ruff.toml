# Настройки линтера. Читаются и CI, и редактором.
#
# ⚠️ НАБОР ПРАВИЛ ЗДЕСЬ — ПОЛ, А НЕ ПОТОЛОК, И ЭТО ОСОЗНАННО.
#
# Линтер на проекте не запускался ни разу. На настройках по умолчанию ruff
# 0.16 находит 4 286 замечаний, из них 2 625 правятся автоматически. Включить
# всё разом означало бы одно из двух: либо красный CI с первого дня — то есть
# проверка, которую все привыкают игнорировать, — либо правку четырёх тысяч
# мест без единого человеческого взгляда.
#
# Поэтому взят набор, который код проходит НАЧИСТО уже сегодня и который ловит
# именно ошибки, а не расхождения во вкусах:
#
#   E9  — синтаксис и невозможность прочитать файл
#   F6  — сломанные конструкции: assert на кортеже (всегда истинный),
#         повторяющийся ключ в словаре, f-строка без подстановки
#   F7  — break вне цикла, return вне функции и подобное
#   F82 — ОБРАЩЕНИЕ К НЕСУЩЕСТВУЮЩЕМУ ИМЕНИ. Самое ценное здесь: опечатка в
#         имени переменной внутри ветки, куда тесты не заходят, иначе живёт
#         до первого живого пользователя.
#
# Как расширять — по одному шагу, каждый отдельным коммитом и с прогоном:
#   шаг 1: весь F целиком (+187 замечаний, из них 147 — неиспользуемые
#          импорты, правятся автоматически и безопасно)
#   шаг 2: E7 (66 неоднозначных имён вроде `l`, 37 точек с запятой)
#   шаг 3: UP (устаревшие конструкции, 2 300+ мест — только после того,
#          как включат форматтер, иначе диффы наложатся)
#
# ⚠️ ФОРМАТТЕР НЕ ВКЛЮЧЁН, И ЭТО РЕШЕНИЕ ВЛАДЕЛЬЦА, А НЕ НАША ЗАБЫВЧИВОСТЬ.
# `ruff format` переписал бы 448 файлов из 574 — 95 639 строк. Такой коммит
# нельзя ни прочитать глазами, ни разобрать при конфликте слияния, а в проекте
# сейчас живут четыре ветки с незакрытой работой. Включать — отдельной
# работой, в тихий момент, одним коммитом и сразу после него слить все ветки.
# Настройки форматтера ниже уже выставлены, чтобы этот день не начинался со
# спора о ширине строки.

target-version = "py313"

# 95 % строк проекта укладываются в 77 символов, 99 % — в 87. Проект держит
# классические 79, и менять это заодно с включением линтера незачем.
line-length = 79

# Окружения и зависимости в .gitignore, ruff их и так не смотрит. Перечислено
# явно ради тех, кто запустит линтер из редактора со своими настройками.
exclude = [
    "venv",
    "venv312",
    "venv313",
    ".venv",
    "node_modules",
    "staticfiles",
    "reports",
    "deploy_fixtures",
]

[lint]
select = ["E9", "F6", "F7", "F82"]

[lint.per-file-ignores]
# Миграции пишет автодетектор Django, и переписывать их руками нельзя:
# файл миграции — это запись о том, что уже применено к боевой базе.
"*/migrations/*" = ["E501", "F401"]

[format]
# Проект пишет строки в одинарных кавычках; менять это заодно с включением
# форматтера значило бы утопить смысл диффа в кавычках.
quote-style = "single"
indent-style = "space"
